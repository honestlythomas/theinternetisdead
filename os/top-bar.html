<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>theinternetisdead.org - Top Bar</title>
  <style>
    :root{color-scheme:dark;--green:#72ff19;--magenta:#ff2bd6}
    *{box-sizing:border-box}
    html,body{width:100%;margin:0;background:#000}
    body{color:var(--green);font-family:"Courier New",Courier,monospace}

    .topbar{position:relative;z-index:5;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));height:54px;background:#000}
    .site-name,.page-title,.topbar-clock{color:var(--green);font:900 clamp(15px,1.65vw,21px)/.9 "Courier New",Courier,monospace;letter-spacing:-.075em;text-shadow:0 2px 8px #000,0 0 12px rgba(114,255,25,.38)}
    .site-name{grid-column:1;justify-self:start;align-self:center;display:inline-flex;align-items:center;gap:9px;border:0;padding:0;background:transparent;color:inherit;text-decoration:none;cursor:pointer;white-space:nowrap}
    .site-name-icon{position:relative;display:block;width:34px;height:34px;aspect-ratio:1/1;flex:0 0 34px;overflow:hidden;border:0;background:transparent;font-size:0;line-height:0;box-shadow:none}
    .site-name-icon::before{content:"☠️";position:absolute;inset:0;display:grid;place-items:center;width:100%;height:100%;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;font-size:25px;line-height:1;transform:scale(.92);transform-origin:center}
    .site-name-label{display:inline-block;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.18em}
    .page-title{grid-column:2;justify-self:center;align-self:center;position:relative;display:inline-flex;align-items:center;margin:0;font-style:normal;white-space:nowrap;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.18em}
    .topbar-clock{grid-column:3;justify-self:end;align-self:center;display:inline-flex;align-items:center;gap:9px;white-space:nowrap;text-decoration:none}
    .topbar-clock::after{content:"⚙️";display:inline-grid;width:34px;height:34px;flex:0 0 34px;place-items:center;overflow:hidden;border:0;background:transparent;box-shadow:none;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;font-size:25px;line-height:1;text-decoration:none}
    .site-name:hover,.site-name:focus-visible{color:var(--magenta);outline:none;text-shadow:0 2px 8px #000,0 0 14px rgba(255,43,214,.58)}

    @media(max-width:820px){.topbar{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;height:48px}.site-name,.page-title,.topbar-clock{font-size:clamp(13px,4vw,17px)}.site-name{gap:7px}.site-name-icon{width:30px;height:30px;flex-basis:30px}.site-name-icon::before{font-size:22px}.topbar-clock{gap:7px}.topbar-clock::after{width:30px;height:30px;flex-basis:30px;font-size:22px}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="site-name" href="/" aria-label="theinternetisdead.org home"><span class="site-name-icon" aria-hidden="true">☠️</span><span class="site-name-label">theinternetisdead.org</span></a>
    <h1 class="page-title">Main Space</h1>
    <time class="topbar-clock" id="topbar-clock" aria-label="Local time"></time>
  </header>

  <script>
    const topbarClock=document.getElementById('topbar-clock');
    const clockFormatter=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Toronto',hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true});
    const updateTopbarClock=()=>{topbarClock.childNodes[0] ? topbarClock.childNodes[0].nodeValue=clockFormatter.format(new Date()) : topbarClock.prepend(document.createTextNode(clockFormatter.format(new Date())))};
    updateTopbarClock();
    setInterval(updateTopbarClock,250);
  </script>
</body>
</html>
