<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020302">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="A spatial map of every page on theinternetisdead.org.">
  <title>Site Space — The Internet Is Dead</title>
  <style>
    :root {
      color-scheme: dark;
      --void: #020302;
      --ink: #efffe8;
      --green: #72ff19;
      --magenta: #ff2bd6;
      --amber: #ffb000;
      --cell-w: 1000px;
      --cell-h: 562.5px;
      --gap: 110px;
      --step-x: 1110px;
      --step-y: 672.5px;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--void);
    }

    body {
      color: var(--ink);
      font-family: "Courier New", Courier, monospace;
      user-select: none;
    }

    button,
    input { font: inherit; }

    button { color: inherit; }

    .viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      background:
        radial-gradient(circle at 50% 50%, rgba(114, 255, 25, .055), transparent 46%),
        #020302;
    }

    .viewport.is-panning { cursor: grabbing; }

    .world {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    .world::before {
      content: "";
      position: absolute;
      top: -7600px;
      left: -12200px;
      width: 24400px;
      height: 15200px;
      pointer-events: none;
      background:
        linear-gradient(rgba(114, 255, 25, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(114, 255, 25, .045) 1px, transparent 1px);
      background-size: var(--step-x) var(--step-y);
      border: 1px solid rgba(114, 255, 25, .06);
    }

    .slot,
    .page-panel {
      position: absolute;
      width: var(--cell-w);
      height: var(--cell-h);
      transform: translate(-50%, -50%);
    }

    .slot {
      display: grid;
      place-items: center;
      border: 3px dashed rgba(114, 255, 25, .21);
      background: rgba(7, 11, 6, .34);
      color: rgba(114, 255, 25, .55);
      cursor: pointer;
      font-size: 82px;
      transition: border-color 120ms ease, background 120ms ease, color 120ms ease;
    }

    .slot:hover,
    .slot:focus-visible {
      border-color: var(--magenta);
      background: rgba(255, 43, 214, .08);
      color: var(--magenta);
      outline: 8px solid rgba(255, 43, 214, .15);
      outline-offset: 10px;
    }

    .slot span {
      display: block;
      text-align: center;
      text-shadow: 0 0 24px currentColor;
    }

    .slot small {
      display: block;
      margin-top: 16px;
      font-size: 26px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .page-panel {
      overflow: hidden;
      border: 4px solid var(--green);
      background: #000;
      box-shadow: 0 0 0 10px #020302, 0 0 0 13px rgba(114, 255, 25, .25), 0 24px 70px rgba(0, 0, 0, .75);
    }

    .page-panel.is-home {
      border-color: #fff;
      box-shadow: 0 0 0 10px #020302, 0 0 0 13px rgba(255, 43, 214, .48), 0 0 90px rgba(114, 255, 25, .18);
    }

    .panel-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 3;
      display: flex;
      min-height: 50px;
      align-items: center;
      gap: 14px;
      border-bottom: 2px solid rgba(114, 255, 25, .55);
      padding: 0 12px 0 18px;
      background: rgba(0, 0, 0, .88);
      backdrop-filter: blur(8px);
    }

    .panel-title {
      overflow: hidden;
      flex: 1;
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .panel-path {
      overflow: hidden;
      max-width: 46%;
      color: var(--green);
      font-size: 16px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .panel-action {
      display: grid;
      width: 38px;
      height: 34px;
      place-items: center;
      border: 1px solid rgba(114, 255, 25, .5);
      background: #080a07;
      color: var(--green);
      font-size: 22px;
      text-decoration: none;
      cursor: pointer;
    }

    .panel-action:hover,
    .panel-action:focus-visible {
      border-color: var(--magenta);
      color: var(--magenta);
      outline: 2px solid #fff;
    }

    .page-panel iframe {
      position: absolute;
      inset: 0;
      display: block;
      width: 1280px;
      height: 720px;
      border: 0;
      background: #000;
      pointer-events: none;
      transform: scale(.78125);
      transform-origin: 0 0;
    }

    .chrome {
      position: fixed;
      z-index: 20;
      pointer-events: none;
    }

    .topbar {
      top: max(12px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      right: max(12px, env(safe-area-inset-right));
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .brand,
    .controls,
    .position-readout {
      border: 1px solid rgba(114, 255, 25, .36);
      background: rgba(2, 3, 2, .9);
      box-shadow: 0 8px 30px rgba(0, 0, 0, .48);
      backdrop-filter: blur(12px);
      pointer-events: auto;
    }

    .brand { padding: 10px 13px; }

    h1 {
      margin: 0;
      color: #fff;
      font-size: clamp(15px, 2vw, 24px);
      letter-spacing: -.05em;
      line-height: 1;
      text-transform: uppercase;
      text-shadow: 1px 0 var(--magenta), -1px 0 var(--green);
    }

    .hint {
      margin: 6px 0 0;
      color: #9db397;
      font-size: 9px;
      line-height: 1.35;
    }

    .controls {
      display: flex;
      gap: 5px;
      padding: 5px;
    }

    .controls button {
      min-width: 38px;
      min-height: 36px;
      border: 1px solid rgba(114, 255, 25, .28);
      background: #070907;
      color: var(--green);
      cursor: pointer;
      font-size: 11px;
      text-transform: uppercase;
    }

    .controls button:hover,
    .controls button:focus-visible {
      border-color: var(--magenta);
      color: var(--magenta);
      outline: 2px solid #fff;
    }

    .position-readout {
      right: max(12px, env(safe-area-inset-right));
      bottom: max(12px, env(safe-area-inset-bottom));
      padding: 7px 10px;
      color: var(--green);
      font-size: 10px;
    }

    .key {
      display: inline-grid;
      min-width: 19px;
      height: 19px;
      place-items: center;
      border: 1px solid rgba(255,255,255,.35);
      margin: 0 1px;
      background: #10140e;
      color: #fff;
    }

    dialog {
      width: min(680px, calc(100vw - 28px));
      max-height: min(780px, calc(100dvh - 28px));
      overflow: hidden;
      border: 2px solid var(--green);
      padding: 0;
      background: #070907;
      color: var(--ink);
      box-shadow: 0 0 0 7px #000, 0 0 80px rgba(114, 255, 25, .22);
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, .78);
      backdrop-filter: blur(5px);
    }

    .picker-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      border-bottom: 1px solid rgba(114, 255, 25, .32);
      padding: 14px;
    }

    .picker-head h2 {
      grid-column: 1;
      margin: 0;
      color: #fff;
      font-size: 19px;
      text-transform: uppercase;
    }

    .picker-head p {
      grid-column: 1;
      margin: 2px 0 0;
      color: #93a78d;
      font-size: 10px;
    }

    .close-picker {
      grid-column: 2;
      grid-row: 1 / 3;
      width: 42px;
      border: 1px solid rgba(255, 43, 214, .5);
      background: #0b070a;
      color: var(--magenta);
      cursor: pointer;
      font-size: 22px;
    }

    .page-search {
      display: block;
      width: calc(100% - 28px);
      min-height: 44px;
      margin: 14px;
      border: 1px solid rgba(114, 255, 25, .4);
      padding: 0 12px;
      background: #020302;
      color: #fff;
    }

    .page-search:focus {
      border-color: var(--magenta);
      outline: 2px solid var(--magenta);
    }

    .page-list {
      display: grid;
      max-height: min(570px, calc(100dvh - 190px));
      overflow: auto;
      gap: 7px;
      padding: 0 14px 14px;
    }

    .page-choice {
      display: grid;
      grid-template-columns: minmax(0, 1fr) max-content;
      gap: 5px 12px;
      width: 100%;
      border: 1px solid rgba(114, 255, 25, .22);
      padding: 10px 12px;
      background: #0b0e0a;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }

    .page-choice:hover,
    .page-choice:focus-visible {
      border-color: var(--magenta);
      outline: 2px solid rgba(255, 43, 214, .55);
    }

    .choice-title {
      overflow: hidden;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .choice-route {
      grid-column: 1;
      overflow: hidden;
      color: var(--green);
      font-size: 9px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .choice-section {
      grid-column: 2;
      grid-row: 1 / 3;
      align-self: center;
      color: var(--amber);
      font-size: 8px;
      text-transform: uppercase;
    }

    .page-choice:disabled {
      opacity: .32;
      cursor: not-allowed;
    }

    .no-results {
      padding: 30px;
      color: #879481;
      text-align: center;
    }

    @media (max-width: 620px) {
      .topbar { align-items: stretch; }
      .brand { max-width: 58vw; }
      .hint { font-size: 8px; }
      .controls { flex-wrap: wrap; justify-content: flex-end; max-width: 155px; }
      .controls button { min-width: 34px; padding: 4px 6px; font-size: 9px; }
      .page-panel { border-width: 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .slot { transition: none; }
    }
  </style>
</head>
<body>
  <div class="viewport" id="viewport" aria-label="Spatial page map">
    <div class="world" id="world"></div>
  </div>

  <div class="chrome topbar">
    <div class="brand">
      <h1>Site Space</h1>
      <p class="hint"><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> fly · wheel zoom · drag to pan · click an empty rectangle to add a page</p>
    </div>
    <nav class="controls" aria-label="Map controls">
      <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
      <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
      <button type="button" id="overview">Overview</button>
      <button type="button" id="home">Splash</button>
    </nav>
  </div>

  <div class="chrome position-readout" id="position" aria-live="polite">0, 0 · 100%</div>

  <dialog id="page-picker">
    <div class="picker-head">
      <h2>Add a page</h2>
      <p id="picker-position">Choose what belongs in this part of the map.</p>
      <button class="close-picker" type="button" aria-label="Close page list">×</button>
    </div>
    <input class="page-search" id="page-search" type="search" placeholder="Search every page…" autocomplete="off">
    <div class="page-list" id="page-list"></div>
  </dialog>

  <script>
    const CELL_W = 1000;
    const CELL_H = 562.5;
    const STEP_X = 1110;
    const STEP_Y = 672.5;
    const GRID_RADIUS = 10;
    const STORAGE_KEY = "theinternetisdead:site-space:placements:v1";
    const REPOSITORY_TREE = "https://api.github.com/repos/honestlythomas/theinternetisdead/git/trees/main?recursive=1";

    const FALLBACK_PATHS = [
      "index.html", "portal/index.html", "help/index.html",
      "help/institutional-neglect.html", "help/self-advocacy-101-human-dignity.html",
      "help/self-advocacy-101-recognizing-harm.html", "dead/apps/chat/index.html",
      "dead/apps/os/index.html", "dead/content/pages/thumbnail-grid/index.html",
      "dead/distribution/downloads/index.html", "dead/distribution/downloads/dead-david-tss/index.html",
      "dead/experiments/index.html", "dead/experiments/background/index.html",
      "dead/experiments/base64-converter/index.html", "dead/experiments/blotter-visualizer/index.html",
      "dead/experiments/bookmark-manager/index.html", "dead/experiments/business-card/index.html",
      "dead/experiments/camera-experiment/index.html", "dead/experiments/camera-studio/index.html",
      "dead/experiments/canvas-backgrounds/index.html", "dead/experiments/chat-sandbox/index.html",
      "dead/experiments/dead-tv/index.html", "dead/experiments/gods-eye/index.html",
      "dead/experiments/habisky-mofo/index.html", "dead/experiments/karaoke-machine/index.html",
      "dead/experiments/mandala-visuals/index.html", "dead/experiments/multimedia-editor/index.html",
      "dead/experiments/music-crunchifier/index.html", "dead/experiments/music-player/index.html",
      "dead/experiments/old-homepage/index.html", "dead/experiments/pdf-viewer/index.html",
      "dead/experiments/photosphere/index.html", "dead/experiments/sound-machine/index.html",
      "dead/experiments/stacks/index.html", "dead/experiments/weird-secret/index.html",
      "dead/experiments/world-in-thing/index.html", "dead/games/index.html",
      "dead/games/grid-game-v2/index.html", "dead/games/grid-game/index.html",
      "dead/games/inferno-trainer/index.html", "dead/games/shooter-game/index.html",
      "dead/games/tektite-3D-game/index.html", "dead/media/videos/index.html"
    ];

    const viewport = document.getElementById("viewport");
    const world = document.getElementById("world");
    const picker = document.getElementById("page-picker");
    const pageSearch = document.getElementById("page-search");
    const pageList = document.getElementById("page-list");
    const positionReadout = document.getElementById("position");
    const pickerPosition = document.getElementById("picker-position");

    let camera = { x: 0, y: 0, zoom: 1 };
    let pages = [];
    let pendingCell = null;
    let placements = readPlacements();
    let pointer = null;
    let moved = false;
    let suppressSlotClick = false;
    let animationFrame = 0;
    const keys = new Set();

    if (!placements["0,0"]) placements["0,0"] = "/";

    function readPlacements() {
      try {
        const value = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return value && typeof value === "object" ? value : {};
      } catch (_) {
        return {};
      }
    }

    function savePlacements() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(placements)); } catch (_) {}
    }

    function pathToRoute(path) {
      if (path === "index.html") return "/";
      if (path.endsWith("/index.html")) return `/${path.slice(0, -10)}`;
      return `/${path}`;
    }

    function titleFromRoute(route) {
      if (route === "/") return "Splash";
      return route.replace(/\/$/, "").split("/").pop().replace(/\.html$/, "")
        .replace(/[-_]+/g, " ")
        .replace(/\b3d\b/i, "3D")
        .replace(/\b\w/g, letter => letter.toUpperCase());
    }

    function sectionFromRoute(route) {
      if (route === "/") return "home";
      const parts = route.split("/").filter(Boolean);
      if (parts[0] === "dead" && parts[1]) return parts[1];
      return parts[0] || "site";
    }

    function standaloneUrl(route) {
      if (route === "/") return "/";
      const url = new URL(route, location.origin);
      url.searchParams.set("standalone", "true");
      return `${url.pathname}${url.search}`;
    }

    function cellKey(x, y) { return `${x},${y}`; }

    function cellPosition(x, y) {
      return { left: x * STEP_X, top: y * STEP_Y };
    }

    function createSlot(x, y) {
      const button = document.createElement("button");
      const position = cellPosition(x, y);
      button.className = "slot";
      button.type = "button";
      button.style.left = `${position.left}px`;
      button.style.top = `${position.top}px`;
      button.dataset.x = x;
      button.dataset.y = y;
      button.setAttribute("aria-label", `Add page at grid position ${x}, ${y}`);
      button.innerHTML = `<span>+<small>${x}, ${y}</small></span>`;
      button.addEventListener("click", () => {
        if (suppressSlotClick) return;
        openPicker(x, y);
      });
      return button;
    }

    function createPanel(route, x, y) {
      const panel = document.createElement("article");
      const position = cellPosition(x, y);
      panel.className = `page-panel${route === "/" ? " is-home" : ""}`;
      panel.style.left = `${position.left}px`;
      panel.style.top = `${position.top}px`;
      panel.dataset.route = route;
      panel.dataset.x = x;
      panel.dataset.y = y;

      const bar = document.createElement("header");
      bar.className = "panel-bar";

      const title = document.createElement("span");
      title.className = "panel-title";
      title.textContent = titleFromRoute(route);

      const path = document.createElement("code");
      path.className = "panel-path";
      path.textContent = route;

      const open = document.createElement("a");
      open.className = "panel-action";
      open.href = route;
      open.target = "_blank";
      open.rel = "noopener";
      open.textContent = "↗";
      open.setAttribute("aria-label", `Open ${titleFromRoute(route)} in a new tab`);

      bar.append(title, path, open);

      if (route !== "/") {
        const remove = document.createElement("button");
        remove.className = "panel-action";
        remove.type = "button";
        remove.textContent = "×";
        remove.setAttribute("aria-label", `Remove ${titleFromRoute(route)} from the map`);
        remove.addEventListener("click", () => {
          delete placements[cellKey(x, y)];
          savePlacements();
          renderWorld();
        });
        bar.append(remove);
      }

      const frame = document.createElement("iframe");
      frame.src = standaloneUrl(route);
      frame.loading = "lazy";
      frame.tabIndex = -1;
      frame.title = `Preview of ${titleFromRoute(route)}`;

      panel.append(frame, bar);
      return panel;
    }

    function renderWorld() {
      const fragment = document.createDocumentFragment();
      for (let y = -GRID_RADIUS; y <= GRID_RADIUS; y++) {
        for (let x = -GRID_RADIUS; x <= GRID_RADIUS; x++) {
          const route = placements[cellKey(x, y)];
          fragment.append(route ? createPanel(route, x, y) : createSlot(x, y));
        }
      }
      world.replaceChildren(fragment);
      updateWorldTransform();
    }

    function updateWorldTransform() {
      const screenX = innerWidth / 2 - camera.x * camera.zoom;
      const screenY = innerHeight / 2 - camera.y * camera.zoom;
      world.style.transform = `translate3d(${screenX}px, ${screenY}px, 0) scale(${camera.zoom})`;
      positionReadout.textContent = `${Math.round(camera.x)}, ${Math.round(camera.y)} · ${Math.round(camera.zoom * 100)}%`;
    }

    function fitSplash() {
      camera.x = 0;
      camera.y = 0;
      camera.zoom = Math.min(.98, (innerWidth - 54) / CELL_W, (innerHeight - 80) / CELL_H);
      camera.zoom = Math.max(.16, camera.zoom);
      updateWorldTransform();
    }

    function showOverview() {
      const occupied = Object.entries(placements).map(([key]) => key.split(",").map(Number));
      if (!occupied.length) return fitSplash();
      const xs = occupied.map(point => point[0] * STEP_X);
      const ys = occupied.map(point => point[1] * STEP_Y);
      const minX = Math.min(...xs) - CELL_W / 2;
      const maxX = Math.max(...xs) + CELL_W / 2;
      const minY = Math.min(...ys) - CELL_H / 2;
      const maxY = Math.max(...ys) + CELL_H / 2;
      camera.x = (minX + maxX) / 2;
      camera.y = (minY + maxY) / 2;
      camera.zoom = Math.max(.08, Math.min(.8, (innerWidth - 70) / (maxX - minX), (innerHeight - 110) / (maxY - minY)));
      updateWorldTransform();
    }

    function zoomAt(nextZoom, clientX = innerWidth / 2, clientY = innerHeight / 2) {
      const oldZoom = camera.zoom;
      const clamped = Math.max(.07, Math.min(1.25, nextZoom));
      const worldX = camera.x + (clientX - innerWidth / 2) / oldZoom;
      const worldY = camera.y + (clientY - innerHeight / 2) / oldZoom;
      camera.zoom = clamped;
      camera.x = worldX - (clientX - innerWidth / 2) / clamped;
      camera.y = worldY - (clientY - innerHeight / 2) / clamped;
      updateWorldTransform();
    }

    function openPicker(x, y) {
      pendingCell = { x, y };
      pickerPosition.textContent = `Grid ${x}, ${y} · choose what belongs here.`;
      pageSearch.value = "";
      renderPageList();
      picker.showModal();
      requestAnimationFrame(() => pageSearch.focus());
    }

    function renderPageList() {
      const term = pageSearch.value.trim().toLowerCase();
      const usedRoutes = new Set(Object.values(placements));
      const matching = pages.filter(page => !term || `${page.title} ${page.route} ${page.section}`.toLowerCase().includes(term));
      const fragment = document.createDocumentFragment();

      matching.forEach(page => {
        const choice = document.createElement("button");
        choice.className = "page-choice";
        choice.type = "button";
        choice.disabled = usedRoutes.has(page.route);
        choice.innerHTML = `<span class="choice-title"></span><code class="choice-route"></code><span class="choice-section"></span>`;
        choice.querySelector(".choice-title").textContent = page.title;
        choice.querySelector(".choice-route").textContent = page.route;
        choice.querySelector(".choice-section").textContent = choice.disabled ? "already placed" : page.section;
        choice.addEventListener("click", () => {
          if (!pendingCell) return;
          placements[cellKey(pendingCell.x, pendingCell.y)] = page.route;
          savePlacements();
          picker.close();
          renderWorld();
        });
        fragment.append(choice);
      });

      if (!matching.length) {
        const empty = document.createElement("p");
        empty.className = "no-results";
        empty.textContent = "No pages found.";
        fragment.append(empty);
      }
      pageList.replaceChildren(fragment);
    }

    async function discoverPages() {
      let paths = FALLBACK_PATHS;
      try {
        const response = await fetch(REPOSITORY_TREE, { headers: { Accept: "application/vnd.github+json" } });
        if (!response.ok) throw new Error("page tree unavailable");
        const data = await response.json();
        paths = data.tree.filter(item => item.type === "blob" && item.path.endsWith(".html")).map(item => item.path);
      } catch (_) {}

      pages = [...new Set(paths.map(pathToRoute))]
        .filter(route => route !== "/customize/")
        .map(route => ({ route, title: titleFromRoute(route), section: sectionFromRoute(route) }))
        .sort((a, b) => a.section.localeCompare(b.section) || a.title.localeCompare(b.title));
      renderPageList();
    }

    function shouldIgnoreKey(event) {
      const tag = event.target?.tagName?.toLowerCase();
      return picker.open || tag === "input" || tag === "textarea" || tag === "select" || event.target?.isContentEditable;
    }

    function fly(time) {
      const previous = fly.previous || time;
      const seconds = Math.min(.04, (time - previous) / 1000);
      fly.previous = time;
      let dx = 0;
      let dy = 0;
      if (keys.has("w") || keys.has("arrowup")) dy--;
      if (keys.has("s") || keys.has("arrowdown")) dy++;
      if (keys.has("a") || keys.has("arrowleft")) dx--;
      if (keys.has("d") || keys.has("arrowright")) dx++;
      if (dx || dy) {
        const length = Math.hypot(dx, dy);
        const speed = 920 / Math.max(.22, camera.zoom);
        camera.x += dx / length * speed * seconds;
        camera.y += dy / length * speed * seconds;
        updateWorldTransform();
      }
      animationFrame = requestAnimationFrame(fly);
    }

    viewport.addEventListener("wheel", event => {
      event.preventDefault();
      zoomAt(camera.zoom * Math.exp(-event.deltaY * .0012), event.clientX, event.clientY);
    }, { passive: false });

    viewport.addEventListener("pointerdown", event => {
      if (event.button !== 0 || event.target.closest(".panel-action")) return;
      pointer = { id: event.pointerId, x: event.clientX, y: event.clientY, cameraX: camera.x, cameraY: camera.y };
      moved = false;
      viewport.setPointerCapture(event.pointerId);
      viewport.classList.add("is-panning");
    });

    viewport.addEventListener("pointermove", event => {
      if (!pointer || pointer.id !== event.pointerId) return;
      const dx = event.clientX - pointer.x;
      const dy = event.clientY - pointer.y;
      if (Math.hypot(dx, dy) > 7) moved = true;
      camera.x = pointer.cameraX - dx / camera.zoom;
      camera.y = pointer.cameraY - dy / camera.zoom;
      updateWorldTransform();
    });

    const stopPanning = event => {
      if (!pointer || pointer.id !== event.pointerId) return;
      suppressSlotClick = moved;
      setTimeout(() => { suppressSlotClick = false; }, 0);
      pointer = null;
      viewport.classList.remove("is-panning");
    };
    viewport.addEventListener("pointerup", stopPanning);
    viewport.addEventListener("pointercancel", stopPanning);

    addEventListener("keydown", event => {
      if (shouldIgnoreKey(event)) return;
      const key = event.key.toLowerCase();
      if (["w", "a", "s", "d", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(key)) {
        event.preventDefault();
        keys.add(key);
      }
    });
    addEventListener("keyup", event => keys.delete(event.key.toLowerCase()));
    addEventListener("blur", () => keys.clear());
    addEventListener("resize", updateWorldTransform);

    document.getElementById("zoom-out").addEventListener("click", () => zoomAt(camera.zoom / 1.25));
    document.getElementById("zoom-in").addEventListener("click", () => zoomAt(camera.zoom * 1.25));
    document.getElementById("overview").addEventListener("click", showOverview);
    document.getElementById("home").addEventListener("click", fitSplash);
    document.querySelector(".close-picker").addEventListener("click", () => picker.close());
    picker.addEventListener("click", event => {
      if (event.target === picker) picker.close();
    });
    pageSearch.addEventListener("input", renderPageList);

    savePlacements();
    renderWorld();
    fitSplash();
    discoverPages();
    animationFrame = requestAnimationFrame(fly);
  </script>
</body>
</html>
