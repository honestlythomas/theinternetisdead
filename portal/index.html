<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Recursive Portal — THE INTERNET IS DEAD</title>
  <style>
    :root {
      color-scheme: dark;
      --void: #000;
      --green: #42ff19;
      --magenta: #ff00d4;
      --ink: #ddffda;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--void);
      color: var(--ink);
      font-family: "Courier New", Courier, monospace;
    }

    /* Add or replace anything inside #portal-content. The handoff remains independent. */
    #portal-content {
      display: grid;
      min-height: 100dvh;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at center, rgba(255, 0, 212, 0.11), transparent 35%),
        radial-gradient(circle at 50% 115%, rgba(66, 255, 25, 0.1), transparent 42%),
        #000;
      text-align: center;
      transform-origin: 50% 50%;
    }

    .portal-placeholder {
      width: min(680px, 100%);
      border: 1px solid rgba(66, 255, 25, 0.35);
      padding: clamp(24px, 6vw, 60px);
      background: rgba(0, 8, 0, 0.88);
      box-shadow: 0 0 42px rgba(66, 255, 25, 0.1);
    }

    h1 {
      margin: 0 0 14px;
      color: var(--green);
      font-size: clamp(28px, 7vw, 68px);
      letter-spacing: -0.06em;
      line-height: 0.95;
      text-transform: uppercase;
      text-shadow: 2px 0 var(--magenta), 0 0 18px rgba(66, 255, 25, 0.4);
    }

    p {
      margin: 0;
      line-height: 1.55;
    }

  </style>
</head>
<body>
  <main id="portal-content">
    <section class="portal-placeholder">
      <h1>Portal Open</h1>
      <p>This space is ready for whatever comes through next.</p>
    </section>
  </main>

  <script src="/dead/scripts/page-transitions.js"></script>
</body>
</html>
