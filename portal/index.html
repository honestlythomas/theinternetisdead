<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>TheInternetIsDead.org - Portal</title>
  <link rel="stylesheet" href="/os/page-glitch-transition.css">
  <link rel="stylesheet" href="/os/midnight-hyperspace.css">
  <script src="/os/page-glitch-transition.js" defer></script>
  <script src="/os/site-color-overlay.js" defer></script>
  <script src="/os/midnight-hyperspace.js" defer></script>
  <script src="/os/page-warp.js" defer></script>
  <style>
    :root {
      color-scheme: dark;
      --green: #72ff19;
      --magenta: #ff2bd6;
      --line: rgba(114,255,25,.32);
      --vortex-x: 0px;
      --vortex-y: 0px;
    }
    @property --vortex-spin { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    body {
      position: relative;
      color: var(--green);
      font-family: "Courier New", Courier, monospace;
    }
    .starfield-background {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }
    .top-bar-frame {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: block;
      width: 100%;
      height: 54px;
      border: 0;
      background: transparent !important;
      color-scheme: normal;
      transition: height .01s linear;
    }
    .top-bar-frame.sidebar-open,
    .top-bar-frame.menu-open { height: 100vh; height: 100dvh; }
    .main-rectangle {
      position: fixed;
      top: 64px;
      left: 10px;
      right: 10px;
      bottom: 10px;
      z-index: 5;
      overflow: hidden;
      border: 3px solid #fff;
      padding: 10px 14px 14px;
      background: rgba(0,0,0,.65);
      text-shadow: 0 2px 8px #000;
    }
    .navigation {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(84vmin, 760px, calc(100% - 20px));
      height: min(84vmin, 760px, calc(100% - 20px));
      background: transparent;
      transform: translate(-50%, -50%);
      isolation: isolate;
    }
    .compass {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      place-items: center;
    }
    .compass::before,
    .compass::after {
      content: "";
      position: absolute;
      z-index: -1;
      pointer-events: none;
      transition: width 180ms ease, height 180ms ease, background 180ms ease;
    }
    .compass::before { top: 50%; left: 8%; width: 84%; height: 1px; background: linear-gradient(90deg, transparent, var(--line), transparent); }
    .compass::after { top: 8%; left: 50%; width: 1px; height: 84%; background: linear-gradient(180deg, transparent, var(--line), transparent); }
    .compass.portal-open::before { height: 3px; background: linear-gradient(90deg, transparent, var(--magenta), transparent); }
    .compass.portal-open::after { width: 3px; background: linear-gradient(180deg, transparent, var(--magenta), transparent); }
    .portal-button {
      position: relative;
      display: grid;
      width: min(22vmin, 190px, 72%);
      aspect-ratio: 1;
      place-items: center;
      overflow: hidden;
      border: 2px solid var(--green);
      border-radius: 50%;
      background: linear-gradient(rgba(0,0,0,.12), rgba(0,0,0,.12)), var(--portal-image) center/cover no-repeat;
      box-shadow: 0 0 0 4px rgba(0,0,0,.85), 0 0 0 5px rgba(114,255,25,.3), 0 0 34px rgba(114,255,25,.2), inset 0 0 32px rgba(0,0,0,.45);
      color: var(--green);
      cursor: pointer;
      font: inherit;
      padding: 0;
      text-decoration: none;
      appearance: none;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateZ(0);
      will-change: transform, opacity;
    }
    .portal-button::before { content: ""; position: absolute; inset: 0; z-index: 2; border-radius: inherit; background: repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.3) 3px 4px),radial-gradient(circle,transparent 38%,rgba(0,0,0,.58) 100%); pointer-events: none; }
    .portal-preview { position: absolute; top: 50%; left: 50%; z-index: 1; width: 455%; height: 455%; border: 0; background: transparent; opacity: .82; pointer-events: none; transform: translate(-50%,-50%) scale(.22); transform-origin: center; filter: saturate(1.18) contrast(1.08); mix-blend-mode: screen; }
    .portal-button > span { position: relative; z-index: 3; display: grid; min-width: 46%; aspect-ratio: 1; place-items: center; border: 1px solid currentColor; border-radius: 50%; background: rgba(0,0,0,.76); font-size: clamp(10px,2.2vmin,20px); font-weight: 900; text-shadow: 0 0 8px #000; }
    .portal-button .destination-label { min-width: 0; aspect-ratio: auto; border: 0; border-radius: 0; padding: .35em .55em; background: rgba(0,0,0,.78); font-size: clamp(10px,1.8vmin,18px); letter-spacing: .04em; line-height: 1; }
    .portal-button .orb-label { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .3em; text-align: center; }
    .portal-button .orb-symbol { display: block; min-width: 0; aspect-ratio: auto; border: 0; border-radius: 0; background: transparent; font-size: clamp(22px,4vmin,40px); line-height: 1; }
    .portal-button:hover,
    .portal-button:focus-visible { border-color: var(--magenta); color: #ff8deb; outline: 2px solid #fff; outline-offset: 6px; box-shadow: 0 0 0 4px rgba(0,0,0,.85),0 0 0 5px rgba(255,43,214,.45),0 0 48px rgba(255,43,214,.42); }
    .north { grid-column: 2; grid-row: 1; --from-x: 0%; --from-y: 134%; --over-x: 0%; --over-y: -10%; --spiral: -620deg; --delay: 0ms; }
    .east { grid-column: 3; grid-row: 2; --portal-image: url("/dead/assets/images/static.gif"); --from-x: -134%; --from-y: 0%; --over-x: 10%; --over-y: 0%; --spiral: 620deg; --delay: 70ms; }
    .south { grid-column: 2; grid-row: 3; --portal-image: url("/dead/assets/images/static.gif"); --from-x: 0%; --from-y: -134%; --over-x: 0%; --over-y: 10%; --spiral: -620deg; --delay: 140ms; }
    .west { grid-column: 1; grid-row: 2; --portal-image: url("/dead/assets/images/static.gif"); --from-x: 134%; --from-y: 0%; --over-x: -10%; --over-y: 0%; --spiral: 620deg; --delay: 210ms; }
    .portal-open .portal-button { visibility: visible; pointer-events: auto; opacity: 1; transform: translate3d(0,0,0) rotate(0deg) scale(1); filter: none; }
    .portal-opening .portal-button { visibility: visible; pointer-events: auto; animation: portal-emerge 1050ms cubic-bezier(.12,.72,.18,1.12) calc(var(--delay) + 240ms) both; }
    .portal-closing .portal-button { visibility: visible; pointer-events: none; animation: portal-emerge 720ms cubic-bezier(.62,0,.88,.38) calc(210ms - var(--delay)) reverse both; }
    @keyframes portal-emerge { 0% { opacity: 0; transform: translate3d(var(--from-x),var(--from-y),0) rotate(var(--spiral)) scale(.02); filter: brightness(3) saturate(2.5); } 58% { opacity: 1; transform: translate3d(var(--over-x),var(--over-y),0) rotate(-26deg) scale(1.12); filter: brightness(1.4) saturate(1.6); } 100% { opacity: 1; transform: translate3d(0,0,0) rotate(0deg) scale(1); filter: none; } }
    .core { position: relative; grid-column: 2; grid-row: 2; display: grid; width: min(15vmin,125px,48%); aspect-ratio: 1; place-items: center; overflow: hidden; border: 1px solid rgba(255,43,214,.7); border-radius: 50%; padding: 0; background: radial-gradient(circle,#000 0 34%,rgba(0,0,0,.78) 52%,transparent 72%); color: var(--green); cursor: pointer; font: 900 clamp(21px,3.75vmin,36px)/1.05 "Courier New",Courier,monospace; letter-spacing: .08em; text-align: center; text-decoration: none; text-transform: uppercase; text-shadow: 0 0 8px #000; isolation: isolate; appearance: none; outline: 2px solid var(--green); outline-offset: 6px; box-shadow: 0 0 48px rgba(114,255,25,.46); transform: scale(3); transform-origin: center; transition: outline-color 160ms ease,box-shadow 160ms ease,color 160ms ease; }
    .core-vortex { position: absolute; inset: -50%; z-index: -1; width: 200%; height: 200%; overflow: visible; opacity: .9; filter: saturate(1.5); transform: translate3d(var(--vortex-x),var(--vortex-y),0) rotate(var(--vortex-spin)); animation: vortex-spin 1650ms linear infinite; transform-origin: center; will-change: transform,filter,opacity; }
    .vortex-tendril { fill: none; stroke-width: 3.2; stroke-linecap: round; vector-effect: non-scaling-stroke; mix-blend-mode: screen; }
    .vortex-red { stroke: #ff1744; filter: drop-shadow(0 0 4px #ff1744); }
    .vortex-green { stroke: #42ff55; filter: drop-shadow(0 0 4px #42ff55); }
    .vortex-blue { stroke: #18a8ff; filter: drop-shadow(0 0 4px #18a8ff); }
    .core-label { position: relative; z-index: 1; }
    .core:hover,
    .core:focus-visible { outline-color: var(--magenta); color: var(--magenta); box-shadow: 0 0 64px rgba(255,43,214,.58); }
    .portal-open .core-vortex { opacity: .96; filter: saturate(1.9) brightness(1.25); transform: translate3d(var(--vortex-x),var(--vortex-y),0) rotate(var(--vortex-spin)) scale(1.32); animation: vortex-spin 420ms linear infinite; }
    .portal-open .core { overflow: hidden; transform: scale(1.08); }
    .portal-opening .core-vortex { animation: vortex-open 1250ms cubic-bezier(.1,.76,.18,1) both,vortex-spin 420ms linear infinite; }
    .portal-opening .core { overflow: hidden; animation: core-open 1250ms cubic-bezier(.12,.72,.18,1) both; }
    .portal-closing .core-vortex { animation: vortex-close 930ms cubic-bezier(.62,0,.88,.38) both,vortex-spin 360ms linear infinite; }
    .portal-closing .core { animation: core-close 930ms cubic-bezier(.62,0,.88,.38) both; }
    @keyframes vortex-spin { to { --vortex-spin: 360deg; } }
    @keyframes vortex-open { 0% { opacity: .78; filter: saturate(1.4) brightness(1); transform: translate3d(var(--vortex-x),var(--vortex-y),0) rotate(var(--vortex-spin)) scale(.72); } 48% { opacity: 1; filter: saturate(2.4) brightness(1.65); transform: translate3d(var(--vortex-x),var(--vortex-y),0) rotate(var(--vortex-spin)) scale(2.45); } 100% { opacity: .96; filter: saturate(1.9) brightness(1.25); transform: translate3d(var(--vortex-x),var(--vortex-y),0) rotate(var(--vortex-spin)) scale(1.32); } }
    @keyframes core-open { 0% { transform: scale(3); } 42% { transform: scale(3.35); } 68% { transform: scale(1.28); } 100% { transform: scale(1.08); } }
    @keyframes vortex-close { 0% { opacity: .96; filter: saturate(1.9) brightness(1.25); transform: translate3d(var(--vortex-x),var(--vortex-y),0) rotate(var(--vortex-spin)) scale(1.32); } 38% { opacity: 1; filter: saturate(2.5) brightness(1.7); transform: translate3d(var(--vortex-x),var(--vortex-y),0) rotate(var(--vortex-spin)) scale(2.1); } 100% { opacity: .9; filter: saturate(1.5) brightness(1); transform: translate3d(var(--vortex-x),var(--vortex-y),0) rotate(var(--vortex-spin)) scale(1); } }
    @keyframes core-close { 0% { transform: scale(1.08); } 38% { transform: scale(1.7); } 100% { transform: scale(3); } }
    @media (max-width: 820px) {
      .top-bar-frame { height: 48px; }
      .top-bar-frame.sidebar-open,
      .top-bar-frame.menu-open { height: 100vh; height: 100dvh; }
      .main-rectangle { top: 58px; padding: 8px 12px 12px; }
    }
  </style>
</head>
<body>
  <iframe
    class="starfield-background"
    src="/dead/backgrounds/starfield-background.html?v=20260816-4"
    title="Animated starfield background"
    aria-hidden="true"
  ></iframe>

  <iframe
    class="top-bar-frame"
    id="top-bar-frame"
    src="/os/top-bar.html?title=Portal"
    title="Site top bar"
    allowtransparency="true"
  ></iframe>

  <main class="main-rectangle">
    <nav class="navigation compass" aria-label="Portal navigation">
      <a class="portal-button north" href="/" aria-label="Return home"><span class="destination-label orb-label"><span class="orb-symbol" aria-hidden="true">🏠</span>Home</span></a>
      <a class="portal-button east" href="/dead/experiments/" aria-label="Open Experiments"><iframe class="portal-preview" src="/dead/experiments/" title="Live preview of Experiments" aria-hidden="true" tabindex="-1"></iframe><span class="destination-label orb-label"><span class="orb-symbol" aria-hidden="true">🧩</span>Experiments</span></a>
      <button class="core" id="open-portal" type="button" aria-expanded="false" aria-label="Enter Portal and release the direction portals"><svg class="core-vortex" viewBox="-110 -110 220 220" aria-hidden="true"><path class="vortex-tendril vortex-red"></path><path class="vortex-tendril vortex-green"></path><path class="vortex-tendril vortex-blue"></path></svg><span class="core-label">Enter</span></button>
      <a class="portal-button south" href="/" aria-label="Return through the south portal"><span aria-hidden="true">↓</span></a>
      <a class="portal-button west" href="/dead/games/" aria-label="Open Games"><iframe class="portal-preview" src="/dead/games/" title="Live preview of Games" aria-hidden="true" tabindex="-1"></iframe><span class="destination-label orb-label"><span class="orb-symbol" aria-hidden="true">🕹️</span>Games</span></a>
    </nav>
  </main>

  <script>
    const topBarFrame=document.getElementById('top-bar-frame');
    window.addEventListener('message',event=>{
      if(event.origin!==window.location.origin||event.source!==topBarFrame.contentWindow)return;
      if(event.data?.type==='topbar-sidebar')topBarFrame.classList.toggle('sidebar-open',Boolean(event.data.open));
      if(event.data?.type==='topbar-menu')topBarFrame.classList.toggle('menu-open',Boolean(event.data.open));
    });

    const compass=document.querySelector('.compass');
    const openPortal=document.getElementById('open-portal');
    const coreLabel=openPortal.querySelector('.core-label');
    const tendrils=document.querySelectorAll('.vortex-tendril');
    const portalStateKey='theinternetisdead:portal:open';
    let portalIsOpen=false;
    let openTimer=0;
    let closeTimer=0;
    const makeSpiral=phase=>{
      const points=[];
      const steps=260;
      for(let step=0;step<=steps;step++){
        const progress=step/steps;
        const angle=progress*Math.PI*10+phase;
        const radius=4+progress*98;
        points.push(`${step?'L':'M'}${(Math.cos(angle)*radius).toFixed(2)} ${(Math.sin(angle)*radius).toFixed(2)}`);
      }
      return points.join(' ');
    };
    tendrils.forEach((tendril,index)=>tendril.setAttribute('d',makeSpiral(index*Math.PI*2/tendrils.length)));
    const readPortalState=()=>{try{return localStorage.getItem(portalStateKey)==='true'}catch(error){return false}};
    const savePortalState=open=>{try{localStorage.setItem(portalStateKey,open?'true':'false')}catch(error){}};
    const setPortalState=(open,{animate=false}={})=>{
      clearTimeout(openTimer);
      clearTimeout(closeTimer);
      portalIsOpen=Boolean(open);
      compass.classList.remove('portal-open','portal-opening','portal-closing');
      if(portalIsOpen){
        compass.classList.add('portal-open');
        if(animate){
          void compass.offsetWidth;
          compass.classList.add('portal-opening');
          openTimer=setTimeout(()=>{if(portalIsOpen)compass.classList.remove('portal-opening')},1550);
        }
        coreLabel.textContent='Exit';
        openPortal.setAttribute('aria-expanded','true');
        openPortal.setAttribute('aria-label','Exit Portal and hide the direction portals');
      }else if(animate){
        void compass.offsetWidth;
        compass.classList.add('portal-closing');
        coreLabel.textContent='Enter';
        openPortal.setAttribute('aria-expanded','false');
        openPortal.setAttribute('aria-label','Enter Portal and release the direction portals');
        closeTimer=setTimeout(()=>{if(!portalIsOpen)compass.classList.remove('portal-closing')},980);
      }else{
        coreLabel.textContent='Enter';
        openPortal.setAttribute('aria-expanded','false');
        openPortal.setAttribute('aria-label','Enter Portal and release the direction portals');
      }
      savePortalState(portalIsOpen);
    };
    openPortal.addEventListener('click',()=>setPortalState(!portalIsOpen,{animate:true}));
    window.addEventListener('pageshow',()=>setPortalState(readPortalState()));
    setPortalState(readPortalState());
  </script>
</body>
</html>
