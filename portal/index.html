<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>TheInternetIsDead.org - Portal</title>
  <style>
    :root {
      color-scheme: dark;
      --green: #72ff19;
      --magenta: #ff2bd6;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    body {
      position: relative;
      color: var(--green);
      font-family: "Courier New", Courier, monospace;
    }
    .starfield-background {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }
    .top-bar-frame {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: block;
      width: 100%;
      height: 54px;
      border: 0;
      background: transparent !important;
      color-scheme: normal;
      transition: height .01s linear;
    }
    .top-bar-frame.sidebar-open { height: 100vh; height: 100dvh; }
    .main-rectangle {
      position: fixed;
      top: 64px;
      left: 10px;
      right: 10px;
      bottom: 10px;
      z-index: 5;
      overflow: hidden;
      border: 3px solid #fff;
      padding: 10px 14px 14px;
      background: rgba(0,0,0,.65);
      text-shadow: 0 2px 8px #000;
    }
    @media (max-width: 820px) {
      .top-bar-frame { height: 48px; }
      .top-bar-frame.sidebar-open { height: 100vh; height: 100dvh; }
      .main-rectangle { top: 58px; padding: 8px 12px 12px; }
    }
  </style>
</head>
<body>
  <iframe
    class="starfield-background"
    src="/dead/backgrounds/starfield-background.html"
    title="Animated starfield background"
    aria-hidden="true"
  ></iframe>

  <iframe
    class="top-bar-frame"
    id="top-bar-frame"
    src="/os/top-bar.html?title=Portal"
    title="Site top bar"
    allowtransparency="true"
  ></iframe>

  <div class="main-rectangle"></div>

  <script>
    const topBarFrame=document.getElementById('top-bar-frame');
    window.addEventListener('message',event=>{
      if(event.origin!==window.location.origin||event.source!==topBarFrame.contentWindow)return;
      if(event.data?.type==='topbar-sidebar')topBarFrame.classList.toggle('sidebar-open',Boolean(event.data.open));
    });
  </script>
</body>
</html>
