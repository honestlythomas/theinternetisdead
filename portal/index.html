<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Recursive Portal — THE INTERNET IS DEAD</title>
  <style>
    :root {
      color-scheme: dark;
      --void: #000;
      --green: #42ff19;
      --magenta: #ff00d4;
      --ink: #ddffda;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--void);
      color: var(--ink);
      font-family: "Courier New", Courier, monospace;
    }

    /* Add or replace anything inside #portal-content. The handoff remains independent. */
    #portal-content {
      display: grid;
      min-height: 100dvh;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at center, rgba(255, 0, 212, 0.11), transparent 35%),
        radial-gradient(circle at 50% 115%, rgba(66, 255, 25, 0.1), transparent 42%),
        #000;
      text-align: center;
      transform-origin: 50% 50%;
    }

    .portal-placeholder {
      width: min(680px, 100%);
      border: 1px solid rgba(66, 255, 25, 0.35);
      padding: clamp(24px, 6vw, 60px);
      background: rgba(0, 8, 0, 0.88);
      box-shadow: 0 0 42px rgba(66, 255, 25, 0.1);
    }

    h1 {
      margin: 0 0 14px;
      color: var(--green);
      font-size: clamp(28px, 7vw, 68px);
      letter-spacing: -0.06em;
      line-height: 0.95;
      text-transform: uppercase;
      text-shadow: 2px 0 var(--magenta), 0 0 18px rgba(66, 255, 25, 0.4);
    }

    p {
      margin: 0;
      line-height: 1.55;
    }

    body.portal-arriving {
      overflow: hidden;
      pointer-events: none;
    }

    body.portal-arriving #portal-content {
      animation: portal-release 2500ms cubic-bezier(0.08, 0.58, 0.28, 1) both;
    }

    body.portal-arriving .portal-flare {
      animation: portal-flare-out 2500ms ease-out both;
    }

    .portal-flare {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background:
        repeating-conic-gradient(from 0deg, transparent 0 8deg, rgba(255, 0, 212, 0.13) 8deg 10deg, transparent 10deg 18deg),
        radial-gradient(circle at center, #000 0 2%, rgba(0, 0, 0, 0.82) 5%, transparent 28%);
      pointer-events: none;
      transform-origin: center;
      opacity: 0;
    }

    @keyframes portal-release {
      0% {
        opacity: 0;
        transform: rotate(-745deg) scale(0.015);
        filter: url("#portal-swirl-filter") saturate(2.2) contrast(1.3) blur(2px);
      }
      28% {
        opacity: 0.92;
        transform: rotate(-430deg) scale(0.48);
        filter: url("#portal-swirl-filter") saturate(1.8) contrast(1.18) blur(0.5px);
      }
      76% {
        opacity: 1;
        transform: rotate(-36deg) scale(1.06);
        filter: url("#portal-swirl-filter") saturate(1.35) contrast(1.08);
      }
      100% {
        opacity: 1;
        transform: rotate(0deg) scale(1);
        filter: none;
      }
    }

    @keyframes portal-flare-out {
      0% { opacity: 1; transform: scale(3) rotate(-745deg); }
      45% { opacity: 0.46; }
      100% { opacity: 0; transform: scale(0.1) rotate(0deg); }
    }
  </style>
</head>
<body>
  <main id="portal-content">
    <section class="portal-placeholder">
      <h1>Portal Open</h1>
      <p>This space is ready for whatever comes through next.</p>
    </section>
  </main>

  <div class="portal-flare" aria-hidden="true"></div>

  <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:fixed">
    <filter id="portal-swirl-filter" x="-35%" y="-35%" width="170%" height="170%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.018" numOctaves="2" seed="13" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="22" xChannelSelector="R" yChannelSelector="B" />
    </filter>
  </svg>

  <script>
    (() => {
      const handoff = sessionStorage.getItem("portalHandoff");
      if (!handoff) return;

      sessionStorage.removeItem("portalHandoff");
      document.body.classList.add("portal-arriving");

      window.setTimeout(() => {
        document.body.classList.remove("portal-arriving");
      }, 2500);
    })();
  </script>
</body>
</html>
