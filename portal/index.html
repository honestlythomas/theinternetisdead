<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Recursive Portal</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    .portal {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    .starfield,
    .navigation {
      position: absolute;
      display: block;
      border: 0;
    }

    .starfield {
      inset: -3%;
      z-index: 0;
      width: 106%;
      height: 106%;
      background: #000;
      transform: scale(1.04);
      transform-origin: center;
    }

    .navigation {
      top: 54%;
      left: 50%;
      z-index: 1;
      width: min(84vmin, 760px);
      height: min(84vmin, 760px);
      background: transparent;
      transform: translate(-50%, -50%);
    }

    .home-link,
    .page-title {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      z-index: 2;
      margin: 0;
      color: #72ff19;
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(16px, 2vw, 24px);
      font-style: italic;
      font-weight: 700;
      line-height: 1;
      text-decoration: underline;
      text-underline-offset: .2em;
      text-shadow: 0 2px 8px #000, 0 0 12px rgba(114, 255, 25, .38);
    }

    .home-link {
      left: max(16px, env(safe-area-inset-left));
    }

    .page-title {
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .home-link:visited {
      color: #72ff19;
    }

    .home-link:hover,
    .home-link:focus-visible {
      color: #ff2bd6;
      text-shadow: 0 2px 8px #000, 0 0 14px rgba(255, 43, 214, .58);
    }

    .cursor-lens {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 3;
      width: 50px;
      height: 50px;
      border: 3px solid #fff;
      border-radius: 50%;
      background: rgba(255, 255, 255, .001);
      -webkit-backdrop-filter: invert(1);
      backdrop-filter: invert(1);
      opacity: 0;
      pointer-events: none;
      transform: translate3d(-100px, -100px, 0) translate(-50%, -50%);
      transition: opacity 80ms linear;
      will-change: transform, opacity;
    }

    .cursor-lens.is-visible {
      opacity: 1;
    }

    @media (max-width: 520px) {
      .navigation {
        top: 55%;
        width: 88vmin;
        height: 88vmin;
      }
    }
  </style>
</head>
<body>
  <main class="portal" data-transition-root>
    <iframe class="starfield"
            src="/dead/experiments/canvas-backgrounds/starfield-background.html?v=20260809-3"
            title="Animated starfield background"></iframe>

    <iframe class="navigation"
            src="/portal/nav.html?v=20260809-9"
            title="Cardinal portal navigation"
            allowtransparency="true"></iframe>

    <a class="home-link" href="/">theinternetisdead.org</a>
    <h1 class="page-title">Portal</h1>
    <div class="cursor-lens" aria-hidden="true"></div>
  </main>

  <script>
    const portal = document.querySelector(".portal");
    const starfield = document.querySelector(".starfield");
    const navigation = document.querySelector(".navigation");
    const cursorLens = document.querySelector(".cursor-lens");
    const portalStateKey = "theinternetisdead:portal:open";
    let touchHideTimer = 0;

    const readPortalState = () => {
      try {
        return window.localStorage.getItem(portalStateKey) === "true";
      } catch (_) {
        return false;
      }
    };

    const savePortalState = open => {
      try {
        window.localStorage.setItem(portalStateKey, open ? "true" : "false");
      } catch (_) {}
    };

    const syncPortalState = () => {
      if (!navigation.contentWindow) return;
      navigation.contentWindow.postMessage({
        type: "portal-set-open-state",
        open: readPortalState()
      }, window.location.origin);
    };

    const positionLens = (clientX, clientY, pointerType = "mouse", active = true) => {
      window.clearTimeout(touchHideTimer);

      if (active) {
        cursorLens.style.transform = `translate3d(${clientX}px, ${clientY}px, 0) translate(-50%, -50%)`;
        cursorLens.classList.add("is-visible");
        return;
      }

      const hide = () => cursorLens.classList.remove("is-visible");
      if (pointerType === "touch") touchHideTimer = window.setTimeout(hide, 180);
      else hide();
    };

    const positionLensFromFrame = (frame, data) => {
      const rect = frame.getBoundingClientRect();
      const x = Math.max(-1, Math.min(1, Number(data.x) || 0));
      const y = Math.max(-1, Math.min(1, Number(data.y) || 0));
      positionLens(
        rect.left + (x + 1) * rect.width / 2,
        rect.top + (y + 1) * rect.height / 2,
        data.pointerType || "mouse",
        Boolean(data.active)
      );
    };

    const updateParentLens = (event, active = true) => {
      positionLens(event.clientX, event.clientY, event.pointerType || "mouse", active);
    };

    portal.addEventListener("pointermove", event => updateParentLens(event), { passive: true });
    portal.addEventListener("pointerdown", event => updateParentLens(event), { passive: true });
    portal.addEventListener("pointerup", event => {
      if (event.pointerType !== "mouse") updateParentLens(event, false);
    }, { passive: true });
    portal.addEventListener("pointercancel", event => updateParentLens(event, false), { passive: true });
    window.addEventListener("blur", () => cursorLens.classList.remove("is-visible"));
    navigation.addEventListener("load", syncPortalState);
    window.addEventListener("pageshow", syncPortalState);

    window.addEventListener("message", event => {
      if (event.origin !== window.location.origin || !event.data) return;

      if (event.source === navigation.contentWindow) {
        if (event.data.type === "portal-open-state-request") {
          syncPortalState();
          return;
        }

        if (event.data.type === "portal-open-state") {
          savePortalState(Boolean(event.data.open));
          return;
        }
      }

      if (event.source === starfield.contentWindow && event.data.type === "portal-surface-pointer") {
        positionLensFromFrame(starfield, event.data);
        return;
      }

      if (event.source !== navigation.contentWindow || event.data.type !== "portal-pointer") return;

      const x = Math.max(-1, Math.min(1, Number(event.data.x) || 0));
      const y = Math.max(-1, Math.min(1, Number(event.data.y) || 0));
      positionLensFromFrame(navigation, event.data);
      starfield.contentWindow.postMessage({
        type: "portal-starfield-parallax",
        active: Boolean(event.data.active),
        x,
        y
      }, window.location.origin);
    });
  </script>
  <script src="/dead/scripts/page-transitions.js?v=20260809-2"></script>
</body>
</html>
