<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Recursive Portal</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    .portal {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    .starfield,
    .navigation {
      position: absolute;
      display: block;
      border: 0;
    }

    .starfield {
      inset: -3%;
      z-index: 0;
      width: 106%;
      height: 106%;
      background: #000;
      transform: scale(1.04) translate3d(0, 0, 0);
      transform-origin: center;
      transition: transform 90ms linear;
      will-change: transform;
    }

    .navigation {
      top: 50%;
      left: 50%;
      z-index: 1;
      width: min(94vmin, 820px);
      height: min(94vmin, 820px);
      background: transparent;
      transform: translate(-50%, -50%);
    }

    .home-link {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      left: max(16px, env(safe-area-inset-left));
      z-index: 2;
      color: #fff;
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(16px, 2vw, 24px);
      font-style: italic;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      text-shadow: 0 2px 8px #000, 0 0 12px rgba(255, 255, 255, .28);
    }

    .home-link:hover,
    .home-link:focus-visible {
      text-decoration: underline;
      text-underline-offset: .2em;
    }

    @media (max-width: 520px) {
      .navigation {
        width: 98vmin;
        height: 98vmin;
      }
    }
  </style>
</head>
<body>
  <main class="portal" data-transition-root>
    <iframe class="starfield"
            src="/dead/experiments/canvas-backgrounds/starfield-background.html"
            title="Animated starfield background"></iframe>

    <iframe class="navigation"
            src="/portal/nav.html"
            title="Cardinal portal navigation"
            allowtransparency="true"></iframe>

    <a class="home-link" href="/">theinternetisdead.org</a>
  </main>

  <script>
    const starfield = document.querySelector(".starfield");
    const navigation = document.querySelector(".navigation");

    window.addEventListener("message", event => {
      if (event.origin !== window.location.origin || event.source !== navigation.contentWindow) return;
      if (!event.data || event.data.type !== "portal-pointer") return;

      const x = Math.max(-1, Math.min(1, Number(event.data.x) || 0));
      const y = Math.max(-1, Math.min(1, Number(event.data.y) || 0));
      starfield.style.transform = `scale(1.07) translate3d(${-x * 1.8}%, ${-y * 1.8}%, 0)`;
    });
  </script>
  <script src="/dead/scripts/page-transitions.js?v=20260809-2"></script>
</body>
</html>
