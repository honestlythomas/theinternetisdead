<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Recursive Portal</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    .portal {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    .starfield,
    .navigation {
      position: absolute;
      display: block;
      border: 0;
    }

    .starfield {
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    .navigation {
      top: 50%;
      left: 50%;
      z-index: 1;
      width: min(94vmin, 820px);
      height: min(94vmin, 820px);
      background: transparent;
      transform: translate(-50%, -50%);
    }

    @media (max-width: 520px) {
      .navigation {
        width: 98vmin;
        height: 98vmin;
      }
    }
  </style>
</head>
<body>
  <main class="portal" data-transition-root>
    <iframe class="starfield"
            src="/dead/interactive/experiments/canvas-backgrounds/starfield-background.html"
            title="Animated starfield background"></iframe>

    <iframe class="navigation"
            src="/portal/nav.html"
            title="Cardinal portal navigation"
            allowtransparency="true"></iframe>
  </main>

  <script src="/dead/scripts/page-transitions.js?v=20260808-7"></script>
</body>
</html>
