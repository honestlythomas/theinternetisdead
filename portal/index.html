<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Recursive Portal — Choose a Vector</title>
  <style>
    :root {
      color-scheme: dark;
      --void: #000;
      --green: #72ff19;
      --magenta: #ff2bd6;
      --line: rgba(114, 255, 25, .3);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--void);
    }

    body {
      min-width: 280px;
      color: #eaffdf;
      font-family: "Courier New", Courier, monospace;
    }

    .portal {
      position: relative;
      display: grid;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      place-items: center;
      isolation: isolate;
      background:
        radial-gradient(circle at center, rgba(255, 43, 214, .1), transparent 18%),
        radial-gradient(circle at center, rgba(114, 255, 25, .07), transparent 48%),
        #000;
    }

    .portal::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(114, 255, 25, .14);
      pointer-events: none;
    }

    .status {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      left: max(16px, env(safe-area-inset-left));
      z-index: 3;
      margin: 0;
      color: #297f18;
      font-size: clamp(7px, .72vw, 10px);
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .compass {
      position: relative;
      display: grid;
      width: min(90vmin, 820px);
      height: min(90vmin, 820px);
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      place-items: center;
    }

    .axis {
      position: absolute;
      z-index: -1;
      background: linear-gradient(90deg, transparent, var(--line), transparent);
      pointer-events: none;
    }

    .axis.horizontal {
      top: 50%;
      left: 8%;
      width: 84%;
      height: 1px;
    }

    .axis.vertical {
      top: 8%;
      left: 50%;
      width: 1px;
      height: 84%;
      background: linear-gradient(180deg, transparent, var(--line), transparent);
    }

    .window {
      position: relative;
      display: block;
      width: min(25vmin, 210px);
      aspect-ratio: 4 / 3;
      overflow: hidden;
      border: 1px solid var(--green);
      background: #030603;
      box-shadow:
        0 0 0 3px #000,
        0 0 0 4px rgba(114, 255, 25, .25),
        0 0 28px rgba(114, 255, 25, .1);
      color: var(--green);
      text-decoration: none;
      transform: translateZ(0);
    }

    .window img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: .86;
      filter: contrast(1.18) saturate(.72) hue-rotate(18deg);
    }

    .window::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(0, 0, 0, .25) 3px 4px);
      pointer-events: none;
    }

    .window span {
      position: absolute;
      z-index: 2;
      border: 1px solid currentColor;
      padding: 3px 6px;
      background: rgba(0, 0, 0, .82);
      font-size: clamp(7px, .85vmin, 10px);
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .window:hover,
    .window:focus-visible {
      border-color: var(--magenta);
      color: #ff7ae7;
      outline: 2px solid #fff;
      outline-offset: 5px;
      box-shadow: 0 0 38px rgba(255, 43, 214, .28);
    }

    .window:hover img,
    .window:focus-visible img {
      opacity: 1;
      filter: contrast(1.35) saturate(1.1) hue-rotate(-12deg);
    }

    .north { grid-column: 2; grid-row: 1; }
    .east  { grid-column: 3; grid-row: 2; }
    .south { grid-column: 2; grid-row: 3; }
    .west  { grid-column: 1; grid-row: 2; }

    .north span { top: 7px; left: 50%; transform: translateX(-50%); }
    .south span { bottom: 7px; left: 50%; transform: translateX(-50%); }
    .west span  { left: 7px; top: 50%; transform: translateY(-50%); }
    .east span  { right: 7px; top: 50%; transform: translateY(-50%); }

    .core {
      grid-column: 2;
      grid-row: 2;
      display: grid;
      width: min(18vmin, 150px);
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid rgba(255, 43, 214, .45);
      border-radius: 50%;
      background:
        repeating-conic-gradient(from 0deg, rgba(255, 43, 214, .09) 0 8deg, transparent 8deg 18deg),
        radial-gradient(circle, #081006, #000 68%);
      box-shadow: 0 0 42px rgba(255, 43, 214, .12), inset 0 0 25px rgba(114, 255, 25, .08);
      text-align: center;
    }

    .core strong,
    .core small { display: block; }

    .core strong {
      color: var(--green);
      font-size: clamp(8px, 1.2vmin, 13px);
      letter-spacing: .09em;
      line-height: 1.3;
      text-transform: uppercase;
    }

    .core small {
      margin-top: 4px;
      color: #397f2b;
      font-size: clamp(6px, .78vmin, 9px);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    @media (max-width: 520px) {
      .compass { width: 96vmin; height: 96vmin; }
      .window { width: 27vmin; }
      .core { width: 20vmin; }
      .portal::before { inset: 5px; }
      .status { top: 9px; left: 10px; font-size: 6px; }
    }

    @media (max-height: 430px) {
      .compass { width: 94vmin; height: 94vmin; }
      .window { width: 24vmin; }
    }
  </style>
</head>
<body>
  <main class="portal" data-transition-root aria-labelledby="portal-title">
    <p class="status">Four exits detected // choose a vector</p>

    <nav class="compass" aria-label="Cardinal portals back to the splash page">
      <i class="axis horizontal" aria-hidden="true"></i>
      <i class="axis vertical" aria-hidden="true"></i>

      <a class="window north" href="/" data-transition="slide-down" aria-label="Return north to the splash page">
        <img src="/dead/assets/images/static.gif" alt="">
        <span>North ↑</span>
      </a>

      <a class="window east" href="/" data-transition="slide-left" aria-label="Return east to the splash page">
        <img src="/dead/assets/images/static.gif" alt="">
        <span>East →</span>
      </a>

      <div class="core">
        <div>
          <strong id="portal-title">Recursive<br>Portal</strong>
          <small>Choose exit</small>
        </div>
      </div>

      <a class="window south" href="/" data-transition="slide-up" aria-label="Return south to the splash page">
        <img src="/dead/assets/images/static.gif" alt="">
        <span>South ↓</span>
      </a>

      <a class="window west" href="/" data-transition="slide-right" aria-label="Return west to the splash page">
        <img src="/dead/assets/images/static.gif" alt="">
        <span>West ←</span>
      </a>
    </nav>
  </main>

  <script src="/dead/scripts/page-transitions.js?v=20260808-7"></script>
</body>
</html>
