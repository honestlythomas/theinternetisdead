<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>Infinite Repository Preview Grid</title>
  <style>
    :root {
      color-scheme: dark;
      --tile-w: 320px;
      --tile-h: 180px;
      --grid-line: rgba(255,255,255,.13);
      --tile-a: #070707;
      --tile-b: #111;
      --accent: #b7ff00;
      --text: #f4f4f4;
      --muted: #8a8a8a;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050505; }
    body { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; user-select: none; }

    #viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      background: #050505;
    }
    #viewport.dragging { cursor: grabbing; }

    #world {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    .tile {
      position: absolute;
      width: var(--tile-w);
      height: var(--tile-h);
      overflow: hidden;
      border-right: 1px solid var(--grid-line);
      border-bottom: 1px solid var(--grid-line);
      display: grid;
      place-items: center;
      background: var(--tile-a);
    }
    .tile.alt { background: var(--tile-b); }
    .tile.origin { box-shadow: inset 0 0 0 2px rgba(183,255,0,.22); }

    .plus {
      width: 100%;
      height: 100%;
      border: 0;
      padding: 0;
      display: grid;
      place-items: center;
      background: transparent;
      color: rgba(255,255,255,.28);
      font: 700 38px/1 system-ui, sans-serif;
      cursor: pointer;
    }
    .tile:hover .plus { color: var(--accent); }

    .preview {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #000;
      cursor: pointer;
    }
    .preview iframe,
    .preview img,
    .preview video,
    .preview object {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      object-fit: cover;
      pointer-events: none;
      background: #000;
    }
    .preview iframe {
      width: 1280px;
      height: 720px;
      transform: scale(.25);
      transform-origin: 0 0;
      object-fit: initial;
    }
    .preview.contain img { object-fit: contain; }

    .generic-preview {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      text-align: center;
      background: radial-gradient(circle at center, #181818 0, #080808 72%);
      color: #ddd;
    }
    .generic-preview .icon { font-size: 46px; margin-bottom: 8px; }
    .generic-preview .name { font-size: 12px; overflow-wrap: anywhere; }

    .label {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 5;
      padding: 5px 7px;
      font-size: 10px;
      line-height: 1.25;
      color: white;
      background: linear-gradient(transparent, rgba(0,0,0,.9));
      padding-top: 24px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      pointer-events: none;
    }

    dialog {
      width: min(780px, calc(100vw - 22px));
      height: min(760px, calc(100vh - 22px));
      padding: 0;
      border: 1px solid #353535;
      border-radius: 10px;
      background: rgba(8,8,8,.98);
      color: var(--text);
      box-shadow: 0 24px 90px rgba(0,0,0,.65);
      user-select: text;
    }
    dialog::backdrop { background: rgba(0,0,0,.72); backdrop-filter: blur(3px); }

    .picker-shell { height: 100%; display: grid; grid-template-rows: auto auto 1fr; }
    .picker-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border-bottom: 1px solid #222;
    }
    #search {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid #333;
      border-radius: 7px;
      outline: none;
      background: #101010;
      color: white;
      font: inherit;
    }
    #search:focus { border-color: var(--accent); }
    .picker-button {
      border: 1px solid #333;
      border-radius: 7px;
      padding: 9px 11px;
      background: #111;
      color: white;
      font: inherit;
      cursor: pointer;
    }
    .picker-button:hover { border-color: var(--accent); }

    #pickerStatus {
      padding: 7px 11px;
      color: var(--muted);
      font-size: 11px;
      border-bottom: 1px solid #1d1d1d;
    }

    #repoList {
      overflow: auto;
      padding: 7px;
      display: grid;
      align-content: start;
      gap: 4px;
    }
    .repo-item {
      width: 100%;
      min-height: 52px;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 7px 9px;
      display: grid;
      grid-template-columns: 38px 1fr auto;
      gap: 9px;
      align-items: center;
      text-align: left;
      background: #0c0c0c;
      color: white;
      font: inherit;
      cursor: pointer;
    }
    .repo-item:hover { border-color: #3e3e3e; background: #121212; }
    .repo-item .type-icon { font-size: 23px; text-align: center; }
    .repo-item .path { font-size: 12px; overflow-wrap: anywhere; user-select: text; }
    .repo-item .kind { color: #707070; font-size: 10px; text-transform: uppercase; }

    #loadingCard {
      position: fixed;
      left: 50%;
      bottom: 14px;
      z-index: 20;
      translate: -50% 0;
      padding: 6px 9px;
      border: 1px solid #252525;
      border-radius: 999px;
      background: rgba(0,0,0,.75);
      color: #777;
      font: 10px ui-monospace, monospace;
      pointer-events: none;
      opacity: 0;
      transition: opacity .15s ease;
    }
    #loadingCard.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="viewport" aria-label="Infinite repository preview grid">
    <div id="world"></div>
  </div>

  <div id="loadingCard">loading repository…</div>

  <dialog id="picker">
    <div class="picker-shell">
      <div class="picker-head">
        <input id="search" type="search" placeholder="Choose anything in the repo…" autocomplete="off" />
        <button id="removeBtn" class="picker-button" type="button" hidden>remove</button>
        <button id="closeBtn" class="picker-button" type="button">close</button>
      </div>
      <div id="pickerStatus">repository contents</div>
      <div id="repoList"></div>
    </div>
  </dialog>

  <script>
  (() => {
    const OWNER = 'honestlythomas';
    const REPO = 'theinternetisdead';
    const BRANCH = 'main';
    const TREE_API = `https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`;
    const STORAGE_KEY = 'theinternetisdead-infinite-preview-grid-v1';

    const TILE_W = 320;
    const TILE_H = 180;
    const MIN_ZOOM = .28;
    const MAX_ZOOM = 2.4;
    const OVERSCAN = 2;

    const viewport = document.getElementById('viewport');
    const world = document.getElementById('world');
    const picker = document.getElementById('picker');
    const search = document.getElementById('search');
    const repoList = document.getElementById('repoList');
    const pickerStatus = document.getElementById('pickerStatus');
    const closeBtn = document.getElementById('closeBtn');
    const removeBtn = document.getElementById('removeBtn');
    const loadingCard = document.getElementById('loadingCard');

    let repoFiles = [];
    let selectedKey = null;
    let drag = null;
    let renderQueued = false;

    const state = loadState();
    state.cells ||= {};
    state.camera ||= { x: TILE_W / 2, y: TILE_H / 2, zoom: 1 };

    function loadState() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
      catch { return {}; }
    }

    function persist() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
    }

    function keyFor(x, y) { return `${x},${y}`; }
    function parseKey(key) { const [x, y] = key.split(',').map(Number); return { x, y }; }

    function siteUrl(path) {
      return new URL('/' + path.replace(/^\/+/, ''), location.origin).href;
    }

    function extension(path) {
      const name = path.split('/').pop() || '';
      const dot = name.lastIndexOf('.');
      return dot >= 0 ? name.slice(dot).toLowerCase() : '';
    }

    function fileKind(path) {
      const ext = extension(path);
      if (['.html', '.htm'].includes(ext)) return 'page';
      if (['.png','.jpg','.jpeg','.gif','.webp','.svg','.avif','.bmp','.ico'].includes(ext)) return 'image';
      if (['.mp4','.webm','.mov','.m4v','.ogv'].includes(ext)) return 'video';
      if (['.mp3','.wav','.ogg','.m4a','.aac','.flac'].includes(ext)) return 'audio';
      if (ext === '.pdf') return 'pdf';
      if (['.md','.txt','.json','.js','.mjs','.css','.xml','.csv','.yml','.yaml'].includes(ext)) return 'text';
      if (['.zip','.7z','.rar','.tar','.gz'].includes(ext)) return 'archive';
      return 'file';
    }

    function kindIcon(kind) {
      return ({ page:'🌐', image:'🖼️', video:'🎞️', audio:'🔊', pdf:'📄', text:'📝', archive:'📦', file:'💾' })[kind] || '💾';
    }

    function scheduleRender() {
      if (renderQueued) return;
      renderQueued = true;
      requestAnimationFrame(() => { renderQueued = false; render(); });
    }

    function screenToWorld(clientX, clientY) {
      const z = state.camera.zoom;
      return {
        x: state.camera.x + (clientX - innerWidth / 2) / z,
        y: state.camera.y + (clientY - innerHeight / 2) / z
      };
    }

    function applyCamera() {
      const { x, y, zoom } = state.camera;
      const tx = innerWidth / 2 - x * zoom;
      const ty = innerHeight / 2 - y * zoom;
      world.style.transform = `translate(${tx}px, ${ty}px) scale(${zoom})`;
    }

    function makeGeneric(path, kind) {
      const wrap = document.createElement('div');
      wrap.className = 'generic-preview';
      const inner = document.createElement('div');
      const icon = document.createElement('div');
      icon.className = 'icon';
      icon.textContent = kindIcon(kind);
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = path;
      inner.append(icon, name);
      wrap.appendChild(inner);
      return wrap;
    }

    function makePreview(path) {
      const kind = fileKind(path);
      const wrap = document.createElement('div');
      wrap.className = 'preview';
      wrap.title = '/' + path + ' — click to replace';

      if (kind === 'page') {
        const frame = document.createElement('iframe');
        frame.src = siteUrl(path);
        frame.loading = 'lazy';
        frame.tabIndex = -1;
        frame.setAttribute('aria-hidden', 'true');
        wrap.appendChild(frame);
      } else if (kind === 'image') {
        const img = document.createElement('img');
        img.src = siteUrl(path);
        img.loading = 'lazy';
        img.alt = '';
        if (extension(path) === '.svg' || extension(path) === '.ico') wrap.classList.add('contain');
        wrap.appendChild(img);
      } else if (kind === 'video') {
        const video = document.createElement('video');
        video.src = siteUrl(path);
        video.muted = true;
        video.preload = 'metadata';
        video.playsInline = true;
        video.addEventListener('loadeddata', () => {
          try { video.currentTime = Math.min(1, Math.max(0, (video.duration || 2) * .08)); } catch {}
        }, { once: true });
        wrap.appendChild(video);
      } else if (kind === 'pdf') {
        const frame = document.createElement('iframe');
        frame.src = siteUrl(path) + '#toolbar=0&navpanes=0&scrollbar=0';
        frame.loading = 'lazy';
        frame.tabIndex = -1;
        wrap.appendChild(frame);
      } else {
        wrap.appendChild(makeGeneric(path, kind));
      }

      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = '/' + path;
      wrap.appendChild(label);
      return wrap;
    }

    function makeTile(x, y) {
      const key = keyFor(x, y);
      const tile = document.createElement('section');
      tile.className = 'tile' + (((x + y) & 1) ? ' alt' : '') + (x === 0 && y === 0 ? ' origin' : '');
      tile.style.left = `${x * TILE_W}px`;
      tile.style.top = `${y * TILE_H}px`;
      tile.dataset.key = key;

      const path = state.cells[key];
      if (path) {
        const preview = makePreview(path);
        preview.addEventListener('click', e => {
          if (drag?.moved) return;
          e.stopPropagation();
          openPicker(key);
        });
        tile.appendChild(preview);
      } else {
        const plus = document.createElement('button');
        plus.className = 'plus';
        plus.type = 'button';
        plus.textContent = '+';
        plus.title = `Add repository content at ${key}`;
        plus.addEventListener('click', e => {
          if (drag?.moved) return;
          e.stopPropagation();
          openPicker(key);
        });
        tile.appendChild(plus);
      }
      return tile;
    }

    function render() {
      applyCamera();
      const topLeft = screenToWorld(0, 0);
      const bottomRight = screenToWorld(innerWidth, innerHeight);
      const minX = Math.floor(topLeft.x / TILE_W) - OVERSCAN;
      const maxX = Math.floor(bottomRight.x / TILE_W) + OVERSCAN;
      const minY = Math.floor(topLeft.y / TILE_H) - OVERSCAN;
      const maxY = Math.floor(bottomRight.y / TILE_H) + OVERSCAN;

      const wanted = new Set();
      for (let y = minY; y <= maxY; y++) {
        for (let x = minX; x <= maxX; x++) wanted.add(keyFor(x, y));
      }

      for (const node of [...world.children]) {
        if (!wanted.has(node.dataset.key)) node.remove();
      }

      const existing = new Set([...world.children].map(n => n.dataset.key));
      const frag = document.createDocumentFragment();
      for (let y = minY; y <= maxY; y++) {
        for (let x = minX; x <= maxX; x++) {
          const key = keyFor(x, y);
          if (!existing.has(key)) frag.appendChild(makeTile(x, y));
        }
      }
      world.appendChild(frag);
    }

    function openPicker(key) {
      selectedKey = key;
      search.value = '';
      removeBtn.hidden = !state.cells[key];
      renderRepoList('');
      picker.showModal();
      setTimeout(() => search.focus(), 0);
    }

    function renderRepoList(query) {
      const q = query.trim().toLowerCase();
      const items = repoFiles.filter(file => !q || file.path.toLowerCase().includes(q));
      pickerStatus.textContent = repoFiles.length
        ? `${items.length} of ${repoFiles.length} repository files`
        : 'repository contents are still loading…';
      repoList.innerHTML = '';

      if (!items.length && repoFiles.length) {
        const empty = document.createElement('div');
        empty.style.cssText = 'padding:22px;color:#777;text-align:center;font-size:12px';
        empty.textContent = 'No matching repository content.';
        repoList.appendChild(empty);
        return;
      }

      const frag = document.createDocumentFragment();
      for (const file of items) {
        const kind = fileKind(file.path);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'repo-item';

        const icon = document.createElement('div');
        icon.className = 'type-icon';
        icon.textContent = kindIcon(kind);

        const path = document.createElement('div');
        path.className = 'path';
        path.textContent = '/' + file.path;

        const kindEl = document.createElement('div');
        kindEl.className = 'kind';
        kindEl.textContent = kind;

        btn.append(icon, path, kindEl);
        btn.addEventListener('click', () => {
          if (!selectedKey) return;
          state.cells[selectedKey] = file.path;
          persist();
          picker.close();
          selectedKey = null;
          world.innerHTML = '';
          render();
        });
        frag.appendChild(btn);
      }
      repoList.appendChild(frag);
    }

    async function discoverRepo() {
      loadingCard.classList.add('show');
      try {
        const res = await fetch(TREE_API, { headers: { Accept: 'application/vnd.github+json' } });
        if (!res.ok) throw new Error(`GitHub API ${res.status}`);
        const data = await res.json();
        repoFiles = (data.tree || [])
          .filter(item => item.type === 'blob' && item.path !== 'preview/index.html')
          .map(item => ({ path: item.path, size: item.size || 0 }))
          .sort((a, b) => a.path.localeCompare(b.path));
        pickerStatus.textContent = `${repoFiles.length} repository files`;
      } catch (err) {
        console.error(err);
        pickerStatus.textContent = 'Repository discovery failed. Reload to retry.';
      } finally {
        loadingCard.classList.remove('show');
        if (picker.open) renderRepoList(search.value);
      }
    }

    viewport.addEventListener('pointerdown', e => {
      if (picker.open || e.button !== 0) return;
      drag = {
        id: e.pointerId,
        startX: e.clientX,
        startY: e.clientY,
        cameraX: state.camera.x,
        cameraY: state.camera.y,
        moved: false
      };
      viewport.setPointerCapture(e.pointerId);
    });

    viewport.addEventListener('pointermove', e => {
      if (!drag || drag.id !== e.pointerId) return;
      const dx = e.clientX - drag.startX;
      const dy = e.clientY - drag.startY;
      if (!drag.moved && Math.hypot(dx, dy) > 4) {
        drag.moved = true;
        viewport.classList.add('dragging');
      }
      if (!drag.moved) return;
      state.camera.x = drag.cameraX - dx / state.camera.zoom;
      state.camera.y = drag.cameraY - dy / state.camera.zoom;
      scheduleRender();
    });

    function endDrag(e) {
      if (!drag || drag.id !== e.pointerId) return;
      if (drag.moved) persist();
      drag = null;
      viewport.classList.remove('dragging');
      try { viewport.releasePointerCapture(e.pointerId); } catch {}
    }
    viewport.addEventListener('pointerup', endDrag);
    viewport.addEventListener('pointercancel', endDrag);

    viewport.addEventListener('wheel', e => {
      e.preventDefault();
      const before = screenToWorld(e.clientX, e.clientY);
      const factor = Math.exp(-e.deltaY * .0012);
      const nextZoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, state.camera.zoom * factor));
      state.camera.zoom = nextZoom;
      const after = screenToWorld(e.clientX, e.clientY);
      state.camera.x += before.x - after.x;
      state.camera.y += before.y - after.y;
      persist();
      scheduleRender();
    }, { passive: false });

    window.addEventListener('resize', scheduleRender);
    search.addEventListener('input', () => renderRepoList(search.value));
    closeBtn.addEventListener('click', () => { picker.close(); selectedKey = null; });
    removeBtn.addEventListener('click', () => {
      if (!selectedKey) return;
      delete state.cells[selectedKey];
      persist();
      picker.close();
      selectedKey = null;
      world.innerHTML = '';
      render();
    });
    picker.addEventListener('close', () => { selectedKey = null; });

    render();
    discoverRepo();
  })();
  </script>
</body>
</html>
