<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Infinite Repository Preview Grid</title>
<style>
:root{color-scheme:dark;--w:320px;--h:180px;--line:rgba(255,255,255,.12);--a:#070707;--b:#111;--accent:#b7ff00}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
#viewport{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none}#viewport.dragging{cursor:grabbing}#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;will-change:transform}
.tile{position:absolute;width:var(--w);height:var(--h);overflow:hidden;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;place-items:center;background:var(--a)}.tile.alt{background:var(--b)}.tile.origin{box-shadow:inset 0 0 0 2px rgba(183,255,0,.18)}
.plus{width:100%;height:100%;border:0;background:transparent;color:rgba(255,255,255,.28);font:42px/1 system-ui;cursor:pointer}.tile:hover .plus{color:var(--accent)}
.preview{position:absolute;inset:0;background:#000;overflow:hidden;cursor:pointer}.preview img,.preview video,.preview iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover;pointer-events:none;background:#000}.preview iframe.page{width:1280px;height:720px;transform:scale(.25);transform-origin:0 0}.preview img.contain{object-fit:contain}.generic{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:18px;background:radial-gradient(circle,#1b1b1b,#080808 72%);color:#ddd}.generic .icon{font-size:44px}.generic .name{margin-top:8px;font-size:11px;overflow-wrap:anywhere}.label{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:24px 7px 5px;background:linear-gradient(transparent,rgba(0,0,0,.92));font-size:10px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
dialog{width:min(900px,calc(100vw - 24px));height:min(780px,calc(100vh - 24px));padding:0;border:1px solid #333;border-radius:10px;background:#090909;color:#fff;box-shadow:0 24px 90px #000;user-select:text}dialog::backdrop{background:rgba(0,0,0,.75);backdrop-filter:blur(3px)}.shell{height:100%;display:grid;grid-template-rows:auto auto 1fr}.head{display:flex;gap:8px;padding:10px;border-bottom:1px solid #222}#search{flex:1;min-width:0;padding:10px 12px;border:1px solid #333;border-radius:7px;background:#101010;color:#fff;font:inherit;outline:none}#search:focus{border-color:var(--accent)}button.action{padding:9px 11px;border:1px solid #333;border-radius:7px;background:#111;color:#fff;font:inherit;cursor:pointer}button.action:hover{border-color:var(--accent)}#status{padding:7px 11px;border-bottom:1px solid #1d1d1d;color:#888;font-size:11px}#list{overflow:auto;padding:7px;display:grid;align-content:start;gap:4px}.item{width:100%;min-height:50px;display:grid;grid-template-columns:38px 1fr auto;gap:9px;align-items:center;padding:7px 9px;border:1px solid transparent;border-radius:6px;background:#0c0c0c;color:#fff;text-align:left;font:inherit;cursor:pointer}.item:hover{border-color:#444;background:#131313}.item .icon{font-size:22px;text-align:center}.item .path{font-size:12px;overflow-wrap:anywhere}.item .kind{font-size:10px;color:#777;text-transform:uppercase}.emptymsg{padding:24px;color:#777;text-align:center}
#hint{position:fixed;left:50%;bottom:12px;translate:-50% 0;padding:6px 9px;border:1px solid #222;border-radius:999px;background:rgba(0,0,0,.72);color:#666;font-size:10px;pointer-events:none}
</style>
</head>
<body>
<div id="viewport"><div id="world"></div></div>
<div id="hint">drag to pan · wheel to zoom</div>
<dialog id="picker"><div class="shell"><div class="head"><input id="search" type="search" placeholder="Search every file in the repo…" autocomplete="off"><button id="remove" class="action" hidden>remove</button><button id="close" class="action">close</button></div><div id="status">loading complete repository file tree…</div><div id="list"></div></div></dialog>
<script>
(()=>{
const OWNER='honestlythomas',REPO='theinternetisdead',BRANCH='main';
const TREE=`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`;
const RAW=`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/`;
const KEY='theinternetisdead-infinite-preview-grid-v2',W=320,H=180,MIN=.25,MAX=2.5,OVER=2;
const viewport=document.querySelector('#viewport'),world=document.querySelector('#world'),picker=document.querySelector('#picker'),search=document.querySelector('#search'),list=document.querySelector('#list'),status=document.querySelector('#status'),remove=document.querySelector('#remove');
let files=[],selected=null,drag=null,raf=false;
let state={};try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{}state.cells||={};state.camera||={x:W/2,y:H/2,z:1};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};
const key=(x,y)=>`${x},${y}`;
const ext=p=>{const n=p.split('/').pop()||'',i=n.lastIndexOf('.');return i<0?'':n.slice(i).toLowerCase()};
const kind=p=>{const e=ext(p);if(['.html','.htm'].includes(e))return'page';if(['.png','.jpg','.jpeg','.gif','.webp','.svg','.avif','.bmp','.ico'].includes(e))return'image';if(['.mp4','.webm','.mov','.m4v','.ogv'].includes(e))return'video';if(['.mp3','.wav','.ogg','.m4a','.aac','.flac'].includes(e))return'audio';if(e==='.pdf')return'pdf';if(['.md','.txt','.json','.js','.mjs','.css','.xml','.csv','.yml','.yaml','.toml'].includes(e))return'text';if(['.zip','.7z','.rar','.tar','.gz'].includes(e))return'archive';return'file'};
const icon=k=>({page:'🌐',image:'🖼️',video:'🎞️',audio:'🔊',pdf:'📄',text:'📝',archive:'📦',file:'💾'})[k]||'💾';
const site=p=>new URL('/'+p.replace(/^\/+/,''),location.origin).href,raw=p=>RAW+p.split('/').map(encodeURIComponent).join('/');
function generic(p,k){const d=document.createElement('div');d.className='generic';d.innerHTML=`<div><div class="icon">${icon(k)}</div><div class="name"></div></div>`;d.querySelector('.name').textContent=p;return d}
function preview(p){const k=kind(p),d=document.createElement('div');d.className='preview';if(k==='page'){const f=document.createElement('iframe');f.className='page';f.src=site(p);f.loading='lazy';f.tabIndex=-1;d.append(f)}else if(k==='image'){const i=document.createElement('img');i.src=site(p);i.loading='lazy';i.alt='';if(['.svg','.ico'].includes(ext(p)))i.className='contain';d.append(i)}else if(k==='video'){const v=document.createElement('video');v.src=site(p);v.muted=true;v.preload='metadata';v.playsInline=true;v.addEventListener('loadeddata',()=>{try{v.currentTime=Math.min(1,(v.duration||2)*.08)}catch{}},{once:true});d.append(v)}else if(k==='pdf'){const f=document.createElement('iframe');f.src=site(p)+'#toolbar=0&navpanes=0&scrollbar=0';f.loading='lazy';d.append(f)}else d.append(generic(p,k));const l=document.createElement('div');l.className='label';l.textContent='/'+p;d.append(l);return d}
function tile(x,y){const k=key(x,y),t=document.createElement('section');t.className='tile'+(((x+y)&1)?' alt':'')+(x===0&&y===0?' origin':'');t.style.left=x*W+'px';t.style.top=y*H+'px';const p=state.cells[k];if(p){const d=preview(p);d.addEventListener('click',e=>{if(drag?.moved)return;e.stopPropagation();open(k)});t.append(d)}else{const b=document.createElement('button');b.className='plus';b.textContent='+';b.title='Choose any repository file';b.addEventListener('click',e=>{if(drag?.moved)return;e.stopPropagation();open(k)});t.append(b)}return t}
function apply(){const c=state.camera;world.style.transform=`translate(${innerWidth/2-c.x*c.z}px,${innerHeight/2-c.y*c.z}px) scale(${c.z})`}
function render(){apply();const c=state.camera,z=c.z;const hw=innerWidth/(2*z),hh=innerHeight/(2*z);const x0=Math.floor((c.x-hw)/W)-OVER,x1=Math.floor((c.x+hw)/W)+OVER,y0=Math.floor((c.y-hh)/H)-OVER,y1=Math.floor((c.y+hh)/H)+OVER;world.replaceChildren();for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)world.append(tile(x,y))}
function schedule(){if(raf)return;raf=true;requestAnimationFrame(()=>{raf=false;render()})}
function renderList(q=''){q=q.trim().toLowerCase();const shown=files.filter(f=>!q||f.path.toLowerCase().includes(q));list.replaceChildren();status.textContent=`${shown.length.toLocaleString()} of ${files.length.toLocaleString()} repo files`;if(!shown.length){const d=document.createElement('div');d.className='emptymsg';d.textContent=files.length?'No matching files.':'Repository file list unavailable.';list.append(d);return}for(const f of shown){const k=kind(f.path),b=document.createElement('button');b.className='item';b.type='button';b.innerHTML=`<span class="icon">${icon(k)}</span><span class="path"></span><span class="kind">${k}</span>`;b.querySelector('.path').textContent='/'+f.path;b.title=`${f.path}${Number.isFinite(f.size)?' · '+f.size.toLocaleString()+' bytes':''}`;b.addEventListener('click',()=>{state.cells[selected]=f.path;save();picker.close();schedule()});list.append(b)}}
function open(k){selected=k;search.value='';remove.hidden=!state.cells[k];renderList();picker.showModal();setTimeout(()=>search.focus(),0)}
async function loadFiles(){status.textContent='loading complete repository file tree…';try{const r=await fetch(TREE,{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw new Error('GitHub '+r.status);const data=await r.json();if(data.truncated)status.textContent='GitHub returned a truncated tree';files=(data.tree||[]).filter(x=>x.type==='blob').map(x=>({path:x.path,size:x.size??null,sha:x.sha})).sort((a,b)=>a.path.localeCompare(b.path));renderList()}catch(e){console.error(e);status.textContent='Could not load repository file tree';renderList()}}
viewport.addEventListener('pointerdown',e=>{if(e.button!==0||picker.open)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,cx:state.camera.x,cy:state.camera.y,moved:false};viewport.setPointerCapture(e.pointerId);viewport.classList.add('dragging')});
viewport.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;state.camera.x=drag.cx-dx/state.camera.z;state.camera.y=drag.cy-dy/state.camera.z;schedule()});
function end(e){if(!drag||drag.id!==e.pointerId)return;drag=null;viewport.classList.remove('dragging');save()}viewport.addEventListener('pointerup',end);viewport.addEventListener('pointercancel',end);
viewport.addEventListener('wheel',e=>{e.preventDefault();const before={x:state.camera.x+(e.clientX-innerWidth/2)/state.camera.z,y:state.camera.y+(e.clientY-innerHeight/2)/state.camera.z};const nz=Math.max(MIN,Math.min(MAX,state.camera.z*Math.exp(-e.deltaY*.001)));state.camera.z=nz;state.camera.x=before.x-(e.clientX-innerWidth/2)/nz;state.camera.y=before.y-(e.clientY-innerHeight/2)/nz;save();schedule()},{passive:false});
search.addEventListener('input',()=>renderList(search.value));document.querySelector('#close').onclick=()=>picker.close();remove.onclick=()=>{if(selected){delete state.cells[selected];save();picker.close();schedule()}};window.addEventListener('resize',schedule);render();loadFiles();
})();
</script>
</body>
</html>
