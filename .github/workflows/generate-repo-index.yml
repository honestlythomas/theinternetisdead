name: Generate repository index

on:
  push:
    branches: [main]
    paths-ignore:
      - repo-index.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate repo-index.json
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone

          paths = subprocess.check_output(
              ['git', 'ls-files', '-co', '--exclude-standard'],
              text=True
          ).splitlines()

          files = []
          for path in sorted(set(paths)):
              if path == 'repo-index.json' or not os.path.isfile(path):
                  continue
              try:
                  size = os.path.getsize(path)
              except OSError:
                  size = None
              files.append({
                  'path': path.replace(os.sep, '/'),
                  'size': size,
              })

          payload = {
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'commit': os.environ.get('GITHUB_SHA'),
              'count': len(files),
              'files': files,
          }

          with open('repo-index.json', 'w', encoding='utf-8') as f:
              json.dump(payload, f, indent=2, ensure_ascii=False)
              f.write('\n')
          PY

      - name: Commit updated index
        shell: bash
        run: |
          if git diff --quiet -- repo-index.json && git ls-files --error-unmatch repo-index.json >/dev/null 2>&1; then
            echo "repo-index.json is already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo-index.json
          git commit -m "Update repository file index"
          git push
