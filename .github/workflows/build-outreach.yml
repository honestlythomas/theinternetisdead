name: Build outreach chronology

on:
  push:
    paths:
      - 'outreach/raw_messages.csv'
      - 'outreach/thread_messages.csv'
      - 'outreach/annotations.csv'
      - 'outreach/expected_counts.json'
      - 'outreach/build.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build webpage and SQLite archive
        run: python outreach/build.py
      - name: Commit generated archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outreach/index.html outreach/outreach.sqlite
          git diff --cached --quiet && exit 0
          git commit -m 'Build raw outreach archive'
          git push
