    async function handleClearPublicPassword(password) {
      const ok = await clearPublicChatHistory(password);
      clearClearPublicPasswordMode();
      if (ok) removeClearPublicPromptLine();
      return true;
    }

    function setNicknameColorPromptMode() {
      pendingNicknameColor = true;
      previousChatInputPlaceholder = chatInput.getAttribute('placeholder') || previousChatInputPlaceholder;
      chatInput.value = '';
      chatInput.type = 'text';
      chatInput.placeholder = 'Enter color:';
      hideSuggestions();
      const promptText = 'Type a color name, hex code, or rgba value.';
      if (pendingNicknameColorPromptLine && pendingNicknameColorPromptLine.isConnected) {
        pendingNicknameColorPromptLine.textContent = promptText;
      } else {
        pendingNicknameColorPromptLine = addSystemMessage(promptText);
      }
      chatInput.focus();
    }

    function clearNicknameColorPromptMode() {
      pendingNicknameColor = false;
      chatInput.type = 'text';
      chatInput.placeholder = previousChatInputPlaceholder || 'Press here to chat...';
      chatInput.value = '';
    }

    function removeNicknameColorPromptLine() {
      if (pendingNicknameColorPromptLine && pendingNicknameColorPromptLine.isConnected) {
        pendingNicknameColorPromptLine.remove();
      }
      pendingNicknameColorPromptLine = null;
    }

    function setSiteSearchPromptMode() {
      pendingSiteSearch = true;
      previousChatInputPlaceholder = chatInput.getAttribute('placeholder') || previousChatInputPlaceholder;
      chatInput.value = '';
      chatInput.type = 'text';
      chatInput.placeholder = 'Search Site Files:';
      hideSuggestions();
      if (pendingSiteSearchPromptLine && pendingSiteSearchPromptLine.isConnected) {
        pendingSiteSearchPromptLine.textContent = 'Search Site Files:';
      } else {
        pendingSiteSearchPromptLine = addSystemMessage('Search Site Files:');
      }
      chatInput.focus();
    }

    function clearSiteSearchPromptMode() {
      pendingSiteSearch = false;
      chatInput.type = 'text';
      chatInput.placeholder = previousChatInputPlaceholder || 'Press here to chat...';
      chatInput.value = '';
    }

    function removeSiteSearchPromptLine() {
      if (pendingSiteSearchPromptLine && pendingSiteSearchPromptLine.isConnected) {
        pendingSiteSearchPromptLine.remove();
      }
      pendingSiteSearchPromptLine = null;
    }

    async function handleSiteSearchInput(value) {
      clearSiteSearchPromptMode();
      removeSiteSearchPromptLine();
      await runSiteSearch(value);
      return true;
    }

    function applyNicknameColor(value) {
      const nextColor = normalizeNicknameColor(value);
      if (!value || !nextColor) {
        addSystemMessage('Usage: /nickname color [color name, hex code, or rgba value]');
        return false;
      }
      currentNicknameColor = saveNicknameColor(nextColor);
      addCommandExecutionMessage('/nickname', {
        message: `/nickname color executed: ${currentNicknameColor}`
      });
      return true;
    }

    function handleNicknameColorInput(value) {
      const applied = applyNicknameColor(value);
      clearNicknameColorPromptMode();
      if (applied) removeNicknameColorPromptLine();
      return true;
    }

    async function handleCommand(raw) {
      const trimmed = String(raw || '').trim();
      const [commandToken = ''] = trimmed.split(/\s+/);
      const command = commandToken.toLowerCase();
      const arg = trimmed.slice(commandToken.length).trim();
      if (arg.toLowerCase() === '-help') {
        return showCommandUsage(command);
      }

      if (command === '/nickname') {
        const lowerArg = arg.toLowerCase();
        if (lowerArg === 'reset') {
          currentNickname = generateAnonymousNickname();
          saveNickname('');
          addCommandExecutionMessage('/nickname', {
            message: `/nickname reset: ${currentNickname}`
          });
          return true;
        }
        if (lowerArg === 'color reset' || lowerArg === 'color clear') {
          currentNicknameColor = saveNicknameColor('');
          addCommandExecutionMessage('/nickname', { message: '/nickname color reset' });
          return true;
        }
        if (lowerArg.startsWith('color')) {
          const colorValue = arg.slice('color'.length).trim();
          if (!colorValue) {
            setNicknameColorPromptMode();
            return true;
          }
          applyNicknameColor(colorValue);
          return true;
        }
        if (!arg) {
          addSystemMessage('Usage: /nickname [name]');
          return true;
        }
        if (arg.length > 40) {
          addSystemMessage('Nickname is too long. Keep it to 40 characters.', { error: true });
          return true;
        }
        if (isReservedNickname(arg)) {
          setReservedNicknamePasswordMode(arg);
          return true;
        }
        currentNickname = normalizeNickname(arg);
        saveNickname(currentNickname);
        addCommandExecutionMessage('/nickname', {
          message: formatCommandExecutionMessage('/nickname', 'executed', currentNickname)
        });
        return true;
      }

      if (command === '/help') {
        addCommandExecutionMessage('/help');
        addMessage('system', createHelpHtml(), { kind: 'commands' });
        return true;
      }

      if (command === '/clear') {
        clearLocalChatCommand();
        return true;
      }

      if (command === '/clear_public') {
        if (!arg) {
          setClearPublicPasswordMode();
          return true;
        }
        await clearPublicChatHistory(arg);
        return true;
      }

      if (command === '/pin') {
        if (await pinMessageToSelectedChats(arg)) {
          addCommandExecutionMessage('/pin');
        }
        return true;
      }

      if (command === '/system_prompt') {
        runSystemPromptCommand(arg);
        return true;
      }

      if (command === '/random') {
        await loadRandomIndexPageFromChat();
        return true;
      }

      if (command === '/rainbow') {
        requestRootRainbowFilter(arg);
        return true;
      }

      if (command === '/refresh') {
        refreshEntirePage();
        return true;
      }

      if (command === '/reset') {
        try {
          window.localStorage.clear();
        } catch (error) {}
        window.location.reload();
        return true;
      }

      if (command === '/search') {
        if (!arg) {
          setSiteSearchPromptMode();
          return true;
        }
        await runSiteSearch(arg);
        return true;
      }

      if (command === '/dvd') {
        const nextAttempt = dvdCommandAttemptCount + 1;
        dvdCommandAttemptCount = nextAttempt;
        const spawned = spawnDvdInstance();
        const countLabel = `(${Math.min(dvdInstances.length, dvdNormalMaxInstances)}/${dvdNormalMaxInstances}${spawned ? '' : ' MAX'})`;
        addCommandExecutionMessage('/dvd', { detail: countLabel });
        return true;
      }

      if (command === '/exit') {
        addCommandExecutionMessage('/exit');
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'pageExit' }, '*');
        } else {
          renderFatalExitScreen();
        }
        return true;
      }

      return false;
    }

    async function runCommandWithTaggedOutput(raw) {
      commandOutputDepth += 1;
      try {
        return await handleCommand(raw);
      } finally {
        commandOutputDepth = Math.max(0, commandOutputDepth - 1);
      }
    }

    async function submitInput() {
      const raw = chatInput.value;
      const trimmed = raw.trim();
      if (!trimmed) return;
      chatInput.value = '';
      hideSuggestions();
      if (pendingReservedNickname) {
        await handleReservedNicknamePassword(trimmed);
        return;
      }
      if (pendingClearPublicPassword) {
        await handleClearPublicPassword(trimmed);
        return;
      }
      if (pendingNicknameColor) {
        handleNicknameColorInput(trimmed);
        return;
      }
      if (pendingSiteSearch) {
        await handleSiteSearchInput(trimmed);
        return;
      }
      if (trimmed.startsWith('/') && commandsEnabled()) {
        const handled = await runCommandWithTaggedOutput(trimmed);
        if (!handled) addSystemMessage(`${trimmed.split(/\s+/)[0]} is not a known command`, { error: true, kind: 'commands' });
        return;
      }
      if (currentChatKinds.has('ai')) {
        await runAiChatPrompt(trimmed);
        return;
      }
      const activeInputChatKind = getActiveInputChatKind();
      if (activeInputChatKind === 'local') {
        addLocalChatMessage(trimmed);
        return;
      }
      await sendPublicMessage(trimmed);
    }

    function getSuggestionQuery() {
      if (!commandsEnabled()) return null;
      const value = chatInput.value;
      if (!value.startsWith('/')) return null;
      const commandToken = value.split(/\s+/)[0].toLowerCase();
      const command = commandByName.get(commandToken);
      if (command && Array.isArray(command.subcommands) && /\s$/.test(value)) {
        return { type: 'subcommand', command, query: '' };
      }
      if (command && Array.isArray(command.subcommands) && value.toLowerCase().startsWith(`${commandToken} `)) {
        return { type: 'subcommand', command, query: value.slice(commandToken.length).trimStart().toLowerCase() };
      }
      const token = value.split(/\s+/)[0].toLowerCase();
      return { type: 'command', query: token };
    }

    function matchingCommands() {
      const suggestionQuery = getSuggestionQuery();
      if (!suggestionQuery) return [];
      if (suggestionQuery.type === 'subcommand') {
        return suggestionQuery.command.subcommands
          .filter((subcommand) => subcommand.name.toLowerCase().startsWith(suggestionQuery.query))
          .map((subcommand) => ({
            ...subcommand,
            parentCommand: suggestionQuery.command.name,
            label: `${suggestionQuery.command.name} ${subcommand.name}`
          }));
      }
      return visibleCommands.filter((command) => command.name.startsWith(suggestionQuery.query));
    }

    function hideSuggestions() {
      suggestions.classList.remove('visible');
      suggestions.setAttribute('aria-hidden', 'true');
      suggestions.innerHTML = '';
      suggestionIndex = -1;
    }

    function renderSuggestions() {
      const matches = matchingCommands();
      if (!matches.length) {
        hideSuggestions();
        return;
      }
      suggestions.innerHTML = '';
      matches.forEach((command, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = index === suggestionIndex ? 'suggestion active' : 'suggestion';
        button.textContent = command.desc && command.label ? `${command.label} - ${command.desc}` : command.label || command.name;
        button.addEventListener('mousedown', (event) => {
          event.preventDefault();
          applyCommand(command);
        });
        suggestions.appendChild(button);
      });
      suggestions.classList.add('visible');
      suggestions.setAttribute('aria-hidden', 'false');
    }

    function applyCommand(command) {
      chatInput.value = command.value || command.name;
      chatInput.focus();
      chatInput.selectionStart = chatInput.selectionEnd = chatInput.value.length;
      hideSuggestions();
      if (command.execute) submitInput();
    }

    function cycleSuggestion(direction) {
      const matches = matchingCommands();
      if (!matches.length) return false;
      suggestionIndex = (suggestionIndex + direction + matches.length) % matches.length;
      const selected = matches[suggestionIndex];
      chatInput.value = selected.value || selected.name;
      chatInput.selectionStart = chatInput.selectionEnd = chatInput.value.length;
      renderSuggestions();
      return true;
    }

    function setOpen(open, focus = true) {
      document.body.classList.toggle('chat-open', !!open);
      if (!open && pendingReservedNickname) clearReservedNicknamePasswordMode();
      if (!open && pendingClearPublicPassword) clearClearPublicPasswordMode();
      if (!open && pendingNicknameColor) clearNicknameColorPromptMode();
      if (!open && pendingSiteSearch) clearSiteSearchPromptMode();
      notifyState();
      if (open && focus) requestAnimationFrame(() => chatInput.focus());
    }

    function setPreview(visible, progress = 0) {
      document.body.classList.toggle('chat-preview', !!visible);
      document.body.style.setProperty('--preview-opacity', String(Math.max(0.25, Math.min(1, Number(progress) || 0.45))));
    }

    function notifyState() {
      if (!window.parent || window.parent === window) return;
      window.parent.postMessage({
        type: 'chatSandboxState',
        visible: document.body.classList.contains('chat-open'),
        valuePickerActive: false,
        valuePickerCommand: ''
      }, '*');
    }

    applyChatModeTheme();
    syncPublicChatSettings();
    updateChatModeControls();

    if (chatModeButton && chatModeMenu) {
      chatModeButton.addEventListener('click', () => {
        setChatModeMenuOpen(!chatModeMenu.classList.contains('open'));
      });

      publicNicknameInput?.addEventListener('change', applyPublicNicknameInput);

      publicNicknameInput?.addEventListener('keydown', (event) => {
        if (event.key !== 'Enter') return;
        event.preventDefault();
        applyPublicNicknameInput();
        chatInput.focus();
      });

      publicNicknameColor?.addEventListener('input', () => {
        currentNicknameColor = saveNicknameColor(publicNicknameColor.value);
      });

      chatBaseSelect?.addEventListener('change', () => {
        if (chatBaseSelect.value === 'public') {
          setChatKinds(['public']);
        } else if (chatBaseSelect.value === 'ai') {
          setChatKinds(['ai']);
        } else {
          const selected = ['local', ...chatModeCheckboxes
            .filter((item) => item.checked)
            .map((item) => item.value)];
          setChatKinds(selected);
        }
        chatInput.focus();
      });

      chatModeCheckboxes.forEach((checkbox) => {
        checkbox.addEventListener('change', () => {
          const baseKind = chatBaseSelect && chatBaseSelect.value === 'ai' ? 'ai' : 'local';
          const selected = [baseKind, ...chatModeCheckboxes
            .filter((item) => item.checked)
            .map((item) => item.value)];
          setChatKinds(selected);
          chatInput.focus();
        });
      });

      document.addEventListener('click', (event) => {
        if (!chatModePicker || chatModePicker.contains(event.target)) return;
        setChatModeMenuOpen(false);
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') setChatModeMenuOpen(false);
      });
    }

    inputWrap.addEventListener('submit', (event) => {
      event.preventDefault();
      submitInput();
    });

    chatInput.addEventListener('input', renderSuggestions);

    chatCloseButton.addEventListener('click', () => {
      setOpen(false, false);
    });

    chatInput.addEventListener('paste', (event) => {
      const items = Array.from(event.clipboardData && event.clipboardData.items ? event.clipboardData.items : []);
      const imageItem = items.find((item) => item && item.kind === 'file' && String(item.type || '').startsWith('image/'));
      if (!imageItem) return;
      const file = imageItem.getAsFile();
      if (!file) return;
      event.preventDefault();
      sendPublicImage(file);
    });

    chatInput.addEventListener('keydown', (event) => {
      if (event.key === 'Tab' && commandsEnabled() && chatInput.value.startsWith('/')) {
        event.preventDefault();
        cycleSuggestion(event.shiftKey ? -1 : 1);
        return;
      }
      if (event.key === 'Escape') {
        event.preventDefault();
        if (pendingReservedNickname) clearReservedNicknamePasswordMode();
        if (pendingClearPublicPassword) clearClearPublicPasswordMode();
        if (pendingNicknameColor) clearNicknameColorPromptMode();
        if (pendingSiteSearch) clearSiteSearchPromptMode();
        setOpen(false, false);
      }
    });

    messages.addEventListener('click', (event) => {
      const frameLink = event.target && event.target.closest ? event.target.closest('a[data-index-frame-src]') : null;
      if (frameLink) {
        const framePath = String(frameLink.dataset.indexFrameSrc || '').trim();
        const controller = getParentIndexFrameController();
        if (framePath && controller) {
          event.preventDefault();
          controller.setSource(framePath, { historyMode: 'push' });
          setOpen(false, false);
          return;
        }
      }

      const item = event.target && event.target.closest ? event.target.closest('.helpItem[data-command]') : null;
      if (!item) return;
      event.preventDefault();
      const command = commandByName.get(item.dataset.command || '');
      if (command) applyCommand(command);
    });

    window.addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.type === 'chatSandboxOpen') {
        setOpen(true, data.focus !== false);
        if (data.seedSlash) {
          chatInput.value = '/';
          renderSuggestions();
        }
        return;
      }
      if (data.type === 'chatSandboxClose') {
        setOpen(false, false);
        return;
      }
      if (data.type === 'chatSandboxPreview') {
        setPreview(!!data.visible, data.progress);
        return;
      }
      if (data.type === 'chatSandboxExecuteCommand') {
        const rawCommand = typeof data.command === 'string' ? data.command.trim() : '';
        if (!rawCommand) return;
        if (data.openChat) setOpen(true, data.focus !== false);
        if (!commandsEnabled()) {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'chatSandboxCommandResult', ok: false, command: rawCommand, commandId: data.commandId || '' }, '*');
          }
          return;
        }
        runCommandWithTaggedOutput(rawCommand).then((ok) => {
          if (!ok && rawCommand.startsWith('/')) addSystemMessage(`${rawCommand.split(/\s+/)[0]} is not a known command`, { error: true, kind: 'commands' });
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'chatSandboxCommandResult', ok: !!ok, command: rawCommand, commandId: data.commandId || '' }, '*');
          }
        });
        return;
      }
      if (data.type === 'pageChatResult') {
        if (data.announce) {
          const commandName = String(data.command || '').trim() || '/command';
          const message = String(data.message || '').trim();
          addCommandExecutionMessage(commandName, { message: message || `${commandName} executed` });
        }
        return;
      }
      if (data.type === 'pageChatRegister') {
        return;
      }
    });

    if (window.parent && window.parent !== window) {
      document.documentElement.classList.add('embedded');
      document.body.classList.add('embedded');
    } else {
      setOpen(true, false);
    }

    welcomeMessageLine = addWelcomeMessages();
    renderStoredApiChatHistory();
    applyChatModeFilter();
    loadRecentPublicMessages();
    window.setInterval(() => {
      if (!document.hidden) loadRecentPublicMessages({ incremental: true });
    }, PUBLIC_CHAT_REFRESH_MS);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) loadRecentPublicMessages({ incremental: true });
    });
    window.addEventListener('resize', () => positionAllDvdInstances(true));
    notifyState();
  </script>
</body>
</html>
