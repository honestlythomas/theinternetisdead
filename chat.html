<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      color: #00ff66;
      font-family: "Courier New", Courier, monospace;
      overflow: hidden;
    }

    body {
      --chat-bg: rgba(0, 0, 0, 0.82);
      --chat-border: rgba(0, 255, 102, 0.42);
      --chat-text: #00ff66;
      --chat-muted: rgba(0, 255, 102, 0.72);
      --chat-danger: #ff5577;
    }

    #chatSurface {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      pointer-events: none;
    }

    #chatPanel {
      width: 100%;
      height: 100%;
      max-height: none;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px;
      box-sizing: border-box;
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 160ms ease, transform 160ms ease;
      pointer-events: none;
    }

    body.chat-open #chatPanel,
    body.chat-preview #chatPanel {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    body.chat-preview:not(.chat-open) #chatPanel {
      opacity: var(--preview-opacity, 0.45);
    }

    #messages {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: none;
      padding-right: 4px;
      scrollbar-color: var(--chat-text) transparent;
    }

    .message {
      width: fit-content;
      max-width: min(920px, calc(100vw - 32px));
      padding: 7px 9px;
      border: 1px solid var(--chat-border);
      background: var(--chat-bg);
      color: var(--chat-text);
      text-shadow: 0 0 6px rgba(0, 255, 102, 0.28);
      line-height: 1.35;
      overflow-wrap: anywhere;
      box-shadow: 0 0 18px rgba(0, 255, 102, 0.08);
    }

    .message[data-role="user"] {
      align-self: flex-end;
      border-color: rgba(123, 210, 255, 0.46);
      color: #9be4ff;
      text-shadow: 0 0 6px rgba(123, 210, 255, 0.25);
    }

    .message[data-role="system"] { color: var(--chat-muted); }

    .message a,
    .message a:visited {
      color: #ffffff;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .publicChatImage {
      display: block;
      max-width: min(420px, calc(100vw - 70px));
      max-height: 320px;
      width: auto;
      height: auto;
      margin-top: 6px;
      border: 1px solid rgba(255, 255, 255, 0.34);
      background: rgba(0, 0, 0, 0.35);
      object-fit: contain;
    }

    .messageTimestamp {
      color: #ffffff;
      font-size: 12px;
      line-height: 1;
      margin-right: 6px;
      text-shadow: none;
      white-space: nowrap;
    }

    .message[data-error="true"] {
      color: var(--chat-danger);
      border-color: rgba(255, 85, 119, 0.5);
      text-shadow: 0 0 6px rgba(255, 85, 119, 0.25);
    }

    .helpList { display: grid; gap: 4px; margin-top: 4px; }

    .helpItem {
      color: inherit;
      text-decoration: none;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px;
      align-items: baseline;
    }

    .helpItem:hover,
    .helpItem:focus-visible { outline: none; color: #ffffff; }
    .helpCommandName { color: #ffffff; font-weight: 700; }
    .helpCommandDesc { color: var(--chat-muted); }

    #inputWrap {
      position: relative;
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border: 1px solid var(--chat-border);
      background: var(--chat-bg);
      box-shadow: 0 0 22px rgba(0, 255, 102, 0.12);
    }

    #prompt { color: var(--chat-text); font-weight: 700; }

    #chatInput {
      min-width: 0;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--chat-text);
      font: inherit;
    }

    #chatInput::placeholder { color: rgba(0, 255, 102, 0.52); }

    #suggestions {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(100% + 6px);
      display: none;
      gap: 4px;
      padding: 6px;
      border: 1px solid var(--chat-border);
      background: var(--chat-bg);
    }

    #suggestions.visible { display: grid; }

    .suggestion {
      border: 0;
      background: transparent;
      color: var(--chat-text);
      font: inherit;
      text-align: left;
      padding: 4px 6px;
      cursor: pointer;
    }

    .suggestion:hover,
    .suggestion.active,
    .suggestion:focus-visible {
      outline: 1px solid var(--chat-border);
      background: rgba(0, 255, 102, 0.12);
    }
  </style>
</head>
<body>
  <main id="chatSurface" aria-live="polite">
    <section id="chatPanel">
      <div id="messages"></div>
      <form id="inputWrap" autocomplete="off">
        <span id="prompt">&gt;</span>
        <input id="chatInput" type="text" placeholder="Press here to chat or / for commands..." />
        <div id="suggestions" aria-hidden="true"></div>
      </form>
    </section>
  </main>

  <script>
    const CHAT_NICKNAME_STORAGE_KEY = 'tektiteChatNickname';
    const CHAT_NICKNAME_EXPLICIT_STORAGE_KEY = 'tektiteChatNicknameExplicit';
    const SUPABASE_PROJECT_URL = 'https://fumidkcwrhzgfdmuakqj.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_BcNJhaZkgo4r5VH1aJ_stQ_P-kEDY_r';
    const SUPABASE_CHAT_ROOM = 'index';
    const SUPABASE_CHAT_TABLE = 'site_chat_messages';
    const SUPABASE_CHAT_MAX_VISIBLE = 20;
    const PUBLIC_CHAT_FETCH_LIMIT = SUPABASE_CHAT_MAX_VISIBLE + 1;
    const PUBLIC_CHAT_REFRESH_MS = 5000;
    const PUBLIC_CHAT_PRUNE_RETRY_MS = 30000;
    const PUBLIC_CHAT_IMAGE_MAX_SOURCE_BYTES = 5 * 1024 * 1024;
    const PUBLIC_CHAT_IMAGE_MAX_BODY_CHARS = 700000;
    const PUBLIC_CHAT_IMAGE_MAX_DIMENSION = 960;
    const PUBLIC_CHAT_IMAGE_PAYLOAD_TYPE = 'theinternetisdead.publicChatImage.v1';

    const commands = [
      { name: '/clear', value: '/clear', execute: true, desc: 'clear local non-public chat messages' },
      { name: '/clear_public', value: '/clear_public ', execute: false, desc: 'admin: clear public chat history through the server-side function', hidden: true },
      { name: '/nickname', value: '/nickname ', execute: false, desc: 'set the displayed username used by system messages', suggestions: ['Tektite', 'Guest', 'User'] },
      { name: '/help', value: '/help', execute: true, desc: 'show this help message with command links' }
    ];

    const visibleCommands = commands.filter((command) => command.hidden !== true);
    const commandByName = new Map(commands.map((command) => [command.name, command]));
    const messages = document.getElementById('messages');
    const inputWrap = document.getElementById('inputWrap');
    const chatInput = document.getElementById('chatInput');
    const suggestions = document.getElementById('suggestions');
    let currentNickname = loadNickname();
    let renderedPublicMessageKeys = new Set();
    let suggestionIndex = -1;
    let publicChatRefreshInFlight = false;
    let publicChatPruneInFlight = false;
    let lastPublicChatPruneAttemptMs = 0;
    let latestPublicMessageCreatedAt = '';
    let scrollFrameId = 0;

    function generateAnonymousNickname() {
      return `Anonymous Ghost ${Math.floor(Math.random() * 900) + 100}`;
    }

    function normalizeNickname(value) {
      const cleaned = String(value || '').replace(/[\r\n\t]+/g, ' ').replace(/\s{2,}/g, ' ').trim();
      return cleaned || generateAnonymousNickname();
    }

    function loadNickname() {
      try {
        const saved = window.localStorage.getItem(CHAT_NICKNAME_STORAGE_KEY);
        if (saved && saved.trim()) return normalizeNickname(saved);
      } catch (error) {}
      return generateAnonymousNickname();
    }

    function saveNickname(value) {
      try {
        if (value && value.trim()) {
          window.localStorage.setItem(CHAT_NICKNAME_STORAGE_KEY, value.trim());
          window.localStorage.setItem(CHAT_NICKNAME_EXPLICIT_STORAGE_KEY, 'true');
        } else {
          window.localStorage.removeItem(CHAT_NICKNAME_STORAGE_KEY);
          window.localStorage.removeItem(CHAT_NICKNAME_EXPLICIT_STORAGE_KEY);
        }
      } catch (error) {}
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/`/g, '&#96;');
    }

    function splitUrlTrailingPunctuation(value) {
      let url = String(value || '');
      let trailing = '';
      while (/[),.!?:;]$/.test(url)) {
        trailing = url.slice(-1) + trailing;
        url = url.slice(0, -1);
      }
      return { url, trailing };
    }

    function getSafeHttpUrl(value) {
      try {
        const url = new URL(value);
        if (url.protocol !== 'http:' && url.protocol !== 'https:') return '';
        return url.href;
      } catch (error) {
        return '';
      }
    }

    function linkifyText(value) {
      const text = String(value || '');
      const pattern = /https?:\/\/[^\s<>"']+/gi;
      let result = '';
      let cursor = 0;
      text.replace(pattern, (match, offset) => {
        result += escapeHtml(text.slice(cursor, offset));
        const { url, trailing } = splitUrlTrailingPunctuation(match);
        const safeUrl = getSafeHttpUrl(url);
        result += safeUrl
          ? `<a href="${escapeAttribute(safeUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(url)}</a>${escapeHtml(trailing)}`
          : escapeHtml(match);
        cursor = offset + match.length;
        return match;
      });
      result += escapeHtml(text.slice(cursor));
      return result;
    }

    function scrollToBottom() {
      messages.scrollTop = messages.scrollHeight;
    }

    function scheduleScrollToBottom() {
      if (scrollFrameId) return;
      scrollFrameId = requestAnimationFrame(() => {
        scrollFrameId = 0;
        scrollToBottom();
      });
    }

    function addMessage(role, html, options = {}) {
      const line = document.createElement('div');
      line.className = 'message';
      line.dataset.role = role;
      if (options.publicMessage) line.dataset.liveChatMessage = 'true';
      if (options.error) line.dataset.error = 'true';
      line.innerHTML = html;
      messages.appendChild(line);
      while (messages.children.length > SUPABASE_CHAT_MAX_VISIBLE + 30) {
        messages.firstElementChild?.remove();
      }
      scheduleScrollToBottom();
      return line;
    }

    function addSystemMessage(text, options = {}) {
      return addMessage('system', escapeHtml(text), options);
    }

    function addUserEcho(text) {
      return addMessage('user', escapeHtml(text));
    }

    function formatCommandExecutionMessage(command, state = 'executed', nickname = currentNickname) {
      return `${command} ${state} by ${nickname}`;
    }

    function createHelpHtml() {
      const items = visibleCommands.map((command) => {
        return `<a href="#" class="helpItem" data-command="${escapeHtml(command.name)}"><span class="helpCommandName">${escapeHtml(command.name)}</span><span class="helpCommandDesc">- ${escapeHtml(command.desc)}</span></a>`;
      }).join('');
      return `<strong>Help with commands...</strong><div class="helpList">${items}</div>`;
    }

    function clearLocalChatCommand() {
      Array.from(messages.children).forEach((child) => {
        if (child.dataset.liveChatMessage !== 'true') child.remove();
      });
      addSystemMessage('Local chat display cleared. Public chat history remains online.');
      return true;
    }

    function publicMessageKey(message) {
      if (!message) return '';
      return String(message.id || `${message.created_at || ''}:${message.nickname || ''}:${message.body || ''}`);
    }

    function formatPublicMessageTimestamp(value) {
      const date = new Date(value || '');
      if (Number.isNaN(date.getTime())) return '';
      return new Intl.DateTimeFormat('en-US', {
        timeZone: 'America/Toronto',
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      }).format(date);
    }

    function parsePublicChatPayload(body) {
      const raw = String(body || '');
      if (!raw.startsWith('{')) return { type: 'text', text: raw };
      try {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.type === PUBLIC_CHAT_IMAGE_PAYLOAD_TYPE && typeof parsed.src === 'string') {
          return {
            type: 'image',
            src: parsed.src,
            alt: typeof parsed.name === 'string' ? parsed.name : 'pasted image',
            caption: typeof parsed.caption === 'string' ? parsed.caption : ''
          };
        }
      } catch (error) {
      }
      return { type: 'text', text: raw };
    }

    function renderPublicChatBody(body) {
      const payload = parsePublicChatPayload(body);
      if (payload.type !== 'image') return linkifyText(payload.text);
      if (!/^data:image\/(?:png|jpe?g|webp|gif);base64,/i.test(payload.src)) {
        return escapeHtml('[unsupported image]');
      }
      const captionHtml = payload.caption ? `<div>${linkifyText(payload.caption)}</div>` : '';
      return `${captionHtml}<img class="publicChatImage" src="${escapeAttribute(payload.src)}" alt="${escapeAttribute(payload.alt)}" loading="lazy" decoding="async" />`;
    }

    function addPublicChatMessage(message) {
      const key = publicMessageKey(message);
      if (!key || renderedPublicMessageKeys.has(key)) return;
      renderedPublicMessageKeys.add(key);
      const createdAt = String(message.created_at || '');
      if (createdAt && (!latestPublicMessageCreatedAt || createdAt > latestPublicMessageCreatedAt)) {
        latestPublicMessageCreatedAt = createdAt;
      }
      const timestamp = escapeHtml(formatPublicMessageTimestamp(message.created_at));
      const timestampHtml = timestamp ? `<span class="messageTimestamp">${timestamp}</span>` : '';
      const nickname = escapeHtml(message.nickname || 'Anonymous');
      const body = renderPublicChatBody(message.body || '');
      const line = addMessage('public', `${timestampHtml}<strong>${nickname}:</strong> ${body}`, { publicMessage: true });
      line.dataset.publicMessageKey = key;
      trimRenderedPublicMessages();
    }

    function trimRenderedPublicMessages() {
      const publicLines = Array.from(messages.querySelectorAll('[data-live-chat-message="true"]'));
      while (publicLines.length > SUPABASE_CHAT_MAX_VISIBLE) {
        const line = publicLines.shift();
        if (!line) break;
        renderedPublicMessageKeys.delete(line.dataset.publicMessageKey || '');
        line.remove();
      }
    }

    async function supabaseRequest(path, options = {}) {
      const headers = {
        apikey: SUPABASE_PUBLISHABLE_KEY,
        Authorization: `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
        ...(options.headers || {})
      };
      const response = await fetch(`${SUPABASE_PROJECT_URL}${path}`, { ...options, headers });
      if (!response.ok) {
        const text = await response.text().catch(() => '');
        throw new Error(text || `Request failed with ${response.status}`);
      }
      if (response.status === 204) return null;
      return response.json();
    }

    function buildPublicMessagesPath(options = {}) {
      const params = new URLSearchParams();
      params.set('room', `eq.${SUPABASE_CHAT_ROOM}`);
      params.set('select', 'id,room,nickname,body,created_at');
      if (options.since) params.set('created_at', `gt.${options.since}`);
      params.set('order', options.ascending ? 'created_at.asc' : 'created_at.desc');
      params.set('limit', String(options.limit || PUBLIC_CHAT_FETCH_LIMIT));
      return `/rest/v1/${SUPABASE_CHAT_TABLE}?${params.toString()}`;
    }

    async function loadRecentPublicMessages(options = {}) {
      if (publicChatRefreshInFlight) return false;
      publicChatRefreshInFlight = true;
      try {
        const incremental = options.incremental && latestPublicMessageCreatedAt;
        const rows = await supabaseRequest(buildPublicMessagesPath({
          since: incremental ? latestPublicMessageCreatedAt : '',
          ascending: !!incremental,
          limit: incremental ? SUPABASE_CHAT_MAX_VISIBLE : PUBLIC_CHAT_FETCH_LIMIT
        }));
        if (Array.isArray(rows) && rows.length > SUPABASE_CHAT_MAX_VISIBLE) {
          prunePublicChatHistory();
        }
        const orderedRows = Array.isArray(rows)
          ? (incremental ? rows : rows.slice(0, SUPABASE_CHAT_MAX_VISIBLE).reverse())
          : [];
        if (!incremental) {
          const nextKeys = new Set(orderedRows.map(publicMessageKey).filter(Boolean));
          Array.from(messages.querySelectorAll('[data-live-chat-message="true"]')).forEach((line) => {
            const key = line.dataset.publicMessageKey || '';
            if (!nextKeys.has(key)) {
              line.remove();
              renderedPublicMessageKeys.delete(key);
            }
          });
        }
        orderedRows.forEach(addPublicChatMessage);
        trimRenderedPublicMessages();
        return true;
      } catch (error) {
        console.warn('Unable to load public chat:', error);
        return false;
      } finally {
        publicChatRefreshInFlight = false;
      }
    }

    async function prunePublicChatHistory(options = {}) {
      if (publicChatPruneInFlight) return false;
      const now = Date.now();
      if (!options.force && now - lastPublicChatPruneAttemptMs < PUBLIC_CHAT_PRUNE_RETRY_MS) return false;
      lastPublicChatPruneAttemptMs = now;
      publicChatPruneInFlight = true;
      try {
        await supabaseRequest('/functions/v1/clear-chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'prune',
            room: SUPABASE_CHAT_ROOM,
            maxMessages: SUPABASE_CHAT_MAX_VISIBLE
          })
        });
        return true;
      } catch (error) {
        console.warn('Unable to prune public chat history:', error);
        return false;
      } finally {
        publicChatPruneInFlight = false;
      }
    }

    async function insertPublicChatBody(body) {
      const nickname = normalizeNickname(currentNickname);
      currentNickname = nickname;
      const rows = await supabaseRequest(`/rest/v1/${SUPABASE_CHAT_TABLE}?select=id,room,nickname,body,created_at`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Prefer: 'return=representation'
        },
        body: JSON.stringify({ room: SUPABASE_CHAT_ROOM, nickname, body })
      });
      const [message] = Array.isArray(rows) ? rows : [];
      if (message) addPublicChatMessage(message);
      await prunePublicChatHistory({ force: true });
      return true;
    }

    async function insertPublicChatImageBody(imageBody) {
      const nickname = normalizeNickname(currentNickname);
      currentNickname = nickname;
      const result = await supabaseRequest('/functions/v1/clear-chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'insert_image',
          room: SUPABASE_CHAT_ROOM,
          nickname,
          imageBody
        })
      });
      if (result && result.message) addPublicChatMessage(result.message);
      await prunePublicChatHistory({ force: true });
      return true;
    }

    async function sendPublicMessage(rawBody) {
      const body = String(rawBody || '').trim();
      if (!body) return false;
      if (body.length > 500) {
        addSystemMessage('Message is too long. Keep public chat messages to 500 characters.', { error: true });
        return false;
      }
      try {
        return await insertPublicChatBody(body);
      } catch (error) {
        console.error('Unable to send public chat message:', error);
        addSystemMessage('Unable to send public chat message.', { error: true });
        return false;
      }
    }

    function readImageElement(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error('Unable to read pasted image.'));
        image.src = src;
      });
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ''));
        reader.onerror = () => reject(new Error('Unable to read pasted image.'));
        reader.readAsDataURL(file);
      });
    }

    async function createImageDataUrl(file) {
      if (!file || !String(file.type || '').startsWith('image/')) {
        throw new Error('Paste an image file.');
      }
      if (file.size > PUBLIC_CHAT_IMAGE_MAX_SOURCE_BYTES) {
        throw new Error('Image is too large. Keep pasted images under 5 MB.');
      }

      const sourceDataUrl = await readFileAsDataUrl(file);
      const image = await readImageElement(sourceDataUrl);
      const scale = Math.min(1, PUBLIC_CHAT_IMAGE_MAX_DIMENSION / Math.max(image.naturalWidth || 1, image.naturalHeight || 1));
      const width = Math.max(1, Math.round((image.naturalWidth || 1) * scale));
      const height = Math.max(1, Math.round((image.naturalHeight || 1) * scale));
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext('2d');
      if (!context) throw new Error('Unable to process pasted image.');
      context.drawImage(image, 0, 0, width, height);

      const qualities = [0.76, 0.66, 0.56, 0.46];
      for (const quality of qualities) {
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        if (dataUrl.length <= PUBLIC_CHAT_IMAGE_MAX_BODY_CHARS) return dataUrl;
      }
      throw new Error('Image is too large after compression.');
    }

    async function sendPublicImage(file) {
      try {
        addSystemMessage('Uploading pasted image...');
        const src = await createImageDataUrl(file);
        const payload = JSON.stringify({
          type: PUBLIC_CHAT_IMAGE_PAYLOAD_TYPE,
          name: file.name || 'pasted image',
          mime: 'image/jpeg',
          src
        });
        if (payload.length > PUBLIC_CHAT_IMAGE_MAX_BODY_CHARS + 512) {
          throw new Error('Image payload is too large.');
        }
        await insertPublicChatImageBody(payload);
      } catch (error) {
        console.error('Unable to send pasted image:', error);
        addSystemMessage(error && error.message ? error.message : 'Unable to send pasted image.', { error: true });
      }
    }

    async function clearPublicChatHistory(password) {
      const adminPassword = String(password || '');
      if (!adminPassword) {
        addSystemMessage('Usage: /clear_public [admin password]');
        return true;
      }
      try {
        await supabaseRequest('/functions/v1/clear-chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: adminPassword, room: SUPABASE_CHAT_ROOM })
        });
        Array.from(messages.querySelectorAll('[data-live-chat-message="true"]')).forEach((line) => line.remove());
        renderedPublicMessageKeys.clear();
        latestPublicMessageCreatedAt = '';
        addSystemMessage('Public chat history cleared.');
        loadRecentPublicMessages();
        return true;
      } catch (error) {
        console.error('Unable to clear public chat history:', error);
        addSystemMessage('Unable to clear public chat history.', { error: true });
        return false;
      }
    }

    async function handleCommand(raw) {
      const trimmed = String(raw || '').trim();
      const [commandToken = ''] = trimmed.split(/\s+/);
      const command = commandToken.toLowerCase();
      const arg = trimmed.slice(commandToken.length).trim();

      if (command === '/nickname') {
        if (arg.toLowerCase() === 'reset') {
          currentNickname = generateAnonymousNickname();
          saveNickname('');
          addSystemMessage(`/nickname reset: ${currentNickname}`);
          return true;
        }
        if (!arg) {
          addSystemMessage('Usage: /nickname [name]');
          return true;
        }
        if (arg.length > 40) {
          addSystemMessage('Nickname is too long. Keep it to 40 characters.', { error: true });
          return true;
        }
        currentNickname = normalizeNickname(arg);
        saveNickname(currentNickname);
        addSystemMessage(formatCommandExecutionMessage('/nickname', 'executed', currentNickname));
        return true;
      }

      if (command === '/help') {
        addSystemMessage(formatCommandExecutionMessage('/help'));
        addMessage('system', createHelpHtml());
        return true;
      }

      if (command === '/clear') {
        clearLocalChatCommand();
        return true;
      }

      if (command === '/clear_public') {
        await clearPublicChatHistory(arg);
        return true;
      }

      return false;
    }

    function isSensitiveClearCommand(raw) {
      const trimmed = String(raw || '').trim().toLowerCase();
      return trimmed.startsWith('/clear_public') && !!trimmed.slice('/clear_public'.length).trim();
    }

    async function submitInput() {
      const raw = chatInput.value;
      const trimmed = raw.trim();
      if (!trimmed) return;
      chatInput.value = '';
      hideSuggestions();
      if (trimmed.startsWith('/')) {
        if (!isSensitiveClearCommand(trimmed)) addUserEcho(trimmed);
        const handled = await handleCommand(trimmed);
        if (!handled) addSystemMessage(`${trimmed.split(/\s+/)[0]} is not a known command`, { error: true });
        return;
      }
      await sendPublicMessage(trimmed);
    }

    function matchingCommands() {
      const value = chatInput.value;
      if (!value.startsWith('/')) return [];
      const token = value.split(/\s+/)[0].toLowerCase();
      return visibleCommands.filter((command) => command.name.startsWith(token));
    }

    function hideSuggestions() {
      suggestions.classList.remove('visible');
      suggestions.setAttribute('aria-hidden', 'true');
      suggestions.innerHTML = '';
      suggestionIndex = -1;
    }

    function renderSuggestions() {
      const matches = matchingCommands();
      if (!matches.length) {
        hideSuggestions();
        return;
      }
      suggestions.innerHTML = '';
      matches.forEach((command, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = index === suggestionIndex ? 'suggestion active' : 'suggestion';
        button.textContent = command.name;
        button.addEventListener('mousedown', (event) => {
          event.preventDefault();
          applyCommand(command);
        });
        suggestions.appendChild(button);
      });
      suggestions.classList.add('visible');
      suggestions.setAttribute('aria-hidden', 'false');
    }

    function applyCommand(command) {
      chatInput.value = command.value || command.name;
      chatInput.focus();
      chatInput.selectionStart = chatInput.selectionEnd = chatInput.value.length;
      hideSuggestions();
      if (command.execute) submitInput();
    }

    function cycleSuggestion(direction) {
      const matches = matchingCommands();
      if (!matches.length) return false;
      suggestionIndex = (suggestionIndex + direction + matches.length) % matches.length;
      const selected = matches[suggestionIndex];
      chatInput.value = selected.value || selected.name;
      chatInput.selectionStart = chatInput.selectionEnd = chatInput.value.length;
      renderSuggestions();
      return true;
    }

    function setOpen(open, focus = true) {
      document.body.classList.toggle('chat-open', !!open);
      notifyState();
      if (open && focus) requestAnimationFrame(() => chatInput.focus());
    }

    function setPreview(visible, progress = 0) {
      document.body.classList.toggle('chat-preview', !!visible);
      document.body.style.setProperty('--preview-opacity', String(Math.max(0.25, Math.min(1, Number(progress) || 0.45))));
    }

    function notifyState() {
      if (!window.parent || window.parent === window) return;
      window.parent.postMessage({
        type: 'chatSandboxState',
        visible: document.body.classList.contains('chat-open'),
        valuePickerActive: false,
        valuePickerCommand: ''
      }, '*');
    }

    inputWrap.addEventListener('submit', (event) => {
      event.preventDefault();
      submitInput();
    });

    chatInput.addEventListener('input', renderSuggestions);

    chatInput.addEventListener('paste', (event) => {
      const items = Array.from(event.clipboardData && event.clipboardData.items ? event.clipboardData.items : []);
      const imageItem = items.find((item) => item && item.kind === 'file' && String(item.type || '').startsWith('image/'));
      if (!imageItem) return;
      const file = imageItem.getAsFile();
      if (!file) return;
      event.preventDefault();
      sendPublicImage(file);
    });

    chatInput.addEventListener('keydown', (event) => {
      if (event.key === 'Tab' && chatInput.value.startsWith('/')) {
        event.preventDefault();
        cycleSuggestion(event.shiftKey ? -1 : 1);
        return;
      }
      if (event.key === 'Escape') {
        event.preventDefault();
        setOpen(false, false);
      }
    });

    messages.addEventListener('click', (event) => {
      const item = event.target && event.target.closest ? event.target.closest('.helpItem[data-command]') : null;
      if (!item) return;
      event.preventDefault();
      const command = commandByName.get(item.dataset.command || '');
      if (command) applyCommand(command);
    });

    window.addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.type === 'chatSandboxOpen') {
        setOpen(true, data.focus !== false);
        if (data.seedSlash) {
          chatInput.value = '/';
          renderSuggestions();
        }
        return;
      }
      if (data.type === 'chatSandboxClose') {
        setOpen(false, false);
        return;
      }
      if (data.type === 'chatSandboxPreview') {
        setPreview(!!data.visible, data.progress);
        return;
      }
      if (data.type === 'chatSandboxExecuteCommand') {
        const rawCommand = typeof data.command === 'string' ? data.command.trim() : '';
        if (!rawCommand) return;
        if (data.openChat) setOpen(true, data.focus !== false);
        handleCommand(rawCommand).then((ok) => {
          if (!ok && rawCommand.startsWith('/')) addSystemMessage(`${rawCommand.split(/\s+/)[0]} is not a known command`, { error: true });
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'chatSandboxCommandResult', ok: !!ok, command: rawCommand, commandId: data.commandId || '' }, '*');
          }
        });
        return;
      }
      if (data.type === 'pageChatRegister') {
        return;
      }
    });

    if (window.parent && window.parent !== window) {
      document.documentElement.classList.add('embedded');
      document.body.classList.add('embedded');
    } else {
      setOpen(true, false);
    }

    addSystemMessage('System: Welcome to chat. Type /help for commands.');
    loadRecentPublicMessages();
    window.setInterval(() => {
      if (!document.hidden) loadRecentPublicMessages({ incremental: true });
    }, PUBLIC_CHAT_REFRESH_MS);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) loadRecentPublicMessages({ incremental: true });
    });
    notifyState();
  </script>
</body>
</html>
