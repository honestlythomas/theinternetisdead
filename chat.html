<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      color: #00ff66;
      font-family: "Courier New", Courier, monospace;
      overflow: hidden;
    }

    body {
      --chat-bg: rgba(0, 0, 0, 0.82);
      --chat-border: rgba(0, 255, 102, 0.42);
      --chat-text: #00ff66;
      --chat-muted: rgba(0, 255, 102, 0.72);
      --chat-danger: #ff5577;
    }

    #chatSurface {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      pointer-events: none;
      z-index: 3;
    }

    #chatDimLayer {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.46);
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease;
      z-index: 1;
    }

    body.chat-open #chatDimLayer {
      opacity: 1;
    }

    #chatPanel {
      width: 100%;
      height: 100%;
      max-height: none;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px;
      box-sizing: border-box;
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 160ms ease, transform 160ms ease;
      pointer-events: none;
    }

    body.chat-open #chatPanel,
    body.chat-preview #chatPanel {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    body.chat-preview:not(.chat-open) #chatPanel {
      opacity: var(--preview-opacity, 0.45);
    }

    #messages {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 6px;
      max-height: none;
      padding-right: 4px;
      scrollbar-color: var(--chat-text) transparent;
    }

    .message {
      width: fit-content;
      max-width: min(920px, calc(100vw - 32px));
      flex-shrink: 0;
      padding: 7px 9px;
      border: 1px solid var(--chat-border);
      background: var(--chat-bg);
      color: var(--chat-text);
      text-shadow: 0 0 6px rgba(0, 255, 102, 0.28);
      line-height: 1.35;
      overflow-wrap: anywhere;
      box-shadow: 0 0 18px rgba(0, 255, 102, 0.08);
    }

    .message[data-role="user"] {
      align-self: flex-end;
      border-color: rgba(123, 210, 255, 0.46);
      color: #9be4ff;
      text-shadow: 0 0 6px rgba(123, 210, 255, 0.25);
    }

    .message[data-role="system"] { color: var(--chat-muted); }

    .message a,
    .message a:visited {
      color: #ffffff;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .message p {
      margin: 0;
    }

    .message p + p,
    .message ul + p,
    .message pre + p {
      margin-top: 7px;
    }

    .message ul {
      margin: 4px 0 0 18px;
      padding: 0;
    }

    .message li {
      margin: 2px 0;
    }

    .message code {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
      padding: 1px 4px;
      border-radius: 3px;
      text-shadow: none;
    }

    .message pre {
      margin: 4px 0 0;
      max-width: min(720px, calc(100vw - 70px));
      overflow: auto;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.48);
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 8px;
      text-shadow: none;
      white-space: pre;
    }

    .message pre code {
      display: block;
      padding: 0;
      background: transparent;
    }

    .publicChatImage {
      display: block;
      max-width: min(420px, calc(100vw - 70px));
      max-height: 320px;
      width: auto;
      height: auto;
      margin-top: 6px;
      border: 1px solid rgba(255, 255, 255, 0.34);
      background: rgba(0, 0, 0, 0.35);
      object-fit: contain;
      cursor: zoom-in;
    }

    .publicChatImage:hover,
    .publicChatImage:focus-visible {
      outline: 1px solid rgba(255, 255, 255, 0.62);
      filter: brightness(1.08);
    }

    .publicChatYoutube {
      display: block;
      width: min(420px, calc(100vw - 70px));
      max-width: 100%;
      margin-top: 6px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.34);
      background: rgba(0, 0, 0, 0.52);
      color: #ffffff;
      font: inherit;
      text-align: left;
      cursor: zoom-in;
      box-shadow: 0 0 18px rgba(255, 0, 120, 0.12), 0 0 20px rgba(0, 255, 102, 0.08);
      overflow: hidden;
    }

    .publicChatYoutube:hover,
    .publicChatYoutube:focus-visible {
      outline: 1px solid rgba(255, 255, 255, 0.62);
      filter: brightness(1.08);
    }

    .publicChatYoutubeThumbWrap {
      position: relative;
      display: block;
      aspect-ratio: 16 / 9;
      background: rgba(0, 0, 0, 0.72);
    }

    .publicChatYoutubeThumb {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .publicChatYoutubePlay {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      width: 62px;
      height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.66);
      border-radius: 10px;
      background: rgba(255, 0, 80, 0.72);
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.45);
      box-shadow: 0 0 26px rgba(255, 0, 80, 0.35);
    }

    .publicChatYoutubeLabel {
      display: block;
      padding: 7px 9px;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.64);
      overflow-wrap: anywhere;
      text-shadow: 0 0 6px rgba(0, 255, 102, 0.22);
    }

    #chatLightbox {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 22px;
      box-sizing: border-box;
      background:
        radial-gradient(circle at 50% 50%, rgba(81, 42, 103, 0.38), transparent 58%),
        rgba(0, 0, 0, 0.84);
      pointer-events: none;
    }

    #chatLightbox.active {
      display: flex;
      pointer-events: auto;
    }

    #chatLightboxImage {
      display: block;
      max-width: min(96vw, 1400px);
      max-height: 90vh;
      width: auto;
      height: auto;
      border: 1px solid rgba(0, 255, 102, 0.54);
      background: rgba(0, 0, 0, 0.72);
      box-shadow: 0 0 32px rgba(0, 255, 102, 0.18), 0 0 90px rgba(81, 42, 103, 0.34);
      object-fit: contain;
      cursor: zoom-out;
    }

    #chatLightboxFrame {
      display: none;
      width: min(96vw, 1400px);
      height: min(54vw, 78vh);
      max-height: 78vh;
      aspect-ratio: 16 / 9;
      border: 1px solid rgba(0, 255, 102, 0.54);
      background: rgba(0, 0, 0, 0.9);
      box-shadow: 0 0 32px rgba(0, 255, 102, 0.18), 0 0 90px rgba(81, 42, 103, 0.34);
    }

    #chatLightbox[data-lightbox-kind="video"] #chatLightboxImage {
      display: none;
    }

    #chatLightbox[data-lightbox-kind="video"] #chatLightboxFrame {
      display: block;
    }

    #chatLightbox[data-lightbox-kind="image"] #chatLightboxFrame {
      display: none;
    }

    #chatLightboxClose {
      position: fixed;
      top: 14px;
      right: 16px;
      border: 1px solid rgba(255, 85, 119, 0.5);
      background: rgba(0, 0, 0, 0.76);
      color: #ff5577;
      font: inherit;
      line-height: 1;
      padding: 7px 9px;
      cursor: pointer;
      text-shadow: 0 0 8px rgba(255, 85, 119, 0.38);
    }

    #chatLightboxClose:hover,
    #chatLightboxClose:focus-visible {
      outline: none;
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.62);
    }

    .messageTimestamp {
      color: #ffffff;
      font-size: 12px;
      line-height: 1;
      margin-right: 6px;
      text-shadow: none;
      white-space: nowrap;
    }

    .reservedNickname {
      background: linear-gradient(90deg, #ff5577, #ff9f43, #ffe66d, #00ff66, #7bd2ff, #c792ea, #ff7ac8, #ff5577);
      background-size: 220% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: reserved-nickname-rainbow 2.2s linear infinite;
      text-shadow: none;
    }

    @keyframes reserved-nickname-rainbow {
      from { background-position: 0% 50%; }
      to { background-position: 220% 50%; }
    }

    .message[data-error="true"] {
      color: var(--chat-danger);
      border-color: rgba(255, 85, 119, 0.5);
      text-shadow: 0 0 6px rgba(255, 85, 119, 0.25);
    }

    .message[data-pinned-message="true"] {
      border-color: rgba(255, 255, 255, 0.52);
      color: #ffffff;
      background: rgba(0, 0, 0, 0.66);
      box-shadow: 0 0 22px rgba(255, 255, 255, 0.12);
    }

    .helpList { display: grid; gap: 4px; margin-top: 4px; }

    .helpItem {
      color: inherit;
      text-decoration: none;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px;
      align-items: baseline;
    }

    .helpItem:hover,
    .helpItem:focus-visible { outline: none; color: #ffffff; }
    .helpCommandName { color: #ffffff; font-weight: 700; }
    .helpCommandDesc { color: var(--chat-muted); }

    #inputWrap {
      position: relative;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border: 1px solid var(--chat-border);
      background: var(--chat-bg);
      box-shadow: 0 0 22px rgba(0, 255, 102, 0.12);
    }

    #prompt { color: var(--chat-text); font-weight: 700; }

    #chatInput {
      min-width: 0;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--chat-text);
      font: inherit;
    }

    #chatInput::placeholder { color: rgba(0, 255, 102, 0.52); }

    #chatCloseButton {
      border: 0;
      background: transparent;
      color: #ff5577;
      font: inherit;
      line-height: 1;
      padding: 0 2px;
      cursor: pointer;
      text-shadow: 0 0 8px rgba(255, 85, 119, 0.38);
    }

    #chatCloseButton:hover,
    #chatCloseButton:focus-visible {
      outline: none;
      color: #ffffff;
    }

    #suggestions {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(100% + 6px);
      display: none;
      gap: 4px;
      padding: 6px;
      border: 1px solid var(--chat-border);
      background: var(--chat-bg);
    }

    #suggestions.visible { display: grid; }

    .suggestion {
      border: 0;
      background: transparent;
      color: var(--chat-text);
      font: inherit;
      text-align: left;
      padding: 4px 6px;
      cursor: pointer;
    }

    .suggestion:hover,
    .suggestion.active,
    .suggestion:focus-visible {
      outline: 1px solid var(--chat-border);
      background: rgba(0, 255, 102, 0.12);
    }

    #dvdOverlay {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      display: none;
      z-index: 2;
    }

    #dvdOverlay.active {
      display: block;
    }

    .dvdLogo {
      position: absolute;
      left: 0;
      top: 0;
      width: min(22vw, 180px);
      height: auto;
      opacity: 0.96;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: auto;
      cursor: default;
      filter: hue-rotate(0deg) drop-shadow(0 0 10px rgba(255, 255, 255, 0.28));
      transform: translate3d(0, 0, 0);
      will-change: transform, filter;
    }
  </style>
</head>
<body>
  <div id="chatDimLayer" aria-hidden="true"></div>
  <div id="dvdOverlay" aria-hidden="true"></div>
  <div id="chatLightbox" aria-hidden="true" role="dialog" aria-label="Expanded chat media">
    <button id="chatLightboxClose" type="button" aria-label="Close expanded media" title="Close expanded media">❌</button>
    <img id="chatLightboxImage" src="" alt="" />
    <iframe id="chatLightboxFrame" title="YouTube video player" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </div>
  <main id="chatSurface" aria-live="polite">
    <section id="chatPanel">
      <div id="messages"></div>
      <form id="inputWrap" autocomplete="off">
        <span id="prompt">&gt;</span>
        <input id="chatInput" type="text" placeholder="Press here to chat or / for commands..." />
        <button id="chatCloseButton" type="button" aria-label="Close chat" title="Close chat">❌</button>
        <div id="suggestions" aria-hidden="true"></div>
      </form>
    </section>
  </main>

  <script>
    const CHAT_NICKNAME_STORAGE_KEY = 'tektiteChatNickname';
    const CHAT_NICKNAME_EXPLICIT_STORAGE_KEY = 'tektiteChatNicknameExplicit';
    const CHAT_NICKNAME_COLOR_STORAGE_KEY = 'tektiteChatNicknameColor';
    const SUPABASE_PROJECT_URL = 'https://fumidkcwrhzgfdmuakqj.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_BcNJhaZkgo4r5VH1aJ_stQ_P-kEDY_r';
    const SUPABASE_CHAT_ROOM = 'index';
    const SUPABASE_CHAT_TABLE = 'site_chat_messages';
    const SUPABASE_CHAT_MAX_VISIBLE = 20;
    const PUBLIC_CHAT_FETCH_LIMIT = SUPABASE_CHAT_MAX_VISIBLE + 1;
    const PUBLIC_CHAT_REFRESH_MS = 5000;
    const PUBLIC_CHAT_PRUNE_RETRY_MS = 30000;
    const PUBLIC_CHAT_IMAGE_MAX_SOURCE_BYTES = 5 * 1024 * 1024;
    const PUBLIC_CHAT_IMAGE_MAX_BODY_CHARS = 700000;
    const PUBLIC_CHAT_IMAGE_MAX_DIMENSION = 960;
    const PUBLIC_CHAT_IMAGE_PAYLOAD_TYPE = 'theinternetisdead.publicChatImage.v1';
    const PUBLIC_CHAT_PIN_PAYLOAD_TYPE = 'theinternetisdead.publicChatPin.v1';

    const commands = [
      { name: '/clear', value: '/clear', execute: true, desc: 'clear local non-public chat messages' },
      { name: '/clear_public', value: '/clear_public ', execute: false, desc: 'admin: clear public chat history through the server-side function', hidden: true },
      { name: '/dvd', value: '/dvd', execute: true, desc: 'spawn another bouncing hue-shifting DVD logo, up to 10 total' },
      { name: '/exit', value: '/exit', execute: true, desc: 'kill the page and trigger the fatal exit screen' },
      { name: '/nickname', value: '/nickname ', execute: false, desc: 'set the displayed username used by system messages', suggestions: ['Tektite', 'Guest', 'User', 'color #00ff66', 'reset'] },
      { name: '/pin', value: '/pin ', execute: false, desc: 'reserved: pin a message below the welcome message', hidden: true },
      { name: '/random', value: '/random', execute: true, desc: 'load a random site page in the root iframe' },
      { name: '/rainbow', value: '/rainbow', execute: true, desc: 'toggle a hue-shifting color filter over the root page' },
      { name: '/refresh', value: '/refresh', execute: true, desc: 'refresh the entire page' },
      { name: '/search', value: '/search ', execute: false, desc: 'search visible text across indexed site HTML files' },
      { name: '/help', value: '/help', execute: true, desc: 'show this help message with command links' }
    ];

    const visibleCommands = commands.filter((command) => command.hidden !== true);
    const commandByName = new Map(commands.map((command) => [command.name, command]));
    const messages = document.getElementById('messages');
    const inputWrap = document.getElementById('inputWrap');
    const chatInput = document.getElementById('chatInput');
    const chatCloseButton = document.getElementById('chatCloseButton');
    const suggestions = document.getElementById('suggestions');
    const dvdOverlay = document.getElementById('dvdOverlay');
    const chatLightbox = document.getElementById('chatLightbox');
    const chatLightboxImage = document.getElementById('chatLightboxImage');
    const chatLightboxFrame = document.getElementById('chatLightboxFrame');
    const chatLightboxClose = document.getElementById('chatLightboxClose');
    let currentNickname = loadNickname();
    let currentNicknameColor = loadNicknameColor();
    let renderedPublicMessageKeys = new Set();
    let suggestionIndex = -1;
    let publicChatRefreshInFlight = false;
    let publicChatPruneInFlight = false;
    let lastPublicChatPruneAttemptMs = 0;
    let latestPublicMessageCreatedAt = '';
    let scrollFrameId = 0;
    let dvdAnimationFrameId = null;
    let dvdEnabled = false;
    let dvdLastTime = 0;
    let dvdLogoCounter = 0;
    let dvdCommandAttemptCount = 0;
    const dvdInstances = [];
    const dvdDefaultSource = 'https://upload.wikimedia.org/wikipedia/commons/8/85/Dvd_logo.svg';
    const dvdNormalMaxInstances = 10;
    const dvdHueShiftSpeedDegPerSecond = 45;
    const COMMAND_EXECUTION_MESSAGE_TTL_MS = 15000;
    const SITE_SEARCH_MAX_RESULTS = 8;
    const SITE_SEARCH_FETCH_CONCURRENCY = 8;
    const RESERVED_NICKNAMES = new Set([
      'honestly thomas',
      'tektite',
      'theinternetisdead',
      'jinclops',
      'jin',
      'evil jin',
      'webmaster',
      'admin',
      'administrator',
      'mod',
      'moderator',
      'dev',
      'developer'
    ]);
    const commandExecutionMessages = new Map();
    let pendingReservedNickname = '';
    let pendingReservedNicknamePromptLine = null;
    let pendingClearPublicPassword = false;
    let pendingClearPublicPromptLine = null;
    let pendingNicknameColor = false;
    let pendingNicknameColorPromptLine = null;
    let pendingSiteSearch = false;
    let pendingSiteSearchPromptLine = null;
    let siteSearchIndexPromise = null;
    let siteSearchDocuments = null;
    let welcomeMessageLine = null;
    let pinnedMessageLine = null;
    let previousChatInputPlaceholder = chatInput.getAttribute('placeholder') || '';

    function generateAnonymousNickname() {
      return `Anonymous Ghost ${Math.floor(Math.random() * 900) + 100}`;
    }

    function normalizeNickname(value) {
      const cleaned = String(value || '').replace(/[\r\n\t]+/g, ' ').replace(/\s{2,}/g, ' ').trim();
      return cleaned || generateAnonymousNickname();
    }

    function isReservedNickname(value) {
      return RESERVED_NICKNAMES.has(normalizeNickname(value).toLowerCase());
    }

    function loadNickname() {
      try {
        const saved = window.localStorage.getItem(CHAT_NICKNAME_STORAGE_KEY);
        if (saved && saved.trim()) return normalizeNickname(saved);
      } catch (error) {}
      return generateAnonymousNickname();
    }

    function saveNickname(value) {
      try {
        if (value && value.trim()) {
          window.localStorage.setItem(CHAT_NICKNAME_STORAGE_KEY, value.trim());
          window.localStorage.setItem(CHAT_NICKNAME_EXPLICIT_STORAGE_KEY, 'true');
        } else {
          window.localStorage.removeItem(CHAT_NICKNAME_STORAGE_KEY);
          window.localStorage.removeItem(CHAT_NICKNAME_EXPLICIT_STORAGE_KEY);
        }
      } catch (error) {}
    }

    function normalizeNicknameColor(value) {
      const raw = String(value || '').trim();
      if (!raw) return '';
      const cssColor = raw.replace(/\s+/g, ' ');
      const hex = raw.match(/^#?([0-9a-f]{3}|[0-9a-f]{6})$/i);
      if (hex) {
        const value = hex[1];
        if (value.length === 3) {
          return `#${value.split('').map((char) => char + char).join('').toLowerCase()}`;
        }
        return `#${value.toLowerCase()}`;
      }
      const rgba = raw.match(/^rgba?\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})(?:\s*,\s*(0|1|0?\.\d+))?\s*\)$/i);
      if (rgba) {
        const red = Math.max(0, Math.min(255, Number(rgba[1])));
        const green = Math.max(0, Math.min(255, Number(rgba[2])));
        const blue = Math.max(0, Math.min(255, Number(rgba[3])));
        const alpha = rgba[4] === undefined ? null : Math.max(0, Math.min(1, Number(rgba[4])));
        return alpha === null
          ? `rgb(${red}, ${green}, ${blue})`
          : `rgba(${red}, ${green}, ${blue}, ${alpha})`;
      }
      const namedColors = {
        red: '#ff5577',
        orange: '#ff9f43',
        yellow: '#ffe66d',
        green: '#00ff66',
        blue: '#7bd2ff',
        indigo: 'indigo',
        purple: '#c792ea',
        pink: '#ff7ac8',
        white: '#ffffff'
      };
      if (namedColors[raw.toLowerCase()]) return namedColors[raw.toLowerCase()];

      if (typeof CSS !== 'undefined' && CSS.supports && CSS.supports('color', cssColor)) {
        return cssColor;
      }

      return '';
    }

    function loadNicknameColor() {
      try {
        return normalizeNicknameColor(window.localStorage.getItem(CHAT_NICKNAME_COLOR_STORAGE_KEY) || '');
      } catch (error) {}
      return '';
    }

    function saveNicknameColor(value) {
      const color = normalizeNicknameColor(value);
      try {
        if (color) {
          window.localStorage.setItem(CHAT_NICKNAME_COLOR_STORAGE_KEY, color);
        } else {
          window.localStorage.removeItem(CHAT_NICKNAME_COLOR_STORAGE_KEY);
        }
      } catch (error) {}
      return color;
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/`/g, '&#96;');
    }

    function splitUrlTrailingPunctuation(value) {
      let url = String(value || '');
      let trailing = '';
      while (/[),.!?:;]$/.test(url)) {
        trailing = url.slice(-1) + trailing;
        url = url.slice(0, -1);
      }
      return { url, trailing };
    }

    function getSafeHttpUrl(value) {
      try {
        const url = new URL(value);
        if (url.protocol !== 'http:' && url.protocol !== 'https:') return '';
        return url.href;
      } catch (error) {
        return '';
      }
    }

    function parseYouTubeTimestamp(value) {
      const raw = String(value || '').trim();
      if (!raw) return 0;
      if (/^\d+$/.test(raw)) return Math.max(0, Number(raw));
      const match = raw.match(/(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?/i);
      if (!match || !match[0]) return 0;
      return ((Number(match[1]) || 0) * 3600) + ((Number(match[2]) || 0) * 60) + (Number(match[3]) || 0);
    }

    function getYouTubeEmbedInfo(value) {
      const safeUrl = getSafeHttpUrl(value);
      if (!safeUrl) return null;
      let url;
      try {
        url = new URL(safeUrl);
      } catch (error) {
        return null;
      }

      const host = url.hostname.replace(/^www\./i, '').toLowerCase();
      let videoId = '';
      if (host === 'youtu.be') {
        videoId = url.pathname.split('/').filter(Boolean)[0] || '';
      } else if (host === 'youtube.com' || host === 'm.youtube.com' || host === 'music.youtube.com' || host === 'youtube-nocookie.com') {
        const parts = url.pathname.split('/').filter(Boolean);
        if (url.pathname === '/watch') {
          videoId = url.searchParams.get('v') || '';
        } else if (['shorts', 'embed', 'live', 'v'].includes(parts[0])) {
          videoId = parts[1] || '';
        }
      }

      videoId = String(videoId || '').match(/^[a-zA-Z0-9_-]{11}$/)?.[0] || '';
      if (!videoId) return null;

      const start = parseYouTubeTimestamp(url.searchParams.get('t') || url.searchParams.get('start') || '');
      const embedUrl = new URL(`https://www.youtube-nocookie.com/embed/${videoId}`);
      embedUrl.searchParams.set('autoplay', '1');
      embedUrl.searchParams.set('rel', '0');
      if (start) embedUrl.searchParams.set('start', String(start));

      return {
        videoId,
        url: safeUrl,
        embedUrl: embedUrl.href,
        thumbnailUrl: `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`
      };
    }

    function getYouTubeEmbedsFromText(value) {
      const found = [];
      const seen = new Set();
      String(value || '').replace(/https?:\/\/[^\s<]+/gi, (match) => {
        const { url } = splitUrlTrailingPunctuation(match);
        const info = getYouTubeEmbedInfo(url);
        if (info && !seen.has(info.videoId)) {
          seen.add(info.videoId);
          found.push(info);
        }
        return match;
      });
      return found;
    }

    function renderYouTubeEmbeds(value) {
      const embeds = getYouTubeEmbedsFromText(value);
      if (!embeds.length) return '';
      return embeds.map((embed) => `

          <span class="publicChatYoutubeThumbWrap">

          </span>
          <span class="publicChatYoutubeLabel">YouTube video detected. Click to open inside the haunted glass coffin.</span>
        </button>
      `).join('');

    function renderInlineMarkdown(value) {
      const tokens = [];
      const addToken = (html) => {
        const token = `@@MDTOKEN${tokens.length}@@`;
        tokens.push(html);
        return token;
      };

      let text = String(value || '');
      text = text.replace(/`([^`\n]+)`/g, (_match, code) => {
        return addToken(`<code>${escapeHtml(code)}</code>`);
      });
      text = text.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/gi, (_match, label, href) => {
        const safeUrl = getSafeHttpUrl(href);
        if (!safeUrl) return escapeHtml(label);
        return addToken(`<a href="${escapeAttribute(safeUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)}</a>`);
      });

      let html = escapeHtml(text);
      html = html.replace(/\*\*([^*\n][\s\S]*?[^*\n])\*\*/g, '<strong>$1</strong>');
      html = html.replace(/(^|[^\*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
      html = html.replace(/(https?:\/\/[^\s<]+)/gi, (match) => {
        const { url, trailing } = splitUrlTrailingPunctuation(match);
        const safeUrl = getSafeHttpUrl(url);
        return safeUrl
          ? `<a href="${escapeAttribute(safeUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(url)}</a>${escapeHtml(trailing)}`
          : escapeHtml(match);
      });
      tokens.forEach((tokenHtml, index) => {
        html = html.replaceAll(`@@MDTOKEN${index}@@`, tokenHtml);
      });
      return html;
    }

    function renderMarkdownText(value) {
      const raw = String(value || '').replace(/\r\n?/g, '\n');
      if (!raw.includes('\n') && !/^\s*[-*]\s+/.test(raw) && !/```/.test(raw)) {
        return renderInlineMarkdown(raw);
      }
      const lines = raw.split('\n');
      const blocks = [];
      let paragraph = [];
      let listItems = [];
      let codeLines = [];
      let inCodeBlock = false;

      const flushParagraph = () => {
        if (!paragraph.length) return;
        blocks.push(`<p>${paragraph.map(renderInlineMarkdown).join('<br>')}</p>`);
        paragraph = [];
      };
      const flushList = () => {
        if (!listItems.length) return;
        blocks.push(`<ul>${listItems.map((item) => `<li>${renderInlineMarkdown(item)}</li>`).join('')}</ul>`);
        listItems = [];
      };
      const flushCode = () => {
        blocks.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
        codeLines = [];
      };

      lines.forEach((line) => {
        if (/^\s*```/.test(line)) {
          if (inCodeBlock) {
            flushCode();
            inCodeBlock = false;
          } else {
            flushParagraph();
            flushList();
            inCodeBlock = true;
          }
          return;
        }

        if (inCodeBlock) {
          codeLines.push(line);
          return;
        }

        const listMatch = line.match(/^\s*[-*]\s+(.+)$/);
        if (listMatch) {
          flushParagraph();
          listItems.push(listMatch[1]);
          return;
        }

        if (!line.trim()) {
          flushParagraph();
          flushList();
          return;
        }

        flushList();
        paragraph.push(line);
      });

      if (inCodeBlock) flushCode();
      flushParagraph();
      flushList();
      return `${blocks.join('')}${renderYouTubeEmbeds(raw)}`;
    }

      const entry = commandExecutionMessages.get(commandKey);
      if (!entry) return;
      window.clearTimeout(entry.timerId);

      commandExecutionMessages.delete(commandKey);

    function addCommandExecutionMessage(command, options = {}) {
      const commandKey = String(command || '').trim().toLowerCase();
      if (!commandKey) return null;

      const baseText = options.message || formatCommandExecutionMessage(commandKey, options.state || 'executed');
      const detail = options.detail ? ` ${options.detail}` : '';
      const existing = commandExecutionMessages.get(commandKey);
      const count = existing && existing.line && existing.line.isConnected ? existing.count + 1 : 1;
      const text = `${baseText}${detail}${count > 1 ? ` x${count}` : ''}`;
      const line = existing && existing.line && existing.line.isConnected
        ? existing.line
        : addMessage('system', escapeHtml(text), { commandExecution: true });

      line.textContent = text;
      line.dataset.commandExecution = commandKey;
      line.dataset.commandExecutionCount = String(count);
      window.clearTimeout(existing && existing.timerId);

      const timerId = window.setTimeout(() => {
        removeCommandExecutionMessage(commandKey);
      }, COMMAND_EXECUTION_MESSAGE_TTL_MS);

      commandExecutionMessages.set(commandKey, { line, count, timerId });
      scheduleScrollToBottom();
      return line;
    }

    function normalizeRandomPagePath(path) {
      try {
        const url = new URL(String(path || ''), window.location.origin);
        if (url.origin !== window.location.origin) return '';
        url.pathname = url.pathname.replace(/\/{2,}/g, '/');
        return `${url.pathname}${url.search}${url.hash}` || '';
      } catch (error) {
        const fallbackPath = String(path || '').trim();
        if (!fallbackPath || !fallbackPath.startsWith('/')) return '';
        return fallbackPath.replace(/\/{2,}/g, '/');
      }
    }

    function isRandomPageCandidate(path) {
      const normalized = normalizeRandomPagePath(path);
      if (!normalized) return false;

      let url;
      try {
        url = new URL(normalized, window.location.origin);
      } catch (error) {
        return false;
      }

      const pathname = url.pathname.replace(/\/{2,}/g, '/');
      if (pathname === '/' ||
        pathname === '/index.html' ||
        pathname === '/homepage.html' ||
        pathname === '/dead/stuff/stuff-for-index/thumbnail-grid/index.html' ||
        pathname === '/dead/stuff/stuff-for-index/feeds/feeds-bridge.html') {
        return false;
      }
      if (/^\/(?:nav|chat)\.html$/i.test(pathname)) return false;
      if (/^\/dead\/(?:JSON|audio|images|messages|scripts)\//i.test(pathname)) return false;
      if (/\.(?:css|js|mjs|json|map|png|jpe?g|gif|webp|svg|ico|mp3|wav|ogg|pdf|zip|md|txt)$/i.test(pathname)) return false;
      return /\/$/i.test(pathname) || /\.html$/i.test(pathname);
    }

        if (!controller || typeof controller.setSource !== 'function') return null;
        return controller;
      } catch (error) {
        return null;
      }
    }

    function normalizeRainbowSpeed(value) {
      const numeric = Number.parseFloat(String(value || '').trim());
      if (!Number.isFinite(numeric) || numeric <= 0) return 1;
      return Math.min(20, Math.max(0.05, numeric));
    }

    function requestRootRainbowFilter(arg = '') {
      const rawArg = String(arg || '').trim();
      const lowerArg = rawArg.toLowerCase();
      let active = true;
      let speed = 1;
      let toggle = false;

      if (!lowerArg) {
        toggle = true;
      } else if (lowerArg.startsWith('speed')) {
        speed = normalizeRainbowSpeed(rawArg.slice('speed'.length).trim() || '1');
      } else if (rawArg) {
        addSystemMessage('Usage: /rainbow | /rainbow speed [number]');

      if (!window.parent || window.parent === window) {

    function normalizeSiteSearchText(value) {

    function isSearchableHtmlPath(path) {
      const normalized = normalizeRandomPagePath(path);
      if (!normalized) return false;
      try {
        const url = new URL(normalized, window.location.origin);
        if (url.origin !== window.location.origin) return false;
        if (!/\.html$/i.test(url.pathname)) return false;
        if (/^\/(?:index|nav|chat)\.html$/i.test(url.pathname)) return false;
        return !/^\/dead\/(?:JSON|audio|images|messages|scripts)\//i.test(url.pathname);

    function getSiteSearchTitle(path, doc) {
      const title = doc && doc.querySelector ? normalizeSiteSearchText(doc.querySelector('title')?.textContent || '') : '';
      if (title) return title;
      const parts = String(path || '').split('/').filter(Boolean);
      return parts.at(-1) || path || 'Untitled page';
    }

    function extractVisiblePageText(html) {
      const doc = new DOMParser().parseFromString(String(html || ''), 'text/html');
      doc.querySelectorAll('script, style, noscript, template, svg, canvas, iframe, audio, video, source, track').forEach((node) => node.remove());
      doc.querySelectorAll('[hidden], [aria-hidden="true"]').forEach((node) => node.remove());
      doc.querySelectorAll('[style]').forEach((node) => {
        const style = String(node.getAttribute('style') || '').toLowerCase();
        if (/(?:display\s*:\s*none|visibility\s*:\s*hidden)/.test(style)) node.remove();
      });
      const bodyText = normalizeSiteSearchText(doc.body ? doc.body.textContent : doc.documentElement.textContent);
      return { doc, text: bodyText };
    }

    async function fetchSiteSearchDocument(path) {
      try {
        const response = await fetch(path, { cache: 'no-store' });
        if (!response.ok) return null;
        const html = await response.text();
        const extracted = extractVisiblePageText(html);
        if (!extracted.text) return null;
        return {
          path,
          title: getSiteSearchTitle(path, extracted.doc),
          text: extracted.text,
          lowerText: extracted.text.toLowerCase()
        };
      } catch (error) {
        return null;
      }
    }

    async function loadSiteSearchDocuments() {
      if (siteSearchDocuments) return siteSearchDocuments;
      if (siteSearchIndexPromise) return siteSearchIndexPromise;

      siteSearchIndexPromise = (async () => {
        const response = await fetch('/dead/JSON/repo-index.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('Unable to load repo-index.json');
        const repoIndex = await response.json();
        const itemLinks = Array.isArray(repoIndex.items)
          ? repoIndex.items.map((item) => item && (item.href || item.path || '')).filter(Boolean)
          : [];
        const paths = Array.from(new Set(itemLinks.map(normalizeRandomPagePath).filter(isSearchableHtmlPath)));
        const docs = [];
        for (let index = 0; index < paths.length; index += SITE_SEARCH_FETCH_CONCURRENCY) {
          const batch = paths.slice(index, index + SITE_SEARCH_FETCH_CONCURRENCY);
          const results = await Promise.all(batch.map(fetchSiteSearchDocument));
          results.forEach((result) => {
            if (result) docs.push(result);
          });
        }
        siteSearchDocuments = docs;
        return docs;
      })();

      try {
        return await siteSearchIndexPromise;
      } finally {
        siteSearchIndexPromise = null;
      }
    }

    function countSiteSearchMatches(text, query) {
      let count = 0;
      let index = text.indexOf(query);
      while (index !== -1) {
        count += 1;
        index = text.indexOf(query, index + query.length);
      }
      return count;
    }

    function getSiteSearchSnippet(text, lowerText, query) {
      const index = lowerText.indexOf(query);
      if (index === -1) return '';
      const start = Math.max(0, index - 72);
      const end = Math.min(text.length, index + query.length + 112);
      const prefix = start > 0 ? '...' : '';
      const suffix = end < text.length ? '...' : '';
      return normalizeSiteSearchText(`${prefix}${text.slice(start, end)}${suffix}`);
    }

    function renderSiteSearchResults(query, results, totalDocs) {
      if (!results.length) {
        addSystemMessage(`No site file matches for "${query}".`);
        return;
      }

      const items = results.map((result) => {
        const href = escapeAttribute(result.path);
        const title = escapeHtml(result.title);
        const path = escapeHtml(result.path);
        const snippet = escapeHtml(result.snippet);
        const count = result.count === 1 ? '1 match' : `${result.count} matches`;
        return `<li><a href="${href}" data-index-frame-src="${href}">${title}</a><br><code>${path}</code><br><span>${escapeHtml(count)} - ${snippet}</span></li>`;
      }).join('');
      addMessage('system', `<strong>Search Site Files: ${escapeHtml(query)}</strong><br><span>${results.length} result${results.length === 1 ? '' : 's'} from ${totalDocs} pages</span><ul>${items}</ul>`);
    }

    async function runSiteSearch(query) {
      const searchText = normalizeSiteSearchText(query);
      if (!searchText) {
        addSystemMessage('Usage: /search [search text]');
        return false;
      }

      const loadingLine = addSystemMessage('Searching site files...');
      try {
        const docs = await loadSiteSearchDocuments();
        const lowerQuery = searchText.toLowerCase();
        const results = docs.map((doc) => {
          const count = countSiteSearchMatches(doc.lowerText, lowerQuery);
          if (!count) return null;
          return {
            path: doc.path,
            title: doc.title,
            count,
            snippet: getSiteSearchSnippet(doc.text, doc.lowerText, lowerQuery)
          };
        }).filter(Boolean)
          .sort((a, b) => b.count - a.count || a.path.localeCompare(b.path))
          .slice(0, SITE_SEARCH_MAX_RESULTS);

        if (loadingLine && loadingLine.isConnected) loadingLine.remove();
        renderSiteSearchResults(searchText, results, docs.length);
        addCommandExecutionMessage('/search', { message: `/search executed: ${searchText}` });
        return true;
      } catch (error) {
        if (loadingLine && loadingLine.isConnected) loadingLine.remove();
        console.error('Unable to search site files:', error);
        addSystemMessage('Unable to search site files.', { error: true });
        return false;
      }
    }

    async function loadRandomPageCandidatesFromRepoIndex() {
      try {
        const response = await fetch('/dead/JSON/repo-index.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('repo-index unavailable');
        const repoIndex = await response.json();
        const folders = Array.isArray(repoIndex.folders) ? repoIndex.folders : [];
        const itemLinks = Array.isArray(repoIndex.items)
          ? repoIndex.items.map((item) => item && (item.href || item.path || '')).filter(Boolean)
          : [];
        return Array.from(new Set([...folders, ...itemLinks].map(normalizeRandomPagePath).filter(isRandomPageCandidate)));
      } catch (error) {
        return [];
      }
    }

    async function loadRandomIndexPageFromChat() {
      const controller = getParentIndexFrameController();
      if (!controller) {
        addSystemMessage('/random only works from the root page chat overlay.', { error: true });
        return false;
      }

      const controllerLinks = typeof controller.getLinks === 'function' ? controller.getLinks() : [];
      let candidates = Array.from(new Set((Array.isArray(controllerLinks) ? controllerLinks : [])
        .map(normalizeRandomPagePath)
        .filter(isRandomPageCandidate)));
      if (!candidates.length) {
        candidates = await loadRandomPageCandidatesFromRepoIndex();
      }
      if (!candidates.length) {
        addSystemMessage('No random pages are available.', { error: true });
        return false;
      }

      const currentPath = typeof controller.getCurrentSource === 'function'
        ? normalizeRandomPagePath(controller.getCurrentSource())
        : '';
      const available = candidates.length > 1
        ? candidates.filter((path) => path !== currentPath)
        : candidates;
      const nextPath = available[Math.floor(Math.random() * available.length)];
      controller.setSource(nextPath, { historyMode: 'push' });
      addCommandExecutionMessage('/random', { message: `/random executed: ${nextPath}` });
      return true;
    }

    function positionDvdInstance(instance, force = false) {
      if (!instance || !instance.el || !dvdOverlay) return;
      const viewportWidth = Math.max(window.innerWidth || 0, document.documentElement.clientWidth || 0, 1);
      const viewportHeight = Math.max(window.innerHeight || 0, document.documentElement.clientHeight || 0, 1);
      const logoRect = instance.el.getBoundingClientRect();
      const logoWidth = Math.max(logoRect.width || instance.el.offsetWidth || 180, 1);
      const logoHeight = Math.max(logoRect.height || instance.el.offsetHeight || Math.round(logoWidth * 0.45), 1);
      const maxX = Math.max(0, viewportWidth - logoWidth);
      const maxY = Math.max(0, viewportHeight - logoHeight);

      instance.x = Math.min(Math.max(instance.x, 0), maxX);
      instance.y = Math.min(Math.max(instance.y, 0), maxY);
      if (force) instance.initialized = true;

      instance.el.style.transform = `translate3d(${instance.x}px, ${instance.y}px, 0)`;
      instance.el.style.filter = `hue-rotate(${instance.hue}deg) drop-shadow(0 0 10px rgba(255, 255, 255, 0.28))`;
    }

    function positionAllDvdInstances(force = false) {
      dvdInstances.forEach((instance) => positionDvdInstance(instance, force));
    }

    function stepDvdAnimation(now) {
      if (!dvdEnabled || !dvdOverlay || !dvdInstances.length) {
        dvdAnimationFrameId = null;
        return;
      }

      if (!dvdLastTime) dvdLastTime = now;
      const deltaMs = Math.min(32, Math.max(0, now - dvdLastTime));
      dvdLastTime = now;

      const viewportWidth = Math.max(window.innerWidth || 0, document.documentElement.clientWidth || 0, 1);
      const viewportHeight = Math.max(window.innerHeight || 0, document.documentElement.clientHeight || 0, 1);

      dvdInstances.forEach((instance) => {
        const logoRect = instance.el.getBoundingClientRect();
        const logoWidth = Math.max(logoRect.width || instance.el.offsetWidth || 180, 1);
        const logoHeight = Math.max(logoRect.height || instance.el.offsetHeight || Math.round(logoWidth * 0.45), 1);
        const maxX = Math.max(0, viewportWidth - logoWidth);
        const maxY = Math.max(0, viewportHeight - logoHeight);

        instance.x += instance.vx * deltaMs;
        instance.y += instance.vy * deltaMs;

        if (instance.x <= 0) {
          instance.x = 0;
          instance.vx = Math.abs(instance.vx);
        } else if (instance.x >= maxX) {
          instance.x = maxX;
          instance.vx = -Math.abs(instance.vx);
        }

        if (instance.y <= 0) {
          instance.y = 0;
          instance.vy = Math.abs(instance.vy);
        } else if (instance.y >= maxY) {
          instance.y = maxY;
          instance.vy = -Math.abs(instance.vy);
        }

        instance.hue = (instance.hue + ((dvdHueShiftSpeedDegPerSecond * deltaMs) / 1000)) % 360;
        positionDvdInstance(instance);
      });

      dvdAnimationFrameId = requestAnimationFrame(stepDvdAnimation);
    }

    function startDvdAnimation() {
      if (!dvdOverlay || !dvdInstances.length) return false;
      dvdEnabled = true;
      dvdOverlay.classList.add('active');
      dvdLastTime = 0;
      positionAllDvdInstances(true);
      if (dvdAnimationFrameId === null) {
        dvdAnimationFrameId = requestAnimationFrame(stepDvdAnimation);
      }
      notifyParentDvdState();
      return true;
    }

    function createDvdInstance() {
      if (!dvdOverlay || dvdInstances.length >= dvdNormalMaxInstances) return null;

      const index = dvdInstances.length;
      const img = document.createElement('img');
      img.className = 'dvdLogo';
      img.alt = 'DVD logo';
      img.referrerPolicy = 'no-referrer';
      img.crossOrigin = 'anonymous';
      img.dataset.dvdId = `dvd-${++dvdLogoCounter}`;

      const instance = {
        id: img.dataset.dvdId,
        el: img,
        x: 24 + ((index * 37) % 320),
        y: 24 + ((index * 29) % 220),
        vx: (index % 2 === 0 ? 1 : -1) * (0.065 + (index * 0.009)),
        vy: (index % 3 === 0 ? -1 : 1) * (0.055 + (index * 0.008)),
        hue: (index * 36) % 360
      };

      img.src = dvdDefaultSource;
      img.onload = () => positionDvdInstance(instance, true);
      dvdInstances.push(instance);
      dvdOverlay.appendChild(img);
      positionDvdInstance(instance, true);
      return instance;
    }

    function spawnDvdInstance() {
      if (dvdInstances.length >= dvdNormalMaxInstances) {
        if (!dvdEnabled && dvdInstances.length) startDvdAnimation();
        return false;
      }
      const instance = createDvdInstance();
      if (!instance) return false;
      startDvdAnimation();
      return true;
    }

    function publicMessageKey(message) {
      if (!message) return '';
      return String(message.id || `${message.created_at || ''}:${message.nickname || ''}:${message.body || ''}`);
    }

    function formatPublicMessageTimestamp(value) {
      const date = new Date(value || '');
      if (Number.isNaN(date.getTime())) return '';
      return new Intl.DateTimeFormat('en-US', {
        timeZone: 'America/Toronto',
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      }).format(date);
    }

    function parsePublicChatPayload(body) {
      const raw = String(body || '');
      if (!raw.startsWith('{')) return { type: 'text', text: raw, nicknameColor: '' };
      try {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.type === PUBLIC_CHAT_IMAGE_PAYLOAD_TYPE && typeof parsed.src === 'string') {
          return {
            type: 'image',
            src: parsed.src,
            alt: typeof parsed.name === 'string' ? parsed.name : 'pasted image',
            caption: typeof parsed.caption === 'string' ? parsed.caption : '',
            nicknameColor: normalizeNicknameColor(parsed.nicknameColor || '')
          };
        }
        if (parsed && parsed.type === PUBLIC_CHAT_PIN_PAYLOAD_TYPE) {
          return {
            type: 'pin',
            text: typeof parsed.text === 'string' ? parsed.text : '',
            nicknameColor: normalizeNicknameColor(parsed.nicknameColor || '')
          };
        }
        if (parsed && parsed.type === 'theinternetisdead.publicChatText.v1') {
          return {
            type: 'text',
            text: typeof parsed.text === 'string' ? parsed.text : raw,
            nicknameColor: normalizeNicknameColor(parsed.nicknameColor || '')
          };
        }
      } catch (error) {
      }
      return { type: 'text', text: raw, nicknameColor: '' };
    }

    function renderPublicChatBody(body) {
      const payload = parsePublicChatPayload(body);
      if (payload.type !== 'image') return renderMarkdownText(payload.text);
      if (!/^data:image\/(?:png|jpe?g|webp|gif);base64,/i.test(payload.src)) {
        return escapeHtml('[unsupported image]');
      }
      const captionHtml = payload.caption ? `<div>${renderMarkdownText(payload.caption)}</div>` : '';
      return `${captionHtml}<img class="publicChatImage" src="${escapeAttribute(payload.src)}" alt="${escapeAttribute(payload.alt)}" loading="lazy" decoding="async" tabindex="0" title="Open larger image" />`;
    }

    function addPublicChatMessage(message) {
      const key = publicMessageKey(message);
      if (!key || renderedPublicMessageKeys.has(key)) return;
      renderedPublicMessageKeys.add(key);
      const createdAt = String(message.created_at || '');
      if (createdAt && (!latestPublicMessageCreatedAt || createdAt > latestPublicMessageCreatedAt)) {
        latestPublicMessageCreatedAt = createdAt;
      }
      const payload = parsePublicChatPayload(message.body || '');
      if (payload.type === 'pin') {
        upsertPinnedMessage(payload.text, message.nickname || 'Anonymous');
        return;
      }
      const timestamp = escapeHtml(formatPublicMessageTimestamp(message.created_at));
      const timestampHtml = timestamp ? `<span class="messageTimestamp">${timestamp}</span>` : '';
      const rawNickname = message.nickname || 'Anonymous';
      const nickname = escapeHtml(rawNickname);
      const nicknameColor = normalizeNicknameColor(payload.nicknameColor || '');
      const reservedNickname = isReservedNickname(rawNickname);
      const nicknameClass = reservedNickname ? ' class="reservedNickname"' : '';
      const nicknameStyle = !reservedNickname && nicknameColor ? ` style="color:${escapeAttribute(nicknameColor)}"` : '';
      const body = renderPublicChatBody(message.body || '');
      const line = addMessage('public', `${timestampHtml}<strong${nicknameClass}${nicknameStyle}>${nickname}:</strong> ${body}`, { publicMessage: true });
      line.dataset.publicMessageKey = key;
      trimRenderedPublicMessages();
    }

    function trimRenderedPublicMessages() {
      const publicLines = Array.from(messages.querySelectorAll('[data-live-chat-message="true"]'));
      while (publicLines.length > SUPABASE_CHAT_MAX_VISIBLE) {
        const line = publicLines.shift();
        if (!line) break;
        renderedPublicMessageKeys.delete(line.dataset.publicMessageKey || '');
        line.remove();
      }
    }

    async function supabaseRequest(path, options = {}) {
      const headers = {
        apikey: SUPABASE_PUBLISHABLE_KEY,
        Authorization: `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
        ...(options.headers || {})
      };
      const response = await fetch(`${SUPABASE_PROJECT_URL}${path}`, { ...options, headers });
      if (!response.ok) {
        const text = await response.text().catch(() => '');
        throw new Error(text || `Request failed with ${response.status}`);
      }
      if (response.status === 204) return null;
      return response.json();
    }

    function buildPublicMessagesPath(options = {}) {
      const params = new URLSearchParams();
      params.set('room', `eq.${SUPABASE_CHAT_ROOM}`);
      params.set('select', 'id,room,nickname,body,created_at');
      if (options.since) params.set('created_at', `gt.${options.since}`);
      params.set('order', options.ascending ? 'created_at.asc' : 'created_at.desc');
      params.set('limit', String(options.limit || PUBLIC_CHAT_FETCH_LIMIT));
      return `/rest/v1/${SUPABASE_CHAT_TABLE}?${params.toString()}`;
    }

    async function loadRecentPublicMessages(options = {}) {
      if (publicChatRefreshInFlight) return false;
      publicChatRefreshInFlight = true;
      try {
        const incremental = options.incremental && latestPublicMessageCreatedAt;
        const rows = await supabaseRequest(buildPublicMessagesPath({
          since: incremental ? latestPublicMessageCreatedAt : '',
          ascending: !!incremental,
          limit: incremental ? SUPABASE_CHAT_MAX_VISIBLE : PUBLIC_CHAT_FETCH_LIMIT
        }));
        if (Array.isArray(rows) && rows.length > SUPABASE_CHAT_MAX_VISIBLE) {
          prunePublicChatHistory();
        }
        const orderedRows = Array.isArray(rows)
          ? (incremental ? rows : rows.slice(0, SUPABASE_CHAT_MAX_VISIBLE).reverse())
          : [];
        if (!incremental) {
          const nextKeys = new Set(orderedRows.map(publicMessageKey).filter(Boolean));
          const hasPinnedRow = orderedRows.some((row) => parsePublicChatPayload(row && row.body || '').type === 'pin');
          if (!hasPinnedRow) removePinnedMessage();
          Array.from(messages.querySelectorAll('[data-live-chat-message="true"]')).forEach((line) => {
            const key = line.dataset.publicMessageKey || '';
            if (!nextKeys.has(key)) {
              line.remove();
              renderedPublicMessageKeys.delete(key);
            }
          });
        }
        orderedRows.forEach(addPublicChatMessage);
        trimRenderedPublicMessages();
        return true;
      } catch (error) {
        console.warn('Unable to load public chat:', error);
        return false;
      } finally {
        publicChatRefreshInFlight = false;
      }
    }

    async function prunePublicChatHistory(options = {}) {
      if (publicChatPruneInFlight) return false;
      const now = Date.now();
      if (!options.force && now - lastPublicChatPruneAttemptMs < PUBLIC_CHAT_PRUNE_RETRY_MS) return false;
      lastPublicChatPruneAttemptMs = now;
      publicChatPruneInFlight = true;
      try {
        await supabaseRequest('/functions/v1/clear-chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'prune',
            room: SUPABASE_CHAT_ROOM,
            maxMessages: SUPABASE_CHAT_MAX_VISIBLE
          })
        });
        return true;
      } catch (error) {
        console.warn('Unable to prune public chat history:', error);
        return false;
      } finally {
        publicChatPruneInFlight = false;
      }
    }

    function createPublicTextBody(text) {
      const body = String(text || '');
      if (!currentNicknameColor) return body;
      return JSON.stringify({
        type: 'theinternetisdead.publicChatText.v1',
        text: body,
        nicknameColor: currentNicknameColor
      });
    }

    function createPublicPinBody(text) {
      return JSON.stringify({
        type: PUBLIC_CHAT_PIN_PAYLOAD_TYPE,
        text: String(text || ''),
        nicknameColor: currentNicknameColor
      });
    }

    async function insertPublicChatBody(body) {
      const nickname = normalizeNickname(currentNickname);
      currentNickname = nickname;
      const rows = await supabaseRequest(`/rest/v1/${SUPABASE_CHAT_TABLE}?select=id,room,nickname,body,created_at`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Prefer: 'return=representation'
        },
        body: JSON.stringify({ room: SUPABASE_CHAT_ROOM, nickname, body: createPublicTextBody(body) })
      });
      const [message] = Array.isArray(rows) ? rows : [];
      if (message) addPublicChatMessage(message);
      await prunePublicChatHistory({ force: true });
      return true;
    }

    async function insertPublicPinnedMessage(text) {
      const pinnedText = String(text || '').trim();
      if (!pinnedText) {
        addSystemMessage('Usage: /pin [text]');
        return false;
      }
      if (pinnedText.length > 500) {
        addSystemMessage('Pinned message is too long. Keep it to 500 characters.', { error: true });
        return false;
      }
      const nickname = normalizeNickname(currentNickname);
      currentNickname = nickname;
      const rows = await supabaseRequest(`/rest/v1/${SUPABASE_CHAT_TABLE}?select=id,room,nickname,body,created_at`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Prefer: 'return=representation'
        },
        body: JSON.stringify({ room: SUPABASE_CHAT_ROOM, nickname, body: createPublicPinBody(pinnedText) })
      });
      const [message] = Array.isArray(rows) ? rows : [];
      if (message) addPublicChatMessage(message);
      await prunePublicChatHistory({ force: true });
      return true;
    }

    async function insertPublicChatImageBody(imageBody) {
      const nickname = normalizeNickname(currentNickname);
      currentNickname = nickname;
      const result = await supabaseRequest('/functions/v1/clear-chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'insert_image',
          room: SUPABASE_CHAT_ROOM,
          nickname,
          imageBody
        })
      });
      if (result && result.message) addPublicChatMessage(result.message);
      await prunePublicChatHistory({ force: true });
      return true;
    }

    async function sendPublicMessage(rawBody) {
      const body = String(rawBody || '').trim();
      if (!body) return false;
      if (body.length > 500) {
        addSystemMessage('Message is too long. Keep public chat messages to 500 characters.', { error: true });
        return false;
      }
      try {
        return await insertPublicChatBody(body);
      } catch (error) {
        console.error('Unable to send public chat message:', error);
        addSystemMessage('Unable to send public chat message.', { error: true });
        return false;
      }
    }

    function readImageElement(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error('Unable to read pasted image.'));
        image.src = src;
      });
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ''));
        reader.onerror = () => reject(new Error('Unable to read pasted image.'));
        reader.readAsDataURL(file);
      });
    }

    async function createImageDataUrl(file) {
      if (!file || !String(file.type || '').startsWith('image/')) {
        throw new Error('Paste an image file.');
      }
      if (file.size > PUBLIC_CHAT_IMAGE_MAX_SOURCE_BYTES) {
        throw new Error('Image is too large. Keep pasted images under 5 MB.');
      }

      const sourceDataUrl = await readFileAsDataUrl(file);
      const image = await readImageElement(sourceDataUrl);
      const scale = Math.min(1, PUBLIC_CHAT_IMAGE_MAX_DIMENSION / Math.max(image.naturalWidth || 1, image.naturalHeight || 1));
      const width = Math.max(1, Math.round((image.naturalWidth || 1) * scale));
      const height = Math.max(1, Math.round((image.naturalHeight || 1) * scale));
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext('2d');
      if (!context) throw new Error('Unable to process pasted image.');
      context.drawImage(image, 0, 0, width, height);

      const qualities = [0.76, 0.66, 0.56, 0.46];
      for (const quality of qualities) {
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        if (dataUrl.length <= PUBLIC_CHAT_IMAGE_MAX_BODY_CHARS) return dataUrl;
      }
      throw new Error('Image is too large after compression.');
    }

    async function sendPublicImage(file) {
      try {
        addSystemMessage('Uploading pasted image...');
        const src = await createImageDataUrl(file);
        const payload = JSON.stringify({
          type: PUBLIC_CHAT_IMAGE_PAYLOAD_TYPE,
          name: file.name || 'pasted image',
          mime: 'image/jpeg',
          src,
          nicknameColor: currentNicknameColor
        });
        if (payload.length > PUBLIC_CHAT_IMAGE_MAX_BODY_CHARS + 512) {
          throw new Error('Image payload is too large.');
        }
        await insertPublicChatImageBody(payload);
      } catch (error) {
        console.error('Unable to send pasted image:', error);
        addSystemMessage(error && error.message ? error.message : 'Unable to send pasted image.', { error: true });
      }
    }

    async function clearPublicChatHistory(password) {
      const adminPassword = String(password || '');
      if (!adminPassword) {
        addSystemMessage('Usage: /clear_public [admin password]');
        return true;
      }
      try {
        await supabaseRequest('/functions/v1/clear-chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: adminPassword, room: SUPABASE_CHAT_ROOM })
        });
        Array.from(messages.querySelectorAll('[data-live-chat-message="true"]')).forEach((line) => line.remove());
        removePinnedMessage();
        renderedPublicMessageKeys.clear();
        latestPublicMessageCreatedAt = '';
        addSystemMessage('Public chat history cleared.');
        loadRecentPublicMessages();
        return true;
      } catch (error) {
        console.error('Unable to clear public chat history:', error);
        addSystemMessage('Unable to clear public chat history.', { error: true });
        return false;
      }
    }

    async function verifyAdminPassword(password) {
      try {
        await supabaseRequest('/functions/v1/clear-chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'verify_admin_password',
            password: String(password || ''),
            room: SUPABASE_CHAT_ROOM
          })
        });
        return true;
      } catch (error) {
        return false;
      }
    }

    function setReservedNicknamePasswordMode(nickname) {
      pendingReservedNickname = normalizeNickname(nickname);
      previousChatInputPlaceholder = chatInput.getAttribute('placeholder') || previousChatInputPlaceholder;
      chatInput.value = '';
      chatInput.type = 'password';
      chatInput.placeholder = 'Enter password:';
      hideSuggestions();
      if (pendingReservedNicknamePromptLine && pendingReservedNicknamePromptLine.isConnected) {
        pendingReservedNicknamePromptLine.textContent = 'Reserved nickname. Enter password:';
      } else {
        pendingReservedNicknamePromptLine = addSystemMessage('Reserved nickname. Enter password:');
      }
      chatInput.focus();
    }

    function clearReservedNicknamePasswordMode() {
      pendingReservedNickname = '';
      chatInput.type = 'text';
      chatInput.placeholder = previousChatInputPlaceholder || 'Press here to chat or / for commands...';
      chatInput.value = '';
    }

    function removeReservedNicknamePromptLine() {
      if (pendingReservedNicknamePromptLine && pendingReservedNicknamePromptLine.isConnected) {
        pendingReservedNicknamePromptLine.remove();
      }
      pendingReservedNicknamePromptLine = null;
    }

    async function handleReservedNicknamePassword(password) {
      const nickname = pendingReservedNickname;
      if (!nickname) return false;
      const ok = await verifyAdminPassword(password);
      if (!ok) {
        clearReservedNicknamePasswordMode();
        addSystemMessage('Incorrect password. Nickname unchanged.', { error: true });
        return true;
      }
      currentNickname = normalizeNickname(nickname);
      saveNickname(currentNickname);
      clearReservedNicknamePasswordMode();
      removeReservedNicknamePromptLine();
      addCommandExecutionMessage('/nickname', {
        message: formatCommandExecutionMessage('/nickname', 'executed', currentNickname)
      });
      return true;
    }

    function setClearPublicPasswordMode() {
      pendingClearPublicPassword = true;
      previousChatInputPlaceholder = chatInput.getAttribute('placeholder') || previousChatInputPlaceholder;
      chatInput.value = '';
      chatInput.type = 'password';
      chatInput.placeholder = 'Enter password:';
      hideSuggestions();
      if (pendingClearPublicPromptLine && pendingClearPublicPromptLine.isConnected) {
        pendingClearPublicPromptLine.textContent = 'Enter password:';
      } else {
        pendingClearPublicPromptLine = addSystemMessage('Enter password:');
      }
      chatInput.focus();
    }

    function clearClearPublicPasswordMode() {
      pendingClearPublicPassword = false;
      chatInput.type = 'text';
      chatInput.placeholder = previousChatInputPlaceholder || 'Press here to chat or / for commands...';
      chatInput.value = '';
    }

    function removeClearPublicPromptLine() {
      if (pendingClearPublicPromptLine && pendingClearPublicPromptLine.isConnected) {
        pendingClearPublicPromptLine.remove();
      }
      pendingClearPublicPromptLine = null;
    }

    async function handleClearPublicPassword(password) {
      const ok = await clearPublicChatHistory(password);
      clearClearPublicPasswordMode();
      if (ok) removeClearPublicPromptLine();
      return true;
    }

    function setNicknameColorPromptMode() {
      pendingNicknameColor = true;
      previousChatInputPlaceholder = chatInput.getAttribute('placeholder') || previousChatInputPlaceholder;
      chatInput.value = '';
      chatInput.type = 'text';
      chatInput.placeholder = 'Enter color:';
      hideSuggestions();
      const promptText = 'Type a color name, hex code, or rgba value.';
      if (pendingNicknameColorPromptLine && pendingNicknameColorPromptLine.isConnected) {
        pendingNicknameColorPromptLine.textContent = promptText;
      } else {
        pendingNicknameColorPromptLine = addSystemMessage(promptText);
      }
      chatInput.focus();
    }

    function clearNicknameColorPromptMode() {
      pendingNicknameColor = false;
      chatInput.type = 'text';
      chatInput.placeholder = previousChatInputPlaceholder || 'Press here to chat or / for commands...';
      chatInput.value = '';
    }

    function removeNicknameColorPromptLine() {
      if (pendingNicknameColorPromptLine && pendingNicknameColorPromptLine.isConnected) {
        pendingNicknameColorPromptLine.remove();
      }
      pendingNicknameColorPromptLine = null;
    }

    function setSiteSearchPromptMode() {
      pendingSiteSearch = true;
      previousChatInputPlaceholder = chatInput.getAttribute('placeholder') || previousChatInputPlaceholder;
      chatInput.value = '';
      chatInput.type = 'text';
      chatInput.placeholder = 'Search Site Files:';
      hideSuggestions();
      if (pendingSiteSearchPromptLine && pendingSiteSearchPromptLine.isConnected) {
        pendingSiteSearchPromptLine.textContent = 'Search Site Files:';
      } else {
        pendingSiteSearchPromptLine = addSystemMessage('Search Site Files:');
      }
      chatInput.focus();
    }

    function clearSiteSearchPromptMode() {
      pendingSiteSearch = false;
      chatInput.type = 'text';
      chatInput.placeholder = previousChatInputPlaceholder || 'Press here to chat or / for commands...';
      chatInput.value = '';
    }

    function removeSiteSearchPromptLine() {
      if (pendingSiteSearchPromptLine && pendingSiteSearchPromptLine.isConnected) {
        pendingSiteSearchPromptLine.remove();
      }
      pendingSiteSearchPromptLine = null;
    }

    async function handleSiteSearchInput(value) {
      clearSiteSearchPromptMode();
      removeSiteSearchPromptLine();
      await runSiteSearch(value);
      return true;
    }

    function applyNicknameColor(value) {
      const nextColor = normalizeNicknameColor(value);
      if (!value || !nextColor) {
        addSystemMessage('Usage: /nickname color [color name, hex code, or rgba value]');
        return false;
      }
      currentNicknameColor = saveNicknameColor(nextColor);
      addCommandExecutionMessage('/nickname', {
        message: `/nickname color executed: ${currentNicknameColor}`
      });
      return true;
    }

    function handleNicknameColorInput(value) {
      const applied = applyNicknameColor(value);
      clearNicknameColorPromptMode();
      if (applied) removeNicknameColorPromptLine();
      return true;
    }

    async function handleCommand(raw) {
      const trimmed = String(raw || '').trim();
      const [commandToken = ''] = trimmed.split(/\s+/);
      const command = commandToken.toLowerCase();
      const arg = trimmed.slice(commandToken.length).trim();
      if (arg.toLowerCase() === '-help') {
        return showCommandUsage(command);
      }

      if (command === '/nickname') {
        const lowerArg = arg.toLowerCase();
        if (lowerArg === 'reset') {
          currentNickname = generateAnonymousNickname();
          saveNickname('');
          addCommandExecutionMessage('/nickname', {
            message: `/nickname reset: ${currentNickname}`
          });
          return true;
        }
        if (lowerArg === 'color reset' || lowerArg === 'color clear') {
          currentNicknameColor = saveNicknameColor('');
          addCommandExecutionMessage('/nickname', { message: '/nickname color reset' });
          return true;
        }
        if (lowerArg.startsWith('color')) {
          const colorValue = arg.slice('color'.length).trim();
          if (!colorValue) {
            setNicknameColorPromptMode();
            return true;
          }
          applyNicknameColor(colorValue);
          return true;
        }
        if (!arg) {
          addSystemMessage('Usage: /nickname [name]');
          return true;
        }
        if (arg.length > 40) {
          addSystemMessage('Nickname is too long. Keep it to 40 characters.', { error: true });
          return true;
        }
        if (isReservedNickname(arg)) {
          setReservedNicknamePasswordMode(arg);
          return true;
        }
        currentNickname = normalizeNickname(arg);
        saveNickname(currentNickname);
        addCommandExecutionMessage('/nickname', {
          message: formatCommandExecutionMessage('/nickname', 'executed', currentNickname)
        });
        return true;
      }

      if (command === '/help') {
        addCommandExecutionMessage('/help');
        addMessage('system', createHelpHtml());
        return true;
      }

      if (command === '/clear') {
        clearLocalChatCommand();
        return true;
      }

      if (command === '/clear_public') {
        if (!arg) {
          setClearPublicPasswordMode();
          return true;
        }
        await clearPublicChatHistory(arg);
        return true;
      }

      if (command === '/pin') {
        if (!isReservedNickname(currentNickname)) {
          addSystemMessage('/pin is reserved.', { error: true });
          return true;
        }
        if (await insertPublicPinnedMessage(arg)) {
          addCommandExecutionMessage('/pin');
        }
        return true;
      }

      if (command === '/random') {
        await loadRandomIndexPageFromChat();
        return true;
      }

      if (command === '/rainbow') {
        requestRootRainbowFilter(arg);
        return true;
      }

      if (command === '/refresh') {
        refreshEntirePage();
        return true;
      }

      if (command === '/search') {
        if (!arg) {
          setSiteSearchPromptMode();
          return true;
        }
        await runSiteSearch(arg);
        return true;
      }

      if (command === '/dvd') {
        const nextAttempt = dvdCommandAttemptCount + 1;
        dvdCommandAttemptCount = nextAttempt;
        const spawned = spawnDvdInstance();
        const countLabel = `(${Math.min(dvdInstances.length, dvdNormalMaxInstances)}/${dvdNormalMaxInstances}${spawned ? '' : ' MAX'})`;
        addCommandExecutionMessage('/dvd', { detail: countLabel });
        return true;
      }

      if (command === '/exit') {
        addCommandExecutionMessage('/exit');
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'pageExit' }, '*');
        } else {
          renderFatalExitScreen();
        }
        return true;
      }

      return false;
    }

    async function submitInput() {
      const raw = chatInput.value;
      const trimmed = raw.trim();
      if (!trimmed) return;
      chatInput.value = '';
      hideSuggestions();
      if (pendingReservedNickname) {
        await handleReservedNicknamePassword(trimmed);
        return;
      }
      if (pendingClearPublicPassword) {
        await handleClearPublicPassword(trimmed);
        return;
      }
      if (pendingNicknameColor) {
        handleNicknameColorInput(trimmed);
        return;
      }
      if (pendingSiteSearch) {
        await handleSiteSearchInput(trimmed);
        return;
      }
      if (trimmed.startsWith('/')) {
        const handled = await handleCommand(trimmed);
        if (!handled) addSystemMessage(`${trimmed.split(/\s+/)[0]} is not a known command`, { error: true });
        return;
      }
      await sendPublicMessage(trimmed);
    }

    function matchingCommands() {
      const value = chatInput.value;
      if (!value.startsWith('/')) return [];
      const token = value.split(/\s+/)[0].toLowerCase();
      return visibleCommands.filter((command) => command.name.startsWith(token));
    }

    function hideSuggestions() {
      suggestions.classList.remove('visible');
      suggestions.setAttribute('aria-hidden', 'true');
      suggestions.innerHTML = '';
      suggestionIndex = -1;
    }

    function renderSuggestions() {
      const matches = matchingCommands();
      if (!matches.length) {
        hideSuggestions();
        return;
      }
      suggestions.innerHTML = '';
      matches.forEach((command, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = index === suggestionIndex ? 'suggestion active' : 'suggestion';
        button.textContent = command.name;
        button.addEventListener('mousedown', (event) => {
          event.preventDefault();
          applyCommand(command);
        });
        suggestions.appendChild(button);
      });
      suggestions.classList.add('visible');
      suggestions.setAttribute('aria-hidden', 'false');
    }

    function applyCommand(command) {
      chatInput.value = command.value || command.name;
      chatInput.focus();
      chatInput.selectionStart = chatInput.selectionEnd = chatInput.value.length;
      hideSuggestions();
      if (command.execute) submitInput();
    }

    function cycleSuggestion(direction) {
      const matches = matchingCommands();
      if (!matches.length) return false;
      suggestionIndex = (suggestionIndex + direction + matches.length) % matches.length;
      const selected = matches[suggestionIndex];
      chatInput.value = selected.value || selected.name;
      chatInput.selectionStart = chatInput.selectionEnd = chatInput.value.length;
      renderSuggestions();
      return true;
    }

    function setOpen(open, focus = true) {
      document.body.classList.toggle('chat-open', !!open);
      if (!open && pendingReservedNickname) clearReservedNicknamePasswordMode();
      if (!open && pendingClearPublicPassword) clearClearPublicPasswordMode();
      if (!open && pendingNicknameColor) clearNicknameColorPromptMode();
      if (!open && pendingSiteSearch) clearSiteSearchPromptMode();
      notifyState();
      if (open && focus) requestAnimationFrame(() => chatInput.focus());
    }

    function setPreview(visible, progress = 0) {
      document.body.classList.toggle('chat-preview', !!visible);
      document.body.style.setProperty('--preview-opacity', String(Math.max(0.25, Math.min(1, Number(progress) || 0.45))));
    }

    function notifyState() {
      if (!window.parent || window.parent === window) return;
      window.parent.postMessage({
        type: 'chatSandboxState',
        visible: document.body.classList.contains('chat-open'),
        valuePickerActive: false,
        valuePickerCommand: ''
      }, '*');
    }

    inputWrap.addEventListener('submit', (event) => {
      event.preventDefault();
      submitInput();
    });

    chatInput.addEventListener('input', renderSuggestions);

    chatCloseButton.addEventListener('click', () => {
      setOpen(false, false);
    });

    chatInput.addEventListener('paste', (event) => {
      const items = Array.from(event.clipboardData && event.clipboardData.items ? event.clipboardData.items : []);
      const imageItem = items.find((item) => item && item.kind === 'file' && String(item.type || '').startsWith('image/'));
      if (!imageItem) return;
      const file = imageItem.getAsFile();
      if (!file) return;
      event.preventDefault();
      sendPublicImage(file);
    });

    chatInput.addEventListener('keydown', (event) => {
      if (event.key === 'Tab' && chatInput.value.startsWith('/')) {
        event.preventDefault();
        cycleSuggestion(event.shiftKey ? -1 : 1);
        return;
      }
      if (event.key === 'Escape') {
        event.preventDefault();
        if (pendingReservedNickname) clearReservedNicknamePasswordMode();
        if (pendingClearPublicPassword) clearClearPublicPasswordMode();
        if (pendingNicknameColor) clearNicknameColorPromptMode();
        if (pendingSiteSearch) clearSiteSearchPromptMode();
        setOpen(false, false);
      }
    });

    messages.addEventListener('click', (event) => {
      const frameLink = event.target && event.target.closest ? event.target.closest('a[data-index-frame-src]') : null;
      if (frameLink) {
        const framePath = String(frameLink.dataset.indexFrameSrc || '').trim();
        const controller = getParentIndexFrameController();
        if (framePath && controller) {
          event.preventDefault();
          controller.setSource(framePath, { historyMode: 'push' });
          setOpen(false, false);
          return;
        }
      }

      const item = event.target && event.target.closest ? event.target.closest('.helpItem[data-command]') : null;
      if (!item) return;
      event.preventDefault();
      const command = commandByName.get(item.dataset.command || '');
      if (command) applyCommand(command);
    });

    window.addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.type === 'chatSandboxOpen') {
        setOpen(true, data.focus !== false);
        if (data.seedSlash) {
          chatInput.value = '/';
          renderSuggestions();
        }
        return;
      }
      if (data.type === 'chatSandboxClose') {
        setOpen(false, false);
        return;
      }
      if (data.type === 'chatSandboxPreview') {
        setPreview(!!data.visible, data.progress);
        return;
      }
      if (data.type === 'chatSandboxExecuteCommand') {
        const rawCommand = typeof data.command === 'string' ? data.command.trim() : '';
        if (!rawCommand) return;
        if (data.openChat) setOpen(true, data.focus !== false);
        handleCommand(rawCommand).then((ok) => {
          if (!ok && rawCommand.startsWith('/')) addSystemMessage(`${rawCommand.split(/\s+/)[0]} is not a known command`, { error: true });
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'chatSandboxCommandResult', ok: !!ok, command: rawCommand, commandId: data.commandId || '' }, '*');
          }
        });
        return;
      }
      if (data.type === 'pageChatResult') {
        if (data.announce) {
          const commandName = String(data.command || '').trim() || '/command';
          const message = String(data.message || '').trim();
          addCommandExecutionMessage(commandName, { message: message || `${commandName} executed` });
        }
        return;
      }
      if (data.type === 'pageChatRegister') {
        return;
      }
    });

    if (window.parent && window.parent !== window) {
      document.documentElement.classList.add('embedded');
      document.body.classList.add('embedded');
    } else {
      setOpen(true, false);
    }

    welcomeMessageLine = addSystemMessage('System: Welcome to chat. Type /help for commands.');
    loadRecentPublicMessages();
    window.setInterval(() => {
      if (!document.hidden) loadRecentPublicMessages({ incremental: true });
    }, PUBLIC_CHAT_REFRESH_MS);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) loadRecentPublicMessages({ incremental: true });
    });
    window.addEventListener('resize', () => positionAllDvdInstances(true));
    notifyState();
  </script>
</body>
</html>
