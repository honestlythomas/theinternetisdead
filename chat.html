<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      color: var(--chat-primary);
      font-family: "Courier New", Courier, monospace;
      overflow: hidden;
    }

    body {
      --chat-primary-rgb: 0, 255, 102;
      --chat-primary: rgb(var(--chat-primary-rgb));
      --chat-bg: rgba(0, 0, 0, 0.82);
      --chat-border: rgba(var(--chat-primary-rgb), 0.42);
      --chat-text: var(--chat-primary);
      --chat-muted: rgba(var(--chat-primary-rgb), 0.72);
      --chat-danger: #ff5577;
    }

    body[data-chat-mode="all"] { --chat-primary-rgb: 0, 255, 102; }
    body[data-chat-mode="public"] { --chat-primary-rgb: 0, 102, 255; }
    body[data-chat-mode="ai"] { --chat-primary-rgb: 255, 0, 0; }
    body[data-chat-mode="local"] { --chat-primary-rgb: 255, 255, 0; }
    body[data-chat-mode="system"] { --chat-primary-rgb: 255, 0, 255; }

    #chatSurface {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      pointer-events: none;
      z-index: 3;
    }

    #chatDimLayer {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.46);
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease;
      z-index: 1;
    }

    body.chat-open #chatDimLayer {
      opacity: 1;
    }

    #chatPanel {
      width: 100%;
      height: 100%;
      max-height: none;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px;
      box-sizing: border-box;
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 160ms ease, transform 160ms ease;
      pointer-events: none;
    }

    body.chat-open #chatPanel,
    body.chat-preview #chatPanel {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    body.chat-preview:not(.chat-open) #chatPanel {
      opacity: var(--preview-opacity, 0.45);
    }

    #messages {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 6px;
      max-height: none;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    #messages::-webkit-scrollbar {
      display: none;
    }

    #messages::before {
      content: "";
      margin-top: auto;
    }

    .message {
      width: fit-content;
      max-width: min(920px, calc(100vw - 32px));
      align-self: flex-start;
      flex-shrink: 0;
      padding: 7px 9px;
      border: 1px solid var(--chat-border);
      background: var(--chat-bg);
      color: var(--chat-text);
      text-shadow: 0 0 6px rgba(var(--chat-primary-rgb), 0.28);
      line-height: 1.35;
      overflow-wrap: anywhere;
      box-shadow: 0 0 18px rgba(var(--chat-primary-rgb), 0.08);
    }

    .message[data-role="user"] {
      border-color: rgba(var(--chat-primary-rgb), 0.58);
      color: var(--chat-text);
      text-shadow: 0 0 6px rgba(var(--chat-primary-rgb), 0.25);
    }

    .message[data-role="system"] { color: var(--chat-muted); }

    .message a,
    .message a:visited {
      color: #ffffff;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .message p {
      margin: 0;
    }

    .message p + p,
    .message ul + p,
    .message pre + p {
      margin-top: 7px;
    }

    .message ul {
      margin: 4px 0 0 18px;
      padding: 0;
    }

    .message li {
      margin: 2px 0;
    }

    .message code {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
      padding: 1px 4px;
      border-radius: 3px;
      text-shadow: none;
    }

    .message pre {
      margin: 4px 0 0;
      max-width: min(720px, calc(100vw - 70px));
      overflow: auto;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.48);
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 8px;
      text-shadow: none;
      white-space: pre;
    }

    .message pre code {
      display: block;
      padding: 0;
      background: transparent;
    }

    .publicChatImage {
      display: block;
      max-width: min(420px, calc(100vw - 70px));
      max-height: 320px;
      width: auto;
      height: auto;
      margin-top: 6px;
      border: 1px solid rgba(255, 255, 255, 0.34);
      background: rgba(0, 0, 0, 0.35);
      object-fit: contain;
      cursor: zoom-in;
    }

    .publicChatImage:hover,
    .publicChatImage:focus-visible {
      outline: 1px solid rgba(255, 255, 255, 0.62);
      filter: brightness(1.08);
    }

    .publicChatYoutube {
      display: block;
      width: min(420px, calc(100vw - 70px));
      max-width: 100%;
      margin-top: 6px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.34);
      background: rgba(0, 0, 0, 0.52);
      color: #ffffff;
      box-shadow: 0 0 18px rgba(255, 0, 120, 0.12), 0 0 20px rgba(var(--chat-primary-rgb), 0.08);
      overflow: hidden;
    }

    .publicChatYoutubeFrame {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      height: auto;
      border: 0;
      background: rgba(0, 0, 0, 0.72);
    }

    .publicChatYoutubeThumbWrap {
      position: relative;
      display: block;
      aspect-ratio: 16 / 9;
      background: rgba(0, 0, 0, 0.72);
    }

    .publicChatYoutubeThumb {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .publicChatYoutubePlay {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      width: 62px;
      height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.66);
      border-radius: 10px;
      background: rgba(255, 0, 80, 0.72);
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.45);
      box-shadow: 0 0 26px rgba(255, 0, 80, 0.35);
    }

    .publicChatYoutubeLabel {
      display: block;
      padding: 7px 9px;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.64);
      overflow-wrap: anywhere;
      text-shadow: 0 0 6px rgba(var(--chat-primary-rgb), 0.22);
    }

    #chatLightbox {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 22px;
      box-sizing: border-box;
      background:
        radial-gradient(circle at 50% 50%, rgba(81, 42, 103, 0.38), transparent 58%),
        rgba(0, 0, 0, 0.84);
      pointer-events: none;
    }

    #chatLightbox.active {
      display: flex;
      pointer-events: auto;
    }

    #chatLightboxImage {
      display: block;
      max-width: min(96vw, 1400px);
      max-height: 90vh;
      width: auto;
      height: auto;
      border: 1px solid rgba(var(--chat-primary-rgb), 0.54);
      background: rgba(0, 0, 0, 0.72);
      box-shadow: 0 0 32px rgba(var(--chat-primary-rgb), 0.18), 0 0 90px rgba(81, 42, 103, 0.34);
      object-fit: contain;
      cursor: zoom-out;
    }

    #chatLightboxFrame {
      display: none;
      width: min(96vw, 1400px);
      height: min(54vw, 78vh);
      max-height: 78vh;
      aspect-ratio: 16 / 9;
      border: 1px solid rgba(var(--chat-primary-rgb), 0.54);
      background: rgba(0, 0, 0, 0.9);
      box-shadow: 0 0 32px rgba(var(--chat-primary-rgb), 0.18), 0 0 90px rgba(81, 42, 103, 0.34);
    }

    #chatLightbox[data-lightbox-kind="video"] #chatLightboxImage {
      display: none;
    }

    #chatLightbox[data-lightbox-kind="video"] #chatLightboxFrame {
      display: block;
    }

    #chatLightbox[data-lightbox-kind="image"] #chatLightboxFrame {
      display: none;
    }

    #chatLightboxClose {
      position: fixed;
      top: 14px;
      right: 16px;
      border: 1px solid rgba(255, 85, 119, 0.5);
      background: rgba(0, 0, 0, 0.76);
      color: #ff5577;
      font: inherit;
      line-height: 1;
      padding: 7px 9px;
      cursor: pointer;
      text-shadow: 0 0 8px rgba(255, 85, 119, 0.38);
    }

    #chatLightboxClose:hover,
    #chatLightboxClose:focus-visible {
      outline: none;
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.62);
    }

    .messageTimestamp {
      color: #ffffff;
      font-size: 12px;
      line-height: 1;
      margin-right: 6px;
      text-shadow: none;
      white-space: nowrap;
    }

    .reservedNickname {
      background: linear-gradient(90deg, #ff5577, #ff9f43, #ffe66d, var(--chat-primary), #7bd2ff, #c792ea, #ff7ac8, #ff5577);
      background-size: 220% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: reserved-nickname-rainbow 2.2s linear infinite;
      text-shadow: none;
    }

    @keyframes reserved-nickname-rainbow {
      from { background-position: 0% 50%; }
      to { background-position: 220% 50%; }
    }

    .message[data-error="true"] {
      color: var(--chat-danger);
      border-color: rgba(255, 85, 119, 0.5);
      text-shadow: 0 0 6px rgba(255, 85, 119, 0.25);
    }

    .message[data-pinned-message="true"] {
      border-color: rgba(255, 255, 255, 0.52);
      color: #ffffff;
      background: rgba(0, 0, 0, 0.66);
      box-shadow: 0 0 22px rgba(255, 255, 255, 0.12);
    }

    .helpList { display: grid; gap: 4px; margin-top: 4px; }

    .helpItem {
      color: inherit;
      text-decoration: none;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px;
      align-items: baseline;
    }

    .helpItem:hover,
    .helpItem:focus-visible { outline: none; color: #ffffff; }
    .helpCommandName { color: #ffffff; font-weight: 700; }
    .helpCommandDesc { color: var(--chat-muted); }

    #inputWrap {
      position: relative;
      display: grid;
      grid-template-columns: auto auto 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border: 1px solid var(--chat-border);
      background: var(--chat-bg);
      box-shadow: 0 0 22px rgba(var(--chat-primary-rgb), 0.12);
    }

    #prompt { color: var(--chat-text); font-weight: 700; }

    #chatModePicker {
      position: relative;
    }

    #chatModeButton {
      min-width: 86px;
      border: 1px solid rgba(var(--chat-primary-rgb), 0.34);
      background: rgba(0, 0, 0, 0.58);
      color: var(--chat-text);
      font: inherit;
      padding: 2px 8px;
      outline: none;
      cursor: pointer;
      text-shadow: 0 0 6px rgba(var(--chat-primary-rgb), 0.22);
    }

    #chatModeButton:hover,
    #chatModeButton:focus-visible {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.62);
    }

    #chatModeMenu {
      position: absolute;
      left: 0;
      bottom: calc(100% + 6px);
      z-index: 4;
      display: none;
      min-width: 150px;
      gap: 2px;
      padding: 6px;
      border: 1px solid var(--chat-border);
      background: var(--chat-bg);
      box-shadow: 0 0 22px rgba(var(--chat-primary-rgb), 0.12);
    }

    #chatModeMenu.open {
      display: grid;
    }

    .chatModeOption {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 8px;
      color: var(--chat-text);
      padding: 4px 6px;
      cursor: pointer;
      user-select: none;
      text-shadow: 0 0 6px rgba(var(--chat-primary-rgb), 0.22);
    }

    .chatModeOption:hover,
    .chatModeOption:focus-within {
      outline: 1px solid var(--chat-border);
      background: rgba(var(--chat-primary-rgb), 0.12);
    }

    .chatModeOption input {
      margin: 0;
      accent-color: var(--chat-primary);
    }

    .chatModeOption:has(input:disabled) {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .chatModeOption.hidden {
      display: none;
    }

    #chatBaseSelect {
      width: 100%;
      border: 1px solid rgba(var(--chat-primary-rgb), 0.34);
      background: rgba(0, 0, 0, 0.58);
      color: var(--chat-text);
      font: inherit;
      padding: 3px 6px;
      outline: none;
      cursor: pointer;
      text-shadow: 0 0 6px rgba(var(--chat-primary-rgb), 0.22);
    }

    #chatBaseSelect:hover,
    #chatBaseSelect:focus-visible {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.62);
    }

    #chatBaseSelect option {
      background: #000000;
      color: var(--chat-primary);
    }

    #publicChatSettings {
      display: none;
      gap: 6px;
    }

    #publicChatSettings.visible {
      display: grid;
    }

    #publicNicknameInput,
    #publicNicknameColor {
      min-width: 0;
      border: 1px solid rgba(var(--chat-primary-rgb), 0.34);
      background: rgba(0, 0, 0, 0.58);
      color: var(--chat-text);
      font: inherit;
      padding: 3px 6px;
      outline: none;
      text-shadow: 0 0 6px rgba(var(--chat-primary-rgb), 0.22);
    }

    #publicNicknameInput::placeholder {
      color: rgba(var(--chat-primary-rgb), 0.52);
    }

    #publicNicknameInput:hover,
    #publicNicknameInput:focus-visible,
    #publicNicknameColor:hover,
    #publicNicknameColor:focus-visible {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.62);
    }

    #publicNicknameColor {
      width: 100%;
      min-height: 28px;
      padding: 2px 4px;
      cursor: pointer;
    }

    #chatInput {
      min-width: 0;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--chat-text);
      font: inherit;
    }

    #chatInput::placeholder { color: rgba(var(--chat-primary-rgb), 0.52); }

    #chatCloseButton {
      border: 0;
      background: transparent;
      color: #ff5577;
      font: inherit;
      line-height: 1;
      padding: 0 2px;
      cursor: pointer;
      text-shadow: 0 0 8px rgba(255, 85, 119, 0.38);
    }

    #chatCloseButton:hover,
    #chatCloseButton:focus-visible {
      outline: none;
      color: #ffffff;
    }

    #suggestions {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(100% + 6px);
      display: none;
      gap: 4px;
      padding: 6px;
      border: 1px solid var(--chat-border);
      background: var(--chat-bg);
    }

    #suggestions.visible { display: grid; }

    .suggestion {
      border: 0;
      background: transparent;
      color: var(--chat-text);
      font: inherit;
      text-align: left;
      padding: 4px 6px;
      cursor: pointer;
    }

    .suggestion:hover,
    .suggestion.active,
    .suggestion:focus-visible {
      outline: 1px solid var(--chat-border);
      background: rgba(var(--chat-primary-rgb), 0.12);
    }

    #dvdOverlay {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      display: none;
      z-index: 2;
    }

    #dvdOverlay.active {
      display: block;
    }

    .dvdLogo {
      position: absolute;
      left: 0;
      top: 0;
      width: min(22vw, 180px);
      height: auto;
      opacity: 0.96;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: auto;
      cursor: default;
      filter: hue-rotate(0deg) drop-shadow(0 0 10px rgba(255, 255, 255, 0.28));
      transform: translate3d(0, 0, 0);
      will-change: transform, filter;
    }
  </style>
</head>
<body>
  <div id="chatDimLayer" aria-hidden="true"></div>
  <div id="dvdOverlay" aria-hidden="true"></div>
  <div id="chatLightbox" aria-hidden="true" role="dialog" aria-label="Expanded chat media">
    <button id="chatLightboxClose" type="button" aria-label="Close expanded media" title="Close expanded media">❌</button>
    <img id="chatLightboxImage" src="" alt="" />
    <iframe id="chatLightboxFrame" title="YouTube video player" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </div>
  <main id="chatSurface" aria-live="polite">
    <section id="chatPanel">
      <div id="messages"></div>
      <form id="inputWrap" autocomplete="off">
        <span id="prompt">&gt;</span>
        <div id="chatModePicker">
          <button id="chatModeButton" type="button" aria-haspopup="true" aria-expanded="false" title="Chat filters">All Chats</button>
          <div id="chatModeMenu" aria-label="Chat filters">
            <select id="chatBaseSelect" aria-label="Chat base">
              <option value="public">Public Chat</option>
              <option value="local">Local Chat</option>
              <option value="ai">AI Chat</option>
            </select>
            <div id="publicChatSettings">
              <input id="publicNicknameInput" type="text" maxlength="40" placeholder="Nickname" aria-label="Public nickname" />
              <input id="publicNicknameColor" type="color" aria-label="Nickname color" />
            </div>
            <label class="chatModeOption"><input type="checkbox" value="commands" /> Commands</label>
            <label class="chatModeOption"><input type="checkbox" value="system" /> System Chat</label>
          </div>
        </div>
        <input id="chatInput" type="text" placeholder="Press here to chat..." />
        <button id="chatCloseButton" type="button" aria-label="Close chat" title="Close chat">❌</button>
        <div id="suggestions" aria-hidden="true"></div>
      </form>
    </section>
  </main>

  <script>
    const CHAT_NICKNAME_STORAGE_KEY = 'tektiteChatNickname';
    const CHAT_NICKNAME_EXPLICIT_STORAGE_KEY = 'tektiteChatNicknameExplicit';
    const CHAT_NICKNAME_COLOR_STORAGE_KEY = 'tektiteChatNicknameColor';
    const CHAT_SYSTEM_PROMPT_STORAGE_KEY = 'tektiteChatSystemPrompt';
    const CHAT_MODE_STORAGE_KEY = 'tektiteChatModeDropdown';
    const CHAT_API_HISTORY_STORAGE_KEY = 'tektiteChatApiHistory';
    const SUPABASE_PROJECT_URL = 'https://fumidkcwrhzgfdmuakqj.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_BcNJhaZkgo4r5VH1aJ_stQ_P-kEDY_r';
    const SUPABASE_CHAT_ROOM = 'index';
    const SUPABASE_CHAT_TABLE = 'site_chat_messages';
    const SUPABASE_CHAT_MAX_VISIBLE = 20;
    const PUBLIC_CHAT_FETCH_LIMIT = SUPABASE_CHAT_MAX_VISIBLE + 1;
    const PUBLIC_CHAT_REFRESH_MS = 5000;
    const PUBLIC_CHAT_PRUNE_RETRY_MS = 30000;
    const PUBLIC_CHAT_IMAGE_MAX_SOURCE_BYTES = 5 * 1024 * 1024;
    const PUBLIC_CHAT_IMAGE_MAX_BODY_CHARS = 700000;
    const PUBLIC_CHAT_IMAGE_MAX_DIMENSION = 960;
    const PUBLIC_CHAT_IMAGE_PAYLOAD_TYPE = 'theinternetisdead.publicChatImage.v1';
    const PUBLIC_CHAT_PIN_PAYLOAD_TYPE = 'theinternetisdead.publicChatPin.v1';
    const CHAT_API_URL = 'https://theinternetisdead.onrender.com/api/chat';
    const CHAT_API_MODEL = 'gpt-5.5';

    const commands = [
      { name: '/clear', value: '/clear', execute: true, desc: 'clear local non-public chat messages' },
      { name: '/clear_public', value: '/clear_public ', execute: false, desc: 'admin: clear public chat history through the server-side function', hidden: true },
      { name: '/dvd', value: '/dvd', execute: true, desc: 'spawn another bouncing hue-shifting DVD logo, up to 10 total' },
      { name: '/exit', value: '/exit', execute: true, desc: 'kill the page and trigger the fatal exit screen' },
      {
        name: '/nickname',
        value: '/nickname ',
        execute: false,
        desc: 'set the displayed username used by system messages',
        suggestions: ['Tektite', 'Guest', 'User', 'color #00ff66', 'reset'],
        subcommands: [
          { name: 'color', value: '/nickname color ', execute: false, desc: 'set nickname color' },
          { name: 'color reset', value: '/nickname color reset', execute: true, desc: 'clear nickname color' },
          { name: 'reset', value: '/nickname reset', execute: true, desc: 'reset to an anonymous nickname' }
        ]
      },
      { name: '/pin', value: '/pin ', execute: false, desc: 'pin a message below the selected chat welcome message' },
      {
        name: '/system_prompt',
        value: '/system_prompt ',
        execute: false,
        desc: 'set/show/clear the local system prompt sent with AI chat',
        subcommands: [
          { name: 'clear', value: '/system_prompt clear', execute: true, desc: 'clear the local system prompt' },
          { name: 'reset', value: '/system_prompt reset', execute: true, desc: 'clear the local system prompt' },
          { name: 'off', value: '/system_prompt off', execute: true, desc: 'clear the local system prompt' }
        ]
      },
      { name: '/random', value: '/random', execute: true, desc: 'load a random site page in the root iframe' },
      {
        name: '/rainbow',
        value: '/rainbow',
        execute: true,
        desc: 'toggle a hue-shifting color filter over the root page',
        subcommands: [
          { name: 'speed', value: '/rainbow speed ', execute: false, desc: 'set rainbow filter speed' }
        ]
      },
      { name: '/refresh', value: '/refresh', execute: true, desc: 'refresh the entire page' },
      { name: '/reset', value: '/reset', execute: true, desc: 'clear local browser storage and reload', hidden: true },
      { name: '/search', value: '/search ', execute: false, desc: 'search visible text across indexed site HTML files' },
      { name: '/help', value: '/help', execute: true, desc: 'show this help message with command links' }
    ];

    const visibleCommands = commands.filter((command) => command.hidden !== true);
    const commandByName = new Map(commands.map((command) => [command.name, command]));
    const messages = document.getElementById('messages');
    const inputWrap = document.getElementById('inputWrap');
    const chatInput = document.getElementById('chatInput');
    const chatModePicker = document.getElementById('chatModePicker');
    const chatModeButton = document.getElementById('chatModeButton');
    const chatModeMenu = document.getElementById('chatModeMenu');
    const chatBaseSelect = document.getElementById('chatBaseSelect');
    const publicChatSettings = document.getElementById('publicChatSettings');
    const publicNicknameInput = document.getElementById('publicNicknameInput');
    const publicNicknameColor = document.getElementById('publicNicknameColor');
    const chatModeCheckboxes = Array.from(document.querySelectorAll('#chatModeMenu input[type="checkbox"]'));
    const chatCloseButton = document.getElementById('chatCloseButton');
    const suggestions = document.getElementById('suggestions');
    const dvdOverlay = document.getElementById('dvdOverlay');
    const chatLightbox = document.getElementById('chatLightbox');
    const chatLightboxImage = document.getElementById('chatLightboxImage');
    const chatLightboxFrame = document.getElementById('chatLightboxFrame');
    const chatLightboxClose = document.getElementById('chatLightboxClose');
    const CHAT_KINDS = ['ai', 'commands', 'local', 'public', 'system'];
    const DEFAULT_CHAT_KINDS = ['local'];

    function normalizeNickname(value) {
      const cleaned = String(value || '').replace(/[\r\n\t]+/g, ' ').replace(/\s{2,}/g, ' ').trim();

    }

    function saveNickname(value) {

          window.localStorage.setItem(CHAT_NICKNAME_STORAGE_KEY, value.trim());

        } else {
          window.localStorage.removeItem(CHAT_NICKNAME_STORAGE_KEY);
          window.localStorage.removeItem(CHAT_NICKNAME_EXPLICIT_STORAGE_KEY);
        }
      } catch (error) {}
    }

    function normalizeNicknameColor(value) {
      const raw = String(value || '').trim();
      if (!raw) return '';
      const cssColor = raw.replace(/\s+/g, ' ');
      const hex = raw.match(/^#?([0-9a-f]{3}|[0-9a-f]{6})$/i);
      if (hex) {
        const value = hex[1];
        if (value.length === 3) {
          return `#${value.split('').map((char) => char + char).join('').toLowerCase()}`;
        }
        return `#${value.toLowerCase()}`;
      }
      const rgba = raw.match(/^rgba?\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})(?:\s*,\s*(0|1|0?\.\d+))?\s*\)$/i);
      if (rgba) {
        const red = Math.max(0, Math.min(255, Number(rgba[1])));
        const green = Math.max(0, Math.min(255, Number(rgba[2])));
        const blue = Math.max(0, Math.min(255, Number(rgba[3])));
        const alpha = rgba[4] === undefined ? null : Math.max(0, Math.min(1, Number(rgba[4])));
        return alpha === null
          ? `rgb(${red}, ${green}, ${blue})`
          : `rgba(${red}, ${green}, ${blue}, ${alpha})`;
      }
      const namedColors = {
        red: '#ff5577',
        orange: '#ff9f43',
        yellow: '#ffe66d',
        green: '#00ff66',
        blue: '#7bd2ff',
        indigo: 'indigo',
        purple: '#c792ea',
        pink: '#ff7ac8',
        white: '#ffffff'
      };
      if (namedColors[raw.toLowerCase()]) return namedColors[raw.toLowerCase()];

      if (typeof CSS !== 'undefined' && CSS.supports && CSS.supports('color', cssColor)) {
        return cssColor;
      }

      return '';
    }

    function loadNicknameColor() {
      try {
        return normalizeNicknameColor(window.localStorage.getItem(CHAT_NICKNAME_COLOR_STORAGE_KEY) || '');
      } catch (error) {}
      return '';
    }

    function saveNicknameColor(value) {

      try {
        if (color) {
          window.localStorage.setItem(CHAT_NICKNAME_COLOR_STORAGE_KEY, color);
        } else {
          window.localStorage.removeItem(CHAT_NICKNAME_COLOR_STORAGE_KEY);

    function normalizeSystemPrompt(value) {

    }

    function loadSystemPrompt() {

        return normalizeSystemPrompt(window.localStorage.getItem(CHAT_SYSTEM_PROMPT_STORAGE_KEY) || '');

          window.localStorage.setItem(CHAT_SYSTEM_PROMPT_STORAGE_KEY, systemPrompt);
        } else {
          window.localStorage.removeItem(CHAT_SYSTEM_PROMPT_STORAGE_KEY);
        }
      } catch (error) {}
      return systemPrompt;
    }

    function normalizeChatKind(value) {
      const kind = String(value || '').trim().toLowerCase();
      return CHAT_KIND_SET.has(kind) ? kind : 'system';
    }

    function normalizeChatKindSelection(value) {
      let selected = [];
      if (Array.isArray(value)) {
        selected = value;
      } else {
        const mode = String(value || '').trim().toLowerCase();
        if (mode === 'all') return new Set(DEFAULT_CHAT_KINDS);
        if (!mode) return new Set(DEFAULT_CHAT_KINDS);
        selected = [mode];
      }

      const normalized = selected.map(normalizeChatKind).filter((kind, index, kinds) => kinds.indexOf(kind) === index);
      if (normalized.includes('public')) return new Set(['public']);
      if (normalized.includes('ai')) return new Set(['ai', ...normalized.filter((kind) => kind === 'commands' || kind === 'system')]);
      if (normalized.length) return new Set(['local', ...normalized.filter((kind) => kind === 'commands' || kind === 'system')]);
      return new Set(DEFAULT_CHAT_KINDS);
    }

    function loadChatKinds() {
      try {
        const saved = window.localStorage.getItem(CHAT_MODE_STORAGE_KEY);
        if (!saved) return new Set(DEFAULT_CHAT_KINDS);
        if (saved.trim().startsWith('[')) return normalizeChatKindSelection(JSON.parse(saved));
        return normalizeChatKindSelection(saved);
      } catch (error) {}
      return new Set(DEFAULT_CHAT_KINDS);
    }

    function saveChatKinds(value) {
      const selected = normalizeChatKindSelection(Array.from(value || []));
      try {
        if (selected.size === CHAT_KINDS.length) {
          window.localStorage.removeItem(CHAT_MODE_STORAGE_KEY);
        } else {
          window.localStorage.setItem(CHAT_MODE_STORAGE_KEY, JSON.stringify(Array.from(selected)));
        }
      } catch (error) {}
      return selected;
    }

    function normalizeApiHistoryRole(value) {
      return value === 'assistant' ? 'assistant' : 'user';
    }

    function normalizeApiHistoryEntry(entry) {
      if (!entry || typeof entry !== 'object') return null;
      const content = String(entry.content || '').trim();
      if (!content) return null;
      const normalized = {
        role: normalizeApiHistoryRole(entry.role),
        content
      };
      if (entry.nickname && normalized.role === 'user') {
        normalized.nickname = normalizeNickname(entry.nickname);
      }
      if (entry.nicknameColor && normalized.role === 'user') {
        const color = normalizeNicknameColor(entry.nicknameColor);
        if (color) normalized.nicknameColor = color;
      }
      if (entry.createdAt) normalized.createdAt = String(entry.createdAt);
      return normalized;
    }

    function normalizeApiChatHistory(value) {
      if (!Array.isArray(value)) return [];
      return value.map(normalizeApiHistoryEntry).filter(Boolean);
    }

    function loadApiChatHistory() {
      try {
        const saved = window.localStorage.getItem(CHAT_API_HISTORY_STORAGE_KEY);
        if (!saved) return [];

    function saveApiChatHistory(history = apiChatHistory) {

          window.localStorage.removeItem(CHAT_API_HISTORY_STORAGE_KEY);

    function appendApiChatHistory(role, content, options = {}) {
      const entry = normalizeApiHistoryEntry({

        content,
        nickname: options.nickname,
        nicknameColor: options.nicknameColor,
        createdAt: new Date().toISOString()
      });
      if (!entry) return apiChatHistory;
      apiChatHistory = [...apiChatHistory, entry];
      saveApiChatHistory(apiChatHistory);

    function getApiChatHistoryForRequest() {

    function getMessageKind(line) {

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/`/g, '&#96;');
    }

    function splitUrlTrailingPunctuation(value) {
      let url = String(value || '');
      let trailing = '';
      while (/[),.!?:;]$/.test(url)) {
        trailing = url.slice(-1) + trailing;
        url = url.slice(0, -1);
      }
      return { url, trailing };
    }

    function getSafeHttpUrl(value) {
      try {
        const url = new URL(value);
        if (url.protocol !== 'http:' && url.protocol !== 'https:') return '';
        return url.href;
      } catch (error) {
        return '';
      }
    }

    function parseYouTubeTimestamp(value) {
      const raw = String(value || '').trim();
      if (!raw) return 0;
      if (/^\d+$/.test(raw)) return Math.max(0, Number(raw));
      const match = raw.match(/(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?/i);
      if (!match || !match[0]) return 0;
      return ((Number(match[1]) || 0) * 3600) + ((Number(match[2]) || 0) * 60) + (Number(match[3]) || 0);
    }

    function getYouTubeEmbedInfo(value) {
      const safeUrl = getSafeHttpUrl(value);
      if (!safeUrl) return null;
      let url;
      try {
        url = new URL(safeUrl);
      } catch (error) {
        return null;
      }

      const host = url.hostname.replace(/^www\./i, '').toLowerCase();
      let videoId = '';
      if (host === 'youtu.be') {
        videoId = url.pathname.split('/').filter(Boolean)[0] || '';
      } else if (host === 'youtube.com' || host === 'm.youtube.com' || host === 'music.youtube.com' || host === 'youtube-nocookie.com') {
        const parts = url.pathname.split('/').filter(Boolean);
        if (url.pathname === '/watch') {
          videoId = url.searchParams.get('v') || '';
        } else if (['shorts', 'embed', 'live', 'v'].includes(parts[0])) {
          videoId = parts[1] || '';
        }
      }

      videoId = String(videoId || '').match(/^[a-zA-Z0-9_-]{11}$/)?.[0] || '';
      if (!videoId) return null;

      const start = parseYouTubeTimestamp(url.searchParams.get('t') || url.searchParams.get('start') || '');
      const embedUrl = new URL(`https://www.youtube-nocookie.com/embed/${videoId}`);
      embedUrl.searchParams.set('rel', '0');
      if (start) embedUrl.searchParams.set('start', String(start));

      return {
        videoId,
        url: safeUrl,
        embedUrl: embedUrl.href,
        thumbnailUrl: `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`
      };
    }

    function getYouTubeEmbedsFromText(value) {
      const found = [];
      const seen = new Set();
      String(value || '').replace(/https?:\/\/[^\s<]+/gi, (match) => {
        const { url } = splitUrlTrailingPunctuation(match);
        const info = getYouTubeEmbedInfo(url);
        if (info && !seen.has(info.videoId)) {
          seen.add(info.videoId);
          found.push(info);
        }
        return match;
      });
      return found;
    }

    function renderYouTubeEmbeds(value) {
      const embeds = getYouTubeEmbedsFromText(value);
      if (!embeds.length) return '';
      return embeds.map((embed) => `
        <div class="publicChatYoutube" data-youtube-video-id="${escapeAttribute(embed.videoId)}">
          <iframe class="publicChatYoutubeFrame" title="YouTube video ${escapeAttribute(embed.videoId)}" src="${escapeAttribute(embed.embedUrl)}" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>
      `).join('');
    }

    function renderInlineMarkdown(value) {
      const tokens = [];
      const addToken = (html) => {
        const token = `@@MDTOKEN${tokens.length}@@`;
        tokens.push(html);
        return token;
      };

      let text = String(value || '');
      text = text.replace(/`([^`\n]+)`/g, (_match, code) => {
        return addToken(`<code>${escapeHtml(code)}</code>`);
      });
      text = text.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/gi, (_match, label, href) => {
        const safeUrl = getSafeHttpUrl(href);
        if (!safeUrl) return escapeHtml(label);
        return addToken(`<a href="${escapeAttribute(safeUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)}</a>`);
      });

      let html = escapeHtml(text);
      html = html.replace(/\*\*([^*\n][\s\S]*?[^*\n])\*\*/g, '<strong>$1</strong>');
      html = html.replace(/(^|[^\*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
      html = html.replace(/(https?:\/\/[^\s<]+)/gi, (match) => {
        const { url, trailing } = splitUrlTrailingPunctuation(match);
        const safeUrl = getSafeHttpUrl(url);
        return safeUrl
          ? `<a href="${escapeAttribute(safeUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(url)}</a>${escapeHtml(trailing)}`
          : escapeHtml(match);
      });
      tokens.forEach((tokenHtml, index) => {
        html = html.replaceAll(`@@MDTOKEN${index}@@`, tokenHtml);
      });
      return html;
    }

    function renderMarkdownText(value) {
      const raw = String(value || '').replace(/\r\n?/g, '\n');
      if (!raw.includes('\n') && !/^\s*[-*]\s+/.test(raw) && !/```/.test(raw)) {
        return `${renderInlineMarkdown(raw)}${renderYouTubeEmbeds(raw)}`;
      }
      const lines = raw.split('\n');
      const blocks = [];
      let paragraph = [];
      let listItems = [];
      let codeLines = [];
      let inCodeBlock = false;

      const flushParagraph = () => {
        if (!paragraph.length) return;
        blocks.push(`<p>${paragraph.map(renderInlineMarkdown).join('<br>')}</p>`);
        paragraph = [];
      };
      const flushList = () => {
        if (!listItems.length) return;
        blocks.push(`<ul>${listItems.map((item) => `<li>${renderInlineMarkdown(item)}</li>`).join('')}</ul>`);
        listItems = [];
      };
      const flushCode = () => {
        blocks.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
        codeLines = [];
      };

      lines.forEach((line) => {
        if (/^\s*```/.test(line)) {
          if (inCodeBlock) {
            flushCode();
            inCodeBlock = false;
          } else {
            flushParagraph();
            flushList();
            inCodeBlock = true;
          }
          return;
        }

        if (inCodeBlock) {
          codeLines.push(line);
          return;
        }

        const listMatch = line.match(/^\s*[-*]\s+(.+)$/);
        if (listMatch) {
          flushParagraph();
          listItems.push(listMatch[1]);
          return;
        }

        if (!line.trim()) {
          flushParagraph();
          flushList();
          return;
        }

        flushList();
        paragraph.push(line);
      });

      if (inCodeBlock) flushCode();
      flushParagraph();
      flushList();
      return `${blocks.join('')}${renderYouTubeEmbeds(raw)}`;
    }

    function scrollToBottom() {
      messages.scrollTop = messages.scrollHeight;
    }

    function scheduleScrollToBottom() {
      if (scrollFrameId) return;
      scrollFrameId = requestAnimationFrame(() => {
        scrollFrameId = 0;
        scrollToBottom();
      });
    }

    function addMessage(role, html, options = {}) {
      const line = document.createElement('div');
      line.className = 'message';
      line.dataset.role = role;
      line.dataset.chatKind = options.kind || (options.publicMessage ? 'public' : (role === 'system' && commandOutputDepth > 0 ? 'commands' : role));
      if (options.publicMessage) line.dataset.liveChatMessage = 'true';
      if (options.error) line.dataset.error = 'true';
      line.innerHTML = html;
      messages.appendChild(line);
      while (messages.children.length > SUPABASE_CHAT_MAX_VISIBLE + 30) {
        messages.firstElementChild?.remove();
      }
      line.hidden = !messageMatchesChatMode(line);
      scheduleScrollToBottom();
      return line;
    }

    function addSystemMessage(text, options = {}) {
      return addMessage('system', escapeHtml(text), options);
    }

    function addWelcomeMessages() {
      const welcomeMessages = [
        { kind: 'ai', text: 'AI chat ready. Ask with plain text when AI Chat is checked. 🤖' },
        { kind: 'local', text: 'Local chat ready. Notes stay in this browser session. 📝' },
        { kind: 'public', text: 'Public chat ready. Messages are shared with everyone. 🌐' },
        { kind: 'system', text: 'System chat ready. Commands and status messages land here. ⚙️' }
      ];
      let publicWelcomeLine = null;
      welcomeMessages.forEach((welcome) => {
        const line = addSystemMessage(welcome.text, { kind: welcome.kind });
        welcomeMessageLines.set(welcome.kind, line);
        if (welcome.kind === 'public') publicWelcomeLine = line;
      });
      return publicWelcomeLine;
    }

    function openChatImageLightbox(image) {
      if (!image || !chatLightbox || !chatLightboxImage) return;
      const src = image.currentSrc || image.src || '';
      if (!src) return;
      if (chatLightboxFrame) chatLightboxFrame.src = '';
      chatLightbox.dataset.lightboxKind = 'image';
      chatLightboxImage.src = src;
      chatLightboxImage.alt = image.alt || 'Expanded chat image';
      chatLightbox.classList.add('active');
      chatLightbox.setAttribute('aria-hidden', 'false');
      chatLightboxClose?.focus({ preventScroll: true });
    }

    function openChatVideoLightbox(trigger) {
      if (!trigger || !chatLightbox || !chatLightboxFrame) return;
      const embedUrl = trigger.dataset.youtubeEmbedUrl || '';
      if (!getSafeHttpUrl(embedUrl)) return;
      chatLightboxImage.removeAttribute('src');
      chatLightboxImage.alt = '';
      chatLightbox.dataset.lightboxKind = 'video';
      chatLightboxFrame.src = embedUrl;
      chatLightbox.classList.add('active');
      chatLightbox.setAttribute('aria-hidden', 'false');
      chatLightboxClose?.focus({ preventScroll: true });
    }

    function closeChatImageLightbox() {
      if (!chatLightbox || !chatLightboxImage) return;
      chatLightbox.classList.remove('active');
      chatLightbox.setAttribute('aria-hidden', 'true');
      chatLightbox.removeAttribute('data-lightbox-kind');
      chatLightboxImage.removeAttribute('src');
      chatLightboxImage.alt = '';
      if (chatLightboxFrame) chatLightboxFrame.src = '';
    }

    messages.addEventListener('click', (event) => {
      const youtubeEmbed = event.target.closest?.('.publicChatYoutube');
      if (youtubeEmbed) {
        event.preventDefault();
        openChatVideoLightbox(youtubeEmbed);

    function upsertPinnedMessage(text, nickname = currentNickname, options = {}) {
      const pinnedText = String(text || '').trim();
      if (!pinnedText) {
        addSystemMessage('Usage: /pin [text]', { kind: options.kind || 'system' });
        return false;
      }

      const kind = normalizeChatKind(options.kind || 'public');
      const html = `${getNicknameHtml(nickname)} ${renderMarkdownText(pinnedText)}`;
      let pinnedMessageLine = pinnedMessageLines.get(kind);
      if (!pinnedMessageLine || !pinnedMessageLine.isConnected) {
        pinnedMessageLine = document.createElement('div');
        pinnedMessageLine.className = 'message';
        pinnedMessageLine.dataset.role = 'public';
        pinnedMessageLine.dataset.chatKind = kind;
        pinnedMessageLine.dataset.pinnedMessage = 'true';
        pinnedMessageLines.set(kind, pinnedMessageLine);
      }
      pinnedMessageLine.innerHTML = html;
      pinnedMessageLine.dataset.chatKind = kind;

      const anchor = getPinnedMessageAnchor(kind);
      if (anchor && anchor.nextSibling !== pinnedMessageLine) {
        messages.insertBefore(pinnedMessageLine, anchor.nextSibling);
      } else if (!anchor && pinnedMessageLine.parentElement !== messages) {
        messages.insertBefore(pinnedMessageLine, messages.firstChild);
      }
      pinnedMessageLine.hidden = !messageMatchesChatMode(pinnedMessageLine);
      applyChatModeFilter();
      scheduleScrollToBottom();
      return true;
    }

      if (pinnedText.length > 500) {

      const nickname = normalizeNickname(currentNickname);
      currentNickname = nickname;
      saveNickname(currentNickname);
      const targetKinds = getPinTargetKinds();
      targetKinds

    function addCommandExecutionMessage(command, options = {}) {
      const commandKey = String(command || '').trim().toLowerCase();
      if (!commandKey) return null;

      const baseText = options.message || formatCommandExecutionMessage(commandKey, options.state || 'executed');
      const detail = options.detail ? ` ${options.detail}` : '';
      const existing = commandExecutionMessages.get(commandKey);
      const count = existing && existing.line && existing.line.isConnected ? existing.count + 1 : 1;
      const text = `${baseText}${detail}${count > 1 ? ` x${count}` : ''}`;
      const line = existing && existing.line && existing.line.isConnected
        ? existing.line
        : addMessage('system', escapeHtml(text), {
            commandExecution: true,
            kind: options.kind || 'commands'
          });

      line.textContent = text;
      line.dataset.chatKind = options.kind || line.dataset.chatKind || 'commands';
      line.dataset.commandExecution = commandKey;
      line.dataset.commandExecutionCount = String(count);
      window.clearTimeout(existing && existing.timerId);

      const timerId = window.setTimeout(() => {
        removeCommandExecutionMessage(commandKey);
      }, COMMAND_EXECUTION_MESSAGE_TTL_MS);

      commandExecutionMessages.set(commandKey, { line, count, timerId });
      scheduleScrollToBottom();
      return line;
    }

    async function runAiChatPrompt(promptText) {
      const message = String(promptText || '').trim();
      if (!message) {
        addSystemMessage('Type a message while AI Chat is checked.', { kind: 'ai' });
        return true;
      }

      const nickname = normalizeNickname(currentNickname);
      const nicknameColor = currentNicknameColor;
      addLocalUserPromptMessage(message, { nickname, nicknameColor });
      appendApiChatHistory('user', message, { nickname, nicknameColor });
      const conversationHistory = getApiChatHistoryForRequest();
      const loadingLine = addSystemMessage('API thinking...', { kind: 'ai' });
      try {
        const payload = {
          message,
          model: CHAT_API_MODEL,
          history: conversationHistory,
          messages: conversationHistory
        };
        if (currentSystemPrompt) payload.systemPrompt = currentSystemPrompt;

        const response = await fetch(CHAT_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        let data = null;
        try {
          data = await response.json();
        } catch (error) {
          data = null;
        }

        if (!response.ok) {
          const detail = data && (data.error || data.detail) ? ` ${data.error || data.detail}` : '';
          throw new Error(`API request failed with ${response.status}.${detail}`);
        }

        const reply = data && typeof data.reply === 'string' ? data.reply.trim() : '';
        if (!reply) throw new Error('API returned an empty reply.');

        if (loadingLine && loadingLine.isConnected) loadingLine.remove();
        appendApiChatHistory('assistant', reply);
        addApiResponseMessage(reply);
        return true;
      } catch (error) {
        if (loadingLine && loadingLine.isConnected) loadingLine.remove();
        console.error('Unable to run API prompt:', error);
        addSystemMessage(error && error.message ? error.message : 'Unable to run API prompt.', { error: true, kind: 'ai' });
        return true;
      }
    }

    function normalizeRandomPagePath(path) {
      try {
        const url = new URL(String(path || ''), window.location.origin);
        if (url.origin !== window.location.origin) return '';
        url.pathname = url.pathname.replace(/\/{2,}/g, '/');
        return `${url.pathname}${url.search}${url.hash}` || '';
      } catch (error) {
        const fallbackPath = String(path || '').trim();
        if (!fallbackPath || !fallbackPath.startsWith('/')) return '';
        return fallbackPath.replace(/\/{2,}/g, '/');
      }
    }

    function isRandomPageCandidate(path) {
      const normalized = normalizeRandomPagePath(path);
      if (!normalized) return false;

      let url;
      try {
        url = new URL(normalized, window.location.origin);
      } catch (error) {
        return false;
      }

      const pathname = url.pathname.replace(/\/{2,}/g, '/');
      if (pathname === '/' ||
        pathname === '/index.html' ||
        pathname === '/homepage.html' ||
        pathname === '/dead/stuff/stuff-for-index/thumbnail-grid/index.html' ||
        pathname === '/dead/stuff/stuff-for-index/feeds/feeds-bridge.html') {
        return false;
      }
      if (/^\/(?:nav|chat)\.html$/i.test(pathname)) return false;
      if (/^\/dead\/(?:JSON|audio|images|messages|scripts)\//i.test(pathname)) return false;
      if (/\.(?:css|js|mjs|json|map|png|jpe?g|gif|webp|svg|ico|mp3|wav|ogg|pdf|zip|md|txt)$/i.test(pathname)) return false;
      return /\/$/i.test(pathname) || /\.html$/i.test(pathname);
    }

    function normalizeRainbowSpeed(value) {
      const numeric = Number.parseFloat(String(value || '').trim());
      if (!Number.isFinite(numeric) || numeric <= 0) return 1;
      return Math.min(20, Math.max(0.05, numeric));

    function requestRootRainbowFilter(arg = '') {
      const rawArg = String(arg || '').trim();
      const lowerArg = rawArg.toLowerCase();
      let active = true;

      if (!lowerArg) {

      } else if (lowerArg.startsWith('speed')) {

    function normalizeSiteSearchText(value) {
      return String(value || '').replace(/\s+/g, ' ').trim();

    function isSearchableHtmlPath(path) {
      const normalized = normalizeRandomPagePath(path);
      if (!normalized) return false;
      try {
        const url = new URL(normalized, window.location.origin);
        if (url.origin !== window.location.origin) return false;
        if (!/\.html$/i.test(url.pathname)) return false;
        if (/^\/(?:index|nav|chat)\.html$/i.test(url.pathname)) return false;
        return !/^\/dead\/(?:JSON|audio|images|messages|scripts)\//i.test(url.pathname);
      } catch (error) {
        return false;
      }
    }

    function getSiteSearchTitle(path, doc) {
      const title = doc && doc.querySelector ? normalizeSiteSearchText(doc.querySelector('title')?.textContent || '') : '';
      if (title) return title;
      const parts = String(path || '').split('/').filter(Boolean);
      return parts.at(-1) || path || 'Untitled page';
    }

    function extractVisiblePageText(html) {
      const doc = new DOMParser().parseFromString(String(html || ''), 'text/html');
      doc.querySelectorAll('script, style, noscript, template, svg, canvas, iframe, audio, video, source, track').forEach((node) => node.remove());
      doc.querySelectorAll('[hidden], [aria-hidden="true"]').forEach((node) => node.remove());
      doc.querySelectorAll('[style]').forEach((node) => {
        const style = String(node.getAttribute('style') || '').toLowerCase();
        if (/(?:display\s*:\s*none|visibility\s*:\s*hidden)/.test(style)) node.remove();
      });
      const bodyText = normalizeSiteSearchText(doc.body ? doc.body.textContent : doc.documentElement.textContent);
      return { doc, text: bodyText };
    }

    async function fetchSiteSearchDocument(path) {
      try {
        const response = await fetch(path, { cache: 'no-store' });
        if (!response.ok) return null;
        const html = await response.text();
        const extracted = extractVisiblePageText(html);
        if (!extracted.text) return null;
        return {
          path,
          title: getSiteSearchTitle(path, extracted.doc),
          text: extracted.text,
          lowerText: extracted.text.toLowerCase()
        };
      } catch (error) {
        return null;
      }
    }

    async function loadSiteSearchDocuments() {
      if (siteSearchDocuments) return siteSearchDocuments;
      if (siteSearchIndexPromise) return siteSearchIndexPromise;

      siteSearchIndexPromise = (async () => {
        const response = await fetch('/dead/JSON/repo-index.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('Unable to load repo-index.json');
        const repoIndex = await response.json();
        const itemLinks = Array.isArray(repoIndex.items)
          ? repoIndex.items.map((item) => item && (item.href || item.path || '')).filter(Boolean)
          : [];
        const paths = Array.from(new Set(itemLinks.map(normalizeRandomPagePath).filter(isSearchableHtmlPath)));
        const docs = [];
        for (let index = 0; index < paths.length; index += SITE_SEARCH_FETCH_CONCURRENCY) {
          const batch = paths.slice(index, index + SITE_SEARCH_FETCH_CONCURRENCY);
          const results = await Promise.all(batch.map(fetchSiteSearchDocument));
          results.forEach((result) => {
            if (result) docs.push(result);
          });
        }
        siteSearchDocuments = docs;
        return docs;
      })();

      try {
        return await siteSearchIndexPromise;
      } finally {
        siteSearchIndexPromise = null;
      }
    }

    function countSiteSearchMatches(text, query) {
      let count = 0;
      let index = text.indexOf(query);
      while (index !== -1) {
        count += 1;
        index = text.indexOf(query, index + query.length);
      }
      return count;
    }

    function getSiteSearchSnippet(text, lowerText, query) {
      const index = lowerText.indexOf(query);
      if (index === -1) return '';
      const start = Math.max(0, index - 72);
      const end = Math.min(text.length, index + query.length + 112);
      const prefix = start > 0 ? '...' : '';
      const suffix = end < text.length ? '...' : '';
      return normalizeSiteSearchText(`${prefix}${text.slice(start, end)}${suffix}`);
    }

    function renderSiteSearchResults(query, results, totalDocs) {
      if (!results.length) {
        addSystemMessage(`No site file matches for "${query}".`);
        return;
      }

      const items = results.map((result) => {
        const href = escapeAttribute(result.path);
        const title = escapeHtml(result.title);
        const path = escapeHtml(result.path);
        const snippet = escapeHtml(result.snippet);
        const count = result.count === 1 ? '1 match' : `${result.count} matches`;
        return `<li><a href="${href}" data-index-frame-src="${href}">${title}</a><br><code>${path}</code><br><span>${escapeHtml(count)} - ${snippet}</span></li>`;
      }).join('');
      addMessage('system', `<strong>Search Site Files: ${escapeHtml(query)}</strong><br><span>${results.length} result${results.length === 1 ? '' : 's'} from ${totalDocs} pages</span><ul>${items}</ul>`);
    }

    async function runSiteSearch(query) {
      const searchText = normalizeSiteSearchText(query);
      if (!searchText) {
        addSystemMessage('Usage: /search [search text]');
        return false;
      }

      const loadingLine = addSystemMessage('Searching site files...');
      try {
        const docs = await loadSiteSearchDocuments();
        const lowerQuery = searchText.toLowerCase();
        const results = docs.map((doc) => {
          const count = countSiteSearchMatches(doc.lowerText, lowerQuery);
          if (!count) return null;
          return {
            path: doc.path,
            title: doc.title,
            count,
            snippet: getSiteSearchSnippet(doc.text, doc.lowerText, lowerQuery)
          };
        }).filter(Boolean)
          .sort((a, b) => b.count - a.count || a.path.localeCompare(b.path))
          .slice(0, SITE_SEARCH_MAX_RESULTS);

        if (loadingLine && loadingLine.isConnected) loadingLine.remove();
        renderSiteSearchResults(searchText, results, docs.length);
        addCommandExecutionMessage('/search', { message: `/search executed: ${searchText}` });
        return true;
      } catch (error) {
        if (loadingLine && loadingLine.isConnected) loadingLine.remove();
        console.error('Unable to search site files:', error);
        addSystemMessage('Unable to search site files.', { error: true });
        return false;
      }
    }

    async function loadRandomPageCandidatesFromRepoIndex() {
      try {
        const response = await fetch('/dead/JSON/repo-index.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('repo-index unavailable');
        const repoIndex = await response.json();
        const folders = Array.isArray(repoIndex.folders) ? repoIndex.folders : [];
        const itemLinks = Array.isArray(repoIndex.items)
          ? repoIndex.items.map((item) => item && (item.href || item.path || '')).filter(Boolean)
          : [];
        return Array.from(new Set([...folders, ...itemLinks].map(normalizeRandomPagePath).filter(isRandomPageCandidate)));
      } catch (error) {
        return [];
      }
    }

    async function loadRandomIndexPageFromChat() {
      const controller = getParentIndexFrameController();
      if (!controller) {
        addSystemMessage('/random only works from the root page chat overlay.', { error: true });
        return false;
      }

      const controllerLinks = typeof controller.getLinks === 'function' ? controller.getLinks() : [];
      let candidates = Array.from(new Set((Array.isArray(controllerLinks) ? controllerLinks : [])
        .map(normalizeRandomPagePath)
        .filter(isRandomPageCandidate)));
      if (!candidates.length) {
        candidates = await loadRandomPageCandidatesFromRepoIndex();
      }
      if (!candidates.length) {
        addSystemMessage('No random pages are available.', { error: true });
        return false;
      }

      const currentPath = typeof controller.getCurrentSource === 'function'
        ? normalizeRandomPagePath(controller.getCurrentSource())
        : '';
      const available = candidates.length > 1
        ? candidates.filter((path) => path !== currentPath)
        : candidates;
      const nextPath = available[Math.floor(Math.random() * available.length)];
      controller.setSource(nextPath, { historyMode: 'push' });
      addCommandExecutionMessage('/random', { message: `/random executed: ${nextPath}` });
      return true;
    }

    function positionDvdInstance(instance, force = false) {
      if (!instance || !instance.el || !dvdOverlay) return;
      const viewportWidth = Math.max(window.innerWidth || 0, document.documentElement.clientWidth || 0, 1);
      const viewportHeight = Math.max(window.innerHeight || 0, document.documentElement.clientHeight || 0, 1);
      const logoRect = instance.el.getBoundingClientRect();
      const logoWidth = Math.max(logoRect.width || instance.el.offsetWidth || 180, 1);
      const logoHeight = Math.max(logoRect.height || instance.el.offsetHeight || Math.round(logoWidth * 0.45), 1);
      const maxX = Math.max(0, viewportWidth - logoWidth);
      const maxY = Math.max(0, viewportHeight - logoHeight);

      instance.x = Math.min(Math.max(instance.x, 0), maxX);
      instance.y = Math.min(Math.max(instance.y, 0), maxY);
      if (force) instance.initialized = true;

      instance.el.style.transform = `translate3d(${instance.x}px, ${instance.y}px, 0)`;
      instance.el.style.filter = `hue-rotate(${instance.hue}deg) drop-shadow(0 0 10px rgba(255, 255, 255, 0.28))`;
    }

    function positionAllDvdInstances(force = false) {
      dvdInstances.forEach((instance) => positionDvdInstance(instance, force));
    }

    function stepDvdAnimation(now) {
      if (!dvdEnabled || !dvdOverlay || !dvdInstances.length) {
        dvdAnimationFrameId = null;
        return;
      }

      if (!dvdLastTime) dvdLastTime = now;
      const deltaMs = Math.min(32, Math.max(0, now - dvdLastTime));
      dvdLastTime = now;

      const viewportWidth = Math.max(window.innerWidth || 0, document.documentElement.clientWidth || 0, 1);
      const viewportHeight = Math.max(window.innerHeight || 0, document.documentElement.clientHeight || 0, 1);

      dvdInstances.forEach((instance) => {
        const logoRect = instance.el.getBoundingClientRect();
        const logoWidth = Math.max(logoRect.width || instance.el.offsetWidth || 180, 1);
        const logoHeight = Math.max(logoRect.height || instance.el.offsetHeight || Math.round(logoWidth * 0.45), 1);
        const maxX = Math.max(0, viewportWidth - logoWidth);
        const maxY = Math.max(0, viewportHeight - logoHeight);

        instance.x += instance.vx * deltaMs;
        instance.y += instance.vy * deltaMs;

        if (instance.x <= 0) {
          instance.x = 0;
          instance.vx = Math.abs(instance.vx);
        } else if (instance.x >= maxX) {
          instance.x = maxX;
          instance.vx = -Math.abs(instance.vx);
        }

        if (instance.y <= 0) {
          instance.y = 0;
          instance.vy = Math.abs(instance.vy);
        } else if (instance.y >= maxY) {
          instance.y = maxY;
          instance.vy = -Math.abs(instance.vy);
        }

        instance.hue = (instance.hue + ((dvdHueShiftSpeedDegPerSecond * deltaMs) / 1000)) % 360;
        positionDvdInstance(instance);
      });

      dvdAnimationFrameId = requestAnimationFrame(stepDvdAnimation);
    }

    function startDvdAnimation() {
      if (!dvdOverlay || !dvdInstances.length) return false;
      dvdEnabled = true;
      dvdOverlay.classList.add('active');
      dvdLastTime = 0;
      positionAllDvdInstances(true);
      if (dvdAnimationFrameId === null) {
        dvdAnimationFrameId = requestAnimationFrame(stepDvdAnimation);
      }
      notifyParentDvdState();
      return true;
    }

    function createDvdInstance() {
      if (!dvdOverlay || dvdInstances.length >= dvdNormalMaxInstances) return null;

      const index = dvdInstances.length;
      const img = document.createElement('img');
      img.className = 'dvdLogo';
      img.alt = 'DVD logo';
      img.referrerPolicy = 'no-referrer';
      img.crossOrigin = 'anonymous';
      img.dataset.dvdId = `dvd-${++dvdLogoCounter}`;

      const instance = {
        id: img.dataset.dvdId,
        el: img,
        x: 24 + ((index * 37) % 320),
        y: 24 + ((index * 29) % 220),
        vx: (index % 2 === 0 ? 1 : -1) * (0.065 + (index * 0.009)),
        vy: (index % 3 === 0 ? -1 : 1) * (0.055 + (index * 0.008)),
        hue: (index * 36) % 360
      };

      img.src = dvdDefaultSource;
      img.onload = () => positionDvdInstance(instance, true);
      dvdInstances.push(instance);
      dvdOverlay.appendChild(img);
      positionDvdInstance(instance, true);
      return instance;
    }

    function spawnDvdInstance() {
      if (dvdInstances.length >= dvdNormalMaxInstances) {
        if (!dvdEnabled && dvdInstances.length) startDvdAnimation();
        return false;
      }
      const instance = createDvdInstance();
      if (!instance) return false;
      startDvdAnimation();
      return true;
    }

    function publicMessageKey(message) {
      if (!message) return '';
      return String(message.id || `${message.created_at || ''}:${message.nickname || ''}:${message.body || ''}`);
    }

    function formatPublicMessageTimestamp(value) {
      const date = new Date(value || '');
      if (Number.isNaN(date.getTime())) return '';
      return new Intl.DateTimeFormat('en-US', {
        timeZone: 'America/Toronto',
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      }).format(date);
    }

    function parsePublicChatPayload(body) {
      const raw = String(body || '');
      if (!raw.startsWith('{')) return { type: 'text', text: raw, nicknameColor: '' };
      try {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.type === PUBLIC_CHAT_IMAGE_PAYLOAD_TYPE && typeof parsed.src === 'string') {
          return {
            type: 'image',
            src: parsed.src,
            alt: typeof parsed.name === 'string' ? parsed.name : 'pasted image',
            caption: typeof parsed.caption === 'string' ? parsed.caption : '',
            nicknameColor: normalizeNicknameColor(parsed.nicknameColor || '')
          };
        }
        if (parsed && parsed.type === PUBLIC_CHAT_PIN_PAYLOAD_TYPE) {
          return {
            type: 'pin',
            text: typeof parsed.text === 'string' ? parsed.text : '',
            nicknameColor: normalizeNicknameColor(parsed.nicknameColor || '')
          };
        }
        if (parsed && parsed.type === 'theinternetisdead.publicChatText.v1') {
          return {
            type: 'text',
            text: typeof parsed.text === 'string' ? parsed.text : raw,
            nicknameColor: normalizeNicknameColor(parsed.nicknameColor || '')
          };
        }
      } catch (error) {
      }
      return { type: 'text', text: raw, nicknameColor: '' };
    }

    function renderPublicChatBody(body) {
      const payload = parsePublicChatPayload(body);
      if (payload.type !== 'image') return renderMarkdownText(payload.text);
      if (!/^data:image\/(?:png|jpe?g|webp|gif);base64,/i.test(payload.src)) {
        return escapeHtml('[unsupported image]');
      }
      const captionHtml = payload.caption ? `<div>${renderMarkdownText(payload.caption)}</div>` : '';
      return `${captionHtml}<img class="publicChatImage" src="${escapeAttribute(payload.src)}" alt="${escapeAttribute(payload.alt)}" loading="lazy" decoding="async" tabindex="0" title="Open larger image" />`;
    }

    function addPublicChatMessage(message) {
      const key = publicMessageKey(message);
      if (!key || renderedPublicMessageKeys.has(key)) return;
      renderedPublicMessageKeys.add(key);
      const createdAt = String(message.created_at || '');
      if (createdAt && (!latestPublicMessageCreatedAt || createdAt > latestPublicMessageCreatedAt)) {
        latestPublicMessageCreatedAt = createdAt;
      }
      const payload = parsePublicChatPayload(message.body || '');
      if (payload.type === 'pin') {
        upsertPinnedMessage(payload.text, message.nickname || 'Anonymous');
        return;
      }
      const timestamp = escapeHtml(formatPublicMessageTimestamp(message.created_at));
      const timestampHtml = timestamp ? `<span class="messageTimestamp">${timestamp}</span>` : '';
      const rawNickname = message.nickname || 'Anonymous';
      const nickname = escapeHtml(rawNickname);
      const nicknameColor = normalizeNicknameColor(payload.nicknameColor || '');
      const reservedNickname = isReservedNickname(rawNickname);
      const nicknameClass = reservedNickname ? ' class="reservedNickname"' : '';
      const nicknameStyle = !reservedNickname && nicknameColor ? ` style="color:${escapeAttribute(nicknameColor)}"` : '';
      const body = renderPublicChatBody(message.body || '');
      const line = addMessage('public', `${timestampHtml}<strong${nicknameClass}${nicknameStyle}>${nickname}:</strong> ${body}`, { publicMessage: true, kind: 'public' });
      line.dataset.publicMessageKey = key;
      trimRenderedPublicMessages();
    }

    function trimRenderedPublicMessages() {
      const publicLines = Array.from(messages.querySelectorAll('[data-live-chat-message="true"]'));
      while (publicLines.length > SUPABASE_CHAT_MAX_VISIBLE) {
        const line = publicLines.shift();
        if (!line) break;
        renderedPublicMessageKeys.delete(line.dataset.publicMessageKey || '');
        line.remove();
      }
    }

    async function supabaseRequest(path, options = {}) {
      const headers = {
        apikey: SUPABASE_PUBLISHABLE_KEY,
        Authorization: `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
        ...(options.headers || {})
      };
      const response = await fetch(`${SUPABASE_PROJECT_URL}${path}`, { ...options, headers });
      if (!response.ok) {
        const text = await response.text().catch(() => '');
        throw new Error(text || `Request failed with ${response.status}`);
      }
      if (response.status === 204) return null;
      return response.json();
    }

    function buildPublicMessagesPath(options = {}) {
      const params = new URLSearchParams();
      params.set('room', `eq.${SUPABASE_CHAT_ROOM}`);
      params.set('select', 'id,room,nickname,body,created_at');
      if (options.since) params.set('created_at', `gt.${options.since}`);
      params.set('order', options.ascending ? 'created_at.asc' : 'created_at.desc');
      params.set('limit', String(options.limit || PUBLIC_CHAT_FETCH_LIMIT));
      return `/rest/v1/${SUPABASE_CHAT_TABLE}?${params.toString()}`;
    }

    async function loadRecentPublicMessages(options = {}) {
      if (publicChatRefreshInFlight) return false;
      publicChatRefreshInFlight = true;
      try {
        const incremental = options.incremental && latestPublicMessageCreatedAt;
        const rows = await supabaseRequest(buildPublicMessagesPath({
          since: incremental ? latestPublicMessageCreatedAt : '',
          ascending: !!incremental,
          limit: incremental ? SUPABASE_CHAT_MAX_VISIBLE : PUBLIC_CHAT_FETCH_LIMIT
        }));
        if (Array.isArray(rows) && rows.length > SUPABASE_CHAT_MAX_VISIBLE) {
          prunePublicChatHistory();
        }
        const orderedRows = Array.isArray(rows)
          ? (incremental ? rows : rows.slice(0, SUPABASE_CHAT_MAX_VISIBLE).reverse())
          : [];
        if (!incremental) {
          const nextKeys = new Set(orderedRows.map(publicMessageKey).filter(Boolean));
          const hasPinnedRow = orderedRows.some((row) => parsePublicChatPayload(row && row.body || '').type === 'pin');
          if (!hasPinnedRow) removePinnedMessage();
          Array.from(messages.querySelectorAll('[data-live-chat-message="true"]')).forEach((line) => {
            const key = line.dataset.publicMessageKey || '';
            if (!nextKeys.has(key)) {
              line.remove();
              renderedPublicMessageKeys.delete(key);
            }
          });
        }
        orderedRows.forEach(addPublicChatMessage);
        trimRenderedPublicMessages();
        applyChatModeFilter();
        return true;
      } catch (error) {
        console.warn('Unable to load public chat:', error);
        return false;
      } finally {
        publicChatRefreshInFlight = false;
      }
    }

    async function prunePublicChatHistory(options = {}) {
      if (publicChatPruneInFlight) return false;
      const now = Date.now();
      if (!options.force && now - lastPublicChatPruneAttemptMs < PUBLIC_CHAT_PRUNE_RETRY_MS) return false;
      lastPublicChatPruneAttemptMs = now;
      publicChatPruneInFlight = true;
      try {
        await supabaseRequest('/functions/v1/clear-chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'prune',
            room: SUPABASE_CHAT_ROOM,
            maxMessages: SUPABASE_CHAT_MAX_VISIBLE
          })
        });
        return true;
      } catch (error) {
        console.warn('Unable to prune public chat history:', error);
        return false;
      } finally {
        publicChatPruneInFlight = false;
      }
    }

    function createPublicTextBody(text) {

    function readImageElement(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error('Unable to read pasted image.'));
        image.src = src;
      });
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ''));
        reader.onerror = () => reject(new Error('Unable to read pasted image.'));
        reader.readAsDataURL(file);
      });
    }

    async function createImageDataUrl(file) {
      if (!file || !String(file.type || '').startsWith('image/')) {
        throw new Error('Paste an image file.');
      }
      if (file.size > PUBLIC_CHAT_IMAGE_MAX_SOURCE_BYTES) {
        throw new Error('Image is too large. Keep pasted images under 5 MB.');
      }

      const sourceDataUrl = await readFileAsDataUrl(file);
      const image = await readImageElement(sourceDataUrl);
      const scale = Math.min(1, PUBLIC_CHAT_IMAGE_MAX_DIMENSION / Math.max(image.naturalWidth || 1, image.naturalHeight || 1));
      const width = Math.max(1, Math.round((image.naturalWidth || 1) * scale));
      const height = Math.max(1, Math.round((image.naturalHeight || 1) * scale));
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext('2d');
      if (!context) throw new Error('Unable to process pasted image.');
      context.drawImage(image, 0, 0, width, height);

      const qualities = [0.76, 0.66, 0.56, 0.46];
      for (const quality of qualities) {
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        if (dataUrl.length <= PUBLIC_CHAT_IMAGE_MAX_BODY_CHARS) return dataUrl;
      }
      throw new Error('Image is too large after compression.');
    }

    async function sendPublicImage(file) {
      try {
        addSystemMessage('Uploading pasted image...');
        const src = await createImageDataUrl(file);
        const payload = JSON.stringify({
          type: PUBLIC_CHAT_IMAGE_PAYLOAD_TYPE,
          name: file.name || 'pasted image',
          mime: 'image/jpeg',
          src,
          nicknameColor: currentNicknameColor
        });
        if (payload.length > PUBLIC_CHAT_IMAGE_MAX_BODY_CHARS + 512) {
          throw new Error('Image payload is too large.');
        }
        await insertPublicChatImageBody(payload);
      } catch (error) {
        console.error('Unable to send pasted image:', error);
        addSystemMessage(error && error.message ? error.message : 'Unable to send pasted image.', { error: true });
      }
    }
