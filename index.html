<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>theinternetisdead.org</title>

  <style>
    html {
      height: 100%;
      background: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: transparent;
      font-family: "Courier New", Courier, monospace;
    }

    .background-frame {
      position: fixed;
      left: 0;
      top: 53px;
      width: 100%;
      height: calc(100vh - 53px);
      border: 0;
      background: transparent;
      z-index: 0;
      pointer-events: none;
    }

    .bottom-bar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: auto;
      z-index: 2;
      width: 100%;
      height: 53px;
      background: black;
      border-bottom: 3px solid lime;
      box-sizing: border-box;

      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .bar-content {
      border: 0;
      padding: 0;
      width: 100%;
      height: 50px;
      background: black;
      color: white;
      cursor: default;

      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;

      font-family: "Courier New", Courier, monospace;
      font-weight: 700;
      line-height: 1;
      box-sizing: border-box;
    }

    .clock-group {
      margin-left: auto;
      display: flex;
      align-items: center;
      height: 50px;
    }

    .clock-text {
      flex: 0 0 96px;
      width: 96px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-right: 0;
    }

    .clock-time {
      font-size: 15px;
      white-space: nowrap;
    }

    .clock-date {
      margin-top: 5px;
      font-size: 10px;
      white-space: nowrap;
    }

    .emoji-icon {
      flex: 0 0 50px;
      width: 50px;
      height: 50px;
      background: black;
      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 24px;
      line-height: 1;
      box-sizing: border-box;
    }

    .skull-icon {
      background: rgb(59 0 102);
    }

    .alien-icon {
      flex: 0 0 auto;
      width: auto;
      padding-left: 10px;
      gap: 8px;
      color: lime;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }

    .alien-glyph {
      flex: 0 0 50px;
      width: 50px;
      height: 50px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;
      font-size: 24px;
      line-height: 1;
    }

    .ghost-count {
      margin-right: 0.35ch;
    }

    .gear-icon {
      color: #8200e0;
    }

    .emoji-label {
      min-width: 0;
      flex: 1 1 auto;
      padding: 0 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .bar-content .emoji-label {
      text-align: left;
      color: lime;
      font-weight: 700;
    }

    .ghost-counter.is-you-dummy {
      color: #fff;
      -webkit-text-stroke: 1px #ff004c;
      paint-order: stroke fill;
      text-shadow:
        -3px -3px 0 #ff004c,
        0 -3px 0 #ff8c00,
        3px -3px 0 #ffe600,
        -3px 0 0 #00d26a,
        3px 0 0 #00d9ff,
        -3px 3px 0 #3b5bff,
        0 3px 0 #8f00ff,
        3px 3px 0 #ff00c8;
    }

    @media (max-width: 600px) {
      .background-frame {
        top: 103px;
        height: calc(100vh - 103px);
      }

      .bottom-bar {
        height: 103px;
      }

      .bar-content {
        height: 100px;
        flex-wrap: wrap;
        align-content: flex-start;
      }

      .bar-content .emoji-label {
        flex: 0 1 calc(100% - 50px);
        width: calc(100% - 50px);
        max-width: calc(100% - 50px);
        box-sizing: border-box;
      }

      .clock-group {
        flex: 0 0 100%;
        margin-left: 0;
        justify-content: center;
      }

      .alien-icon {
        padding-left: 0;
        gap: 4px;
        font-size: 13px;
      }

      .clock-text {
        flex-basis: 88px;
        width: 88px;
      }
    }
  </style>
</head>

<body>
  <iframe class="background-frame" src="/dead/pages/background.html" title="Background" aria-hidden="true"></iframe>

  <div class="bottom-bar" aria-label="Static bookmark top bar preview">
    <button class="bar-content" type="button" tabindex="-1" aria-hidden="true">
      <span class="emoji-icon skull-icon">&#9760;</span>
      <span class="emoji-label">theinternetisdead.org</span>
      <span class="clock-group">
        <span class="emoji-icon alien-icon ghost-counter" id="ghost-counter" role="status" aria-label="? Ghosts Online">
          <span class="ghost-text">
            <span class="ghost-count" id="ghost-count">?</span><span class="ghost-label" id="ghost-label">Ghosts Online</span>
          </span>
          <span class="alien-glyph">&#128125;</span>
        </span>
        <span class="clock-text">
          <span class="clock-time" id="clock-time"></span>
          <span class="clock-date" id="clock-date"></span>
        </span>
        <span class="emoji-icon gear-icon">&#9881;&#65039;</span>
      </span>
    </button>
  </div>
  <script>
    const clockTime = document.getElementById("clock-time");
    const clockDate = document.getElementById("clock-date");
    const ghostCounter = document.getElementById("ghost-counter");
    const ghostCount = document.getElementById("ghost-count");
    const ghostLabel = document.getElementById("ghost-label");
    const YOU_DUMMY_TEXT = "It's YOU dummy!";
    let ghostsOnlineCount = null;

    const updateClock = () => {
      const now = new Date();

      clockTime.textContent = now.toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit",
        hour12: true
      }).replace(/\s/g, "");

      clockDate.textContent = now.toLocaleDateString([], {
        month: "short",
        day: "numeric",
        year: "numeric"
      });
    };

    updateClock();
    setInterval(updateClock, 1000);

    const formatGhostsOnlineText = (count) => (
      count === 1 ? "1 Ghost Online" : `${Number.isFinite(count) ? count : "?"} Ghosts Online`
    );

    const setGhostCounterLabel = (label) => {
      const match = label.match(/^(\S+)(.*)$/);
      const countText = match ? match[1] : "?";
      const suffixText = match ? match[2].trimStart() : "Ghosts Online";

      ghostCount.textContent = countText;
      ghostLabel.textContent = suffixText;
      ghostCounter.setAttribute("aria-label", label);
    };

    const restoreGhostCounterLabel = () => {
      ghostCounter.classList.remove("is-you-dummy");
      setGhostCounterLabel(formatGhostsOnlineText(ghostsOnlineCount));
    };

    const showYouDummyLabel = () => {
      if (ghostsOnlineCount !== 1) return;
      ghostCounter.classList.add("is-you-dummy");
      setGhostCounterLabel(YOU_DUMMY_TEXT);
    };

    const setGhostsOnline = (count) => {
      ghostsOnlineCount = count;
      restoreGhostCounterLabel();
    };

    const connectGhostCounterSocket = () => {
      if (!window.WebSocket) {
        setGhostsOnline(null);
        return;
      }

      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const socketUrl = `${protocol}//${window.location.host}/api/ghosts-online`;
      let socket;

      try {
        socket = new WebSocket(socketUrl);
      } catch (error) {
        window.setTimeout(connectGhostCounterSocket, 5000);
        return;
      }

      socket.addEventListener("message", (event) => {
        try {
          const data = JSON.parse(event.data);
          const count = Number(data && data.count);
          if (Number.isFinite(count) && count >= 0) {
            setGhostsOnline(count);
          }
        } catch (error) {
          // Keep the last visible counter value when a malformed packet arrives.
        }
      });

      socket.addEventListener("close", () => {
        window.setTimeout(connectGhostCounterSocket, 5000);
      });
    };

    ghostCounter.addEventListener("mouseenter", showYouDummyLabel);
    ghostCounter.addEventListener("mouseleave", restoreGhostCounterLabel);

    setGhostsOnline(null);
    connectGhostCounterSocket();
  </script>
</body>
</html>
