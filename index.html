<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/dead/js/shell-route.js"></script><link rel="icon" type="image/png" href="/dead/images/pngs/dead-favicon.png" />
<meta charset="UTF-8" />

<title>/dead/experiments/canvas-backgrounds/starfield-background.html</title>
<style>
  /*
    background.html
    Single-file extraction of the shooter-game Level 1 starfield background.

    This intentionally keeps the canvas sizing/rendering style close to the
    source game instead of doing fancy high-DPI scaling. The old game used
    canvas.width = window.innerWidth and canvas.height = window.innerHeight,
    because apparently crisp modern rendering was too emotionally stable.
  */

  html,
  body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
    color: #0f0;
    font-family: monospace;
  }

  body {
    touch-action: none;
  }

  canvas {
    display: block;
    touch-action: none;
  }

  #content-area {
    position: fixed;
    top: 56px;
    right: 0;
    bottom: 56px;
    left: 0;
    z-index: 5;
    margin: 0 10px 5px;
    outline: 3px solid #0f0;
    overflow: hidden;
    background: rgba(0, 255, 0, .25);
  }

  #content-area.content-area--framed {
    background: transparent;
  }

  .content-area__frame {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    background: transparent;
    color-scheme: normal;
  }

  #splash-content {
    display: flex;
    height: 100%;
    max-width: 880px;
    margin: 0 auto;
    box-sizing: border-box;
    padding: clamp(10px, 3vmin, 32px);
    flex-direction: column;
    justify-content: center;
    color: #fff;
    font: bold clamp(12pt, 1.6vw, 18pt)/1.6 "Courier New", Courier, monospace;
    text-align: center;
    text-shadow: 0 1px 0 #000, 0 0 8px rgba(0, 0, 0, .9);
  }

  #splash-content p {
    margin: 0 0 .85em;
  }

  #splash-read-aloud {
    display: block;
    margin: 0 0 .85em;
    padding: 0;
    align-self: center;
    border: 0;
    background: transparent;
    color: #0f0;
    font: inherit;
    font-size: .75em;
    font-weight: bold;
    text-decoration: none;
    text-shadow: inherit;
    white-space: nowrap;
    user-select: none;
    cursor: pointer;
  }

  #splash-read-aloud:hover,
  #splash-read-aloud:focus-visible {
    color: #f0f;
  }

  .splash-read-aloud__label {
    text-decoration: underline;
  }

  #splash-read-aloud.is-reading .splash-read-aloud__label {
    color: #f00;
  }

  #splash-content p:first-of-type {
    color: #0f0;
    font-size: 1.45em;
    line-height: 1.25;
    white-space: nowrap;
  }

  #splash-content p:last-child {
    margin-bottom: 0;
    color: #f0f;
  }

  #splash-content.splash-content--idle-message > :not(.splash-selection-message) {
    visibility: hidden;
  }

  .splash-selection-message {
    position: absolute;
    inset: 0;
    display: flex;
    box-sizing: border-box;
    padding: clamp(10px, 3vmin, 32px);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #0f0;
    font: bold clamp(12pt, 1.6vw, 18pt)/1.6 "Courier New", Courier, monospace;
    text-align: center;
    pointer-events: none;
    animation: splash-idle-pulse 1.1s ease-in-out infinite;
  }

  .splash-selection-message p {
    margin: 0 0 .85em;
  }

  .splash-selection-message p:first-child {
    font-size: 1.45em;
    line-height: 1.25;
  }

  .splash-selection-message p:last-child {
    margin-bottom: 0;
  }

  @keyframes splash-idle-pulse {
    0%, 100% {
      opacity: .55;
      transform: scale(.97);
      text-shadow: 0 0 6px rgba(0, 255, 0, .45);
    }
    50% {
      opacity: 1;
      transform: scale(1.03);
      text-shadow: 0 0 22px #0f0;
    }
  }

  #top-nav-frame {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 10;
    width: 100%;
    height: 56px;
    border: 0;
    background: transparent;
  }

  #top-nav-frame.sidebar-open {
    z-index: 20;
    height: 100%;
  }

  #bottom-nav-frame {
    position: fixed;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 10;
    width: 100%;
    height: 56px;
    border: 0;
    background: transparent;
  }

  @media (max-width: 700px) {
    #top-nav-frame {
      height: min(350px, calc(50.2vw + 24px));
    }

    #content-area {
      top: min(350px, calc(50.2vw + 24px));
      bottom: 56px;
    }
  }
</style>

<body>
<canvas id="game"></canvas>
<main id="content-area" aria-label="Content area">
  <article id="splash-content" aria-live="polite">
    <button id="splash-read-aloud" type="button">🔊 <span class="splash-read-aloud__label">(READ ALOUD)</span></button>
  </article>
</main>
<iframe
  id="top-nav-frame"
  src="/dead/pages/top-nav.html"
  title="Top navigation"
  allowtransparency="true"
  scrolling="no"
></iframe>
<iframe
  id="bottom-nav-frame"
  src="/dead/pages/bottom-nav.html"
  title="Bottom navigation"
  allowtransparency="true"
  allow="fullscreen"
  scrolling="no"
></iframe>

<script>
/*
  Extracted background-only starfield.

  Kept from shooter-game:
  - black canvas background
  - three parallax star layers
  - exact layer counts, vertical speeds, parallax multipliers, size ranges
  - exact alpha values per layer
  - exact resize behavior: canvas.width/height = window.innerWidth/Height
  - exact menu/start-screen idle sway formula

  Removed:
  - player
  - enemies
  - bullets
  - bombs
  - menus
  - HUD
  - pause
  - audio
  - controller logic
  - keyboard gameplay logic
  - post-FX
*/

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const contentArea = document.getElementById("content-area");
const splashContent = document.getElementById("splash-content");
const splashReadAloud = document.getElementById("splash-read-aloud");
const splashReadAloudLabel = splashReadAloud.querySelector(".splash-read-aloud__label");
const topNavFrame = document.getElementById("top-nav-frame");
const bottomNavFrame = document.getElementById("bottom-nav-frame");
let splashFitFrame = 0;
let splashSelectionTimer = 0;
let splashSelectionMessageActive = false;
let splashAudioContext = null;
const splashAudioBufferPromises = new Map();
const splashMarkdownPromises = new Map();
let splashAudioSource = null;
let splashReadAloudActive = false;
let splashReadAloudRun = 0;
let splashCycleRun = 0;
let shellSection = "main";
let activeContentFrame = null;
let starfieldPaused = false;

function fitSplashContent() {
  splashFitFrame = 0;
  splashContent.style.fontSize = "";
  let fontSize = parseFloat(getComputedStyle(splashContent).fontSize);

  while (fontSize > 8 && (
    splashContent.scrollHeight > splashContent.clientHeight
    || splashContent.scrollWidth > splashContent.clientWidth
  )) {
    fontSize -= .5;
    splashContent.style.fontSize = fontSize + "px";
  }
}

function scheduleSplashFit() {
  if (splashFitFrame) cancelAnimationFrame(splashFitFrame);
  splashFitFrame = requestAnimationFrame(fitSplashContent);
}

fetch("/dead/text/splash-markdown/splash-00.md")
  .then(response => {
    if (!response.ok) throw new Error("Unable to load /dead/text/splash-markdown/splash-00.md");
    return response.text();
  })
  .then(markdown => {
    const paragraphs = markdown.trim().split(/\r?\n\s*\r?\n/);
    const renderedParagraphs = paragraphs.map(text => {
      const paragraph = document.createElement("p");
      paragraph.textContent = text.replace(/\r?\n/g, " ");
      return paragraph;
    });

    splashContent.replaceChildren(splashReadAloud, ...renderedParagraphs);
    scheduleSplashFit();
  })
  .catch(() => {
    const errorMessage = document.createElement("p");
    errorMessage.textContent = "The entrance is temporarily unavailable.";
    splashContent.replaceChildren(splashReadAloud, errorMessage);
    scheduleSplashFit();
  });

function ensureSplashAudioContext() {
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) return null;

  if (!splashAudioContext) splashAudioContext = new AudioContextClass();
  if (splashAudioContext.state === "suspended") {
    splashAudioContext.resume().catch(() => {});
  }

  return splashAudioContext;
}

function loadSplashAudio(splashNumber) {
  if (!splashAudioBufferPromises.has(splashNumber)) {
    const audioPromise = fetch(`/dead/audio/splash-audio/splash-${splashNumber}-david.mp3`)
      .then(response => {
        if (!response.ok) throw new Error(`Unable to load David audio for splash ${splashNumber}`);
        return response.arrayBuffer();
      })
      .then(audioData => splashAudioContext.decodeAudioData(audioData))
      .catch(error => {
        splashAudioBufferPromises.delete(splashNumber);
        throw error;
      });

    splashAudioBufferPromises.set(splashNumber, audioPromise);
  }

  return splashAudioBufferPromises.get(splashNumber);
}

function stopSplashAudio() {
  if (!splashAudioSource) return;
  try { splashAudioSource.stop(); } catch (_) {}
  splashAudioSource = null;
}

function playSplashAudioBuffer(audioBuffer) {
  stopSplashAudio();

  return new Promise(resolve => {
    const source = splashAudioContext.createBufferSource();
    const startTime = splashAudioContext.currentTime;
    const modulationLength = audioBuffer.duration * 1.4;
    let modulationTime = 0;
    let modulationStep = 0;

    source.buffer = audioBuffer;
    source.connect(splashAudioContext.destination);
    source.detune.setValueAtTime(0, startTime);

    while (modulationTime < modulationLength) {
      modulationTime += .13 + Math.random() * .1;
      const sway = Math.sin(modulationStep * .83) * 190;
      const stumble = (Math.random() - .5) * 220;
      const cents = Math.max(-360, Math.min(360, sway + stumble));
      source.detune.linearRampToValueAtTime(cents, startTime + modulationTime);
      modulationStep++;
    }

    source.onended = () => {
      if (splashAudioSource === source) splashAudioSource = null;
      resolve();
    };
    splashAudioSource = source;
    source.start(startTime);
  });
}

async function playSplashAudio(splashNumber) {
  const context = ensureSplashAudioContext();
  if (!context) return;
  await context.resume();
  const audioBuffer = await loadSplashAudio(splashNumber);
  return playSplashAudioBuffer(audioBuffer);
}

function updateSplashReadAloudControl() {
  splashReadAloudLabel.textContent = splashReadAloudActive
    ? "[STOP READING]"
    : "(READ ALOUD)";
  splashReadAloud.classList.toggle("is-reading", splashReadAloudActive);
  splashReadAloud.setAttribute(
    "aria-label",
    splashReadAloudActive ? "Stop reading splash text" : "Read splash text aloud"
  );
}

function cancelSplashReadAloud() {
  splashReadAloudRun++;
  splashReadAloudActive = false;
  updateSplashReadAloudControl();
  stopSplashAudio();
}

async function readSplashAloud() {
  const run = ++splashReadAloudRun;

  if (splashReadAloudActive) {
    splashReadAloudActive = false;
    updateSplashReadAloudControl();
    stopSplashAudio();
    return;
  }

  splashReadAloudActive = true;
  updateSplashReadAloudControl();

  try {
    await playSplashAudio("00");
  } finally {
    if (run === splashReadAloudRun) {
      splashReadAloudActive = false;
      updateSplashReadAloudControl();
    }
  }
}

function loadSplashMarkdown(splashNumber) {
  if (!splashMarkdownPromises.has(splashNumber)) {
    const markdownPromise = fetch(`/dead/text/splash-markdown/splash-${splashNumber}.md`)
      .then(response => {
        if (!response.ok) throw new Error(`Unable to load splash ${splashNumber}`);
        return response.text();
      })
      .catch(error => {
        splashMarkdownPromises.delete(splashNumber);
        throw error;
      });

    splashMarkdownPromises.set(splashNumber, markdownPromise);
  }

  return splashMarkdownPromises.get(splashNumber);
}

function renderCyclingSplash(message, markdown) {
  const paragraphs = markdown.trim().split(/\r?\n\s*\r?\n/).map(text => {
    const paragraph = document.createElement("p");
    paragraph.textContent = text.replace(/\r?\n/g, " ");
    return paragraph;
  });

  message.style.fontSize = "";
  message.replaceChildren(...paragraphs);

  requestAnimationFrame(() => {
    let fontSize = parseFloat(getComputedStyle(message).fontSize);
    while (fontSize > 8 && (
      message.scrollHeight > message.clientHeight
      || message.scrollWidth > message.clientWidth
    )) {
      fontSize -= .5;
      message.style.fontSize = fontSize + "px";
    }
  });
}

async function cycleSelectionSplashes(run, message) {
  const splashNumbers = ["01", "02", "03", "04"];

  while (splashSelectionMessageActive && run === splashCycleRun) {
    for (const splashNumber of splashNumbers) {
      if (!splashSelectionMessageActive || run !== splashCycleRun) return;

      try {
        const [markdown, audioBuffer] = await Promise.all([
          loadSplashMarkdown(splashNumber),
          loadSplashAudio(splashNumber)
        ]);
        if (!splashSelectionMessageActive || run !== splashCycleRun) return;

        renderCyclingSplash(message, markdown);
        await playSplashAudioBuffer(audioBuffer);
      } catch (_) {
        // Skip a missing splash pair and continue the loop.
      }

      if (!splashSelectionMessageActive || run !== splashCycleRun) return;
      await new Promise(resolve => window.setTimeout(resolve, 2000));
    }
  }
}

splashReadAloud.addEventListener("click", readSplashAloud);

window.addEventListener("resize", scheduleSplashFit);

const shellSections = {
  main: { path: "/", src: null, title: "Main Page" },
  games: { path: "/dead/games/", src: "/dead/games/content.html", title: "Games" },
  experiments: { path: "/dead/experiments/", src: "/dead/experiments/content.html", title: "Experiments" }
};
const shellRouteParams = new URLSearchParams(window.location.search);
const embeddedShell = shellRouteParams.get("embedded-shell") === "1" && window.top !== window;
const shellHistoryWindow = embeddedShell ? window.top : window;
const requestedShellSection = shellRouteParams.get("section");
const requestedShellRoute = shellRouteParams.get("shell-route");
const initialShellRoute = requestedShellRoute
  ? routeFromPath(requestedShellRoute)
  : shellSections[requestedShellSection]
    ? { ...shellSections[requestedShellSection], section: requestedShellSection }
    : routeFromPath(shellHistoryWindow.location.pathname);

function sectionFromPath(pathname) {
  if (pathname.startsWith("/dead/games")) return "games";
  if (pathname.startsWith("/dead/experiments")) return "experiments";
  return "main";
}

function titleFromPath(pathname) {
  const slug = pathname.split("/").filter(Boolean).at(-1) || "Main Page";
  return decodeURIComponent(slug)
    .split("-")
    .map(word => word ? word[0].toUpperCase() + word.slice(1) : word)
    .join(" ");
}

function routeFromPath(pathname) {
  let path = "/";
  let route = "/";
  try {
    const url = new URL(pathname, window.location.origin);
    if (url.origin === window.location.origin) {
      path = url.pathname;
      route = url.pathname + url.search + url.hash;
    }
  } catch (_) {}

  if (path === "/dead/games" || path === "/dead/games/") {
    return { ...shellSections.games, section: "games" };
  }
  if (path === "/dead/experiments" || path === "/dead/experiments/") {
    return { ...shellSections.experiments, section: "experiments" };
  }
  if (path.startsWith("/dead/games/") || path.startsWith("/dead/experiments/")) {
    return {
      path: route,
      src: route,
      title: titleFromPath(path),
      section: sectionFromPath(path)
    };
  }
  return { ...shellSections.main, section: "main" };
}

function syncTopNavSection() {
  topNavFrame.contentWindow?.postMessage(
    { type: "portal-shell-section-state", section: shellSection },
    window.location.origin
  );
}

function setShellRoute(destination, historyMode = "push") {
  destination = routeFromPath(destination?.path || "/");
  const section = destination.section;

  clearTimeout(splashSelectionTimer);
  splashSelectionTimer = 0;
  if (splashSelectionMessageActive) restoreSplashAfterSelection();
  else cancelSplashReadAloud();
  window.getSelection()?.removeAllRanges();

  if (section === "main") {
    activeContentFrame = null;
    contentArea.classList.remove("content-area--framed");
    contentArea.replaceChildren(splashContent);
    contentArea.setAttribute("aria-label", "Content area");
    scheduleSplashFit();
  } else {
    contentArea.classList.add("content-area--framed");
    const frame = document.createElement("iframe");
    frame.className = "content-area__frame";
    frame.src = destination.src;
    frame.title = destination.title;
    frame.setAttribute("loading", "eager");
    frame.setAttribute("allowtransparency", "true");
    frame.style.backgroundColor = "transparent";
    frame.style.colorScheme = "normal";
    activeContentFrame = frame;
    frame.addEventListener("load", () => {
      try {
        frame.contentDocument
          ?.querySelectorAll(".starfield-background, .top-bar-frame")
          .forEach(element => element.remove());
      } catch (_) {}
    });
    contentArea.replaceChildren(frame);
    contentArea.setAttribute("aria-label", destination.title + " content");
  }

  shellSection = section;
  shellHistoryWindow.document.title = section === "main"
    ? "theinternetisdead.org"
    : `TheInternetIsDead.org - ${destination.title}`;
  const currentShellRoute = shellHistoryWindow.location.pathname
    + shellHistoryWindow.location.search
    + shellHistoryWindow.location.hash;
  if (historyMode !== "none" && currentShellRoute !== destination.path) {
    shellHistoryWindow.history[historyMode === "replace" ? "replaceState" : "pushState"](
      { shellSection: section },
      "",
      destination.path
    );
  }
  syncTopNavSection();
}

function setShellSection(section, historyMode = "push") {
  if (!shellSections[section]) section = "main";
  setShellRoute({ ...shellSections[section], section }, historyMode);
}

topNavFrame.addEventListener("load", syncTopNavSection);
shellHistoryWindow.addEventListener("popstate", () => {
  setShellRoute(routeFromPath(shellHistoryWindow.location.pathname), "none");
});

function selectionTouchesSplash() {
  const selection = window.getSelection();
  if (!selection || selection.isCollapsed || !selection.toString().trim()) return false;

  for (let index = 0; index < selection.rangeCount; index++) {
    const range = selection.getRangeAt(index);
    if (range.intersectsNode(splashContent)) return true;
  }

  return false;
}

function triggerSplashSelectionMessage() {
  splashSelectionTimer = 0;
  if (!selectionTouchesSplash()) return;

  const context = ensureSplashAudioContext();
  if (!context) return;

  starfieldPaused = true;
  splashSelectionMessageActive = true;
  cancelSplashReadAloud();
  if (splashFitFrame) cancelAnimationFrame(splashFitFrame);
  splashContent.classList.add("splash-content--idle-message");

  const message = document.createElement("div");
  message.className = "splash-selection-message";
  splashContent.append(message);
  const run = ++splashCycleRun;
  cycleSelectionSplashes(run, message);
}

function restoreSplashAfterSelection() {
  if (!splashSelectionMessageActive) return;

  splashCycleRun++;
  stopSplashAudio();
  starfieldPaused = false;
  splashSelectionMessageActive = false;
  splashContent.classList.remove("splash-content--idle-message");
  splashContent.querySelector(".splash-selection-message")?.remove();
  window.getSelection()?.removeAllRanges();
  scheduleSplashFit();
}

function watchSplashSelection() {
  clearTimeout(splashSelectionTimer);
  splashSelectionTimer = 0;

  const hasSplashSelection = selectionTouchesSplash();

  if (splashSelectionMessageActive) {
    if (!hasSplashSelection) restoreSplashAfterSelection();
    return;
  }

  if (hasSplashSelection) {
    splashSelectionTimer = window.setTimeout(triggerSplashSelectionMessage, 11000);
  }
}

document.addEventListener("selectionchange", watchSplashSelection);
["pointerdown", "keydown", "wheel", "touchstart"].forEach(eventName => {
  window.addEventListener(eventName, () => {
    ensureSplashAudioContext();
    watchSplashSelection();
  }, { passive: true });
});
window.addEventListener("click", () => {
  if (splashSelectionMessageActive) restoreSplashAfterSelection();
}, true);

document.body.style.touchAction = "none";
canvas.style.touchAction = "none";

// Mirrors the old runtime helper used by the starfield setup.
function rand(min, max){
  return min + Math.random() * (max - min);
}

/* =======================
   Parallax Starfield
======================= */
const starLayers = [
  { count: 180, baseSpeedY: 40,  parallaxX: 0.35, sizeMin: 1, sizeMax: 2 },
  { count: 120, baseSpeedY: 80,  parallaxX: 0.60, sizeMin: 1, sizeMax: 3 },
  { count: 70,  baseSpeedY: 140, parallaxX: 0.90, sizeMin: 2, sizeMax: 4 }
];

let stars = [];
let playerVxSmoothed = 0;
let starfieldReady = false;
let time = 0;
let last = performance.now();
let externalParallaxActive = false;
let externalParallaxX = 0;
let surfacePointerFrame = 0;
let surfacePointerActive = false;
let surfacePointerType = "mouse";
let surfacePointerX = 0;
let surfacePointerY = 0;

// In the original game this value was passed into updateStarfield().
// This preserves the same visual scale for the menu/start-screen idle sway.
const playerSpeed = 7;

// Use the start-menu / non-playing idle sway, because this file has no
// gameplay input. To mimic gameplay with no left/right movement, set this to 0.
const MENU_IDLE_SWAY_STRENGTH = 0.15;

window.addEventListener("message", event => {
  if (event.origin !== window.location.origin) return;
  if (!event.data) return;

  if (event.data.type === "portal-user-click") {
    if (splashSelectionMessageActive) restoreSplashAfterSelection();
    return;
  }

  if (event.data.type === "portal-shell-section" && event.source === topNavFrame.contentWindow) {
    setShellSection(event.data.section);
    return;
  }

  if (event.data.type === "portal-shell-route" && event.source === bottomNavFrame.contentWindow) {
    setShellRoute(routeFromPath(event.data.path));
    return;
  }

  if (
    event.data.type === "portal-shell-route" &&
    activeContentFrame &&
    event.source === activeContentFrame.contentWindow
  ) {
    setShellRoute(routeFromPath(event.data.path));
    return;
  }

  if (event.data.type === "top-nav-sidebar") {
    document.getElementById("top-nav-frame").classList.toggle("sidebar-open", Boolean(event.data.open));
    return;
  }

  if (event.data.type !== "portal-starfield-parallax") return;

  externalParallaxActive = Boolean(event.data.active);
  externalParallaxX = Math.max(-1, Math.min(1, Number(event.data.x) || 0));
});

function publishSurfacePointer(){
  surfacePointerFrame = 0;
  try {
    window.parent.postMessage({
      type: "portal-surface-pointer",
      active: surfacePointerActive,
      pointerType: surfacePointerType,
      x: surfacePointerX,
      y: surfacePointerY
    }, window.location.origin);
  } catch (_) {}
}

function updateSurfacePointer(event, active = true){
  surfacePointerActive = active;
  surfacePointerType = event.pointerType || surfacePointerType;
  surfacePointerX = Math.max(-1, Math.min(1, event.clientX / window.innerWidth * 2 - 1));
  surfacePointerY = Math.max(-1, Math.min(1, event.clientY / window.innerHeight * 2 - 1));
  externalParallaxActive = active;
  externalParallaxX = surfacePointerX;
  if (!surfacePointerFrame) surfacePointerFrame = requestAnimationFrame(publishSurfacePointer);
}

window.addEventListener("pointermove", event => updateSurfacePointer(event));
window.addEventListener("pointerdown", event => updateSurfacePointer(event));
window.addEventListener("pointerup", event => {
  if (event.pointerType !== "mouse") updateSurfacePointer(event, false);
});
window.addEventListener("pointercancel", event => updateSurfacePointer(event, false));
window.addEventListener("pointerleave", event => {
  surfacePointerActive = false;
  surfacePointerType = event.pointerType || surfacePointerType;
  externalParallaxActive = false;
  if (!surfacePointerFrame) surfacePointerFrame = requestAnimationFrame(publishSurfacePointer);
});

function resetStarfield(){
  stars = starLayers.map(layer => {
    const arr = [];
    for (let i = 0; i < layer.count; i++){
      arr.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        s: rand(layer.sizeMin, layer.sizeMax),
        vyMul: rand(0.7, 1.3)
      });
    }
    return arr;
  });
  starfieldReady = true;
}

function updateStarfield(dt){
  if (!starfieldReady) return;

  // Portal pointer input uses the same left/right intent and smoothing path as
  // player movement in shooter-game. Without external input, preserve the
  // original non-playing/start-menu idle sway.
  const vxIntent = externalParallaxActive
    ? externalParallaxX
    : MENU_IDLE_SWAY_STRENGTH * Math.sin(time * 0.6);

  const targetVx = vxIntent * playerSpeed * 55;
  playerVxSmoothed += (targetVx - playerVxSmoothed) * Math.min(1, dt * 8);

  for (let li = 0; li < starLayers.length; li++){
    const layer = starLayers[li];
    const arr = stars[li];

    const driftX = -playerVxSmoothed * layer.parallaxX;
    const driftY = layer.baseSpeedY;

    for (const st of arr){
      st.x += driftX * dt;
      st.y += driftY * st.vyMul * dt;

      if (st.y > canvas.height + 10) st.y = -10;
      if (st.x < -10) st.x = canvas.width + 10;
      if (st.x > canvas.width + 10) st.x = -10;
    }
  }
}

function drawStarfield(){
  // Source game default: black, unless a runtime override or Stage 2+ red shift exists.
  // This extraction keeps the normal start-menu / early-game background.
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (!starfieldReady) return;

  for (let li = 0; li < starLayers.length; li++){
    const arr = stars[li];
    const alpha = li === 0 ? 0.35 : (li === 1 ? 0.55 : 0.85);

    ctx.fillStyle = `rgba(255,255,255,${alpha})`;

    for (const st of arr){
      ctx.fillRect(st.x, st.y, st.s, st.s);
    }
  }
}

/* =======================
   Resize
======================= */
function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  resetStarfield();
}
window.addEventListener("resize", resize);

function frame(now){
  if (starfieldPaused) {
    last = now;
    requestAnimationFrame(frame);
    return;
  }

  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  time += dt;

  updateStarfield(dt);
  drawStarfield();

  requestAnimationFrame(frame);
}

resize();
setShellRoute(initialShellRoute, "replace");
requestAnimationFrame(frame);
</script>
