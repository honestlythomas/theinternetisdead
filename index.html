<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>The Internet Is Dead...</title>
  <style>
    :root {
      --lime: #39ff14;
      --magenta: #ff00ff;
      --black: #000;
      --purple-rgb: 81, 42, 103;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
      background: var(--black);
      font-family: "Courier New", Courier, monospace;
      touch-action: pan-x pan-y pinch-zoom;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    .foreground-layer {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      padding: 25px;
    }

    .page-spin-stage {
      position: fixed;
      inset: 0;
      z-index: 2;
      transform-origin: 50% 50%;
      pointer-events: none;
    }

    .page-spin-stage.is-wheel-spinning {
      animation: wheel-of-fortune-spin 1.2s linear infinite;
    }

    .page-spin-stage.is-warping {
      animation: page-warp-tunnel 1.35s ease-in-out infinite;
      filter: saturate(1.75) hue-rotate(0deg);
    }

    .top-center.barrel-roll {
      animation: barrel-roll 1.15s ease-in-out;
    }

    .foreground-layer a,
    .foreground-layer button,
    .foreground-layer select {
      pointer-events: auto;
    }

    @keyframes barrel-roll {
      0% {
        transform: rotate(0deg) scale(1);
      }
      16% {
        transform: rotate(55deg) scale(0.72, 0.78);
      }
      34% {
        transform: rotate(125deg) scale(0.46, 0.52);
      }
      50% {
        transform: rotate(180deg) scale(0.28, 0.32);
      }
      66% {
        transform: rotate(245deg) scale(0.52, 0.46);
      }
      84% {
        transform: rotate(320deg) scale(0.82, 0.72);
      }
      100% {
        transform: rotate(360deg) scale(1);
      }
    }

    @keyframes wheel-of-fortune-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes page-warp-tunnel {
      0% {
        transform: perspective(760px) translateZ(0) rotate(0deg) scale(1);
        filter: saturate(1.55) hue-rotate(0deg);
      }
      42% {
        transform: perspective(760px) translateZ(140px) rotate(38deg) scale(1.28);
        filter: saturate(2.15) hue-rotate(135deg);
      }
      72% {
        transform: perspective(760px) translateZ(-80px) rotate(268deg) scale(0.72);
        filter: saturate(2.4) hue-rotate(245deg);
      }
      100% {
        transform: perspective(760px) translateZ(0) rotate(360deg) scale(1);
        filter: saturate(1.55) hue-rotate(360deg);
      }
    }

    .warp-background-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      z-index: 1;
      display: none;
      pointer-events: none;
      background: #004e2f;
    }

    .warp-background-frame.is-active {
      display: block;
    }

    .page-rainbow-filter {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      pointer-events: none;
      backdrop-filter: hue-rotate(0deg) saturate(1.8);
      -webkit-backdrop-filter: hue-rotate(0deg) saturate(1.8);
      animation: page-rainbow-filter var(--page-rainbow-duration, 6s) linear infinite;
    }

    .page-rainbow-filter.is-active {
      display: block;
    }

    @keyframes page-rainbow-filter {
      to {
        backdrop-filter: hue-rotate(360deg) saturate(1.8);
        -webkit-backdrop-filter: hue-rotate(360deg) saturate(1.8);
      }
    }

    .page-dvd-overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      overflow: hidden;
      pointer-events: none;
    }

    .page-dvd-overlay.is-active {
      display: block;
    }

    .page-dvd-logo {
      position: absolute;
      left: 0;
      top: 0;
      width: min(22vw, 180px);
      height: auto;
      opacity: 0.96;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
      filter: hue-rotate(0deg) drop-shadow(0 0 10px rgba(255, 255, 255, 0.28));
      transform: translate3d(0, 0, 0);
      will-change: transform, filter;
    }

    .background-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      z-index: 0;
      pointer-events: none;
    }

    .top-row {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 50px minmax(0, 1fr) 50px;
      align-items: start;
      column-gap: 16px;
      height: calc(100vh - 50px);
      pointer-events: none;
    }

    .home-skull {
      position: relative;
      width: 50px;
      height: 50px;
      min-width: 50px;
      min-height: 50px;
      max-width: 50px;
      max-height: 50px;
      aspect-ratio: 1 / 1;
      display: block;
      overflow: visible;
      text-decoration: none;
      font-size: 0;
    }

    .home-skull span {
      position: absolute;
      top: 0;
      left: 0;
      width: 50px;
      height: 50px;
      display: block;
      font-size: 50px;
      line-height: 50px;
      text-align: left;
      transform: translate(-9px, -2px);
    }

    .top-gear {
      position: relative;
      width: 50px;
      height: 50px;
      min-width: 50px;
      min-height: 50px;
      max-width: 50px;
      max-height: 50px;
      aspect-ratio: 1 / 1;
      display: block;
      overflow: visible;
      text-decoration: none;
      font-size: 0;
      cursor: pointer;
      pointer-events: auto;
    }

    .top-gear span {
      position: absolute;
      top: 0;
      right: 0;
      width: 50px;
      height: 50px;
      display: block;
      font-size: 50px;
      line-height: 50px;
      text-align: right;
      transform: translate(4px, -2px);
    }

    .top-gear::after {
      content: "✓";
      position: absolute;
      top: calc(50% + 1px);
      left: calc(50% + 13px);
      display: none;
      color: var(--lime);
      font-family: "Courier New", Courier, monospace;
      font-size: 22px;
      font-weight: 900;
      line-height: 1;
      text-shadow:
        0 0 2px var(--black),
        0 0 6px var(--lime),
        1px 1px 0 var(--black),
        -1px -1px 0 var(--black);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .top-gear.is-saved-selection::after {
      display: block;
    }

    .top-gear.is-default-saved span {
      animation: star-default-saved 260ms ease-out;
    }

    @keyframes star-default-saved {
      0% {
        transform: translate(4px, -2px) scale(1);
      }
      48% {
        transform: translate(4px, -2px) scale(1.28);
      }
      100% {
        transform: translate(4px, -2px) scale(1);
      }
    }

    .top-center {
      width: 100%;
      min-width: 0;
      height: calc(100vh - 50px);
      max-height: calc(100vh - 50px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 13px;
      padding: 6px 6px 92px;
      scroll-padding: 6px 6px 92px;
      text-align: center;
      overflow-x: hidden;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      touch-action: pan-x pan-y pinch-zoom;
      -webkit-overflow-scrolling: touch;
      transform-origin: 50% 50%;
      pointer-events: auto;
    }

    .top-center::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    .top-center.is-panel-mode {
      padding-bottom: 6px;
      scroll-padding-bottom: 6px;
    }

    .title-box {
      flex: 0 0 auto;
      width: 100%;
      max-width: none;
      min-width: 0;
      display: block;
      padding: 6px clamp(14px, 3vw, 32px);
      border: 3px solid var(--lime);
      background: rgba(var(--purple-rgb), 0.5);
      color: var(--lime);
      font-weight: 700;
      font-size: clamp(1.15rem, 3.2vw, 2.45rem);
      line-height: 1;
      text-shadow:
        0 0 6px var(--lime),
        0 0 18px rgba(57, 255, 20, 0.7),
        2px 2px 0 var(--black);
      letter-spacing: 0.04em;
      overflow: visible;
      text-overflow: clip;
    }

    .title-box div {
      white-space: nowrap;
    }

    .title-speech-line {
      pointer-events: auto;
      cursor: default;
    }

    .title-line-with-clock {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      gap: 0.55ch;
      max-width: 100%;
    }

    .title-clock-line {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      gap: 0.55ch;
      max-width: 100%;
    }

    .title-clock {
      display: inline-flex;
      align-items: baseline;
      color: inherit;
      font: inherit;
      font-weight: inherit;
      line-height: inherit;
      letter-spacing: inherit;
      white-space: nowrap;
    }

    .title-clock-period {
      margin-left: 0;
    }

    .mobile-title-line {
      display: none;
    }

    .action-row {
      width: calc(100% - 4px);
      flex: 0 1 auto;
      min-width: 0;
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      margin: 0 2px;
    }

    .action-stack {
      width: 100%;
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 13px;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .action-stack.is-frame-active {
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }

    .action-label {
      flex: 0 0 auto;
      color: var(--magenta);
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(0.82rem, 1.8vw, 1.1rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1;
      text-shadow: 0 0 6px rgba(255, 0, 255, 0.8);
      white-space: nowrap;
    }

    .action-select,
    .go-button {
      height: 34px;
      border: 2px solid var(--lime);
      background-color: var(--black);
      color: var(--magenta) !important;
      -webkit-text-fill-color: var(--magenta);
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(0.78rem, 1.7vw, 1rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-shadow: 0 0 6px rgba(255, 0, 255, 0.8);
      box-shadow: 0 0 10px rgba(57, 255, 20, 0.35);
    }

    .action-select option {
      background-color: var(--black);
      color: var(--magenta);
      -webkit-text-fill-color: var(--magenta);
    }

    .action-select:focus,
    .go-button:focus,
    .go-button:hover {
      color: var(--magenta) !important;
      -webkit-text-fill-color: var(--magenta);
      border-color: var(--lime);
      outline: 0;
      box-shadow:
        0 0 0 2px var(--magenta),
        0 0 10px rgba(57, 255, 20, 0.35);
    }

    .action-select {
      flex: 1 1 auto;
      min-width: 0;
      padding: 0 32px 0 12px;
      appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--lime) 50%),
        linear-gradient(135deg, var(--lime) 50%, transparent 50%);
      background-position:
        calc(100% - 20px) 12px,
        calc(100% - 13px) 12px;
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
    }

    .go-button {
      flex: 0 0 clamp(58px, 7vw, 82px);
      width: clamp(58px, 7vw, 82px);
      padding: 0 12px;
      cursor: default;
    }

    .lorem-placeholder {
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      margin-top: 0;
      padding: 12px 14px;
      border: 2px solid var(--lime);
      background: rgba(var(--purple-rgb), 0.5);
      color: var(--magenta);
      font-family: "Courier New", Courier, monospace;
      text-align: left;
      box-shadow: 0 0 10px rgba(57, 255, 20, 0.25);
      overflow: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .lorem-placeholder::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    .lorem-placeholder .signal-form {
      min-height: 100%;
      width: min(100%, 420px);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      box-sizing: border-box;
    }

    .lorem-placeholder .signal-form input,
    .lorem-placeholder .signal-form textarea {
      width: 100%;
      box-sizing: border-box;
      border: 2px solid var(--lime);
      background: var(--black);
      color: var(--lime);
      font: inherit;
      padding: 8px;
      outline: none;
      box-shadow: inset 0 0 8px rgba(57, 255, 20, 0.18);
    }

    .lorem-placeholder .signal-form input::placeholder,
    .lorem-placeholder .signal-form textarea::placeholder {
      color: rgba(57, 255, 20, 0.72);
      opacity: 1;
    }

    .lorem-placeholder .signal-form textarea {
      min-height: 86px;
      resize: vertical;
    }

    .lorem-placeholder .signal-form button {
      align-self: center;
      border: 2px solid var(--lime);
      background: rgba(var(--purple-rgb), 0.8);
      color: var(--lime);
      font: inherit;
      font-weight: 700;
      padding: 8px 16px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(57, 255, 20, 0.35);
    }

    .lorem-placeholder .signal-form button:focus,
    .lorem-placeholder .signal-form button:hover {
      background: var(--black);
      text-shadow: 0 0 6px var(--lime);
    }

    .lorem-placeholder.is-frame {
      flex: 1 1 auto;
      min-height: 0;
      padding: 0;
      overflow: hidden;
    }

    .content-frame {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 0;
      border: 0;
      background: transparent;
      pointer-events: auto;
    }

    .game-player-overlay {
      position: fixed;
      top: 25px;
      right: 91px;
      bottom: 91px;
      left: 91px;
      z-index: 5;
      display: none;
      border: 2px solid var(--lime);
      background: var(--black);
      box-shadow:
        0 0 0 2px var(--black),
        0 0 18px rgba(57, 255, 20, 0.45);
      pointer-events: auto;
    }

    .game-player-overlay.is-active {
      display: block;
    }

    .foreground-layer.is-game-active .top-center {
      visibility: hidden;
      pointer-events: none;
    }

    .foreground-layer.is-game-active .game-player-overlay,
    .foreground-layer.is-game-active .home-skull,
    .foreground-layer.is-game-active .top-gear,
    .foreground-layer.is-game-active .bottom-emoji,
    .foreground-layer.is-game-active .game-player-back {
      visibility: visible;
      pointer-events: auto;
    }

    .game-player-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--black);
    }

    .game-player-back {
      position: fixed;
      left: 50%;
      bottom: 25px;
      z-index: 6;
      display: none;
      transform: translateX(-50%);
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--lime);
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(0.9rem, 2.2vw, 1.2rem);
      font-weight: 700;
      line-height: 50px;
      cursor: pointer;
      text-align: center;
      text-shadow:
        0 0 6px var(--lime),
        0 0 18px rgba(57, 255, 20, 0.7),
        2px 2px 0 var(--black);
    }

    .foreground-layer.is-game-active .game-player-back {
      display: block;
    }

    .game-player-back:hover,
    .game-player-back:focus-visible {
      outline: 0;
      color: var(--magenta);
      text-shadow:
        0 0 6px var(--magenta),
        0 0 18px rgba(255, 0, 255, 0.7),
        2px 2px 0 var(--black);
    }

    .lorem-placeholder header {
      margin: 0 0 12px;
      padding: 0 0 10px;
      border-bottom: 2px solid var(--lime);
    }

    .lorem-placeholder .kicker,
    .lorem-placeholder h3,
    .lorem-placeholder strong,
    .lorem-placeholder .stamp {
      color: var(--lime);
      font-family: "Courier New", Courier, monospace;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-shadow: 0 0 6px rgba(57, 255, 20, 0.8);
    }

    .lorem-placeholder .kicker {
      margin: 0 0 6px;
      font-size: clamp(0.58rem, 1vw, 0.72rem);
    }

    .lorem-placeholder h1,
    .lorem-placeholder h2,
    .lorem-placeholder h3 {
      margin: 0;
      line-height: 1.05;
    }

    .lorem-placeholder h1 {
      color: var(--lime);
      font-size: clamp(1.25rem, 3vw, 2.2rem);
      letter-spacing: -0.04em;
      text-shadow:
        0 0 6px var(--lime),
        0 0 14px rgba(57, 255, 20, 0.65),
        2px 2px 0 var(--black);
    }

    .lorem-placeholder h2 {
      margin: 18px 0 8px;
      color: var(--lime);
      font-size: clamp(0.92rem, 1.8vw, 1.2rem);
      letter-spacing: 0.02em;
      text-shadow: 0 0 6px rgba(57, 255, 20, 0.8);
    }

    .lorem-placeholder h3 {
      margin: 0 0 6px;
      font-size: clamp(0.68rem, 1.3vw, 0.86rem);
    }

    .lorem-placeholder p,
    .lorem-placeholder li,
    .lorem-placeholder blockquote {
      color: var(--magenta);
      font-size: clamp(0.62rem, 1.12vw, 0.8rem);
      line-height: 1.32;
      letter-spacing: 0.02em;
      text-shadow: 0 0 5px rgba(255, 0, 255, 0.65);
    }

    .lorem-placeholder p {
      margin: 0 0 9px;
    }

    .lorem-placeholder .subtitle {
      margin-top: 8px;
    }

    .lorem-placeholder a,
    .lorem-placeholder code {
      color: var(--lime);
    }

    .lorem-placeholder code {
      padding: 0 4px;
      border: 1px solid var(--lime);
      background: var(--black);
      text-shadow: none;
    }

    .lorem-placeholder .notice,
    .lorem-placeholder .abstract,
    .lorem-placeholder blockquote,
    .lorem-placeholder .card,
    .lorem-placeholder .signature {
      margin: 12px 0;
      padding: 10px;
      border: 2px solid var(--lime);
      background: rgba(0, 0, 0, 0.45);
      box-shadow: 0 0 8px rgba(57, 255, 20, 0.2);
    }

    .lorem-placeholder .abstract {
      border-left-width: 6px;
    }

    .lorem-placeholder blockquote {
      border-color: var(--magenta);
      font-style: italic;
    }

    .lorem-placeholder ol,
    .lorem-placeholder ul {
      margin: 8px 0 10px;
      padding-left: 20px;
    }

    .lorem-placeholder li {
      margin-bottom: 7px;
    }

    .lorem-placeholder .principles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .lorem-placeholder .card {
      margin: 0;
    }

    .game-card-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .game-card {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      min-width: 0;
      overflow: hidden;
      border: 2px solid var(--lime);
      background: rgba(0, 0, 0, 0.45);
      color: var(--lime);
      text-decoration: none;
      box-shadow: 0 0 8px rgba(57, 255, 20, 0.2);
    }

    .game-card[href]:hover,
    .game-card[href]:focus-visible {
      outline: 0;
      box-shadow:
        0 0 0 2px var(--magenta),
        0 0 12px rgba(57, 255, 20, 0.35);
    }

    .game-card img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-bottom: 2px solid var(--lime);
      background: var(--black);
    }

    .game-card h2 {
      margin: 0;
      padding: 9px 10px;
      color: var(--lime);
      font-size: clamp(0.7rem, 1.3vw, 0.95rem);
      line-height: 1.12;
      letter-spacing: 0;
      text-shadow: 0 0 6px rgba(57, 255, 20, 0.8);
    }

    .lorem-placeholder .stamp {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 7px;
      border: 2px solid var(--magenta);
      color: var(--magenta);
      transform: rotate(-1.5deg);
    }


    .bottom-emoji {
      position: fixed;
      bottom: 25px;
      z-index: 2;
      width: 50px;
      height: 50px;
      min-width: 50px;
      min-height: 50px;
      max-width: 50px;
      max-height: 50px;
      aspect-ratio: 1 / 1;
      display: block;
      overflow: visible;
      border: 0;
      padding: 0;
      background: transparent;
      font-size: 0;
      pointer-events: none;
    }

    .bottom-emoji > span {
      position: absolute;
      bottom: 0;
      width: 50px;
      height: 50px;
      display: block;
      font-size: 50px;
      line-height: 50px;
    }

    .bottom-left {
      left: 25px;
    }

    .ghost-counter-trigger {
      cursor: pointer;
      pointer-events: auto;
      color: var(--lime);
      font-family: "Courier New", Courier, monospace;
      font-weight: 700;
      text-shadow:
        0 0 6px var(--lime),
        0 0 18px rgba(57, 255, 20, 0.7),
        2px 2px 0 var(--black);
    }

    .ghost-counter-trigger:focus-visible {
      outline: 0;
    }

    .ghost-counter-trigger.is-counter {
      width: 50px;
      min-width: 50px;
      max-width: 50px;

    function updateTitleClock() {
      const clocks = document.querySelectorAll('.title-clock');
      if (!clocks.length) return;

      const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'America/Toronto',
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      }).formatToParts(new Date());

      const timeText = parts
        .filter((part) => part.type !== 'dayPeriod')
        .map((part) => part.value)
        .join('')
        .trim();
      const dayPeriod = (parts.find((part) => part.type === 'dayPeriod')?.value || '')
        .toLowerCase()
        .replace(/\./g, '');
      const label = `${timeText} ${dayPeriod}`.trim();

      clocks.forEach((clock) => {
        const timeEl = clock.querySelector('.title-clock-time');
        const periodEl = clock.querySelector('.title-clock-period');
        if (timeEl) timeEl.textContent = timeText;
        if (periodEl) periodEl.textContent = dayPeriod;
        clock.setAttribute('aria-label', label);
      });
    }

    function getTitleSpeechText(line) {
      if (line.hasAttribute('data-title-speech-clock')) {
        const clock = line.querySelector('.title-clock');
        const time = clock ? clock.getAttribute('aria-label') : '';
        return `The time is ${time}`.trim();
      }

      return line.getAttribute('data-title-speech') || line.textContent.trim();
    }

    function updateTitleSpeechVoice() {
      if (!('speechSynthesis' in window)) return;

      const voices = window.speechSynthesis.getVoices();
      titleSpeechVoice = voices.find((voice) => /microsoft david/i.test(voice.name)) || null;
    }

    function stopTitleSpeech() {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
    }

    function speakTitleLine(line) {
      if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') return;

      const text = getTitleSpeechText(line);
      if (!text) return;

      stopTitleSpeech();
      updateTitleSpeechVoice();

      const utterance = new SpeechSynthesisUtterance(text);
      if (titleSpeechVoice) utterance.voice = titleSpeechVoice;
      utterance.rate = 0.9;
      utterance.pitch = 1;
      window.speechSynthesis.speak(utterance);
    }

    function setupTitleSpeech() {
      const lines = document.querySelectorAll('.title-speech-line');
      if (!lines.length || !('speechSynthesis' in window)) return;

      updateTitleSpeechVoice();
      window.speechSynthesis.onvoiceschanged = updateTitleSpeechVoice;

      lines.forEach((line) => {
        line.addEventListener('pointerenter', () => speakTitleLine(line));
        line.addEventListener('pointerleave', stopTitleSpeech);
        line.addEventListener('pointercancel', stopTitleSpeech);
        line.addEventListener('focus', () => speakTitleLine(line));
        line.addEventListener('blur', stopTitleSpeech);
      });
    }

    function hasThanksMessage() {
      return new URLSearchParams(window.location.search).get('msg') === 'thanks';

      const legacyActions = {
        'Ask me anything.': 'Ask me anything ❓',
        'Chat with weirdos.': 'Chat with weirdos 💬',
        'Enter a random dimension.': 'Enter a random dimension 🌀',
        'Listen to my music.': 'Listen to my music 🎵',
        'Look at the main page.': 'Look at the main page 🏠',
        'Play my web games.': 'Play my web games 🎮',
        'Watch my videos.': 'Watch my videos 📺'
      };
      return legacyActions[value] || value;
    }

    function hasActionOption(value) {
      const normalizedValue = normalizeActionValue(value);
      return Array.from(actionSelect.options).some((option) => option.value === normalizedValue);
    }

    function getSavedDefaultAction() {
      try {
        const savedAction = normalizeActionValue(window.localStorage.getItem(defaultActionStorageKey));
        return savedAction && hasActionOption(savedAction) ? savedAction : '';
      } catch (error) {
        return '';
      }
    }

    function saveDefaultActionSelection() {
      const selectedAction = actionSelect.value;
      try {
        window.localStorage.setItem(defaultActionStorageKey, selectedAction);
      } catch (error) {
      }

      topGear.classList.remove('is-default-saved');
      void topGear.offsetWidth;
      topGear.classList.add('is-default-saved');
      updateSavedSelectionIndicator();
    }

    function applySavedDefaultAction() {
      if (hasThanksMessage()) return;
      const savedAction = getSavedDefaultAction();
      if (savedAction) {
        actionSelect.value = savedAction;
      }
    }

    function updateSavedSelectionIndicator() {
      topGear.classList.toggle('is-saved-selection', getSavedDefaultAction() === actionSelect.value);
    }

      return String(value).replace(/[&<>"']/g, (character) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[character]));

              <h2>More coming soon...</h2>
            </article>
          </div>
        `;
        return;
      }

      if (selectedAction === 'Ask me anything ❓') {
        actionStack.classList.remove('is-frame-active');
        contentBox.classList.remove('is-frame');
        contentBox.setAttribute('aria-label', 'Ask me anything');
        if (hasThanksMessage()) {
          contentBox.innerHTML = `
            <header>
              <h1>SIGNAL RECEIVED</h1>
              <p class="subtitle">Your transmission made it through.</p>
            </header>
          `;
          return;
        }

        contentBox.innerHTML = `
          <form class="signal-form" action="https://formspree.io/f/mwvdqeao" method="POST">
            <input type="text" name="name" required placeholder="alias">
            <input type="text" name="contact" placeholder="contact info optional">
            <textarea name="message" required placeholder="transmit message..."></textarea>
            <input type="hidden" name="_subject" value="theinternetisdead.org signal">
            <input type="hidden" name="_redirect" value="/?msg=thanks">
            <button type="submit">SEND SIGNAL</button>
          </form>
        `;
        return;
      }

      actionStack.classList.remove('is-frame-active');
      contentBox.classList.remove('is-frame');
      contentBox.setAttribute('aria-label', selectedAction);
      contentBox.innerHTML = `
        <header>
          <h1>${escapeHtml(selectedAction)}</h1>
          <p class="subtitle">This channel is still tuning itself into existence.</p>
        </header>
      `;
    }

    function selectNextAction() {
      actionSelect.selectedIndex = (actionSelect.selectedIndex + 1) % actionSelect.options.length;
      renderActionSelection();
    }

    function selectRandomAction() {
      const options = Array.from(actionSelect.options);
      if (!options.length) return '';
      const candidates = options.length > 1
        ? options.filter((option) => option.value !== actionSelect.value)
        : options;
      const nextOption = candidates[Math.floor(Math.random() * candidates.length)];
      actionSelect.value = nextOption.value;
      renderActionSelection();
      return actionSelect.value;
    }

    function openGamePlayer(url, title) {
      gamePlayerFrame.src = url;
      gamePlayerFrame.title = title || 'Web game';
      foregroundLayer.classList.add('is-game-active');
      gamePlayerOverlay.classList.add('is-active');
      gamePlayerOverlay.setAttribute('aria-hidden', 'false');
      gamePlayerBack.focus({ preventScroll: true });
    }

    function closeGamePlayer() {
      gamePlayerOverlay.classList.remove('is-active');
      foregroundLayer.classList.remove('is-game-active');
      gamePlayerOverlay.setAttribute('aria-hidden', 'true');
      gamePlayerFrame.removeAttribute('src');

    function setPageRainbowFilter({ active = true, speed = 1, toggle = false } = {}) {
      if (!pageRainbowFilter) return;
      pageRainbowActive = toggle ? !pageRainbowActive : !!active;
      const numericSpeed = Number(speed);
      const safeSpeed = Number.isFinite(numericSpeed) && numericSpeed > 0 ? Math.min(20, Math.max(0.05, numericSpeed)) : 1;
      pageRainbowFilter.style.setProperty('--page-rainbow-duration', `${6 / safeSpeed}s`);
      pageRainbowFilter.classList.toggle('is-active', pageRainbowActive);
    }

    function positionPageDvdInstance(instance, force = false) {
      if (!instance || !instance.el || !pageDvdOverlay) return;
      const viewportWidth = Math.max(window.innerWidth || 0, document.documentElement.clientWidth || 0, 1);
      const viewportHeight = Math.max(window.innerHeight || 0, document.documentElement.clientHeight || 0, 1);
      const logoRect = instance.el.getBoundingClientRect();
      const logoWidth = Math.max(logoRect.width || instance.el.offsetWidth || 180, 1);
      const logoHeight = Math.max(logoRect.height || instance.el.offsetHeight || Math.round(logoWidth * 0.45), 1);
      const maxX = Math.max(0, viewportWidth - logoWidth);
      const maxY = Math.max(0, viewportHeight - logoHeight);

      instance.x = Math.min(Math.max(instance.x, 0), maxX);
      instance.y = Math.min(Math.max(instance.y, 0), maxY);
      if (force) instance.initialized = true;

      instance.el.style.transform = `translate3d(${instance.x}px, ${instance.y}px, 0)`;
      instance.el.style.filter = `hue-rotate(${instance.hue}deg) drop-shadow(0 0 10px rgba(255, 255, 255, 0.28))`;
    }

    function stepPageDvdAnimation(now) {
      if (!pageDvdOverlay || !pageDvdInstances.length) {
        pageDvdAnimationFrameId = null;
        return;
      }

      if (!pageDvdLastTime) pageDvdLastTime = now;
      const deltaMs = Math.min(32, Math.max(0, now - pageDvdLastTime));
      pageDvdLastTime = now;

      const viewportWidth = Math.max(window.innerWidth || 0, document.documentElement.clientWidth || 0, 1);
      const viewportHeight = Math.max(window.innerHeight || 0, document.documentElement.clientHeight || 0, 1);

      pageDvdInstances.forEach((instance) => {
        const logoRect = instance.el.getBoundingClientRect();
        const logoWidth = Math.max(logoRect.width || instance.el.offsetWidth || 180, 1);
        const logoHeight = Math.max(logoRect.height || instance.el.offsetHeight || Math.round(logoWidth * 0.45), 1);
        const maxX = Math.max(0, viewportWidth - logoWidth);
        const maxY = Math.max(0, viewportHeight - logoHeight);

        instance.x += instance.vx * deltaMs;
        instance.y += instance.vy * deltaMs;

        if (instance.x <= 0) {
          instance.x = 0;
          instance.vx = Math.abs(instance.vx);
        } else if (instance.x >= maxX) {
          instance.x = maxX;
          instance.vx = -Math.abs(instance.vx);
        }

        if (instance.y <= 0) {
          instance.y = 0;
          instance.vy = Math.abs(instance.vy);
        } else if (instance.y >= maxY) {
          instance.y = maxY;
          instance.vy = -Math.abs(instance.vy);
        }

        instance.hue = (instance.hue + ((pageDvdHueShiftSpeedDegPerSecond * deltaMs) / 1000)) % 360;
        positionPageDvdInstance(instance);
      });

      pageDvdAnimationFrameId = requestAnimationFrame(stepPageDvdAnimation);
    }

    function getPageDumpImageSource(item) {
      const rawPath = String(item && (item.path || item.src || item.file) || '').trim();
      if (!rawPath) return '';
      try {
        return new URL(rawPath, pageDumpImageIndexBaseUrl).href;
      } catch (error) {
        return '';
      }
    }

    async function loadPageDumpImages() {
      const response = await fetch(pageDumpImageIndexUrl, { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const items = await response.json();
      if (!Array.isArray(items)) return [];
      return items
        .map((item) => ({
          src: getPageDumpImageSource(item),
          alt: String(item && (item.title || item.file) || 'Dump image').trim() || 'Dump image'
        }))
        .filter((item) => item.src);
    }

    function spawnPageDvdLogo(source = pageDvdDefaultSource, alt = 'DVD logo', options = {}) {
      if (!pageDvdOverlay) return false;
      if (options.enforceLimit !== false && pageDvdInstances.length >= pageDvdMaxInstances) return false;

      const index = pageDvdInstances.length;
      const img = document.createElement('img');
      img.className = 'page-dvd-logo';
      img.alt = alt;
      img.referrerPolicy = 'no-referrer';
      img.crossOrigin = 'anonymous';
      img.dataset.dvdId = `page-dvd-${++pageDvdLogoCounter}`;

      const instance = {
        id: img.dataset.dvdId,
        el: img,
        x: 24 + ((index * 37) % 320),
        y: 24 + ((index * 29) % 220),
        vx: (index % 2 === 0 ? 1 : -1) * (0.065 + (index * 0.009)),
        vy: (index % 3 === 0 ? -1 : 1) * (0.055 + (index * 0.008)),
        hue: (index * 36) % 360
      };

      img.src = source;
      img.onload = () => positionPageDvdInstance(instance, true);
      pageDvdInstances.push(instance);
      pageDvdOverlay.appendChild(img);
      pageDvdOverlay.classList.add('is-active');
      pageDvdOverlay.setAttribute('aria-hidden', 'false');
      positionPageDvdInstance(instance, true);
      pageDvdLastTime = 0;
      if (pageDvdAnimationFrameId === null) {
        pageDvdAnimationFrameId = requestAnimationFrame(stepPageDvdAnimation);
      }
      return true;
    }

    async function spawnPageDumpImages() {
      let items = [];
      try {
        items = await loadPageDumpImages();
      } catch (error) {
        console.error('Unable to load image dump:', error);
        return 0;
      }
      let spawnedCount = 0;
      items.forEach((item) => {
        if (spawnPageDvdLogo(item.src, item.alt, { enforceLimit: false })) spawnedCount += 1;
      });
      return spawnedCount;
    }

    function setWheelSpin(active) {
      wheelSpinActive = !!active;
      pageSpinStage.classList.toggle('is-wheel-spinning', wheelSpinActive);
      updateSpiralStopState();
      if (!wheelSpinActive) {
        spinClickTimestamps.length = 0;
      }
    }

    function setWarpMode(active) {
      warpActive = !!active;
      pageSpinStage.classList.toggle('is-warping', warpActive);
      warpBackgroundFrame.classList.toggle('is-active', warpActive);
      if (warpActive && !warpBackgroundFrame.getAttribute('src')) {
        warpBackgroundFrame.src = warpBackgroundSource;
      }
      if (!warpActive) {
        warpBackgroundFrame.removeAttribute('src');
      }
      updateSpiralStopState();
    }

    function stopSpiralEffects() {
      setWheelSpin(false);
      setWarpMode(false);
    }

    function updateSpiralStopState() {
      const active = wheelSpinActive || warpActive;
      barrelRollTriggerText.textContent = active ? stopSpinEmoji : spiralEmoji;
      barrelRollTrigger.setAttribute('aria-label', active ? 'Stop spinning' : 'Do a barrel roll');
      wheelStopTrigger.classList.toggle('is-active', active);
    }

    function activateWarpMode() {
      barrelRollLayer.classList.remove('barrel-roll');
      topCenter.style.removeProperty('transform');
      setWheelSpin(false);
      setWarpMode(true);
    }

    function handleSpiralClick(event) {
      if (suppressNextSpiralClick) {
        suppressNextSpiralClick = false;
        return;
      }

      if (wheelSpinActive || warpActive) {
        stopSpiralEffects();
        return;
      }

      if (event.shiftKey) {
        activateWarpMode();
        return;
      }

      const now = Date.now();
      spinClickTimestamps.push(now);
      while (spinClickTimestamps.length && now - spinClickTimestamps[0] > spinClickWindowMs) {
        spinClickTimestamps.shift();
      }

      if (spinClickTimestamps.length >= 3) {
        barrelRollLayer.classList.remove('barrel-roll');
        setWheelSpin(true);
        return;
      }

      barrelRollLayer.classList.remove('barrel-roll');
      void barrelRollLayer.offsetWidth;
      barrelRollLayer.classList.add('barrel-roll');
    }

    function clearWarpHoldTimer() {
      if (warpHoldTimerId !== null) {
        window.clearInterval(warpHoldTimerId);
        warpHoldTimerId = null;
      }
      warpHoldSeconds = 0;
      barrelRollTrigger.classList.remove('is-hold-counting');
      barrelRollTrigger.removeAttribute('data-hold-count');
      if (!warpActive) {
        topCenter.style.removeProperty('transform');
      }
    }

    function startWarpHoldTimer(event) {
      if (event.pointerType && !['mouse', 'touch', 'pen'].includes(event.pointerType)) return;
      if (wheelSpinActive || warpActive) return;
      clearWarpHoldTimer();
      barrelRollTrigger.classList.add('is-hold-counting');
      warpHoldTimerId = window.setInterval(() => {
        warpHoldSeconds += 1;
        barrelRollTrigger.setAttribute('data-hold-count', String(warpHoldSeconds));
        topCenter.style.transform = `scale(${Math.max(0, 1 - (warpHoldSeconds * 0.1))})`;
        if (warpHoldSeconds >= warpLongHoldMs / 1000) {
          window.clearInterval(warpHoldTimerId);
          warpHoldTimerId = null;
          window.setTimeout(() => {
            suppressNextSpiralClick = true;
            activateWarpMode();
            clearWarpHoldTimer();
          }, 120);
        }
      }, 1000);
    }

    function formatGhostsOnlineText(count) {
      return count === 1 ? '1 Ghost Online' : `${Number.isFinite(count) ? count : '?'} Ghosts Online`;
    }

    function renderGhostCounterText(count) {
      const countText = Number.isFinite(count) ? String(count) : '?';
      const ghostText = count === 1 ? 'Ghost' : 'Ghosts';
      return `
        <span class="ghost-counter-line">${countText}</span>
        <span class="ghost-counter-line">${ghostText}</span>
        <span class="ghost-counter-line">Online</span>
      `;
    }

    function updateGhostCounterDisplay() {
      if (!ghostCounterVisible) {
        ghostCounterText.textContent = alienEmoji;
        ghostCounterTrigger.classList.remove('is-counter');
        ghostCounterTrigger.setAttribute('aria-label', 'Show ghosts online');
        return;
      }

      const label = formatGhostsOnlineText(ghostsOnlineCount);
      ghostCounterText.innerHTML = renderGhostCounterText(ghostsOnlineCount);
      ghostCounterTrigger.classList.add('is-counter');
      ghostCounterTrigger.setAttribute('aria-label', label);
    }

    function setGhostsOnline(count) {
      ghostsOnlineCount = count;
      updateGhostCounterDisplay();
    }

    function clearGhostCounterReconnectTimer() {
      if (ghostCounterReconnectTimerId !== null) {
        window.clearTimeout(ghostCounterReconnectTimerId);
        ghostCounterReconnectTimerId = null;
      }
    }

    function scheduleGhostCounterReconnect() {
      if (ghostCounterIdle || ghostCounterReconnectTimerId !== null) return;
      ghostCounterReconnectTimerId = window.setTimeout(() => {
        ghostCounterReconnectTimerId = null;
        connectGhostCounterSocket();
      }, ghostReconnectDelayMs);
    }

    function closeGhostCounterSocket() {
      if (!ghostCounterSocket) return;
      const socket = ghostCounterSocket;
      ghostCounterSocket = null;
      try {
        socket.close();
      } catch (error) {}
    }

    function markGhostCounterIdle() {
      ghostCounterIdle = true;
      clearGhostCounterReconnectTimer();
      closeGhostCounterSocket();
    }

    function scheduleGhostCounterIdleCheck() {
      if (ghostCounterIdleTimerId !== null) {
        window.clearTimeout(ghostCounterIdleTimerId);
      }
      const elapsedMs = Date.now() - ghostCounterLastActivityAt;
      const remainingMs = Math.max(0, ghostIdleTimeoutMs - elapsedMs);
      ghostCounterIdleTimerId = window.setTimeout(markGhostCounterIdle, remainingMs);
    }

    function recordGhostCounterActivity() {
      ghostCounterLastActivityAt = Date.now();
      const wasIdle = ghostCounterIdle;
      ghostCounterIdle = false;
      scheduleGhostCounterIdleCheck();
      if (wasIdle || !ghostCounterSocket) connectGhostCounterSocket();
    }

    function connectGhostCounterSocket() {
      if (ghostCounterIdle || ghostCounterSocket) return;
      if (!window.WebSocket) {
        setGhostsOnline(null);
        return;
      }

      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const socketUrl = `${protocol}//${window.location.host}/api/ghosts-online`;
      let socket;

      try {
        socket = new WebSocket(socketUrl);
      } catch (error) {
        scheduleGhostCounterReconnect();
        return;
      }

      ghostCounterSocket = socket;

      socket.addEventListener('message', (event) => {
        try {
          const data = JSON.parse(event.data);
          const count = Number(data && data.count);
          if (Number.isFinite(count) && count >= 0) {
            setGhostsOnline(count);
          }
        } catch (error) {
          // Keep the last visible counter value if the socket sends malformed data.
        }
      });

      socket.addEventListener('close', () => {
        if (ghostCounterSocket === socket) ghostCounterSocket = null;
        scheduleGhostCounterReconnect();
      });

      socket.addEventListener('error', () => {
        try {
          socket.close();
        } catch (error) {
          if (ghostCounterSocket === socket) ghostCounterSocket = null;
          scheduleGhostCounterReconnect();
        }
      });
    }

    function toggleGhostCounter() {
      ghostCounterVisible = !ghostCounterVisible;
      updateGhostCounterDisplay();
    }

    ['pointerdown', 'keydown', 'touchstart', 'scroll', 'focus'].forEach((eventName) => {
      window.addEventListener(eventName, recordGhostCounterActivity, { passive: true });
    });
    window.addEventListener('beforeunload', closeGhostCounterSocket);

    barrelRollTrigger.addEventListener('click', handleSpiralClick);
    barrelRollTrigger.addEventListener('pointerdown', startWarpHoldTimer);
    barrelRollTrigger.addEventListener('pointerup', clearWarpHoldTimer);
    barrelRollTrigger.addEventListener('pointercancel', clearWarpHoldTimer);
    barrelRollTrigger.addEventListener('pointerleave', clearWarpHoldTimer);
    wheelStopTrigger.addEventListener('click', stopSpiralEffects);

    contentBox.addEventListener('click', (event) => {
      const gameCard = event.target.closest('a.game-card[href]');
      if (!gameCard || !contentBox.contains(gameCard)) return;
      event.preventDefault();
      openGamePlayer(gameCard.getAttribute('href'), gameCard.querySelector('h2')?.textContent || 'Web game');
    });

    gamePlayerBack.addEventListener('click', closeGamePlayer);
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && gamePlayerOverlay.classList.contains('is-active')) {
        closeGamePlayer();
      }
    });
    window.addEventListener('resize', () => {
      pageDvdInstances.forEach((instance) => positionPageDvdInstance(instance, true));
    });
    window.addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.type === 'pageRainbow') {
        setPageRainbowFilter(data);
        return;
      }
      if (data.type === 'pageDvd') {
        spawnPageDvdLogo();
        return;
      }
      if (data.type === 'pageDump') {
        spawnPageDumpImages();
        return;
      }
      if (data.type === 'pageRandomAction') {
        const selectedAction = selectRandomAction();
        if (event.source && typeof event.source.postMessage === 'function') {
          event.source.postMessage({
            type: 'pageChatResult',
            announce: true,
            command: '/random',
            message: selectedAction ? `/random selected: ${selectedAction}` : '/random could not select an option'
          }, '*');
        }
        return;
      }
      if (data.type === 'pageExit') {
        renderFatalExitScreen();
        return;
      }
      if (data.type === 'pageNewPublicChatMessage') {
        if (actionSelect.value === 'Chat with weirdos 💬') {
          document.title = newChatMessageDocumentTitle;
        }
        return;
      }
      if (data.type === 'pageChatActive') {
        if (actionSelect.value === 'Chat with weirdos 💬') {
          document.title = chatDocumentTitle;
        }
      }
    });

    actionSelect.addEventListener('change', renderActionSelection);
    goButton.addEventListener('click', selectNextAction);
    topGear.addEventListener('click', saveDefaultActionSelection);
    topGear.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      event.preventDefault();
      saveDefaultActionSelection();
    });
    ghostCounterTrigger.addEventListener('click', toggleGhostCounter);
    if (hasThanksMessage()) {
      actionSelect.value = 'Ask me anything ❓';
    } else {
      applySavedDefaultAction();
    }
    updateTitleClock();
    setupTitleSpeech();
    window.setInterval(updateTitleClock, 1000);
    renderActionSelection();
    updateGhostCounterDisplay();
    scheduleGhostCounterIdleCheck();
    connectGhostCounterSocket();
  </script>
