<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Internet Is Dead...</title>
  <style>
    :root {
      --lime: #39ff14;
      --black: #000;
      --purple-rgb: 81, 42, 103;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--black);
      font-family: "Courier New", Courier, monospace;
    }

    .background-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      z-index: 0;
      pointer-events: none;
    }

    .top-row {
      position: fixed;
      top: 25px;
      left: 25px;
      right: 25px;
      z-index: 2;
      display: grid;
      grid-template-columns: 50px minmax(0, 1fr) 50px;
      align-items: start;
      column-gap: 16px;
    }

    .home-skull {
      position: relative;
      width: 50px;
      height: 50px;
      min-width: 50px;
      min-height: 50px;
      max-width: 50px;
      max-height: 50px;
      aspect-ratio: 1 / 1;
      display: block;
      overflow: visible;
      text-decoration: none;
      font-size: 0;
    }

    .home-skull span {
      position: absolute;
      top: 0;
      left: 0;
      width: 50px;
      height: 50px;
      display: block;
      font-size: 50px;
      line-height: 50px;
      text-align: left;
      transform: translate(-9px, -2px);
    }

    .top-gear {
      position: relative;
      width: 50px;
      height: 50px;
      min-width: 50px;
      min-height: 50px;
      max-width: 50px;
      max-height: 50px;
      aspect-ratio: 1 / 1;
      display: block;
      overflow: visible;
      text-decoration: none;
      font-size: 0;
    }

    .top-gear span {
      position: absolute;
      top: 0;
      right: 0;
      width: 50px;
      height: 50px;
      display: block;
      font-size: 50px;
      line-height: 50px;
      text-align: right;
      transform: translate(4px, -2px);
    }

    .top-center {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 22px;
      text-align: center;
      overflow: visible;
    }

    .title-box {
      flex: 0 1 auto;
      min-width: 0;
      display: inline-block;
      padding: 8px 16px;
      border: 3px solid var(--lime);
      background: rgba(var(--purple-rgb), 0.5);
      color: var(--lime);
      font-weight: 700;
      font-size: clamp(1.25rem, 4vw, 2.6rem);
      line-height: 1.1;
      text-shadow:
        0 0 6px var(--lime),
        0 0 18px rgba(57, 255, 20, 0.7),
        2px 2px 0 var(--black);
      letter-spacing: 0.04em;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .action-row {
      flex: 0 1 auto;
      min-width: 0;
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .action-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .action-label {
      flex: 0 0 auto;
      color: var(--lime);
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(0.95rem, 2.3vw, 1.35rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1;
      text-shadow: 0 0 6px rgba(57, 255, 20, 0.8);
      white-space: nowrap;
    }

    .action-select,
    .go-button {
      height: 44px;
      border: 2px solid var(--lime);
      background: var(--black);
      color: var(--lime);
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(0.95rem, 2.3vw, 1.25rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-shadow: 0 0 6px rgba(57, 255, 20, 0.8);
      box-shadow: 0 0 10px rgba(57, 255, 20, 0.35);
    }

    .action-select {
      flex: 0 1 260px;
      min-width: 205px;
      padding: 0 30px 0 10px;
      appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--lime) 50%),
        linear-gradient(135deg, var(--lime) 50%, transparent 50%);
      background-position:
        calc(100% - 18px) 15px,
        calc(100% - 12px) 15px;
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
    }

    .go-button {
      flex: 0 0 68px;
      width: 68px;
      padding: 0 10px;
      cursor: default;
    }

    @media (max-width: 720px) {
      .top-row {
        left: 16px;
        right: 16px;
        grid-template-columns: 42px minmax(0, 1fr) 42px;
        column-gap: 8px;
      }

      .home-skull,
      .top-gear {
        width: 42px;
        height: 42px;
        min-width: 42px;
        min-height: 42px;
        max-width: 42px;
        max-height: 42px;
      }

      .home-skull span,
      .top-gear span {
        width: 42px;
        height: 42px;
        font-size: 42px;
        line-height: 42px;
      }

      .top-center {
        gap: 15px;
      }

      .action-stack {
        gap: 6px;
      }

      .title-box {
        padding: 4px 7px;
        border-width: 2px;
        font-size: clamp(0.82rem, 4vw, 1.25rem);
        letter-spacing: 0.01em;
      }

      .action-row {
        gap: 6px;
      }

      .action-label {
        font-size: clamp(0.68rem, 3vw, 0.9rem);
        letter-spacing: 0.01em;
      }

      .action-select,
      .go-button {
        height: 36px;
        font-size: clamp(0.68rem, 3vw, 0.9rem);
        letter-spacing: 0.01em;
      }

      .action-select {
        flex-basis: 132px;
        min-width: 104px;
        padding-left: 6px;
        padding-right: 20px;
        background-position:
          calc(100% - 13px) 13px,
          calc(100% - 8px) 13px;
        background-size: 5px 5px, 5px 5px;
      }

      .go-button {
        flex-basis: 42px;
        width: 42px;
        padding: 0 5px;
      }
    }

    @media (max-width: 460px) {
      .title-box {
        max-width: 70vw;
      }

      .action-label {
        max-width: 70vw;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .action-select {
        flex-basis: 150px;
        min-width: 130px;
      }
    }

  </style>
</head>
<body>
  <iframe
    class="background-frame"
    src="/dead/pages/starfield-background.html"
    aria-hidden="true"
    tabindex="-1"
  ></iframe>

  <header class="top-row">
    <a class="home-skull" href="/" aria-label="Go to root index"><span>💀</span></a>

    <div class="top-center">
      <section class="title-box" aria-label="Page title">
        <div>The Internet Is Dead...</div>
        <div>What now?</div>
      </section>

      <div class="action-stack">
        <div class="action-label">All you can do here is...</div>
        <form class="action-row" aria-label="Navigation selector">
          <select class="action-select" aria-label="Choose a section">
            <option>Watch (Videos)</option>
            <option>Listen (Audio)</option>
            <option>Play (Games)</option>
            <option>Contact (Me)</option>
          </select>
          <button class="go-button" type="button">Go</button>
        </form>
      </div>
    </div>

    <div class="top-gear" aria-label="Settings"><span>⚙️</span></div>
  </header>
</body>
</html>
