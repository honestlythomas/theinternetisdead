<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>theinternetisdead.org</title>

  <style>
    html {
      height: 100%;
      background: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: transparent;
      font-family: "Courier New", Courier, monospace;
    }

    .background-frame {
      position: fixed;
      left: 0;
      top: 53px;
      width: 100%;
      height: calc(100vh - 53px);
      border: 0;
      background: transparent;
      z-index: 0;
      pointer-events: none;
    }

    .bottom-bar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: auto;
      z-index: 2;
      width: 100%;
      height: 53px;
      background: black;
      border-bottom: 3px solid lime;
      box-sizing: border-box;

      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .bar-content {
      border: 0;
      padding: 0;
      width: 100%;
      height: 50px;
      background: black;
      color: white;
      cursor: default;

      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;

      font-family: "Courier New", Courier, monospace;
      font-weight: 700;
      line-height: 1;
      box-sizing: border-box;
    }

    .clock-group {
      margin-left: auto;
      display: flex;
      align-items: center;
      height: 50px;
    }

    .clock-text {
      flex: 0 0 96px;
      width: 96px;
      height: 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-right: 0;
      border-left: 1px solid lime;
      border-right: 1px solid lime;
      box-sizing: border-box;
    }

    .clock-time {
      font-size: 15px;
      white-space: nowrap;
    }

    .clock-date {
      margin-top: 5px;
      font-size: 10px;
      white-space: nowrap;
    }

    .emoji-icon {
      flex: 0 0 50px;
      width: 50px;
      height: 50px;
      background: black;
      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 24px;
      line-height: 1;
      box-sizing: border-box;
    }

    .emoji-tint {
      position: relative;
      display: inline-block;
      line-height: 1;
      isolation: isolate;
    }

    .emoji-tint::after {
      content: attr(data-emoji);
      position: absolute;
      inset: 0;
      color: lime;
      filter: sepia(100%) saturate(600%) hue-rotate(55deg) brightness(120%);
      mix-blend-mode: color;
      pointer-events: none;
    }

    .emoji-tint.is-screen::after {
      mix-blend-mode: screen;
    }

    .emoji-tint.is-skull {
      color: lime;
      font-weight: 900;
    }

    .emoji-tint.is-skull::after {
      content: none;
    }

    .skull-icon {
      background: rgb(59 0 102);
      border-right: 1px solid lime;
    }

    .alien-icon {
      flex: 0 0 auto;
      width: auto;
      padding-left: 10px;
      gap: 8px;
      border-left: 1px solid lime;
      color: lime;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }

    .alien-glyph {
      flex: 0 0 50px;
      width: 50px;
      height: 50px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;
      font-size: 24px;
      line-height: 1;
    }

    .ghost-count {
      margin-right: 0.35ch;
    }

    .ghost-text {
      flex: 0 0 15ch;
      width: 15ch;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .gear-icon {
      color: #8200e0;
    }

    .emoji-label {
      min-width: 0;
      flex: 1 1 auto;
      padding: 0 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: flex;
      align-items: center;
    }

    .bar-content .emoji-label {
      text-align: left;
      color: lime;
      font-weight: 700;
    }

    .bar-content .home-link {
      color: inherit;
      text-decoration: none;
    }

    .site-divider {
      flex: 0 0 1px;
      width: 1px;
      height: 50px;
      background: lime;
    }

    .index-link-slot {
      min-width: 0;
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .site-divider.after-site {
      margin-left: 8px;
    }

    .bar-content .index-link {
      text-decoration: underline;
    }

    .emoji-mid-divider {
      display: none;
    }

    .ghost-counter.is-you-dummy {
      color: #fff;
      -webkit-text-stroke: 1px #ff004c;
      paint-order: stroke fill;
      text-shadow:
        -3px -3px 0 #ff004c,
        0 -3px 0 #ff8c00,
        3px -3px 0 #ffe600,
        -3px 0 0 #00d26a,
        3px 0 0 #00d9ff,
        -3px 3px 0 #3b5bff,
        0 3px 0 #8f00ff,
        3px 3px 0 #ff00c8;
    }

    @media (max-width: 600px) {
      .background-frame {
        top: 153px;
        height: calc(100vh - 153px);
      }

      .bottom-bar {
        height: 153px;
      }

      .bar-content {
        position: relative;
        height: 150px;
        display: grid;
        grid-template-columns: 50px minmax(0, 1fr) 88px;
        grid-template-rows: 50px 50px 50px;
        align-items: stretch;
      }

      .bar-content::before,
      .bar-content::after {
        content: "";
        position: absolute;
        left: 0;
        width: 100%;
        height: 1px;
        background: lime;
        pointer-events: none;
      }

      .bar-content::before {
        top: 49px;
      }

      .bar-content::after {
        top: 99px;
      }

      .emoji-mid-divider {
        position: absolute;
        top: 50px;
        left: var(--emoji-mid-divider-left, 50%);
        z-index: 1;
        display: block;
        width: 1px;
        height: 50px;
        background: lime;
        transform: translateX(-0.5px);
        pointer-events: none;
      }

      .bar-content .emoji-label {
        display: contents;
      }

      .clock-group {
        display: contents;
      }

      .skull-icon {
        grid-column: 1;
        grid-row: 1;
      }

      .bar-content .emoji-label > .home-link {
        grid-column: 2;
        grid-row: 1;
        min-width: 0;
        height: 50px;
        padding: 0 8px;
        display: flex;
        align-items: center;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        box-sizing: border-box;
      }

      .site-divider {
        display: none;
      }

      .clock-text {
        grid-column: 3;
        grid-row: 1;
        width: 88px;
        border-right: 0;
      }

      .index-link-slot {
        grid-column: 1 / -1;
        grid-row: 3;
        min-width: 0;
        height: 50px;
      }

      .ghost-counter {
        grid-column: 1 / 3;
        grid-row: 2;
        min-width: 0;
        overflow: hidden;
        border-left: 0;
        justify-self: stretch;
        justify-content: center;
      }

      .gear-icon {
        grid-column: 3;
        grid-row: 2;
        justify-self: center;
      }

      .alien-icon {
        padding-left: 0;
        gap: 4px;
        border-left: 0;
        font-size: 13px;
      }

      .ghost-text {
        min-width: 0;
        flex: 0 1 15ch;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    }
  </style>
</head>

<body>
  <iframe class="background-frame" src="/dead/pages/background/" title="Background" aria-hidden="true"></iframe>

  <div class="bottom-bar" aria-label="Static bookmark top bar preview">
    <div class="bar-content">
      <span class="emoji-icon skull-icon"><span class="emoji-tint is-screen is-skull" data-emoji="&#9760;">&#9760;</span></span>
      <span class="emoji-label"><a class="home-link" href="/">theinternetisdead.org</a><span class="site-divider after-site" aria-hidden="true"></span><span class="index-link-slot"><span class="site-divider" aria-hidden="true"></span><a class="home-link index-link" href="/">index.html</a><span class="site-divider" aria-hidden="true"></span></span></span>
      <span class="clock-group">
        <span class="emoji-icon alien-icon ghost-counter" id="ghost-counter" role="status" aria-label="? Ghosts Online">
          <span class="ghost-text">
            <span class="ghost-count" id="ghost-count">?</span><span class="ghost-label" id="ghost-label">Ghosts Online</span>
          </span>
          <span class="alien-glyph"><span class="emoji-tint" data-emoji="&#128125;">&#128125;</span></span>
        </span>
        <span class="clock-text">
          <span class="clock-time" id="clock-time"></span>
          <span class="clock-date" id="clock-date"></span>
        </span>
        <span class="emoji-icon gear-icon"><span class="emoji-tint" data-emoji="&#9881;&#65039;">&#9881;&#65039;</span></span>
      </span>
      <span class="emoji-mid-divider" aria-hidden="true"></span>
    </div>
  </div>
  <script>
    const clockTime = document.getElementById("clock-time");
    const clockDate = document.getElementById("clock-date");
    const barContent = document.querySelector(".bar-content");
    const ghostCounter = document.getElementById("ghost-counter");
    const ghostCount = document.getElementById("ghost-count");
    const ghostLabel = document.getElementById("ghost-label");
    const alienGlyph = document.querySelector(".alien-glyph .emoji-tint");
    const gearGlyph = document.querySelector(".gear-icon .emoji-tint");
    const emojiMidDivider = document.querySelector(".emoji-mid-divider");
    const YOU_DUMMY_TEXT = "It's YOU dummy!";
    let ghostsOnlineCount = null;

    const updateEmojiMidDivider = () => {
      if (!window.matchMedia("(max-width: 600px)").matches) return;

      const barRect = barContent.getBoundingClientRect();
      const alienRect = alienGlyph.getBoundingClientRect();
      const gearRect = gearGlyph.getBoundingClientRect();
      const alienCenter = alienRect.left + alienRect.width / 2;
      const gearCenter = gearRect.left + gearRect.width / 2;
      const dividerLeft = (alienCenter + gearCenter) / 2 - barRect.left;

      emojiMidDivider.style.setProperty("--emoji-mid-divider-left", `${dividerLeft}px`);
    };

    const scheduleEmojiMidDividerUpdate = () => {
      window.requestAnimationFrame(updateEmojiMidDivider);
    };

    const updateClock = () => {
      const now = new Date();

      clockTime.textContent = now.toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit",
        hour12: true
      }).replace(/\s/g, "");

      clockDate.textContent = now.toLocaleDateString([], {
        month: "short",
        day: "numeric",
        year: "numeric"
      });
    };

    updateClock();
    setInterval(updateClock, 1000);

    const formatGhostsOnlineText = (count) => (
      count === 1 ? "1 Ghost Online" : `${Number.isFinite(count) ? count : "?"} Ghosts Online`
    );

    const setGhostCounterLabel = (label) => {
      const match = label.match(/^(\S+)(.*)$/);
      const countText = match ? match[1] : "?";
      const suffixText = match ? match[2].trimStart() : "Ghosts Online";

      ghostCount.textContent = countText;
      ghostLabel.textContent = suffixText;
      ghostCounter.setAttribute("aria-label", label);
      scheduleEmojiMidDividerUpdate();
    };

    const restoreGhostCounterLabel = () => {
      ghostCounter.classList.remove("is-you-dummy");
      setGhostCounterLabel(formatGhostsOnlineText(ghostsOnlineCount));
    };

    const showYouDummyLabel = () => {
      if (ghostsOnlineCount !== 1) return;
      ghostCounter.classList.add("is-you-dummy");
      setGhostCounterLabel(YOU_DUMMY_TEXT);
    };

    const setGhostsOnline = (count) => {
      ghostsOnlineCount = count;
      restoreGhostCounterLabel();
    };

    const connectGhostCounterSocket = () => {
      if (!window.WebSocket) {
        setGhostsOnline(null);
        return;
      }

      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const socketUrl = `${protocol}//${window.location.host}/api/ghosts-online`;
      let socket;

      try {
        socket = new WebSocket(socketUrl);
      } catch (error) {
        window.setTimeout(connectGhostCounterSocket, 5000);
        return;
      }

      socket.addEventListener("message", (event) => {
        try {
          const data = JSON.parse(event.data);
          const count = Number(data && data.count);
          if (Number.isFinite(count) && count >= 0) {
            setGhostsOnline(count);
          }
        } catch (error) {
          // Keep the last visible counter value when a malformed packet arrives.
        }
      });

      socket.addEventListener("close", () => {
        window.setTimeout(connectGhostCounterSocket, 5000);
      });
    };

    ghostCounter.addEventListener("mouseenter", showYouDummyLabel);
    ghostCounter.addEventListener("mouseleave", restoreGhostCounterLabel);
    window.addEventListener("resize", scheduleEmojiMidDividerUpdate);

    setGhostsOnline(null);
    scheduleEmojiMidDividerUpdate();
    connectGhostCounterSocket();
  </script>
</body>
</html>
