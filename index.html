<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>theinternetisdead.org</title>

  <style>
    html {
      height: 100%;
      background: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: transparent;
      font-family: "Courier New", Courier, monospace;
    }

    .background-frame {
      position: fixed;
      left: 0;
      top: 53px;
      width: 100%;
      height: calc(100vh - 53px);
      border: 0;
      background: transparent;
      z-index: 0;
      pointer-events: none;
    }

    .bottom-bar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: auto;
      z-index: 2;
      width: 100%;
      height: 53px;
      background: black;
      border-bottom: 3px solid lime;
      box-sizing: border-box;

      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .bar-content {
      border: 0;
      padding: 0;
      width: 100%;
      height: 50px;
      background: black;
      color: white;
      cursor: default;

      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;

      font-family: "Courier New", Courier, monospace;
      font-weight: 700;
      line-height: 1;
      box-sizing: border-box;
    }

    .clock-text {
      flex: 0 0 96px;
      width: 96px;
      height: 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-right: 0;
      border-left: 1px solid lime;
      border-right: 1px solid lime;
      box-sizing: border-box;
    }

    .clock-time {
      font-size: 15px;
      white-space: nowrap;
    }

    .clock-date {
      margin-top: 5px;
      font-size: 10px;
      white-space: nowrap;
    }

    .emoji-icon {
      flex: 0 0 50px;
      width: 50px;
      height: 50px;
      background: black;
      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 24px;
      line-height: 1;
      box-sizing: border-box;
    }

    .emoji-tint {
      position: relative;
      display: inline-block;
      line-height: 1;
      isolation: isolate;
    }

    .emoji-tint::after {
      content: attr(data-emoji);
      position: absolute;
      inset: 0;
      color: lime;
      filter: sepia(100%) saturate(600%) hue-rotate(55deg) brightness(120%);
      mix-blend-mode: color;
      pointer-events: none;
    }

    .emoji-tint.is-screen::after {
      mix-blend-mode: screen;
    }

    .emoji-tint.is-skull {
      color: lime;
      font-weight: 900;
    }

    .emoji-tint.is-skull::after {
      content: none;
    }

    .skull-icon {
      background: rgb(59 0 102);
      border-right: 1px solid lime;
    }

    .skull-icon,
    .spiral-icon,
    .recycle-icon,
    .gear-icon {
      background: rgb(59 0 102);
    }

    .alien-icon {
      flex: 0 0 auto;
      width: auto;
      padding-left: 0;
      gap: 0;
      border-left: 1px solid lime;
      color: lime;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }

    .alien-glyph {
      flex: 0 0 50px;
      width: 50px;
      height: 50px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;
      font-size: 24px;
      line-height: 1;
    }

    .ghost-count {
      margin-right: 0.35ch;
    }

    .ghost-text {
      flex: 0 0 15ch;
      width: 15ch;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .gear-icon {
      color: #8200e0;
    }

    .bar-content .home-link {
      color: inherit;
      text-decoration: none;
    }

    .site-link {
      flex: 0 0 auto;
      height: 50px;
      min-width: 0;
      padding: 0 8px;
      display: flex;
      align-items: center;
      color: lime;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      box-sizing: border-box;
    }

    .site-divider {
      flex: 0 0 1px;
      width: 1px;
      height: 50px;
      background: lime;
    }

    .index-link-slot {
      min-width: 0;
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .bar-content .index-link {
      text-decoration: underline;
    }

    .index-link-stack {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 50px;
      padding: 0 8px;
      line-height: 1;
    }

    .index-link-panel {
      height: 50px;
      display: inline-flex;
      align-items: center;
      background: rgb(59 0 102);
    }

    .index-bracket {
      color: #ff00ff;
      font-size: 2em;
      line-height: 0.5;
    }

    .recycle-icon {
      color: lime;
      border-left: 1px solid lime;
    }

    .spiral-icon {
      color: lime;
      border-right: 1px solid lime;
    }

    .spiral-icon::after {
      content: none;
    }

    .ghost-glyph {
      flex: 0 0 50px;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: lime;
      font-size: 24px;
      line-height: 1;
    }

    .mobile-ghost-icon {
      display: none;
    }

    .ghost-counter.is-you-dummy,
    .skull-icon:hover .emoji-tint,
    .site-link:hover,
    .bar-content .index-link:hover,
    .index-bracket:hover,
    .index-link-slot:hover .index-bracket,
    .spiral-icon:hover .emoji-tint,
    .recycle-icon:hover .emoji-tint,
    .ghost-glyph:hover .emoji-tint,
    .ghost-icon:hover .emoji-tint,
    .alien-glyph:hover .emoji-tint,
    .gear-icon:hover .emoji-tint,
    .clock-text:hover {
      color: lime;
      -webkit-text-stroke: 1px #ff004c;
      paint-order: stroke fill;
      text-shadow:
        -3px -3px 0 #ff004c,
        0 -3px 0 #ff8c00,
        3px -3px 0 #ffe600,
        -3px 0 0 #00d26a,
        3px 0 0 #00d9ff,
        -3px 3px 0 #3b5bff,
        0 3px 0 #8f00ff,
        3px 3px 0 #ff00c8;
    }

    .alien-glyph:hover .emoji-tint::after,
    .spiral-icon:hover .emoji-tint::after,
    .recycle-icon:hover .emoji-tint::after,
    .ghost-glyph:hover .emoji-tint::after,
    .ghost-icon:hover .emoji-tint::after,
    .gear-icon:hover .emoji-tint::after {
      content: none;
    }

    @media (max-width: 600px) {
      .background-frame {
        top: 153px;
        height: calc(100vh - 153px);
      }

      .bottom-bar {
        height: 153px;
      }

      .bar-content {
        position: relative;
        height: 150px;
        display: grid;
        grid-template-columns: 50px minmax(0, 1fr) 88px;
        grid-template-rows: 50px 50px 50px;
        grid-template-areas:
          "skull site clock"
          "recycle ghost gear"
          "spiral index empty";
        align-items: stretch;
        background: black;
      }

      .bar-content::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        background:
          linear-gradient(lime, lime) 0 50px / 100% 1px no-repeat,
          linear-gradient(lime, lime) 0 100px / 100% 1px no-repeat,
          linear-gradient(lime, lime) 50px 0 / 1px 150px no-repeat,
          linear-gradient(lime, lime) calc(100% - 88px) 0 / 1px 150px no-repeat;
        pointer-events: none;
      }

      .bar-content::after {
        content: none;
      }

      .skull-icon {
        grid-area: skull;
        border-right: 0;
      }

      .site-link {
        grid-area: site;
        flex: 1 1 auto;
        min-width: 0;
        height: 50px;
        padding: 0 8px;
        display: flex;
        align-items: center;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        box-sizing: border-box;
      }

      .site-divider {
        display: none;
      }

      .index-link-panel .site-divider {
        display: block;
      }

      .clock-text {
        grid-area: clock;
        width: 88px;
        background: rgb(59 0 102);
        border-left: 0;
        border-right: 0;
      }

      .index-link-slot {
        grid-area: index;
        min-width: 0;
        height: 50px;
        box-sizing: border-box;
      }

      .ghost-counter {
        grid-area: ghost;
        min-width: 0;
        overflow: hidden;
        border-left: 0;
        background: rgb(59 0 102);
        justify-self: stretch;
        justify-content: center;
      }

      .recycle-icon {
        grid-area: recycle;
        background: black;
        border: 0;
      }

      .recycle-icon::after {
        content: none;
      }

      .spiral-icon {
        grid-area: spiral;
        display: flex;
        border-left: 0;
        border-right: 0;
      }

      .spiral-icon::after {
        content: none;
      }

      .gear-icon {
        grid-area: gear;
        width: auto;
        flex-basis: auto;
        background: black;
        border-left: 0;
        justify-self: stretch;
      }

      .alien-icon {
        padding-left: 0;
        gap: 0;
        border-left: 0;
        font-size: 13px;
      }

      .ghost-glyph {
        display: none;
      }

      .alien-glyph {
        flex: 0 0 50px;
        width: 50px;
      }

      .ghost-text {
        min-width: 0;
        flex: 0 1 15ch;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .mobile-ghost-icon {
        grid-area: empty;
        display: flex;
        width: auto;
        flex-basis: auto;
        background: rgb(59 0 102);
      }
    }
  </style>
</head>

<body>
  <iframe class="background-frame" src="/dead/pages/background/" title="Background" aria-hidden="true"></iframe>

  <div class="bottom-bar" aria-label="Static bookmark top bar preview">
    <div class="bar-content">
      <span class="emoji-icon skull-icon"><span class="emoji-tint is-screen is-skull" data-emoji="&#9760;">&#9760;</span></span>
      <a class="site-link home-link" href="/">theinternetisdead.org</a>
      <span class="site-divider after-site" aria-hidden="true"></span>
      <span class="emoji-icon spiral-icon"><span class="emoji-tint" data-emoji="&#127744;">&#127744;</span></span>
      <span class="index-link-slot"><span class="index-bracket" aria-hidden="true">&lt;</span><span class="index-link-panel"><span class="site-divider" aria-hidden="true"></span><span class="index-link-stack"><a class="home-link index-link" href="/">index.html</a></span><span class="site-divider" aria-hidden="true"></span></span><span class="index-bracket" aria-hidden="true">&gt;</span></span>
      <span class="emoji-icon recycle-icon"><span class="emoji-tint" data-emoji="&#9851;">&#9851;</span></span>
      <span class="emoji-icon alien-icon ghost-counter" id="ghost-counter" role="status" aria-label="? Ghosts Online">
        <span class="ghost-glyph"><span class="emoji-tint" data-emoji="&#128123;">&#128123;</span></span>
        <span class="ghost-text">
          <span class="ghost-count" id="ghost-count">?</span><span class="ghost-label" id="ghost-label">Ghosts Online</span>
        </span>
        <span class="alien-glyph"><span class="emoji-tint" data-emoji="&#127760;">&#127760;</span></span>
      </span>
      <span class="clock-text">
        <span class="clock-time" id="clock-time"></span>
        <span class="clock-date" id="clock-date"></span>
      </span>
      <span class="emoji-icon gear-icon"><span class="emoji-tint" data-emoji="&#9881;&#65039;">&#9881;&#65039;</span></span>
      <span class="emoji-icon ghost-icon mobile-ghost-icon"><span class="emoji-tint" data-emoji="&#128123;">&#128123;</span></span>
    </div>
  </div>
  <script>
    const clockTime = document.getElementById("clock-time");
    const clockDate = document.getElementById("clock-date");
    const ghostCounter = document.getElementById("ghost-counter");
    const ghostCount = document.getElementById("ghost-count");
    const ghostLabel = document.getElementById("ghost-label");
    const YOU_DUMMY_TEXT = "It's YOU dummy!";
    let ghostsOnlineCount = null;

    const updateClock = () => {
      const now = new Date();

      clockTime.textContent = now.toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit",
        hour12: true
      }).replace(/\s/g, "");

      clockDate.textContent = now.toLocaleDateString([], {
        month: "short",
        day: "numeric",
        year: "numeric"
      });
    };

    updateClock();
    setInterval(updateClock, 1000);

    const formatGhostsOnlineText = (count) => (
      count === 1 ? "1 Ghost Online" : `${Number.isFinite(count) ? count : "?"} Ghosts Online`
    );

    const setGhostCounterLabel = (label) => {
      const match = label.match(/^(\S+)(.*)$/);
      const countText = match ? match[1] : "?";
      const suffixText = match ? match[2].trimStart() : "Ghosts Online";

      ghostCount.textContent = countText;
      ghostLabel.textContent = suffixText;
      ghostCounter.setAttribute("aria-label", label);
    };

    const restoreGhostCounterLabel = () => {
      ghostCounter.classList.remove("is-you-dummy");
      setGhostCounterLabel(formatGhostsOnlineText(ghostsOnlineCount));
    };

    const showYouDummyLabel = () => {
      if (ghostsOnlineCount !== 1) return;
      ghostCounter.classList.add("is-you-dummy");
      setGhostCounterLabel(YOU_DUMMY_TEXT);
    };

    const setGhostsOnline = (count) => {
      ghostsOnlineCount = count;
      restoreGhostCounterLabel();
    };

    const connectGhostCounterSocket = () => {
      if (!window.WebSocket) {
        setGhostsOnline(null);
        return;
      }

      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const socketUrl = `${protocol}//${window.location.host}/api/ghosts-online`;
      let socket;

      try {
        socket = new WebSocket(socketUrl);
      } catch (error) {
        window.setTimeout(connectGhostCounterSocket, 5000);
        return;
      }

      socket.addEventListener("message", (event) => {
        try {
          const data = JSON.parse(event.data);
          const count = Number(data && data.count);
          if (Number.isFinite(count) && count >= 0) {
            setGhostsOnline(count);
          }
        } catch (error) {
          // Keep the last visible counter value when a malformed packet arrives.
        }
      });

      socket.addEventListener("close", () => {
        window.setTimeout(connectGhostCounterSocket, 5000);
      });
    };

    ghostCounter.addEventListener("mouseenter", showYouDummyLabel);
    ghostCounter.addEventListener("mouseleave", restoreGhostCounterLabel);

    setGhostsOnline(null);
    connectGhostCounterSocket();
  </script>
</body>
</html>
