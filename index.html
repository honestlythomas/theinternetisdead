<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>TheInternetIsDead.org</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    body { position: relative; }
    .starfield-background {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }
    .top-bar-frame {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: block;
      width: 100%;
      height: 54px;
      border: 0;
      background: transparent;
    }
    @media (max-width: 820px) {
      .top-bar-frame { height: 48px; }
    }
  </style>
</head>
<body>
  <iframe
    class="starfield-background"
    src="/dead/backgrounds/starfield-background.html"
    title="Animated starfield background"
    aria-hidden="true"
  ></iframe>

  <iframe
    class="top-bar-frame"
    src="/os/top-bar.html"
    title="Site top bar"
  ></iframe>
</body>
</html>
