<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>theinternetisdead.org</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Rye&display=swap" rel="stylesheet">

  <style>
    html {
      height: 100%;
      background: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: transparent;
      font-family: "Creepster", "Courier New", Courier, monospace;
      font-kerning: none;
      font-variant-ligatures: none;
      font-variant-numeric: tabular-nums;
    }

    .background-frame {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100vh;
      border: 0;
      background: transparent;
      z-index: 0;
      pointer-events: none;
    }

    .bottom-bar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: auto;
      z-index: 2;
      width: 100%;
      height: 53px;
      background: transparent;
      border-bottom: 3px solid lime;
      box-sizing: border-box;

      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .bar-content {
      border: 0;
      padding: 0;
      width: 100%;
      height: 50px;
      background: transparent;
      color: white;
      cursor: default;

      display: grid;
      grid-template-columns: minmax(130px, 1fr) minmax(190px, 1fr) max-content;
      align-items: center;
      justify-content: flex-start;

      font-weight: 700;
      line-height: 1;
      box-sizing: border-box;
    }

    .bar-column {
      min-width: 0;
      height: 50px;
      display: flex;
      align-items: stretch;
    }

    .bar-column-left {
      display: grid;
      grid-template-columns: 50px minmax(0, 1fr) 1px 50px;
    }

    .bar-column-center {
      display: grid;
      grid-template-columns: 50px minmax(0, 1fr) 50px;
    }

    .bar-column-center > .index-link-slot {
      grid-column: 1 / -1;
    }

    .bar-column-right {
      justify-content: flex-end;
    }

    .clock-text {
      flex: 0 0 96px;
      width: 96px;
      height: 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-right: 0;
      border-left: 1px solid lime;
      border-right: 1px solid lime;
      box-sizing: border-box;
      background: rgb(0 0 0 / 65%);
      color: lime;
      font-family: "Rye", "Playbill", "Rockwell Extra Bold", "Clarendon", Georgia, serif;
      font-weight: 900;
    }

    .clock-time {
      font-size: 15px;
      white-space: nowrap;
    }

    .clock-date {
      margin-top: 5px;
      font-size: 10px;
      white-space: nowrap;
    }

    .emoji-icon {
      flex: 0 0 50px;
      width: 50px;
      height: 50px;
      background: rgb(0 0 0 / 65%);
      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 24px;
      line-height: 1;
      box-sizing: border-box;
    }

    .emoji-tint {
      position: relative;
      display: inline-block;
      line-height: 1;
      isolation: isolate;
    }

    .emoji-tint::after {
      content: attr(data-emoji);
      position: absolute;
      inset: 0;
      color: lime;
      filter: sepia(100%) saturate(600%) hue-rotate(55deg) brightness(120%);
      mix-blend-mode: color;
      pointer-events: none;
    }

    .emoji-tint.is-screen::after {
      mix-blend-mode: screen;
    }

    .emoji-tint.is-skull {
      color: lime;
      font-weight: 900;
    }

    .emoji-tint.is-skull::after {
      content: none;
    }

    .skull-icon {
      background: rgb(59 0 102 / 65%);
      border-right: 1px solid lime;
    }

    .skull-icon,
    .spiral-icon,
    .recycle-icon,
    .gear-icon {
      background: rgb(59 0 102 / 65%);
    }

    .alien-icon {
      width: max-content;
      min-width: max-content;
      padding-left: 0;
      gap: 0;
      border-left: 1px solid lime;
      background: rgb(0 0 0 / 65%);
      color: lime;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }

    .ghost-counter {
      display: grid;
      grid-template-columns: 50px 15ch 50px;
      align-items: center;
      justify-content: center;
    }

    .alien-glyph {
      flex: 0 0 50px;
      width: 50px;
      height: 50px;
      margin-left: 0.35ch;

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;
      font-size: 24px;
      line-height: 1;
    }

    .ghost-count {
      margin-right: 0.35ch;
      font-family: "Rye", "Playbill", "Rockwell Extra Bold", "Clarendon", Georgia, serif;
      font-size: 2em;
      font-weight: 900;
      line-height: 1;
      color: white;
    }

    .ghost-label {
      font-family: "Creepster", "Courier New", Courier, monospace;
      font-style: italic;
      letter-spacing: 0.09em;
    }

    .ghost-text {
      width: 15ch;
      min-width: 15ch;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    .ghost-counter.is-you-dummy .ghost-count,
    .ghost-counter.is-you-dummy .ghost-label {
      font-family: "Creepster", "Courier New", Courier, monospace;
      font-size: 1em;
      font-weight: 700;
      color: lime;
      letter-spacing: 0.09em;
      line-height: 1;
    }

    .gear-icon {
      color: #8200e0;
    }

    .bar-content .home-link {
      color: inherit;
      text-decoration: none;
    }

    .site-link {
      flex: 0 0 auto;
      width: 100%;
      height: 50px;
      min-width: 0;
      padding: 0 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgb(0 0 0 / 65%);
      color: lime;
      font-style: italic;
      font-weight: 700;
      letter-spacing: 0.09em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      box-sizing: border-box;
    }

    .bar-content .site-link.home-link {
      color: lime;
    }

    .bar-content .site-link.home-link:hover {
      color: black;
    }

    .site-divider {
      flex: 0 0 1px;
      width: 1px;
      height: 50px;
      background: lime;
    }

    .index-link-slot {
      min-width: 0;
      width: 100%;
      display: grid;
      grid-template-columns: 50px minmax(0, 1fr) 50px;
      align-items: center;
      overflow: hidden;
      background: transparent;
    }

    .bar-content .index-link {
      color: lime;
      font-family: "Rye", "Playbill", "Rockwell Extra Bold", "Clarendon", Georgia, serif;
      font-weight: 900;
      text-decoration: underline;
    }

    .index-link-stack {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 50px;
      min-width: 0;
      padding: 0 14px;
      line-height: 1;
      background: rgb(59 0 102 / 65%);
    }

    .index-link-panel {
      height: 50px;
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      background:
        linear-gradient(
          to right,
          rgb(0 0 0 / 65%) 0 calc(50% - 61px),
          transparent calc(50% - 61px) calc(50% + 61px),
          rgb(0 0 0 / 65%) calc(50% + 61px) 100%
        );
    }

    .index-link {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .index-bracket {
      color: black;
      font-size: 2em;
      line-height: 0.5;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgb(0 0 0 / 65%);
    }

    .recycle-icon {
      color: lime;
      border-left: 1px solid lime;
    }

    .spiral-icon {
      color: lime;
      border-right: 1px solid lime;
    }

    .spiral-icon::after {
      content: none;
    }

    .ghost-glyph {
      flex: 0 0 50px;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: lime;
      font-size: 24px;
      line-height: 1;
    }

    .mobile-ghost-icon {
      display: none;
    }

    .skull-icon,
    .site-link,
    .spiral-icon,
    .index-bracket,
    .bar-content .index-link,
    .recycle-icon,
    .ghost-glyph,
    .alien-glyph,
    .gear-icon,
    .clock-text {
      cursor: pointer;
    }

    .site-link,
    .bar-content .index-link,
    .index-bracket,
    .ghost-count,
    .ghost-label,
    .clock-text,
    .emoji-tint {
      -webkit-text-stroke: 1px rgb(255 0 255 / 100%);
      paint-order: stroke fill;
      text-shadow:
        0 0 1px rgb(255 0 255 / 100%),
        0 0 2px rgb(255 0 255 / 67%),
        0 0 3px rgb(255 0 255 / 33%),
        -1px -1px 1px rgb(255 0 255 / 100%),
        1px -1px 1px rgb(255 0 255 / 100%),
        -1px 1px 1px rgb(255 0 255 / 100%),
        1px 1px 1px rgb(255 0 255 / 100%),
        -2px -2px 2px rgb(255 0 255 / 67%),
        2px -2px 2px rgb(255 0 255 / 67%),
        -2px 2px 2px rgb(255 0 255 / 67%),
        2px 2px 2px rgb(255 0 255 / 67%),
        -3px -3px 3px rgb(255 0 255 / 33%),
        3px -3px 3px rgb(255 0 255 / 33%),
        -3px 3px 3px rgb(255 0 255 / 33%),
        3px 3px 3px rgb(255 0 255 / 33%);
    }

    .ghost-counter.is-you-dummy,
    .skull-icon:hover .emoji-tint,
    .site-link:hover,
    .bar-content .index-link:hover,
    .index-bracket:hover,
    .index-link-slot:hover .index-bracket,
    .spiral-icon:hover .emoji-tint,
    .recycle-icon:hover .emoji-tint,
    .ghost-glyph:hover .emoji-tint,
    .ghost-icon:hover .emoji-tint,
    .alien-glyph:hover .emoji-tint,
    .gear-icon:hover .emoji-tint,
    .clock-text:hover {
      color: black;
      -webkit-text-stroke: 1px #ff004c;
      paint-order: stroke fill;
      text-shadow:
        -3px -3px 0 #ff004c,
        0 -3px 0 #ff8c00,
        3px -3px 0 #ffe600,
        -3px 0 0 #00d26a,
        3px 0 0 #00d9ff,
        -3px 3px 0 #3b5bff,
        0 3px 0 #8f00ff,
        3px 3px 0 #ff00c8;
    }

    .alien-glyph:hover .emoji-tint::after,
    .spiral-icon:hover .emoji-tint::after,
    .recycle-icon:hover .emoji-tint::after,
    .ghost-glyph:hover .emoji-tint::after,
    .ghost-icon:hover .emoji-tint::after,
    .gear-icon:hover .emoji-tint::after {
      content: none;
    }

    @media (max-width: 600px) {
      .background-frame {
        top: 0;
        height: 100vh;
      }

      .bottom-bar {
        height: 153px;
      }

      .bar-content {
        position: relative;
        height: 150px;
        display: grid;
        grid-template-columns: 50px minmax(0, 1fr) 88px;
        grid-template-rows: 50px 50px 50px;
        grid-template-areas:
          "skull site clock"
          "recycle ghost gear"
          "spiral index empty";
        align-items: stretch;
        background: transparent;
      }

      .bar-column {
        display: contents;
      }

      .bar-content::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        background:
          linear-gradient(lime, lime) 0 50px / 100% 1px no-repeat,
          linear-gradient(lime, lime) 0 100px / 100% 1px no-repeat,
          linear-gradient(lime, lime) 50px 0 / 1px 150px no-repeat,
          linear-gradient(lime, lime) calc(100% - 88px) 0 / 1px 150px no-repeat;
        pointer-events: none;
      }

      .bar-content::after {
        content: none;
      }

      .skull-icon {
        grid-area: skull;
        border-right: 0;
      }

      .site-link {
        grid-area: site;
        flex: 1 1 auto;
        width: auto;
        min-width: 0;
        height: 50px;
        padding: 0 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: lime;
        font-style: italic;
        font-weight: 700;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        box-sizing: border-box;
      }

      .site-divider {
        display: none;
      }

      .index-link-panel .site-divider {
        display: block;
      }

      .clock-text {
        grid-area: clock;
        min-width: 0;
        width: 88px;
        background: rgb(59 0 102 / 65%);
        color: lime;
        border-left: 0;
        border-right: 0;
      }

      .clock-time,
      .clock-date {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .clock-time {
        font-size: clamp(10px, 3.6vw, 15px);
      }

      .clock-date {
        font-size: clamp(8px, 2.7vw, 10px);
      }

      .index-link-slot {
        grid-area: index;
        grid-column: auto;
        min-width: 0;
        height: 50px;
        color: lime;
        box-sizing: border-box;
      }

      .bar-column-center > .index-link-slot {
        grid-area: index;
        grid-column: auto;
      }

      .ghost-counter {
        grid-area: ghost;
        width: auto;
        min-width: 0;
        overflow: hidden;
        border-left: 0;
        background: rgb(59 0 102 / 65%);
        color: lime;
        font-size: 15px;
        font-weight: 700;
        justify-self: stretch;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .recycle-icon {
        grid-area: recycle;
        background: rgb(0 0 0 / 65%);
        border: 0;
      }

      .recycle-icon::after {
        content: none;
      }

      .spiral-icon {
        grid-area: spiral;
        display: flex;
        border-left: 0;
        border-right: 0;
      }

      .spiral-icon::after {
        content: none;
      }

      .gear-icon {
        grid-area: gear;
        width: auto;
        flex-basis: auto;
        background: rgb(0 0 0 / 65%);
        border-left: 0;
        justify-self: stretch;
      }

      .alien-icon {
        width: auto;
        min-width: 0;
        padding-left: 0;
        gap: 0;
        border-left: 0;
        font-size: 13px;
      }

      .ghost-glyph {
        display: none;
      }

      .alien-glyph {
        flex: 0 0 50px;
        width: 50px;
      }

      .ghost-text {
        width: auto;
        min-width: 0;
        height: 50px;
        flex: 0 1 15ch;
        color: lime;
        font-size: 15px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        overflow: visible;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .mobile-ghost-icon {
        grid-area: empty;
        display: flex;
        width: auto;
        flex-basis: auto;
        background: rgb(59 0 102 / 65%);
      }
    }
  </style>
</head>

<body>
  <iframe class="background-frame" src="/dead/pages/background/" title="Background" aria-hidden="true"></iframe>

  <div class="bottom-bar" aria-label="Static bookmark top bar preview">
    <div class="bar-content">
      <span class="bar-column bar-column-left">
        <span class="emoji-icon skull-icon"><span class="emoji-tint is-screen is-skull" data-emoji="&#9760;">&#9760;</span></span>
        <a class="site-link home-link" href="/">theinternetisdead.org</a>
        <span class="site-divider after-site" aria-hidden="true"></span>
        <span class="emoji-icon spiral-icon"><span class="emoji-tint" data-emoji="&#127744;">&#127744;</span></span>
      </span>
      <span class="bar-column bar-column-center">
        <span class="index-link-slot"><span class="index-bracket index-bracket-left" aria-hidden="true">&lt;</span><span class="index-link-panel"><span class="site-divider" aria-hidden="true"></span><span class="index-link-stack"><a class="home-link index-link" href="/">index.html</a></span><span class="site-divider" aria-hidden="true"></span></span><span class="index-bracket index-bracket-right" aria-hidden="true">&gt;</span></span>
      </span>
      <span class="bar-column bar-column-right">
        <span class="emoji-icon recycle-icon"><span class="emoji-tint" data-emoji="&#9851;">&#9851;</span></span>
        <span class="emoji-icon alien-icon ghost-counter" id="ghost-counter" role="status" aria-label="? Ghosts Online">
          <span class="ghost-glyph"><span class="emoji-tint" data-emoji="&#128123;">&#128123;</span></span>
          <span class="ghost-text">
            <span class="ghost-count" id="ghost-count">?</span><span class="ghost-label" id="ghost-label">Ghosts Online</span>
          </span>
          <span class="alien-glyph"><span class="emoji-tint" data-emoji="&#127760;">&#127760;</span></span>
        </span>
        <span class="clock-text">
          <span class="clock-time" id="clock-time"></span>
          <span class="clock-date" id="clock-date"></span>
        </span>
        <span class="emoji-icon gear-icon"><span class="emoji-tint" data-emoji="&#9881;&#65039;">&#9881;&#65039;</span></span>
        <span class="emoji-icon ghost-icon mobile-ghost-icon"><span class="emoji-tint" data-emoji="&#128123;">&#128123;</span></span>
      </span>
    </div>
  </div>
  <script>
    const clockTime = document.getElementById("clock-time");
    const clockDate = document.getElementById("clock-date");
    const ghostCounter = document.getElementById("ghost-counter");
    const ghostCount = document.getElementById("ghost-count");
    const ghostLabel = document.getElementById("ghost-label");
    const YOU_DUMMY_TEXT = "It's YOU dummy!";
    let ghostsOnlineCount = null;

    const updateClock = () => {
      const now = new Date();

      clockTime.textContent = now.toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit",
        hour12: true
      }).replace(/\s/g, "");

      clockDate.textContent = now.toLocaleDateString([], {
        month: "short",
        day: "numeric",
        year: "numeric"
      });
    };

    updateClock();
    setInterval(updateClock, 1000);

    const formatGhostsOnlineText = (count) => (
      count === 1 ? "1 Ghost Online" : `${Number.isFinite(count) ? count : "?"} Ghosts Online`
    );

    const setGhostCounterLabel = (label) => {
      const match = label.match(/^(\S+)(.*)$/);
      const countText = match ? match[1] : "?";
      const suffixText = match ? match[2].trimStart() : "Ghosts Online";

      ghostCount.textContent = countText;
      ghostLabel.textContent = suffixText;
      ghostCounter.setAttribute("aria-label", label);
    };

    const restoreGhostCounterLabel = () => {
      ghostCounter.classList.remove("is-you-dummy");
      setGhostCounterLabel(formatGhostsOnlineText(ghostsOnlineCount));
    };

    const showYouDummyLabel = () => {
      if (ghostsOnlineCount !== 1) return;
      ghostCounter.classList.add("is-you-dummy");
      setGhostCounterLabel(YOU_DUMMY_TEXT);
    };

    const setGhostsOnline = (count) => {
      ghostsOnlineCount = count;
      restoreGhostCounterLabel();
    };

    const connectGhostCounterSocket = () => {
      if (!window.WebSocket) {
        setGhostsOnline(null);
        return;
      }

      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const socketUrl = `${protocol}//${window.location.host}/api/ghosts-online`;
      let socket;

      try {
        socket = new WebSocket(socketUrl);
      } catch (error) {
        window.setTimeout(connectGhostCounterSocket, 5000);
        return;
      }

      socket.addEventListener("message", (event) => {
        try {
          const data = JSON.parse(event.data);
          const count = Number(data && data.count);
          if (Number.isFinite(count) && count >= 0) {
            setGhostsOnline(count);
          }
        } catch (error) {
          // Keep the last visible counter value when a malformed packet arrives.
        }
      });

      socket.addEventListener("close", () => {
        window.setTimeout(connectGhostCounterSocket, 5000);
      });
    };

    ghostCounter.addEventListener("mouseenter", showYouDummyLabel);
    ghostCounter.addEventListener("mouseleave", restoreGhostCounterLabel);

    const desktopHeaderAudioQuery = window.matchMedia("(min-width: 601px)");
    let davidVoice = null;
    let spiralHoverActive = false;
    let spiralRepeatTimer = null;
    let spiralRepeatCount = 0;
    let skullHoverActive = false;
    let skullRepeatTimer = null;
    let noiseContext = null;
    let noiseSource = null;
    let noiseGain = null;
    let modemContext = null;
    let modemNodes = [];
    let modemPopTimer = null;
    let modemWarbleTimer = null;
    let siteSpeechTimer = null;
    let siteSpeechActive = false;
    let modemSpeechTimer = null;
    let modemSpeechActive = false;
    const TTS_VOLUME_SCALE = 0.5;
    const MODEM_EFFECT_VOLUME_SCALE = 0.33;

    const refreshDavidVoice = () => {
      if (!window.speechSynthesis) return;
      const voices = window.speechSynthesis.getVoices();
      davidVoice = voices.find((voice) => /microsoft david/i.test(voice.name))
        || voices.find((voice) => /david/i.test(voice.name))
        || voices.find((voice) => /^en[-_]/i.test(voice.lang))
        || voices[0]
        || null;
    };

    const stopHeaderSpeech = () => {
      if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
      }
      spiralHoverActive = false;
      skullHoverActive = false;
      siteSpeechActive = false;
      modemSpeechActive = false;
      spiralRepeatCount = 0;
      if (spiralRepeatTimer) {
        window.clearTimeout(spiralRepeatTimer);
        spiralRepeatTimer = null;
      }
      if (siteSpeechTimer) {
        window.clearTimeout(siteSpeechTimer);
        siteSpeechTimer = null;
      }
      if (modemSpeechTimer) {
        window.clearTimeout(modemSpeechTimer);
        modemSpeechTimer = null;
      }
      if (skullRepeatTimer) {
        window.clearTimeout(skullRepeatTimer);
        skullRepeatTimer = null;
      }
    };

    const speakWithDavid = (text, options = {}) => {
      if (!desktopHeaderAudioQuery.matches || !window.speechSynthesis) return;

      refreshDavidVoice();
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      if (davidVoice) utterance.voice = davidVoice;
      utterance.rate = options.rate || 1;
      utterance.pitch = options.pitch || 1;
      utterance.volume = (options.volume || 1) * TTS_VOLUME_SCALE;

      window.speechSynthesis.speak(utterance);
    };

    const speakSpiralLoop = () => {
      if (!desktopHeaderAudioQuery.matches || !window.speechSynthesis) return;

      refreshDavidVoice();
      spiralHoverActive = true;

      const utterance = new SpeechSynthesisUtterance("Spiral");
      if (davidVoice) utterance.voice = davidVoice;
      utterance.rate = 1;
      utterance.pitch = spiralRepeatCount % 2 === 0 ? 1.25 : 0.75;
      utterance.volume = TTS_VOLUME_SCALE;

      window.speechSynthesis.speak(utterance);
      spiralRepeatCount += 1;
      spiralRepeatTimer = window.setTimeout(speakSpiralLoop, 500);
    };

    const speakSkullLoop = () => {
      if (!skullHoverActive || !desktopHeaderAudioQuery.matches || !window.speechSynthesis) return;

      refreshDavidVoice();
      const utterance = new SpeechSynthesisUtterance("Open Grave Menu");
      if (davidVoice) utterance.voice = davidVoice;
      utterance.rate = 1;
      utterance.pitch = 1;
      utterance.volume = TTS_VOLUME_SCALE;

      window.speechSynthesis.speak(utterance);
      skullRepeatTimer = window.setTimeout(speakSkullLoop, 500);
    };

    const speakSiteLinkLoop = () => {
      if (!siteSpeechActive || !desktopHeaderAudioQuery.matches || !window.speechSynthesis) return;

      refreshDavidVoice();
      const startedAt = performance.now();
      const utterance = new SpeechSynthesisUtterance("the internet is dead .org");
      if (davidVoice) utterance.voice = davidVoice;
      utterance.rate = 1.15;
      utterance.pitch = 0.78;
      utterance.volume = 0.88 * TTS_VOLUME_SCALE;
      utterance.addEventListener("end", () => {
        if (!siteSpeechActive || !desktopHeaderAudioQuery.matches) return;
        const elapsed = performance.now() - startedAt;
        siteSpeechTimer = window.setTimeout(speakSiteLinkLoop, Math.max(0, 1000 - elapsed));
      });

      window.speechSynthesis.speak(utterance);
    };

    const speakModemPhraseLoop = (text) => {
      if (!modemSpeechActive || !desktopHeaderAudioQuery.matches || !window.speechSynthesis) return;

      refreshDavidVoice();
      const startedAt = performance.now();
      const phrase = typeof text === "function" ? text() : text;
      const utterance = new SpeechSynthesisUtterance(phrase);
      if (davidVoice) utterance.voice = davidVoice;
      utterance.rate = 1.15;
      utterance.pitch = 0.78;
      utterance.volume = 0.88 * TTS_VOLUME_SCALE;
      utterance.addEventListener("end", () => {
        if (!modemSpeechActive || !desktopHeaderAudioQuery.matches) return;
        const elapsed = performance.now() - startedAt;
        modemSpeechTimer = window.setTimeout(() => {
          speakModemPhraseLoop(text);
        }, Math.max(0, 1000 - elapsed));
      });

      window.speechSynthesis.speak(utterance);
    };

    const makeNoiseBuffer = (audioContext, durationSeconds = 1) => {
      const sampleRate = audioContext.sampleRate;
      const buffer = audioContext.createBuffer(1, sampleRate * durationSeconds, sampleRate);
      const output = buffer.getChannelData(0);

      for (let i = 0; i < output.length; i += 1) {
        output[i] = Math.random() * 2 - 1;
      }

      return buffer;
    };

    const makeCrunchCurve = (amount = 70) => {
      const samples = 256;
      const curve = new Float32Array(samples);
      const deg = Math.PI / 180;

      for (let i = 0; i < samples; i += 1) {
        const x = (i * 2) / samples - 1;
        curve[i] = ((3 + amount) * x * 20 * deg) / (Math.PI + amount * Math.abs(x));
      }

      return curve;
    };

    const stopModemStatic = () => {
      if (modemPopTimer) {
        window.clearInterval(modemPopTimer);
        modemPopTimer = null;
      }

      if (modemWarbleTimer) {
        window.clearInterval(modemWarbleTimer);
        modemWarbleTimer = null;
      }

      modemNodes.forEach((node) => {
        if (typeof node.stop === "function") {
          try {
            node.stop();
          } catch (error) {
            // Already stopped.
          }
        }
        node.disconnect();
      });
      modemNodes = [];

      if (modemContext) {
        modemContext.close();
        modemContext = null;
      }
    };

    const startModemStatic = () => {
      if (!desktopHeaderAudioQuery.matches) return;
      stopModemStatic();

      const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextCtor) return;

      modemContext = new AudioContextCtor();
      const masterGain = modemContext.createGain();
      const noiseGainNode = modemContext.createGain();
      const bandPass = modemContext.createBiquadFilter();
      const highPass = modemContext.createBiquadFilter();
      const crunch = modemContext.createWaveShaper();
      const noiseSourceNode = modemContext.createBufferSource();
      const carrierA = modemContext.createOscillator();
      const carrierB = modemContext.createOscillator();
      const carrierGain = modemContext.createGain();

      masterGain.gain.value = 0.16 * MODEM_EFFECT_VOLUME_SCALE;
      noiseGainNode.gain.value = 0.24;
      highPass.type = "highpass";
      highPass.frequency.value = 650;
      bandPass.type = "bandpass";
      bandPass.frequency.value = 2100;
      bandPass.Q.value = 1.4;
      crunch.curve = makeCrunchCurve();
      crunch.oversample = "4x";
      noiseSourceNode.buffer = makeNoiseBuffer(modemContext);
      noiseSourceNode.loop = true;

      carrierA.type = "square";
      carrierB.type = "sawtooth";
      carrierA.frequency.value = 1200;
      carrierB.frequency.value = 2400;
      carrierGain.gain.value = 0.035;

      noiseSourceNode
        .connect(noiseGainNode)
        .connect(highPass)
        .connect(bandPass)
        .connect(crunch)
        .connect(masterGain)
        .connect(modemContext.destination);
      carrierA.connect(carrierGain).connect(masterGain);
      carrierB.connect(carrierGain);

      noiseSourceNode.start();
      carrierA.start();
      carrierB.start();
      modemNodes = [noiseSourceNode, carrierA, carrierB, noiseGainNode, highPass, bandPass, crunch, carrierGain, masterGain];

      modemWarbleTimer = window.setInterval(() => {
        if (!modemContext) return;
        const now = modemContext.currentTime;
        bandPass.frequency.setTargetAtTime(1200 + Math.random() * 2600, now, 0.025);
        carrierA.frequency.setTargetAtTime(650 + Math.random() * 2200, now, 0.015);
        carrierB.frequency.setTargetAtTime(1600 + Math.random() * 3600, now, 0.015);
        noiseGainNode.gain.setTargetAtTime(0.12 + Math.random() * 0.28, now, 0.02);
      }, 90);

      modemPopTimer = window.setInterval(() => {
        if (!modemContext || Math.random() < 0.35) return;
        const popOsc = modemContext.createOscillator();
        const popGain = modemContext.createGain();
        const now = modemContext.currentTime;
        const duration = 0.018 + Math.random() * 0.045;

        popOsc.type = Math.random() > 0.5 ? "square" : "sawtooth";
        popOsc.frequency.value = 1800 + Math.random() * 5200;
        popGain.gain.setValueAtTime(0, now);
        popGain.gain.linearRampToValueAtTime(0.12 + Math.random() * 0.22, now + 0.004);
        popGain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        popOsc.connect(popGain).connect(masterGain);
        popOsc.start(now);
        popOsc.stop(now + duration);
        popOsc.addEventListener("ended", () => {
          popOsc.disconnect();
          popGain.disconnect();
        });
      }, 70);
    };

    const startWhiteNoise = () => {
      if (!desktopHeaderAudioQuery.matches) return;
      stopHeaderSpeech();
      stopModemStatic();
      stopWhiteNoise();

      const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextCtor) return;

      noiseContext = new AudioContextCtor();
      noiseSource = noiseContext.createBufferSource();
      noiseGain = noiseContext.createGain();
      noiseGain.gain.value = 0.12;
      noiseSource.buffer = makeNoiseBuffer(noiseContext);
      noiseSource.loop = true;
      noiseSource.connect(noiseGain).connect(noiseContext.destination);
      noiseSource.start();
    };

    const stopWhiteNoise = () => {
      if (noiseSource) {
        noiseSource.stop();
        noiseSource.disconnect();
        noiseSource = null;
      }

      if (noiseContext) {
        noiseContext.close();
        noiseContext = null;
      }

      noiseGain = null;
    };

    const addDesktopSpeechHover = (selector, text, options) => {
      const element = document.querySelector(selector);
      if (!element) return;

      element.addEventListener("mouseenter", () => {
        stopWhiteNoise();
        stopModemStatic();
        speakWithDavid(text, options);
      });

      element.addEventListener("mouseleave", stopHeaderSpeech);
    };

    if (window.speechSynthesis) {
      refreshDavidVoice();
      if (typeof window.speechSynthesis.addEventListener === "function") {
        window.speechSynthesis.addEventListener("voiceschanged", refreshDavidVoice);
      } else {
        window.speechSynthesis.onvoiceschanged = refreshDavidVoice;
      }
    }

    const skullIcon = document.querySelector(".skull-icon");
    if (skullIcon) {
      skullIcon.addEventListener("mouseenter", () => {
        stopWhiteNoise();
        stopModemStatic();
        stopHeaderSpeech();
        skullHoverActive = true;
        speakSkullLoop();
      });
      skullIcon.addEventListener("mouseleave", stopHeaderSpeech);
    }
    const siteLink = document.querySelector(".site-link");
    if (siteLink) {
      siteLink.addEventListener("mouseenter", () => {
        stopWhiteNoise();
        stopHeaderSpeech();
        startModemStatic();
        siteSpeechActive = true;
        speakSiteLinkLoop();
      });
      siteLink.addEventListener("mouseleave", () => {
        stopHeaderSpeech();
        stopModemStatic();
      });
    }
    const spiralIcon = document.querySelector(".spiral-icon");
    if (spiralIcon) {
      spiralIcon.addEventListener("mouseenter", () => {
        stopWhiteNoise();
        stopHeaderSpeech();
        spiralRepeatCount = 0;
        speakSpiralLoop();
      });
      spiralIcon.addEventListener("mouseleave", stopHeaderSpeech);
    }
    addDesktopSpeechHover(".index-bracket-left", "Go Left");
    addDesktopSpeechHover(".index-bracket-right", "Go Right");
    const indexLinkPanel = document.querySelector(".index-link-panel");
    if (indexLinkPanel) {
      indexLinkPanel.addEventListener("mouseenter", () => {
        stopWhiteNoise();
        stopHeaderSpeech();
        startModemStatic();
        modemSpeechActive = true;
        speakModemPhraseLoop("index.html of the internet is dead .org");
      });
      indexLinkPanel.addEventListener("mouseleave", () => {
        stopHeaderSpeech();
        stopModemStatic();
      });
    }
    const clockText = document.querySelector(".clock-text");
    if (clockText) {
      clockText.addEventListener("mouseenter", () => {
        stopWhiteNoise();
        stopHeaderSpeech();
        startModemStatic();
        modemSpeechActive = true;
        speakModemPhraseLoop(() => `${clockTime.textContent} ${clockDate.textContent}`);
      });
      clockText.addEventListener("mouseleave", () => {
        stopHeaderSpeech();
        stopModemStatic();
      });
    }
    addDesktopSpeechHover(".recycle-icon", "Randomize Page");
    addDesktopSpeechHover(".ghost-glyph", "Ghost Connection");

    const globeGlyph = document.querySelector(".alien-glyph");
    if (globeGlyph) {
      globeGlyph.addEventListener("mouseenter", startWhiteNoise);
      globeGlyph.addEventListener("mouseleave", stopWhiteNoise);
    }

    const stopHeaderAudio = () => {
      stopHeaderSpeech();
      stopWhiteNoise();
      stopModemStatic();
    };

    if (typeof desktopHeaderAudioQuery.addEventListener === "function") {
      desktopHeaderAudioQuery.addEventListener("change", stopHeaderAudio);
    } else {
      desktopHeaderAudioQuery.addListener(stopHeaderAudio);
    }

    setGhostsOnline(null);
    connectGhostCounterSocket();
  </script>
</body>
</html>
