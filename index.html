<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>The Internet Is Dead...</title>
  <style>
    :root {
      --lime: #39ff14;
      --magenta: #ff00ff;
      --black: #000;
      --purple-rgb: 81, 42, 103;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
      background: var(--black);
      font-family: "Courier New", Courier, monospace;
      touch-action: pan-x pan-y pinch-zoom;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    .foreground-layer {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      padding: 25px;
    }

    .top-center.barrel-roll {
      animation: barrel-roll 1.15s ease-in-out;
    }

    .foreground-layer a,
    .foreground-layer button,
    .foreground-layer select {
      pointer-events: auto;
    }

    @keyframes barrel-roll {
      0% {
        transform: rotate(0deg) scale(1);
      }
      16% {
        transform: rotate(55deg) scale(0.72, 0.78);
      }
      34% {
        transform: rotate(125deg) scale(0.46, 0.52);
      }
      50% {
        transform: rotate(180deg) scale(0.28, 0.32);
      }
      66% {
        transform: rotate(245deg) scale(0.52, 0.46);
      }
      84% {
        transform: rotate(320deg) scale(0.82, 0.72);
      }
      100% {
        transform: rotate(360deg) scale(1);
      }
    }

    .background-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      z-index: 0;
      pointer-events: none;
    }

    .top-row {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 50px minmax(0, 1fr) 50px;
      align-items: start;
      column-gap: 16px;
      height: calc(100vh - 50px);
      pointer-events: none;
    }

    .home-skull {
      position: relative;
      width: 50px;
      height: 50px;
      min-width: 50px;
      min-height: 50px;
      max-width: 50px;
      max-height: 50px;
      aspect-ratio: 1 / 1;
      display: block;
      overflow: visible;
      text-decoration: none;
      font-size: 0;
    }

    .home-skull span {
      position: absolute;
      top: 0;
      left: 0;
      width: 50px;
      height: 50px;
      display: block;
      font-size: 50px;
      line-height: 50px;
      text-align: left;
      transform: translate(-9px, -2px);
    }

    .top-gear {
      position: relative;
      width: 50px;
      height: 50px;
      min-width: 50px;
      min-height: 50px;
      max-width: 50px;
      max-height: 50px;
      aspect-ratio: 1 / 1;
      display: block;
      overflow: visible;
      text-decoration: none;
      font-size: 0;
    }

    .top-gear span {
      position: absolute;
      top: 0;
      right: 0;
      width: 50px;
      height: 50px;
      display: block;
      font-size: 50px;
      line-height: 50px;
      text-align: right;
      transform: translate(4px, -2px);
    }

    .top-center {
      width: 100%;
      min-width: 0;
      height: calc(100vh - 50px);
      max-height: calc(100vh - 50px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 13px;
      padding: 6px 6px 92px;
      scroll-padding: 6px 6px 92px;
      text-align: center;
      overflow-x: hidden;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      touch-action: pan-x pan-y pinch-zoom;
      -webkit-overflow-scrolling: touch;
      transform-origin: 50% 50%;
      pointer-events: auto;
    }

    .top-center::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    .top-center.is-panel-mode {
      padding-bottom: 6px;
      scroll-padding-bottom: 6px;
    }

    .title-box {
      flex: 0 0 auto;
      width: 100%;
      max-width: none;
      min-width: 0;
      display: block;
      padding: 6px clamp(14px, 3vw, 32px);
      border: 3px solid var(--lime);
      background: rgba(var(--purple-rgb), 0.5);
      color: var(--lime);
      font-weight: 700;
      font-size: clamp(1.15rem, 3.2vw, 2.45rem);
      line-height: 1;
      text-shadow:
        0 0 6px var(--lime),
        0 0 18px rgba(57, 255, 20, 0.7),
        2px 2px 0 var(--black);
      letter-spacing: 0.04em;
      overflow: visible;
      text-overflow: clip;
    }

    .title-box div {
      white-space: nowrap;
    }

    .mobile-title-line {
      display: none;
    }

    .action-row {
      width: 100%;
      flex: 0 1 auto;
      min-width: 0;
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .action-stack {
      width: 100%;
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 13px;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .action-stack.is-frame-active {
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }

    .action-label {
      flex: 0 0 auto;
      color: var(--magenta);
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(0.82rem, 1.8vw, 1.1rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1;
      text-shadow: 0 0 6px rgba(255, 0, 255, 0.8);
      white-space: nowrap;
    }

    .action-select,
    .go-button {
      height: 34px;
      border: 2px solid var(--lime);
      background-color: var(--black);
      color: var(--magenta) !important;
      -webkit-text-fill-color: var(--magenta);
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(0.78rem, 1.7vw, 1rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-shadow: 0 0 6px rgba(255, 0, 255, 0.8);
      box-shadow: 0 0 10px rgba(57, 255, 20, 0.35);
    }

    .action-select option {
      background-color: var(--black);
      color: var(--magenta);
      -webkit-text-fill-color: var(--magenta);
    }

    .action-select:focus,
    .go-button:focus,
    .go-button:hover {
      color: var(--magenta) !important;
      -webkit-text-fill-color: var(--magenta);
      border-color: var(--lime);
      outline: 0;
      box-shadow:
        0 0 0 2px var(--magenta),
        0 0 10px rgba(57, 255, 20, 0.35);
    }

    .action-select {
      flex: 1 1 auto;
      min-width: 0;
      padding: 0 32px 0 12px;
      appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--lime) 50%),
        linear-gradient(135deg, var(--lime) 50%, transparent 50%);
      background-position:
        calc(100% - 20px) 12px,
        calc(100% - 13px) 12px;
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
    }

    .go-button {
      flex: 0 0 clamp(58px, 7vw, 82px);
      width: clamp(58px, 7vw, 82px);
      padding: 0 12px;
      cursor: default;
    }

    .lorem-placeholder {
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      margin-top: 0;
      padding: 12px 14px;
      border: 2px solid var(--lime);
      background: rgba(var(--purple-rgb), 0.5);
      color: var(--magenta);
      font-family: "Courier New", Courier, monospace;
      text-align: left;
      box-shadow: 0 0 10px rgba(57, 255, 20, 0.25);
      overflow: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .lorem-placeholder::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    .lorem-placeholder.is-frame {
      flex: 1 1 auto;
      min-height: 0;
      padding: 0;
      overflow: hidden;
    }

    .content-frame {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 0;
      border: 0;
      background: transparent;
      pointer-events: auto;
    }

    .game-player-overlay {
      position: fixed;
      top: 25px;
      right: 91px;
      bottom: 91px;
      left: 91px;
      z-index: 5;
      display: none;
      border: 2px solid var(--lime);
      background: var(--black);
      box-shadow:
        0 0 0 2px var(--black),
        0 0 18px rgba(57, 255, 20, 0.45);
      pointer-events: auto;
    }

    .game-player-overlay.is-active {
      display: block;
    }

    .foreground-layer.is-game-active .top-center {
      visibility: hidden;
      pointer-events: none;
    }

    .foreground-layer.is-game-active .game-player-overlay,
    .foreground-layer.is-game-active .home-skull,
    .foreground-layer.is-game-active .top-gear,
    .foreground-layer.is-game-active .bottom-emoji,
    .foreground-layer.is-game-active .game-player-back {
      visibility: visible;
      pointer-events: auto;
    }

    .game-player-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--black);
    }

    .game-player-back {
      position: fixed;
      left: 50%;
      bottom: 25px;
      z-index: 6;
      display: none;
      transform: translateX(-50%);
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--lime);
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(0.9rem, 2.2vw, 1.2rem);
      font-weight: 700;
      line-height: 50px;
      cursor: pointer;
      text-align: center;
      text-shadow:
        0 0 6px var(--lime),
        0 0 18px rgba(57, 255, 20, 0.7),
        2px 2px 0 var(--black);
    }

    .foreground-layer.is-game-active .game-player-back {
      display: block;
    }

    .game-player-back:hover,
    .game-player-back:focus-visible {
      outline: 0;
      color: var(--magenta);
      text-shadow:
        0 0 6px var(--magenta),
        0 0 18px rgba(255, 0, 255, 0.7),
        2px 2px 0 var(--black);
    }

    .lorem-placeholder header {
      margin: 0 0 12px;
      padding: 0 0 10px;
      border-bottom: 2px solid var(--lime);
    }

    .lorem-placeholder .kicker,
    .lorem-placeholder h3,
    .lorem-placeholder strong,
    .lorem-placeholder .stamp {
      color: var(--lime);
      font-family: "Courier New", Courier, monospace;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-shadow: 0 0 6px rgba(57, 255, 20, 0.8);
    }

    .lorem-placeholder .kicker {
      margin: 0 0 6px;
      font-size: clamp(0.58rem, 1vw, 0.72rem);
    }

    .lorem-placeholder h1,
    .lorem-placeholder h2,
    .lorem-placeholder h3 {
      margin: 0;
      line-height: 1.05;
    }

    .lorem-placeholder h1 {
      color: var(--lime);
      font-size: clamp(1.25rem, 3vw, 2.2rem);
      letter-spacing: -0.04em;
      text-shadow:
        0 0 6px var(--lime),
        0 0 14px rgba(57, 255, 20, 0.65),
        2px 2px 0 var(--black);
    }

    .lorem-placeholder h2 {
      margin: 18px 0 8px;
      color: var(--lime);
      font-size: clamp(0.92rem, 1.8vw, 1.2rem);
      letter-spacing: 0.02em;
      text-shadow: 0 0 6px rgba(57, 255, 20, 0.8);
    }

    .lorem-placeholder h3 {
      margin: 0 0 6px;
      font-size: clamp(0.68rem, 1.3vw, 0.86rem);
    }

    .lorem-placeholder p,
    .lorem-placeholder li,
    .lorem-placeholder blockquote {
      color: var(--magenta);
      font-size: clamp(0.62rem, 1.12vw, 0.8rem);
      line-height: 1.32;
      letter-spacing: 0.02em;
      text-shadow: 0 0 5px rgba(255, 0, 255, 0.65);
    }

    .lorem-placeholder p {
      margin: 0 0 9px;
    }

    .lorem-placeholder .subtitle {
      margin-top: 8px;
    }

    .lorem-placeholder a,
    .lorem-placeholder code {
      color: var(--lime);
    }

    .lorem-placeholder code {
      padding: 0 4px;
      border: 1px solid var(--lime);
      background: var(--black);
      text-shadow: none;
    }

    .lorem-placeholder .notice,
    .lorem-placeholder .abstract,
    .lorem-placeholder blockquote,
    .lorem-placeholder .card,
    .lorem-placeholder .signature {
      margin: 12px 0;
      padding: 10px;
      border: 2px solid var(--lime);
      background: rgba(0, 0, 0, 0.45);
      box-shadow: 0 0 8px rgba(57, 255, 20, 0.2);
    }

    .lorem-placeholder .abstract {
      border-left-width: 6px;
    }

    .lorem-placeholder blockquote {
      border-color: var(--magenta);
      font-style: italic;
    }

    .lorem-placeholder ol,
    .lorem-placeholder ul {
      margin: 8px 0 10px;
      padding-left: 20px;
    }

    .lorem-placeholder li {
      margin-bottom: 7px;
    }

    .lorem-placeholder .principles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .lorem-placeholder .card {
      margin: 0;
    }

    .game-card-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .game-card {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      min-width: 0;
      overflow: hidden;
      border: 2px solid var(--lime);
      background: rgba(0, 0, 0, 0.45);
      color: var(--lime);
      text-decoration: none;
      box-shadow: 0 0 8px rgba(57, 255, 20, 0.2);
    }

    .game-card[href]:hover,
    .game-card[href]:focus-visible {
      outline: 0;
      box-shadow:
        0 0 0 2px var(--magenta),
        0 0 12px rgba(57, 255, 20, 0.35);
    }

    .game-card img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-bottom: 2px solid var(--lime);
      background: var(--black);
    }

    .game-card h2 {
      margin: 0;
      padding: 9px 10px;
      color: var(--lime);
      font-size: clamp(0.7rem, 1.3vw, 0.95rem);
      line-height: 1.12;
      letter-spacing: 0;
      text-shadow: 0 0 6px rgba(57, 255, 20, 0.8);
    }

    .lorem-placeholder .stamp {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 7px;
      border: 2px solid var(--magenta);
      color: var(--magenta);
      transform: rotate(-1.5deg);
    }


    .bottom-emoji {
      position: fixed;
      bottom: 25px;
      z-index: 2;
      width: 50px;
      height: 50px;
      min-width: 50px;
      min-height: 50px;
      max-width: 50px;
      max-height: 50px;
      aspect-ratio: 1 / 1;
      display: block;
      overflow: visible;
      border: 0;
      padding: 0;
      background: transparent;
      font-size: 0;
      pointer-events: none;
    }

    .bottom-emoji > span {
      position: absolute;
      bottom: 0;
      width: 50px;
      height: 50px;
      display: block;
      font-size: 50px;
      line-height: 50px;
    }

    .bottom-left {
      left: 25px;
    }

    .ghost-counter-trigger {
      cursor: pointer;
      pointer-events: auto;
      color: var(--lime);
      font-family: "Courier New", Courier, monospace;
      font-weight: 700;
      text-shadow:
        0 0 6px var(--lime),
        0 0 18px rgba(57, 255, 20, 0.7),
        2px 2px 0 var(--black);
    }

    .ghost-counter-trigger:focus-visible {
      outline: 0;
    }

    .ghost-counter-trigger.is-counter {
      width: 50px;
      min-width: 50px;
      max-width: 50px;
      height: 50px;
      min-height: 50px;
      max-height: 50px;
    }

    .ghost-counter-trigger.is-counter span {
      width: 50px;
      height: 50px;
      min-width: 50px;
      max-width: 50px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      overflow: hidden;
      font-size: 10px;
      line-height: 0.95;
      letter-spacing: 0;
      white-space: normal;
      text-align: left;
      transform: translate(-3px, 0);
    }

    .ghost-counter-trigger.is-counter .ghost-counter-line {
      display: block;
      position: static;
      width: 50px;
      height: auto;
      min-width: 0;
      min-height: 0;
      max-width: none;
      max-height: none;
      overflow: hidden;
      text-overflow: clip;
      font-size: inherit;
      line-height: inherit;
      transform: none;
    }

    .bottom-left > span {
      left: 0;
      text-align: left;
      transform: translate(-6px, 4px);
    }

    .bottom-right {
      right: 25px;
    }

    .barrel-roll-trigger {
      cursor: pointer;
      pointer-events: auto;
    }

    .barrel-roll-trigger:focus-visible {
      outline: 0;
    }

    .barrel-roll-trigger:focus-visible span {
      filter: drop-shadow(0 0 0 var(--lime)) drop-shadow(0 0 8px var(--lime));
    }

    .bottom-right span {
      right: 0;
      text-align: right;
      transform: translate(4px, 4px);
    }

    @media (max-width: 720px) {
      .foreground-layer {
        padding: 16px;
      }

      .top-row {
        grid-template-columns: 42px minmax(0, 1fr) 42px;
        column-gap: 8px;
        height: calc(100vh - 32px);
      }

      .home-skull {
        position: fixed;
        top: 16px;
        left: 16px;
      }

      .top-gear {
        position: fixed;
        top: 16px;
        right: 16px;
      }

      .home-skull,
      .top-gear,
      .bottom-emoji {
        width: 42px;
        height: 42px;
        min-width: 42px;
        min-height: 42px;
        max-width: 42px;
        max-height: 42px;
      }

      .home-skull span,
      .top-gear span,
      .bottom-emoji > span {
        width: 42px;
        height: 42px;
        font-size: 42px;
        line-height: 42px;
      }

      .bottom-emoji {
        bottom: 16px;
      }

      .bottom-left {
        left: 16px;
      }

      .ghost-counter-trigger.is-counter {
        width: 42px;
        min-width: 42px;
        max-width: 42px;
        height: 42px;
        min-height: 42px;
        max-height: 42px;
      }

      .ghost-counter-trigger.is-counter span {
        width: 42px;
        height: 42px;
        min-width: 42px;
        max-width: 42px;
        font-size: 8px;
        line-height: 0.95;
        transform: translate(-2px, 0);
      }

      .ghost-counter-trigger.is-counter .ghost-counter-line {
        width: 42px;
      }

      .bottom-right {
        right: 16px;
      }

      .top-center {
        position: fixed;
        top: calc(16px + 42px + 8px);
        right: 16px;
        bottom: calc(16px + 42px + 8px);
        left: 16px;
        width: auto;
        height: auto;
        max-height: none;
        display: flex;
        gap: 6px;
        margin-top: 0;
        padding: 6px 6px 14px;
        scroll-padding: 6px 6px 14px;
        overflow: visible;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .top-center.is-panel-mode {
        padding-bottom: 6px;
        scroll-padding-bottom: 6px;
      }

      .game-player-overlay {
        top: calc(16px + 42px + 8px);
        right: 16px;
        bottom: calc(16px + 42px + 8px);
        left: 16px;
      }

      .game-player-back {
        bottom: 16px;
        font-size: clamp(0.74rem, 3.4vw, 0.95rem);
        line-height: 42px;
      }

      .action-stack {
        width: 100%;
        flex: 1 1 auto;
        min-height: 0;
        margin-left: 0;
        margin-right: 0;
        gap: 6px;
        overflow: hidden;
      }

      .action-stack.is-frame-active {
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
      }

      .action-stack::-webkit-scrollbar {
        width: 0;
        height: 0;
        display: none;
      }

      .title-box {
        flex: 0 0 auto;
        width: calc(100% - 108px);
        align-self: center;
        margin-top: calc(-42px - 8px);
        padding: 3px 6px;
        border-width: 2px;
        font-size: clamp(0.9rem, 5vw, 1.35rem);
        line-height: 0.96;
        letter-spacing: 0;
      }

      .desktop-title-line {
        display: none;
      }

      .mobile-title-line {
        display: block;
      }

      .action-row {
        gap: 5px;
      }

      .action-label {
        width: calc(100% - 108px);
        align-self: center;
        font-size: clamp(0.78rem, 4vw, 1.05rem);
        line-height: 0.95;
        letter-spacing: 0;
      }

      .action-select,
      .go-button {
        height: 30px;
        font-size: clamp(0.58rem, 2.65vw, 0.78rem);
        letter-spacing: 0;
      }

      .action-select {
        flex: 1 1 auto;
        min-width: 0;
        padding-left: 7px;
        padding-right: 22px;
        background-position:
          calc(100% - 12px) 10px,
          calc(100% - 7px) 10px;
        background-size: 5px 5px, 5px 5px;
      }

      .go-button {
        flex: 0 0 42px;
        width: 42px;
        padding: 0 4px;
      }

      .lorem-placeholder {
        flex: 1 1 auto;
        min-height: 0;
        padding: 6px 7px;
      }

      .lorem-placeholder.is-frame {
        flex: 1 1 auto;
        min-height: 0;
        padding: 0;
      }

      .lorem-placeholder header {
        margin-bottom: 7px;
        padding-bottom: 6px;
      }

      .lorem-placeholder .kicker {
        margin-bottom: 3px;
        font-size: clamp(0.46rem, 2vw, 0.58rem);
      }

      .lorem-placeholder h1 {
        font-size: clamp(0.82rem, 4.2vw, 1.1rem);
      }

      .lorem-placeholder h2 {
        margin: 10px 0 5px;
        font-size: clamp(0.62rem, 2.55vw, 0.78rem);
      }

      .lorem-placeholder h3 {
        margin-bottom: 4px;
        font-size: clamp(0.54rem, 2.2vw, 0.66rem);
      }

      .lorem-placeholder .notice,
      .lorem-placeholder .abstract,
      .lorem-placeholder blockquote,
      .lorem-placeholder .card,
      .lorem-placeholder .signature {
        margin: 7px 0;
        padding: 6px;
      }

      .lorem-placeholder p,
      .lorem-placeholder li,
      .lorem-placeholder blockquote {
        margin-bottom: 5px;
        font-size: clamp(0.46rem, 2.02vw, 0.62rem);
        line-height: 1.14;
      }

      .lorem-placeholder ol,
      .lorem-placeholder ul {
        margin: 5px 0 6px;
        padding-left: 15px;
      }

      .lorem-placeholder li {
        margin-bottom: 4px;
      }

      .lorem-placeholder .principles {
        grid-template-columns: 1fr;
        gap: 6px;
        margin-top: 6px;
      }

      .game-card-grid {
        grid-template-columns: 1fr;
        gap: 7px;
      }

      .game-card {
        grid-template-columns: 96px minmax(0, 1fr);
        grid-template-rows: auto;
      }

      .game-card img {
        height: 72px;
        aspect-ratio: auto;
        border-right: 2px solid var(--lime);
        border-bottom: 0;
      }

      .game-card h2 {
        align-self: center;
        padding: 7px 8px;
        font-size: clamp(0.58rem, 2.5vw, 0.72rem);
      }
    }

    @media (max-width: 460px) {
      .title-box {
        max-width: none;
        width: calc(100% - 108px);
        font-size: clamp(0.9rem, 5vw, 1.35rem);
        padding-left: 4px;
        padding-right: 4px;
      }

      .action-label {
        max-width: none;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .action-row {
        gap: 5px;
      }

      .action-stack {
        width: 100%;
        margin-left: 0;
        margin-right: 0;
      }
    }

  </style>
</head>
<body>
  <iframe
    class="background-frame"
    src="/dead/pages/starfield-background.html"
    title="Animated starfield background"
    aria-hidden="true"
    tabindex="-1"
  ></iframe>

  <div class="foreground-layer">
    <div class="top-row">
      <a class="home-skull" href="/" aria-label="Go to root index"><span>💀</span></a>

      <div class="top-center">
        <section class="title-box" aria-label="Page title">
          <div class="desktop-title-line">The Internet Is Dead...</div>
          <div class="desktop-title-line">What now?</div>
          <div class="mobile-title-line">The Internet</div>
          <div class="mobile-title-line">Is Dead...</div>
          <div class="mobile-title-line">What now?</div>
        </section>

        <div class="action-stack">
          <div class="action-label">All you can do here is...</div>
          <div class="action-row" role="group" aria-label="Navigation selector">
            <select class="action-select" aria-label="Choose a section">
            <option>Ask me anything.</option>
            <option>Chat with weirdos.</option>
            <option>Enter a random dimension.</option>
            <option>Listen to my music.</option>
            <option selected>Look at the main page.</option>
            <option>Look at my pictures.</option>
            <option>Play my web games.</option>
            <option>Share your art with me.</option>
            <option>Watch my videos.</option>
          </select>
            <button class="go-button" type="button">Go</button>
          </div>

          <section class="lorem-placeholder whitepaper-placeholder is-frame" aria-label="WTF Is This Website?">
            <iframe class="content-frame" src="/main-page.html" title="WTF Is This Website"></iframe>
          </section>
        </div>
      </div>

      <div class="top-gear" role="img" aria-label="Star"><span>⭐</span></div>
    </div>

    <button class="bottom-emoji bottom-left ghost-counter-trigger" type="button" aria-label="Show ghosts online"><span>👽</span></button>
    <button class="bottom-emoji bottom-right barrel-roll-trigger" type="button" aria-label="Do a barrel roll"><span>🌀</span></button>
    <div class="game-player-overlay" aria-hidden="true">
      <iframe class="game-player-frame" title="Web game"></iframe>
    </div>
    <button class="game-player-back" type="button">Go Back</button>
  </div>

  <script>
    const barrelRollLayer = document.querySelector('.top-center');
    const foregroundLayer = document.querySelector('.foreground-layer');
    const barrelRollTrigger = document.querySelector('.barrel-roll-trigger');
    const actionSelect = document.querySelector('.action-select');
    const goButton = document.querySelector('.go-button');
    const contentBox = document.querySelector('.lorem-placeholder');
    const actionStack = document.querySelector('.action-stack');
    const topCenter = document.querySelector('.top-center');
    const ghostCounterTrigger = document.querySelector('.ghost-counter-trigger');
    const ghostCounterText = ghostCounterTrigger.querySelector('span');
    const gamePlayerOverlay = document.querySelector('.game-player-overlay');
    const gamePlayerFrame = document.querySelector('.game-player-frame');
    const gamePlayerBack = document.querySelector('.game-player-back');
    const alienEmoji = ghostCounterText.textContent;
    let ghostsOnlineCount = null;
    let ghostCounterVisible = false;
    let ghostCounterSocketStarted = false;

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[character]));
    }

    function renderActionSelection() {
      const selectedAction = actionSelect.value;

      topCenter.classList.add('is-panel-mode');

      if (selectedAction === 'Chat with weirdos.') {
        actionStack.classList.add('is-frame-active');
        contentBox.classList.add('is-frame');
        contentBox.setAttribute('aria-label', 'Chat with weirdos');
        contentBox.innerHTML = '<iframe class="content-frame" src="/chat.html?open=1" title="Chat with weirdos" allow="clipboard-write"></iframe>';
        return;
      }

      if (selectedAction === 'Look at the main page.') {
        actionStack.classList.add('is-frame-active');
        contentBox.classList.add('is-frame');
        contentBox.setAttribute('aria-label', 'WTF Is This Website?');
        contentBox.innerHTML = '<iframe class="content-frame" src="/main-page.html" title="WTF Is This Website"></iframe>';
        return;
      }

      if (selectedAction === 'Play my web games.') {
        actionStack.classList.remove('is-frame-active');
        contentBox.classList.remove('is-frame');
        contentBox.setAttribute('aria-label', 'Play my web games');
        contentBox.innerHTML = `
          <div class="game-card-grid">
            <a class="game-card" href="/dead/games/shooter-game/">
              <img src="/dead/images/dead-games-shooter-game-assets-levels-shooter-game-level1.jpg" alt="" />
              <h2>Bananaman Shooter Game</h2>
            </a>
            <a class="game-card" href="/dead/games/ball-is-life/">
              <img src="/dead/images/dead-games-tektite-3d-game.jpg" alt="" />
              <h2>Ball is Life: Ball Simulator</h2>
            </a>
            <article class="game-card" aria-label="More coming soon">
              <img src="/dead/images/static.gif" alt="" />
              <h2>More coming soon...</h2>
            </article>
          </div>
        `;
        return;
      }

      actionStack.classList.remove('is-frame-active');
      contentBox.classList.remove('is-frame');
      contentBox.setAttribute('aria-label', selectedAction);
      contentBox.innerHTML = `
        <header>
          <h1>${escapeHtml(selectedAction)}</h1>
          <p class="subtitle">This channel is still tuning itself into existence.</p>
        </header>
      `;
    }

    function selectNextAction() {
      actionSelect.selectedIndex = (actionSelect.selectedIndex + 1) % actionSelect.options.length;
      renderActionSelection();
    }

    function openGamePlayer(url, title) {
      gamePlayerFrame.src = url;
      gamePlayerFrame.title = title || 'Web game';
      foregroundLayer.classList.add('is-game-active');
      gamePlayerOverlay.classList.add('is-active');
      gamePlayerOverlay.setAttribute('aria-hidden', 'false');
      gamePlayerBack.focus({ preventScroll: true });
    }

    function closeGamePlayer() {
      gamePlayerOverlay.classList.remove('is-active');
      foregroundLayer.classList.remove('is-game-active');
      gamePlayerOverlay.setAttribute('aria-hidden', 'true');
      gamePlayerFrame.removeAttribute('src');
    }

    function formatGhostsOnlineText(count) {
      return count === 1 ? '1 Ghost Online' : `${Number.isFinite(count) ? count : '?'} Ghosts Online`;
    }

    function renderGhostCounterText(count) {
      const countText = Number.isFinite(count) ? String(count) : '?';
      const ghostText = count === 1 ? 'Ghost' : 'Ghosts';
      return `
        <span class="ghost-counter-line">${countText}</span>
        <span class="ghost-counter-line">${ghostText}</span>
        <span class="ghost-counter-line">Online</span>
      `;
    }

    function updateGhostCounterDisplay() {
      if (!ghostCounterVisible) {
        ghostCounterText.textContent = alienEmoji;
        ghostCounterTrigger.classList.remove('is-counter');
        ghostCounterTrigger.setAttribute('aria-label', 'Show ghosts online');
        return;
      }

      const label = formatGhostsOnlineText(ghostsOnlineCount);
      ghostCounterText.innerHTML = renderGhostCounterText(ghostsOnlineCount);
      ghostCounterTrigger.classList.add('is-counter');
      ghostCounterTrigger.setAttribute('aria-label', label);
    }

    function setGhostsOnline(count) {
      ghostsOnlineCount = count;
      updateGhostCounterDisplay();
    }

    function connectGhostCounterSocket() {
      if (!window.WebSocket) {
        setGhostsOnline(null);
        return;
      }

      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const socketUrl = `${protocol}//${window.location.host}/api/ghosts-online`;
      let socket;

      try {
        socket = new WebSocket(socketUrl);
      } catch (error) {
        window.setTimeout(connectGhostCounterSocket, 5000);
        return;
      }

      socket.addEventListener('message', (event) => {
        try {
          const data = JSON.parse(event.data);
          const count = Number(data && data.count);
          if (Number.isFinite(count) && count >= 0) {
            setGhostsOnline(count);
          }
        } catch (error) {
          // Keep the last visible counter value if the socket sends malformed data.
        }
      });

      socket.addEventListener('close', () => {
        window.setTimeout(connectGhostCounterSocket, 5000);
      });

      socket.addEventListener('error', () => {
        try {
          socket.close();
        } catch (error) {
          window.setTimeout(connectGhostCounterSocket, 5000);
        }
      });
    }

    function toggleGhostCounter() {
      ghostCounterVisible = !ghostCounterVisible;
      if (ghostCounterVisible && !ghostCounterSocketStarted) {
        ghostCounterSocketStarted = true;
        setGhostsOnline(ghostsOnlineCount);
        connectGhostCounterSocket();
      } else {
        updateGhostCounterDisplay();
      }
    }

    barrelRollTrigger.addEventListener('click', () => {
      barrelRollLayer.classList.remove('barrel-roll');
      void barrelRollLayer.offsetWidth;
      barrelRollLayer.classList.add('barrel-roll');
    });

    contentBox.addEventListener('click', (event) => {
      const gameCard = event.target.closest('a.game-card[href]');
      if (!gameCard || !contentBox.contains(gameCard)) return;
      event.preventDefault();
      openGamePlayer(gameCard.getAttribute('href'), gameCard.querySelector('h2')?.textContent || 'Web game');
    });

    gamePlayerBack.addEventListener('click', closeGamePlayer);
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && gamePlayerOverlay.classList.contains('is-active')) {
        closeGamePlayer();
      }
    });

    actionSelect.addEventListener('change', renderActionSelection);
    goButton.addEventListener('click', selectNextAction);
    ghostCounterTrigger.addEventListener('click', toggleGhostCounter);
    renderActionSelection();
    updateGhostCounterDisplay();
  </script>
</body>
</html>
