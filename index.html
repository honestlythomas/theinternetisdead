<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/dead/js/shell-route.js"></script><link rel="icon" type="image/png" href="/dead/images/pngs/dead-favicon.png" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>theinternetisdead.org · world grid</title>
<style>
  /*
    background.html
    Single-file extraction of the shooter-game Level 1 starfield background.

    This intentionally keeps the canvas sizing/rendering style close to the
    source game instead of doing fancy high-DPI scaling. The old game used
    canvas.width = window.innerWidth and canvas.height = window.innerHeight,
    because apparently crisp modern rendering was too emotionally stable.
  */

  html,
  body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
    color: #0f0;
    font-family: monospace;
  }

  body {
    touch-action: none;
  }

  canvas {
    display: block;
    touch-action: none;
  }

  /* The map uses a single world-space origin; the viewport only clips it. */
  #map-grid {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    display: none;
    touch-action: none;
  }
  body.debug-grid #map-grid { display: block; }

  #grid-hud {
    display: none;
    position: fixed;
    z-index: 11;
    left: max(12px, env(safe-area-inset-left));
    bottom: max(12px, env(safe-area-inset-bottom));
    max-width: calc(100vw - 32px);
    box-sizing: border-box;
    padding: 9px 12px;
    border: 1px solid rgba(115, 245, 223, .55);
    background: rgba(0, 11, 17, .82);
    color: #b5fff1;
    font: 11px/1.5 monospace;
    letter-spacing: .025em;
    pointer-events: none;
  }
  body.debug-grid #grid-hud { display: block; }
  #grid-hud strong { color: #fff; font-weight: 600; }
  #grid-hud .help { color: #90aaa9; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="map-grid" aria-hidden="true"></canvas>
<div id="grid-hud" aria-live="off">
  <strong>WORLD GRID / DEBUG</strong><br>
  <span id="grid-readout"></span><br>
  <span class="help">Origin 0,0 fixed at top-left · Wheel or pinch to zoom · Esc or hold 3 fingers for 5s to hide</span>
</div>

<script>
/*
  Extracted background-only starfield.

  Kept from shooter-game:
  - black canvas background
  - three parallax star layers
  - exact layer counts, vertical speeds, parallax multipliers, size ranges
  - exact alpha values per layer
  - exact resize behavior: canvas.width/height = window.innerWidth/Height
  - exact menu/start-screen idle sway formula

  Removed:
  - player
  - enemies
  - bullets
  - bombs
  - menus
  - HUD
  - pause
  - audio
  - controller logic
  - keyboard gameplay logic
  - post-FX
*/

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

document.body.style.touchAction = "none";
canvas.style.touchAction = "none";

// Mirrors the old runtime helper used by the starfield setup.
function rand(min, max){
  return min + Math.random() * (max - min);
}

/* =======================
   Parallax Starfield
======================= */
const starLayers = [
  { count: 180, baseSpeedY: 40,  parallaxX: 0.35, sizeMin: 1, sizeMax: 2 },
  { count: 120, baseSpeedY: 80,  parallaxX: 0.60, sizeMin: 1, sizeMax: 3 },
  { count: 70,  baseSpeedY: 140, parallaxX: 0.90, sizeMin: 2, sizeMax: 4 }
];

let stars = [];
let playerVxSmoothed = 0;
let starfieldReady = false;
let time = 0;
let last = performance.now();
let externalParallaxActive = false;
let externalParallaxX = 0;
let surfacePointerFrame = 0;
let surfacePointerActive = false;
let surfacePointerType = "mouse";
let surfacePointerX = 0;
let surfacePointerY = 0;

// In the original game this value was passed into updateStarfield().
// This preserves the same visual scale for the menu/start-screen idle sway.
const playerSpeed = 7;

// Use the start-menu / non-playing idle sway, because this file has no
// gameplay input. To mimic gameplay with no left/right movement, set this to 0.
const MENU_IDLE_SWAY_STRENGTH = 0.15;

window.addEventListener("message", event => {
  if (event.origin !== window.location.origin) return;
  if (!event.data || event.data.type !== "portal-starfield-parallax") return;

  externalParallaxActive = Boolean(event.data.active);
  externalParallaxX = Math.max(-1, Math.min(1, Number(event.data.x) || 0));
});

function publishSurfacePointer(){
  surfacePointerFrame = 0;
  try {
    window.parent.postMessage({
      type: "portal-surface-pointer",
      active: surfacePointerActive,
      pointerType: surfacePointerType,
      x: surfacePointerX,
      y: surfacePointerY
    }, window.location.origin);
  } catch (_) {}
}

function updateSurfacePointer(event, active = true){
  surfacePointerActive = active;
  surfacePointerType = event.pointerType || surfacePointerType;
  surfacePointerX = Math.max(-1, Math.min(1, event.clientX / window.innerWidth * 2 - 1));
  surfacePointerY = Math.max(-1, Math.min(1, event.clientY / window.innerHeight * 2 - 1));
  externalParallaxActive = active;
  externalParallaxX = surfacePointerX;
  if (!surfacePointerFrame) surfacePointerFrame = requestAnimationFrame(publishSurfacePointer);
}

window.addEventListener("pointermove", event => updateSurfacePointer(event));
window.addEventListener("pointerdown", event => updateSurfacePointer(event));
window.addEventListener("pointerup", event => {
  if (event.pointerType !== "mouse") updateSurfacePointer(event, false);
});
window.addEventListener("pointercancel", event => updateSurfacePointer(event, false));
window.addEventListener("pointerleave", event => {
  surfacePointerActive = false;
  surfacePointerType = event.pointerType || surfacePointerType;
  externalParallaxActive = false;
  if (!surfacePointerFrame) surfacePointerFrame = requestAnimationFrame(publishSurfacePointer);
});

function resetStarfield(){
  stars = starLayers.map(layer => {
    const arr = [];
    for (let i = 0; i < layer.count; i++){
      arr.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        s: rand(layer.sizeMin, layer.sizeMax),
        vyMul: rand(0.7, 1.3)
      });
    }
    return arr;
  });
  starfieldReady = true;
}

function updateStarfield(dt){
  if (!starfieldReady) return;

  // Portal pointer input uses the same left/right intent and smoothing path as
  // player movement in shooter-game. Without external input, preserve the
  // original non-playing/start-menu idle sway.
  const vxIntent = externalParallaxActive
    ? externalParallaxX
    : MENU_IDLE_SWAY_STRENGTH * Math.sin(time * 0.6);

  const targetVx = vxIntent * playerSpeed * 55;
  playerVxSmoothed += (targetVx - playerVxSmoothed) * Math.min(1, dt * 8);

  for (let li = 0; li < starLayers.length; li++){
    const layer = starLayers[li];
    const arr = stars[li];

    const driftX = -playerVxSmoothed * layer.parallaxX;
    const driftY = layer.baseSpeedY;

    for (const st of arr){
      st.x += driftX * dt;
      st.y += driftY * st.vyMul * dt;

      if (st.y > canvas.height + 10) st.y = -10;
      if (st.x < -10) st.x = canvas.width + 10;
      if (st.x > canvas.width + 10) st.x = -10;
    }
  }
}

function drawStarfield(){
  // Source game default: black, unless a runtime override or Stage 2+ red shift exists.
  // This extraction keeps the normal start-menu / early-game background.
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (!starfieldReady) return;

  for (let li = 0; li < starLayers.length; li++){
    const arr = stars[li];
    const alpha = li === 0 ? 0.35 : (li === 1 ? 0.55 : 0.85);

    ctx.fillStyle = `rgba(255,255,255,${alpha})`;

    for (const st of arr){
      ctx.fillRect(st.x, st.y, st.s, st.s);
    }
  }
}

/* =======================
   Resize
======================= */
function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  resetStarfield();
}
window.addEventListener("resize", resize);

function frame(now){
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  time += dt;

  updateStarfield(dt);
  drawStarfield();

  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);
</script>
<script>
(() => {
  const grid = document.getElementById("map-grid");
  const pen = grid.getContext("2d");
  const readout = document.getElementById("grid-readout");
  const pointers = new Map();
  const HOLD_MS = 5000;
  const HOLD_TOLERANCE = 18;
  let holdTimer = null;
  let holdStart = null;
  let enabled = false;
  let zoom = 1;
  let baseCell = 1;
  let viewportWidth = 0;
  let viewportHeight = 0;

  // The nominal frame is 16 x 9 in landscape and 9 x 16 in portrait.
  // Its cells always stay square; other viewport ratios reveal more world.
  function measure() {
    viewportWidth = window.innerWidth;
    viewportHeight = window.innerHeight;
    const landscape = viewportWidth >= viewportHeight;
    baseCell = Math.max(1, Math.min(
      viewportWidth / (landscape ? 16 : 9),
      viewportHeight / (landscape ? 9 : 16)
    ));
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    grid.width = Math.round(viewportWidth * dpr);
    grid.height = Math.round(viewportHeight * dpr);
    pen.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function toggleGrid() {
    enabled = !enabled;
    document.body.classList.toggle("debug-grid", enabled);
    pointers.clear();
    draw();
  }

  window.addEventListener("keydown", event => {
    if (event.code === "Escape" && !event.repeat) {
      event.preventDefault();
      toggleGrid();
    }
  });

  function cancelHold() {
    if (holdTimer !== null) clearTimeout(holdTimer);
    holdTimer = null;
    holdStart = null;
  }

  // Native touch events keep the gesture independent of grid visibility.
  document.addEventListener("touchstart", event => {
    if (event.touches.length !== 3) {
      cancelHold();
      return;
    }
    cancelHold();
    holdStart = Array.from(event.touches, touch => ({
      id: touch.identifier, x: touch.clientX, y: touch.clientY
    }));
    holdTimer = setTimeout(() => {
      holdTimer = null;
      holdStart = null;
      toggleGrid();
    }, HOLD_MS);
    event.preventDefault();
  }, { passive: false });

  document.addEventListener("touchmove", event => {
    if (!holdStart) return;
    if (event.touches.length !== 3 || holdStart.some(start => {
      const touch = Array.from(event.touches).find(t => t.identifier === start.id);
      return !touch || Math.hypot(touch.clientX - start.x, touch.clientY - start.y) > HOLD_TOLERANCE;
    })) {
      cancelHold();
    } else {
      event.preventDefault();
    }
  }, { passive: false });
  document.addEventListener("touchend", cancelHold);
  document.addEventListener("touchcancel", cancelHold);
  window.addEventListener("blur", cancelHold);

  function setZoom(factor) {
    zoom = Math.max(.35, Math.min(8, zoom * factor));
    draw();
  }

  grid.addEventListener("wheel", event => {
    event.preventDefault();
    setZoom(Math.exp(-event.deltaY * .001));
  }, { passive: false });

  // Pinch changes the scale around the fixed world origin (0,0).
  grid.addEventListener("pointerdown", event => {
    grid.setPointerCapture(event.pointerId);
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
  });
  grid.addEventListener("pointermove", event => {
    if (!pointers.has(event.pointerId)) return;
    const before = Array.from(pointers.values());
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    const after = Array.from(pointers.values());
    if (after.length === 2) {
      const oldDistance = Math.hypot(before[0].x - before[1].x, before[0].y - before[1].y);
      const distance = Math.hypot(after[0].x - after[1].x, after[0].y - after[1].y);
      if (oldDistance > 0) setZoom(distance / oldDistance);
    }
  });
  function releasePointer(event) {
    pointers.delete(event.pointerId);
  }
  grid.addEventListener("pointerup", releasePointer);
  grid.addEventListener("pointercancel", releasePointer);

  function lines(spacing, color, strokeWidth, originX, originY) {
    if (spacing < 16) return;
    pen.beginPath();
    for (let x = originX % spacing; x <= viewportWidth; x += spacing) {
      pen.moveTo(Math.round(x) + .5, 0);
      pen.lineTo(Math.round(x) + .5, viewportHeight);
    }
    for (let y = originY % spacing; y <= viewportHeight; y += spacing) {
      pen.moveTo(0, Math.round(y) + .5);
      pen.lineTo(viewportWidth, Math.round(y) + .5);
    }
    pen.strokeStyle = color;
    pen.lineWidth = strokeWidth;
    pen.stroke();
  }

  function draw() {
    if (!enabled || !viewportWidth || !viewportHeight) return;
    const size = baseCell * zoom;
    const originX = 0;
    const originY = 0;
    pen.clearRect(0, 0, viewportWidth, viewportHeight);
    pen.fillStyle = "rgba(2, 24, 33, .12)";
    pen.fillRect(0, 0, viewportWidth, viewportHeight);
    // Nested squares: quarter cells, half cells, cells, and 4-cell sectors.
    lines(size / 4, "rgba(90, 233, 213, .12)", 1, originX, originY);
    lines(size / 2, "rgba(90, 233, 213, .20)", 1, originX, originY);
    lines(size, "rgba(110, 246, 229, .54)", 1, originX, originY);
    lines(size * 4, "rgba(240, 255, 250, .70)", 1.5, originX, originY);

    if (size >= 32) {
      pen.font = "10px monospace";
      pen.fillStyle = "rgba(193, 255, 244, .75)";
      for (let col = Math.floor(-originX / size); col <= Math.ceil((viewportWidth - originX) / size); col++) {
        for (let row = Math.floor(-originY / size); row <= Math.ceil((viewportHeight - originY) / size); row++) {
          const x = originX + col * size + 5;
          const y = originY + row * size + 14;
          if (x >= 0 && y >= 0 && x < viewportWidth - 32 && y < viewportHeight) {
            pen.fillText(col + "," + row, x, y);
          }
        }
      }
    }

    pen.fillStyle = "#fff";
    pen.beginPath();
    pen.arc(0, 0, 5, 0, Math.PI * 2);
    pen.fill();
    readout.textContent =
      Math.round(viewportWidth) + "×" + Math.round(viewportHeight) + " viewport · " +
      size.toFixed(1) + "px squares · " + zoom.toFixed(2) + "× zoom";
  }

  window.addEventListener("resize", measure);
  measure();
})();
</script>
<script src="/dead/backgrounds/starfield-pointer-sync.js?v=20260816-4"></script>
</body>
</html>
