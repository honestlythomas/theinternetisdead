<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/dead/images/pngs/dead-favicon.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>homepage</title>
  <style>
    :root {
      --page-text: #00ff00;
      --overlay-bg: #512A67;
      --panel-bg: rgba(0, 0, 0, 0.58);
      --panel-border: rgba(0, 255, 0, 0.58);
      --font-family: "Courier New", Courier, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: transparent;
      color: var(--page-text);
      font-family: var(--font-family);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
    }

    .starfield-background {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      z-index: 0;
      pointer-events: none;
      background: #000;
    }

    .homepage-grid {
      --homepage-column-gap: 16px;
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--homepage-column-gap);
      width: 100%;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: var(--homepage-column-gap);
    }

    body.video-view-open .homepage-grid {
      display: none;
    }

    .video-embed-view {
      position: relative;
      z-index: 2;
      display: none;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      padding: 16px;
    }

    body.video-view-open .video-embed-view {
      display: grid;
      place-items: center;
    }

    .video-embed-shell {
      width: min(100%, 1180px);
      aspect-ratio: 16 / 9;
      max-height: calc(100dvh - 32px);
      background: #000;
      border: 3px solid #00ff00;
    }

    .video-embed-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    .column-wrap {
      position: relative;
      min-width: 0;
      min-height: 0;
      padding: 3px;
    }

    .column-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      padding: 3px;
      opacity: 0;
      pointer-events: none;
      background: linear-gradient(90deg, #ff004c, #ff8c00, #ffe600, #00ff00, #00d9ff, #3b5bff, #ff00c8, #ff004c);
      background-size: 200% 100%;
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
    }

    .column-wrap:nth-child(1)::after {
      opacity: 1;
      background: rgb(81 42 103 / 1);
    }

    .column-wrap:nth-child(2)::after {
      opacity: 1;
      background: #00ff00;
    }

    .column-wrap:hover::after,
    .column-wrap:focus-within::after {
      opacity: 1;
      background: linear-gradient(90deg, #ff004c, #ff8c00, #ffe600, #00ff00, #00d9ff, #3b5bff, #ff00c8, #ff004c);
      background-size: 200% 100%;
      animation: column-outline-rainbow 1.8s linear infinite;
    }

    .posts-column {
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      height: 100%;
      overflow: auto;
      background: rgba(0, 255, 0, 0.33);
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .posts-column::-webkit-scrollbar {
      display: none;
    }

    .column-title {
      margin: 14px 0 0;
      display: block;
      width: fit-content;
      max-width: calc(100% - 32px);
      margin-inline: auto;
      padding: 8px 14px;
      background: #000;
      outline: 3px solid #fff;
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(18px, 2.2vw, 30px);
      font-weight: 700;
      line-height: 1.15;
      text-align: center;
      text-decoration: none;
    }

    .column-title:hover,
    .column-title:focus-visible {
      text-decoration: underline;
    }

    .posts-column .column-title,
    .white-screen .column-title {
      box-sizing: border-box;
      width: calc(100% - 32px);
      max-width: none;
      margin: 12px 16px 0;
      padding: 7px 10px;
      border: 2px solid #512A67;
      outline: 0;
      font-size: 14px;
    }

    .posts-column .column-title {
      color: #ff00ff;
    }

    .broadcast-search-row {
      box-sizing: border-box;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 38px 38px;
      gap: 10px;
      width: calc(100% - 32px);
      margin: 8px 16px 0;
    }

    .broadcast-search,
    .broadcast-sort,
    .broadcast-grid-action,
    .broadcast-search-action {
      box-sizing: border-box;
      padding: 8px 10px;
      background: #000;
      border: 2px solid #512A67;
      border-radius: 0;
      color: #ff00ff;
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      outline: 0;
    }

    .broadcast-search {
      display: block;
      width: 100%;
      min-width: 0;
    }

    .broadcast-sort {
      display: none;
      width: 100%;
      min-width: 0;
      appearance: none;
      cursor: pointer;
    }

    .broadcast-search-row.is-sorting {
      gap: 0;
    }

    .broadcast-search-row.is-sorting .broadcast-search {
      display: none;
    }

    .broadcast-search-row.is-sorting .broadcast-sort {
      display: block;
      border-right: 0;
    }

    .broadcast-search-row.is-sorting .broadcast-grid-action {
      border-left: 0;
      border-right: 0;
    }

    .broadcast-search-row.is-sorting .broadcast-search-action {
      border-left: 0;
    }

    .broadcast-grid-action,
    .broadcast-search-action {
      display: grid;
      place-items: center;
      width: 38px;
      min-height: 38px;
      padding: 0;
      cursor: pointer;
      line-height: 1;
    }

    .broadcast-grid-action {
      font-size: 16px;
    }

    .broadcast-search::placeholder {
      color: #ff00ff;
      opacity: 1;
    }

    .broadcast-search:focus {
      border-color: #00ff00;
      color: #00ff00;
    }

    .broadcast-search-action:hover,
    .broadcast-grid-action:hover,
    .broadcast-grid-action:focus-visible,
    .broadcast-grid-action[aria-pressed="true"],
    .broadcast-search-action:focus-visible {
      border-color: #512A67;
      color: #00ff00;
    }

    .broadcast-sort:focus {
      border-color: #512A67;
      color: #ff00ff;
    }

    .broadcast-search:focus::placeholder {
      color: #00ff00;
    }

    .broadcast-feed {
      display: grid;
      gap: 14px;
      flex: 1 1 auto;
      min-height: 0;
      padding: 12px 16px 16px;
    }

    .broadcast-carousel {
      position: relative;
      display: block;
      min-height: 0;
      height: 100%;
    }

    .broadcast-carousel-button {
      position: absolute;
      top: 50%;
      z-index: 4;
      display: grid;
      place-items: center;
      width: 34px;
      height: 58px;
      padding: 0;
      background: #000;
      border: 2px solid #512A67;
      border-radius: 0;
      color: #ff00ff;
      font-family: "Courier New", Courier, monospace;
      font-size: 26px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      transform: translateY(-50%);
    }

    .broadcast-carousel-button-previous {
      left: 10px;
    }

    .broadcast-carousel-button-next {
      right: 10px;
    }

    .broadcast-carousel-button:hover,
    .broadcast-carousel-button:focus-visible {
      border-color: #00ff00;
      color: #00ff00;
      outline: 0;
    }

    .broadcast-carousel-button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .broadcast-card {
      position: relative;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 8px 10px;
      background: rgba(0, 0, 0, 0.82);
      border: 2px solid #512A67;
      color: #ff00ff;
      font-family: "Courier New", Courier, monospace;
      text-align: center;
      overflow: hidden;
    }

    .broadcast-channel {
      position: relative;
      z-index: 2;
      align-self: center;
      width: fit-content;
      max-width: 100%;
      padding: 1px 4px;
      background: transparent;
      color: #ff00ff;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.25;
      text-align: center;
    }

    .broadcast-title {
      position: relative;
      z-index: 2;
      align-self: center;
      width: fit-content;
      max-width: 100%;
      padding: 1px 4px;
      background: transparent;
      color: #ff00ff;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.25;
      text-decoration: none;
    }

    .broadcast-title:hover,
    .broadcast-title:focus-visible {
      text-decoration: underline;
    }

    .broadcast-middle {
      position: relative;
      z-index: 1;
      display: grid;
      align-items: center;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }

    .broadcast-grid-card {
      padding: 0;
    }

    .broadcast-grid-card::before {
      display: none;
    }

    .broadcast-grid-frame {
      position: relative;
      z-index: 2;
      display: block;
      flex: 1 1 auto;
      width: 100%;
      height: 100%;
      min-height: 0;
      border: 0;
      background: #000;
      pointer-events: auto;
    }

    .broadcast-thumbnail-link {
      position: relative;
      z-index: 1;
      display: block;
      align-self: center;
      background: #000;
      border: 1px solid #512A67;
      line-height: 0;
      margin-inline: 54px;
    }

    .broadcast-thumbnail {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }

    .broadcast-meta {
      position: relative;
      z-index: 3;
      justify-self: center;
      width: fit-content;
      max-width: 100%;
      padding: 1px 4px;
      background: transparent;
      color: #ff00ff;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.35;
    }

    .broadcast-details {
      z-index: 2;
      display: grid;
    }

    .broadcast-description {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: none;
      box-sizing: border-box;
      margin: 0;
      padding: 8px;
      overflow: auto;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.35;
      text-align: left;
      white-space: pre-line;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .broadcast-description::-webkit-scrollbar {
      display: none;
    }

    .broadcast-description-label {
      display: table;
      width: fit-content;
      margin-bottom: 6px;
      padding: 1px 4px;
      background: transparent;
      color: #ff00ff;
    }

    .broadcast-description-text {
      padding: 1px 4px;
      background: transparent;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }

    .broadcast-card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
        var(--broadcast-thumbnail);
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      opacity: 0;
      transform: scale(1.08);
      transition: opacity .16s ease;
    }

    .broadcast-card:has(.broadcast-details:hover),
    .broadcast-card:has(.broadcast-details:focus-within) {
      color: #00ff00;
    }

    .broadcast-card:has(.broadcast-details:hover)::before,
    .broadcast-card:has(.broadcast-details:focus-within)::before {
      opacity: 1;
    }

    .broadcast-card:has(.broadcast-details:hover) .broadcast-title,
    .broadcast-card:has(.broadcast-details:focus-within) .broadcast-title {
      color: #00ff00;
      background: #000;
      box-shadow: inset 0 0 0 1px #fff;
      font-family: "Courier New", Courier, monospace;
      font-weight: 700;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
      text-shadow: 0 1px 3px #000;
    }

    .broadcast-card:has(.broadcast-details:hover) .broadcast-channel,
    .broadcast-card:has(.broadcast-details:focus-within) .broadcast-channel,
    .broadcast-card:has(.broadcast-details:hover) .broadcast-meta,
    .broadcast-card:has(.broadcast-details:focus-within) .broadcast-meta {
      color: #00ff00;
      background: #000;
      box-shadow: inset 0 0 0 1px #fff;
      font-family: "Courier New", Courier, monospace;
      font-weight: 700;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
      text-shadow: 0 1px 3px #000;
    }

    .broadcast-card:has(.broadcast-details:hover) .broadcast-middle .broadcast-thumbnail-link,
    .broadcast-card:has(.broadcast-details:focus-within) .broadcast-middle .broadcast-thumbnail-link {
      visibility: hidden;
    }

    .broadcast-card:has(.broadcast-details:hover) .broadcast-description,
    .broadcast-card:has(.broadcast-details:focus-within) .broadcast-description {
      display: block;
      color: #fff;
      text-shadow: 0 1px 3px #000;
    }

    .broadcast-card:has(.broadcast-details:hover) .broadcast-description-label,
    .broadcast-card:has(.broadcast-details:focus-within) .broadcast-description-label,
    .broadcast-card:has(.broadcast-details:hover) .broadcast-description-text,
    .broadcast-card:has(.broadcast-details:focus-within) .broadcast-description-text {
      background: #000;
      box-shadow: inset 0 0 0 1px #fff;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }

    .feed-status {
      margin: 0 16px 16px;
      padding: 8px 10px;
      background: #000;
      border: 2px solid #512A67;
      color: #ff00ff;
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
    }

    .social-column {
      position: relative;
      display: grid;
      place-items: center;
      min-width: 0;
      min-height: 0;
      height: 100%;
      overflow: hidden;
      padding: 16px;
      background: #000;
    }

    .discord-widget-stack {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: 10px;
      width: min(100%, 420px);
      height: min(100%, 620px);
      min-height: 0;
    }

    .discord-widget-frame {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 0;
      border: 2px solid #00ff00;
      background: #000;
    }

    .discord-permalink {
      display: block;
      width: 100%;
      padding: 9px 10px;
      border: 2px solid #512A67;
      background: #000;
      color: #00ff00;
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
      font-weight: 900;
      line-height: 1.25;
      text-align: center;
      text-decoration: none;
      word-break: break-word;
    }

    .discord-permalink:hover,
    .discord-permalink:focus-visible {
      border-color: #00ff00;
      color: #ff00ff;
      outline: 0;
    }

    .mobile-home-tabs {
      display: none;
    }

    .mobile-home-tab {
      appearance: none;
      border: 2px solid #00ff00;
      background: rgba(0, 0, 0, 0.88);
      color: #00ff00;
      font-family: "Courier New", Courier, monospace;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 10px 12px;
      cursor: pointer;
      text-shadow: 0 0 8px #00ff00;
    }

    .mobile-home-tab[aria-selected="true"] {
      background: #00ff00;
      color: #000;
      box-shadow: 0 0 14px rgba(0, 255, 0, 0.55);
      text-shadow: none;
    }

    @keyframes column-outline-rainbow {
      from { background-position: 0% 50%; }
      to { background-position: 200% 50%; }
    }

    @media (max-width: 760px) {
      body {
        overflow: hidden;
      }

      .mobile-home-tabs {
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        width: 100%;
        padding: 10px 12px 0;
        background: transparent;
      }

      .homepage-grid {
        display: block;
        grid-template-columns: none;
        height: calc(100vh - 54px);
        height: calc(100dvh - 54px);
        width: 100vw;
        min-height: 0;
        padding: 12px;
        overflow: hidden;
      }

      .column-wrap {
        width: 100%;
        height: 100%;
      }

      .column-wrap[hidden] {
        display: none !important;
      }

      .posts-column,
      .social-column {
        min-height: 0;
        height: 100%;
      }

      .broadcast-carousel {
        display: block;
      }

      .broadcast-carousel-button {
        width: 30px;
        height: 52px;
        font-size: 22px;
      }

      .broadcast-carousel-button-previous {
        left: 8px;
      }

      .broadcast-carousel-button-next {
        right: 8px;
      }

      .broadcast-thumbnail-link {
        margin-inline: 46px;
      }
    }
  </style>
</head>
<body>
  <iframe
    class="starfield-background"
    src="/dead/experiments/canvas-backgrounds/starfield-background.html"
    title="Starfield background"
    aria-hidden="true"
  ></iframe>

  <nav class="mobile-home-tabs" aria-label="Mobile homepage sections">
    <button class="mobile-home-tab" type="button" data-home-column="0" aria-selected="true">Videos</button>
    <button class="mobile-home-tab" type="button" data-home-column="1" aria-selected="false">Discord</button>
  </nav>

  <main class="homepage-grid" aria-label="Homepage layout">
    <div class="column-wrap is-mobile-active">
      <section class="posts-column" aria-label="Homepage listings">
        <a class="column-title" href="https://youtube.com/@Honestly_Thomas" target="_blank" rel="noopener noreferrer">My Latest YouTube Broadcasts📡</a>
        <div class="broadcast-search-row">
          <input class="broadcast-search" id="broadcast-search" type="search" placeholder="Search Videos..." aria-label="Search videos" autocomplete="off">
          <select class="broadcast-sort" id="broadcast-sort" aria-label="Sort videos">
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
            <option value="most-viewed">Most Viewed</option>
            <option value="least-viewed">Least Viewed</option>
          </select>
          <button class="broadcast-grid-action" id="broadcast-grid-action" type="button" aria-label="Show thumbnail grid" aria-pressed="false">🌐</button>
          <button class="broadcast-search-action" id="broadcast-search-action" type="button" aria-label="Show sorting options">⚙️</button>
        </div>
        <div class="broadcast-feed" id="broadcast-feed"></div>
        <p class="feed-status" id="broadcast-feed-status">Loading broadcasts...</p>
      </section>
    </div>

    <div class="column-wrap">
      <section class="social-column" aria-label="Discord server channels">
        <div class="discord-widget-stack">
          <iframe
            class="discord-widget-frame"
            src="https://discord.com/widget?id=717962725908676688&theme=dark"
            width="350"
            height="500"
            allowtransparency="true"
            frameborder="0"
            sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"
            title="Discord server channels"
            loading="lazy"
          ></iframe>
          <a class="discord-permalink" href="https://discord.gg/jxVHFfw4rZ" target="_blank" rel="noopener noreferrer">discord.gg/jxVHFfw4rZ</a>
        </div>
      </section>
    </div>
  </main>

  <section class="video-embed-view" id="video-embed-view" aria-label="Video player" hidden>
    <div class="video-embed-shell">
      <iframe
        class="video-embed-frame"
        id="video-embed-frame"
        title="YouTube video player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen
      ></iframe>
    </div>
  </section>
  <script>
    const FEED_VIDEOS_PATH = '/dead/JSON/feed-videos.json';

    const broadcastFeed = document.getElementById('broadcast-feed');
    const broadcastStatus = document.getElementById('broadcast-feed-status');
    const broadcastSearch = document.getElementById('broadcast-search');
    const broadcastSearchRow = document.querySelector('.broadcast-search-row');
    const broadcastGridAction = document.getElementById('broadcast-grid-action');
    const broadcastSearchAction = document.getElementById('broadcast-search-action');
    const broadcastSort = document.getElementById('broadcast-sort');
    const videoEmbedView = document.getElementById('video-embed-view');
    const videoEmbedFrame = document.getElementById('video-embed-frame');
    const homepageGrid = document.querySelector('.homepage-grid');
    const homepageColumns = Array.from(document.querySelectorAll('.column-wrap'));
    const mobileLayoutQuery = window.matchMedia('(max-width: 760px)');
    let allBroadcastEntries = [];
    let broadcastEntries = [];
    let activeBroadcastIndex = 0;
    let isThumbnailGridOpen = false;
    let openVideoId = '';
    let activeHomepageColumn = 0;
    const homepageTabs = Array.from(document.querySelectorAll('.mobile-home-tab'));
    function isMobileHomepageLayout() {
      return mobileLayoutQuery.matches || homepageGrid.getBoundingClientRect().width <= 760;
    }

    function getWrappedHomepageColumnIndex(index) {
      if (!homepageColumns.length) return 0;
      return ((index % homepageColumns.length) + homepageColumns.length) % homepageColumns.length;
    }

    function setActiveHomepageColumn(index) {
      activeHomepageColumn = getWrappedHomepageColumnIndex(index);
      const isMobile = isMobileHomepageLayout();

      homepageColumns.forEach((column, columnIndex) => {
        const isActive = columnIndex === activeHomepageColumn;
        column.classList.toggle('is-mobile-active', isMobile && isActive);
        column.hidden = isMobile && !isActive;
        column.setAttribute('aria-hidden', isMobile && !isActive ? 'true' : 'false');
      });

      homepageTabs.forEach((tab, tabIndex) => {
        const isActive = tabIndex === activeHomepageColumn;
        tab.setAttribute('aria-selected', isActive ? 'true' : 'false');
      });
    }

    function syncHomepageColumnsForViewport() {
      if (isMobileHomepageLayout()) {
        setActiveHomepageColumn(activeHomepageColumn);
        return;
      }

      homepageColumns.forEach((column) => {
        column.classList.remove('is-mobile-active');
        column.hidden = false;
        column.removeAttribute('aria-hidden');
        column.style.removeProperty('--homepage-panel-x');
      });
    }

    homepageTabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        setActiveHomepageColumn(Number(tab.dataset.homeColumn || 0));
      });
    });

    syncHomepageColumnsForViewport();

    mobileLayoutQuery.addEventListener('change', syncHomepageColumnsForViewport);
    window.addEventListener('resize', syncHomepageColumnsForViewport);

    function formatUploadDate(value) {
      const raw = String(value || '').trim();
      if (!/^\d{8}$/.test(raw)) return 'Unknown date';
      const year = raw.slice(0, 4);
      const month = raw.slice(4, 6);
      const day = raw.slice(6, 8);
      const date = new Date(`${year}-${month}-${day}T00:00:00`);
      if (Number.isNaN(date.getTime())) return raw;
      return date.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function formatViews(value) {
      const count = Number(value);
      if (!Number.isFinite(count)) return '0 views';
      return `${count.toLocaleString()} ${count === 1 ? 'view' : 'views'}`;
    }

    function getVideoId(entry) {
      const id = String(entry && entry.id || '').trim();
      if (id) return id;
      try {
        return new URL(entry.url).searchParams.get('v') || '';
      } catch (error) {
        return '';
      }
    }

    function getThumbnailCandidates(entry) {
      const thumbnails = Array.isArray(entry.thumbnails) ? entry.thumbnails : [];
      const videoId = getVideoId(entry);
      const youtubeCandidates = videoId
        ? ['hqdefault', 'sddefault', 'mqdefault', 'default', 'maxresdefault'].map((name) => (
          `https://i.ytimg.com/vi/${encodeURIComponent(videoId)}/${name}.jpg`
        ))
        : [];

      const feedCandidates = thumbnails
        .map((thumbnail) => String(thumbnail && thumbnail.url || '').trim())
        .filter(Boolean);
      const score = (url) => {
        if (/hqdefault/i.test(url)) return 0;
        if (/sddefault/i.test(url)) return 1;
        if (/mqdefault/i.test(url)) return 2;
        if (/maxresdefault/i.test(url)) return 4;
        if (/(?:^|\/)default\.jpg(?:[?#]|$)/i.test(url)) return 3;
        return 5;
      };

      return Array.from(new Set([...feedCandidates, ...youtubeCandidates]))
        .sort((a, b) => score(a) - score(b));
    }

    function getThumbnailUrl(entry) {
      return getThumbnailCandidates(entry)[0] || '';
    }

    function getThumbnailPlaceholder(title) {
      const label = String(title || 'Video thumbnail')
        .replace(/[&<>"']/g, (character) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        })[character]);
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><rect width="640" height="360" fill="#000"/><rect x="1" y="1" width="638" height="358" fill="none" stroke="#512A67" stroke-width="2"/><text x="320" y="174" fill="#ff00ff" font-family="Courier New, monospace" font-size="26" font-weight="700" text-anchor="middle">Video Thumbnail</text><text x="320" y="214" fill="#00ff00" font-family="Courier New, monospace" font-size="18" text-anchor="middle">${label}</text></svg>`)}`;
    }

    function setCardThumbnailBackground(article, thumbnailUrl) {
      article.style.setProperty('--broadcast-thumbnail', thumbnailUrl ? `url("${thumbnailUrl.replace(/"/g, '%22')}")` : 'none');
    }

    function applyThumbnailFallbacks(image, candidates, article, title) {
      const thumbnailCandidates = Array.from(new Set([...candidates.filter(Boolean), getThumbnailPlaceholder(title)]));
      let thumbnailIndex = 0;

      image.addEventListener('error', () => {
        thumbnailIndex += 1;
        if (thumbnailIndex < thumbnailCandidates.length) {
          image.src = thumbnailCandidates[thumbnailIndex];
          if (article) setCardThumbnailBackground(article, thumbnailCandidates[thumbnailIndex]);
        }
      });

      if (thumbnailCandidates.length) {
        image.src = thumbnailCandidates[0];
        if (article) setCardThumbnailBackground(article, thumbnailCandidates[0]);
      }
    }

    function getVideoRoute(entry) {
      const videoId = getVideoId(entry);
      return videoId ? `/dead/videos/?vid=${encodeURIComponent(videoId)}` : String(entry.url || '#');
    }

    function getVideoTitleById(videoId) {
      const match = allBroadcastEntries.find((entry) => getVideoId(entry) === videoId);
      return match ? String(match.title || '').trim() : '';
    }

    function getYouTubeEmbedUrl(videoId) {
      const url = new URL(`https://www.youtube.com/embed/${encodeURIComponent(videoId)}`);
      url.searchParams.set('autoplay', '1');
      url.searchParams.set('rel', '0');
      return url.href;
    }

    function openVideoEmbed(videoId, videoTitle = '') {
      const requestedId = String(videoId || '').trim();
      if (!requestedId) return;
      if (openVideoId === requestedId && document.body.classList.contains('video-view-open')) return;

      openVideoId = requestedId;
      videoEmbedFrame.removeAttribute('src');
      videoEmbedFrame.src = getYouTubeEmbedUrl(requestedId);
      videoEmbedFrame.title = videoTitle || getVideoTitleById(requestedId) || 'YouTube video player';
      videoEmbedView.hidden = false;
      document.body.classList.add('video-view-open');
    }

    function closeVideoEmbed() {
      openVideoId = '';
      videoEmbedFrame.removeAttribute('src');
      videoEmbedView.hidden = true;
      document.body.classList.remove('video-view-open');
    }

    function getVideoIdFromUrl(value) {
      try {
        const url = new URL(value, window.location.origin);
        const path = url.pathname.replace(/\/{2,}/g, '/');
        if (!/^\/dead\/videos\/?$/i.test(path)) return '';
        return (url.searchParams.get('vid') || url.searchParams.get('id') || url.searchParams.get('v') || '').trim();
      } catch (error) {
        return '';
      }
    }

    function syncVideoEmbedFromParentRoute() {
      let routeVideoId = getVideoIdFromUrl(window.location.href);
      try {
        if (window.parent && window.parent !== window) {
          routeVideoId = getVideoIdFromUrl(window.parent.location.href) || routeVideoId;
        }
      } catch (error) {
        // Cross-origin parents cannot be inspected; the message listener still handles routed opens.
      }

      if (routeVideoId) {
        openVideoEmbed(routeVideoId);
      } else if (openVideoId) {
        closeVideoEmbed();
      }
    }

    function createBroadcastCard(entry) {
      const article = document.createElement('article');
      article.className = 'broadcast-card';

      const url = getVideoRoute(entry);
      const title = String(entry.title || 'Untitled broadcast');
      const thumbnailCandidates = getThumbnailCandidates(entry);
      const thumbnailUrl = getThumbnailUrl(entry);
      const channelName = String(entry.channel || entry.uploader || 'Unknown channel');
      setCardThumbnailBackground(article, thumbnailUrl || getThumbnailPlaceholder(title));

      const channel = document.createElement('div');
      channel.className = 'broadcast-channel';
      channel.textContent = channelName;
      article.appendChild(channel);

      const titleLink = document.createElement('a');
      titleLink.className = 'broadcast-title';
      titleLink.href = url;
      if (url !== '#') {
        titleLink.dataset.indexFrameSrc = url;
        titleLink.dataset.videoRouteId = getVideoId(entry);
        titleLink.dataset.videoTitle = title;
      }
      titleLink.textContent = title;
      article.appendChild(titleLink);

      const middle = document.createElement('div');
      middle.className = 'broadcast-middle';

      const thumbnailLink = document.createElement('a');
      thumbnailLink.className = 'broadcast-thumbnail-link';
      thumbnailLink.href = url;
      if (url !== '#') {
        thumbnailLink.dataset.indexFrameSrc = url;
        thumbnailLink.dataset.videoRouteId = getVideoId(entry);
        thumbnailLink.dataset.videoTitle = title;
      }

      const image = document.createElement('img');
      image.className = 'broadcast-thumbnail';
      image.alt = title;
      image.loading = 'lazy';
      applyThumbnailFallbacks(image, thumbnailCandidates, article, title);
      thumbnailLink.appendChild(image);
      middle.appendChild(thumbnailLink);

      const description = document.createElement('p');
      description.className = 'broadcast-description';
      const descriptionLabel = document.createElement('span');
      descriptionLabel.className = 'broadcast-description-label';
      descriptionLabel.textContent = 'Video Description:';
      description.appendChild(descriptionLabel);
      const descriptionText = document.createElement('span');
      descriptionText.className = 'broadcast-description-text';
      descriptionText.textContent = String(entry.description || 'No description available.').trim() || 'No description available.';
      description.appendChild(descriptionText);
      middle.appendChild(description);
      article.appendChild(middle);

      const details = document.createElement('div');
      details.className = 'broadcast-details';

      const meta = document.createElement('div');
      meta.className = 'broadcast-meta';
      meta.textContent = `${formatUploadDate(entry.upload_date)} / ${formatViews(entry.view_count)}`;
      details.appendChild(meta);

      article.appendChild(details);

      return article;
    }

    function createThumbnailGridCard() {
      const article = document.createElement('article');
      article.className = 'broadcast-card broadcast-grid-card';

      const frame = document.createElement('iframe');
      frame.className = 'broadcast-grid-frame';
      frame.src = '/dead/stuff/stuff-for-index/thumbnail-grid/index.html?v=no-header';
      frame.title = 'Thumbnail grid';
      frame.loading = 'lazy';
      article.appendChild(frame);

      return article;
    }

    function createBroadcastCarousel(entry) {
      const carousel = document.createElement('div');
      carousel.className = 'broadcast-carousel';

      const previousButton = document.createElement('button');
      previousButton.className = 'broadcast-carousel-button broadcast-carousel-button-previous';
      previousButton.type = 'button';
      previousButton.textContent = '\u2039';
      previousButton.setAttribute('aria-label', 'Previous video');
      previousButton.disabled = broadcastEntries.length <= 1;
      previousButton.addEventListener('click', () => {
        cycleBroadcast(-1);
      });

      const nextButton = document.createElement('button');
      nextButton.className = 'broadcast-carousel-button broadcast-carousel-button-next';
      nextButton.type = 'button';
      nextButton.textContent = '\u203a';
      nextButton.setAttribute('aria-label', 'Next video');
      nextButton.disabled = broadcastEntries.length <= 1;
      nextButton.addEventListener('click', () => {
        cycleBroadcast(1);
      });

      carousel.append(previousButton, createBroadcastCard(entry), nextButton);
      return carousel;
    }

    function createThumbnailGridView() {
      const carousel = document.createElement('div');
      carousel.className = 'broadcast-carousel';
      carousel.appendChild(createThumbnailGridCard());
      return carousel;
    }

    function getSearchText(entry) {
      return [
        entry.title,
        entry.channel,
        entry.uploader,
        entry.description,
        formatUploadDate(entry.upload_date),
        formatViews(entry.view_count)
      ].map((value) => String(value || '').toLowerCase()).join(' ');
    }

    function getUploadSortValue(entry) {
      const raw = String(entry.upload_date || '').trim();
      return /^\d{8}$/.test(raw) ? Number(raw) : 0;
    }

    function getViewSortValue(entry) {
      const count = Number(entry.view_count);
      return Number.isFinite(count) ? count : 0;
    }

    function sortBroadcastEntries(entries) {
      const sortMode = broadcastSort.value;
      return [...entries].sort((a, b) => {
        if (sortMode === 'oldest') return getUploadSortValue(a) - getUploadSortValue(b);
        if (sortMode === 'most-viewed') return getViewSortValue(b) - getViewSortValue(a);
        if (sortMode === 'least-viewed') return getViewSortValue(a) - getViewSortValue(b);
        return getUploadSortValue(b) - getUploadSortValue(a);
      });
    }

    function applyBroadcastSearch() {
      const query = broadcastSearch.value.trim().toLowerCase();
      const filteredEntries = query
        ? allBroadcastEntries.filter((entry) => getSearchText(entry).includes(query))
        : [...allBroadcastEntries];
      broadcastEntries = sortBroadcastEntries(filteredEntries);

      broadcastFeed.replaceChildren();
      activeBroadcastIndex = 0;
      broadcastStatus.hidden = broadcastEntries.length > 0;
      broadcastStatus.textContent = broadcastEntries.length > 0 ? '' : 'No broadcasts found.';
      renderBroadcasts();
    }

    function renderBroadcasts() {
      broadcastFeed.replaceChildren();
      broadcastGridAction.setAttribute('aria-pressed', isThumbnailGridOpen ? 'true' : 'false');
      broadcastGridAction.setAttribute('aria-label', isThumbnailGridOpen ? 'Show video card' : 'Show thumbnail grid');

      if (isThumbnailGridOpen) {
        broadcastStatus.hidden = true;
        broadcastFeed.appendChild(createThumbnailGridView());
        return;
      }

      if (!broadcastEntries.length) {
        broadcastStatus.hidden = false;
        broadcastStatus.textContent = 'No broadcasts found.';
        return;
      }

      activeBroadcastIndex = Math.max(0, Math.min(activeBroadcastIndex, broadcastEntries.length - 1));
      broadcastFeed.appendChild(createBroadcastCarousel(broadcastEntries[activeBroadcastIndex]));
    }

    function cycleBroadcast(direction) {
      if (!broadcastEntries.length) return;
      activeBroadcastIndex = (activeBroadcastIndex + direction + broadcastEntries.length) % broadcastEntries.length;
      renderBroadcasts();
    }

    document.addEventListener('click', (event) => {
      const link = event.target && event.target.closest
        ? event.target.closest('[data-video-route-id]')
        : null;
      if (!link) return;

      const videoId = String(link.dataset.videoRouteId || '').trim();
      if (!videoId) return;

      const videoTitle = String(link.dataset.videoTitle || '').trim();
      event.preventDefault();
      openVideoEmbed(videoId, videoTitle);

      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: 'indexFrameVideoRoute',
          action: 'open',
          videoId,
          videoTitle
        }, '*');
      } else {
        window.location.href = `/dead/videos/?vid=${encodeURIComponent(videoId)}`;
      }
    }, true);

    broadcastSearch.addEventListener('input', applyBroadcastSearch);
    broadcastSort.addEventListener('change', applyBroadcastSearch);
    broadcastGridAction.addEventListener('click', () => {
      isThumbnailGridOpen = !isThumbnailGridOpen;
      renderBroadcasts();
    });
    broadcastSearchAction.addEventListener('click', () => {
      const isSorting = broadcastSearchRow.classList.toggle('is-sorting');
      broadcastSearchAction.setAttribute('aria-label', isSorting ? 'Show search videos' : 'Show sorting options');
      if (isSorting) {
        broadcastSort.focus();
      } else {
        broadcastSearch.focus();
      }
    });

    window.addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.type === 'feedGridOpenVideo' && data.videoId) {
        openVideoEmbed(String(data.videoId || ''), String(data.videoTitle || ''));
      } else if (data.type === 'feedGridCloseVideo') {
        closeVideoEmbed();
      }
    });

    window.addEventListener('focus', syncVideoEmbedFromParentRoute);
    window.addEventListener('pageshow', syncVideoEmbedFromParentRoute);
    window.setInterval(syncVideoEmbedFromParentRoute, 250);

    fetch(FEED_VIDEOS_PATH, { cache: 'no-store' })
      .then((response) => {
        if (!response.ok) throw new Error(`Failed to load ${FEED_VIDEOS_PATH}`);
        return response.json();
      })
      .then((feed) => {
        allBroadcastEntries = Array.isArray(feed.entries) ? feed.entries : [];
        broadcastEntries = sortBroadcastEntries(allBroadcastEntries);
        broadcastStatus.hidden = true;
        renderBroadcasts();
        syncVideoEmbedFromParentRoute();
      })
      .catch((error) => {
        console.error(error);
        broadcastStatus.textContent = 'Unable to load broadcasts.';
      });
  </script>
</body>
</html>
