<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/dead/images/pngs/dead-favicon.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>homepage</title>
  <style>
    :root {
      --page-text: #00ff00;
      --overlay-bg: #512A67;
      --panel-bg: rgba(0, 0, 0, 0.58);
      --panel-border: rgba(0, 255, 0, 0.58);
      --font-family: "Courier New", Courier, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: transparent;
      color: var(--page-text);
      font-family: var(--font-family);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
    }

    .starfield-background {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      z-index: 0;
      pointer-events: none;
      background: #000;
    }

    .homepage-grid {
      --homepage-column-gap: 16px;
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--homepage-column-gap);
      width: 100%;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: var(--homepage-column-gap);
    }

    body.video-view-open .homepage-grid {
      display: none;
    }

    .video-embed-view {
      position: relative;
      z-index: 2;
      display: none;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      padding: 16px;
    }

    body.video-view-open .video-embed-view {
      display: grid;
      place-items: center;
    }

    .video-embed-shell {
      width: min(100%, 1180px);
      aspect-ratio: 16 / 9;
      max-height: calc(100dvh - 32px);
      background: #000;
      border: 3px solid #00ff00;
    }

    .video-embed-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    .column-wrap {
      position: relative;
      min-width: 0;
      min-height: 0;
      padding: 3px;
    }

    .column-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      padding: 3px;
      opacity: 0;
      pointer-events: none;
      background: linear-gradient(90deg, #ff004c, #ff8c00, #ffe600, #00ff00, #00d9ff, #3b5bff, #ff00c8, #ff004c);
      background-size: 200% 100%;
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
    }

    .column-wrap:nth-child(1)::after {
      opacity: 1;
      background: rgb(81 42 103 / 1);
    }

    .column-wrap:nth-child(2)::after {
      opacity: 1;
      background: #00ff00;
    }

    .column-wrap:hover::after,
    .column-wrap:focus-within::after {
      opacity: 1;
      background: linear-gradient(90deg, #ff004c, #ff8c00, #ffe600, #00ff00, #00d9ff, #3b5bff, #ff00c8, #ff004c);
      background-size: 200% 100%;
      animation: column-outline-rainbow 1.8s linear infinite;
    }

    .posts-column {
      position: relative;
      min-width: 0;
      min-height: 0;
      height: 100%;
      overflow: auto;
      background: rgba(0, 255, 0, 0.33);
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .posts-column::-webkit-scrollbar {
      display: none;
    }

    .column-title {
      margin: 14px 0 0;
      display: block;
      width: fit-content;
      max-width: calc(100% - 32px);
      margin-inline: auto;
      padding: 8px 14px;
      background: #000;
      outline: 3px solid #fff;
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(18px, 2.2vw, 30px);
      font-weight: 700;
      line-height: 1.15;
      text-align: center;
      text-decoration: none;
    }

    .column-title:hover,
    .column-title:focus-visible {
      text-decoration: underline;
    }

    .posts-column .column-title,
    .white-screen .column-title {
      box-sizing: border-box;
      width: calc(100% - 32px);
      max-width: none;
      margin: 16px 16px 0;
      padding: 8px 10px;
      border: 2px solid #512A67;
      outline: 0;
      font-size: 14px;
    }

    .posts-column .column-title {
      color: #ff00ff;
    }

    .broadcast-search-row {
      box-sizing: border-box;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 38px;
      gap: 10px;
      width: calc(100% - 32px);
      margin: 10px 16px 0;
    }

    .broadcast-search,
    .broadcast-sort,
    .broadcast-search-action {
      box-sizing: border-box;
      padding: 8px 10px;
      background: #000;
      border: 2px solid #512A67;
      border-radius: 0;
      color: #ff00ff;
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      outline: 0;
    }

    .broadcast-search {
      display: block;
      width: 100%;
      min-width: 0;
    }

    .broadcast-sort {
      display: none;
      width: 100%;
      min-width: 0;
      appearance: none;
      cursor: pointer;
    }

    .broadcast-search-row.is-sorting {
      gap: 0;
    }

    .broadcast-search-row.is-sorting .broadcast-search {
      display: none;
    }

    .broadcast-search-row.is-sorting .broadcast-sort {
      display: block;
      border-right: 0;
    }

    .broadcast-search-row.is-sorting .broadcast-search-action {
      border-left: 0;
    }

    .broadcast-search-action {
      display: grid;
      place-items: center;
      width: 38px;
      min-height: 38px;
      padding: 0;
      cursor: pointer;
      line-height: 1;
    }

    .broadcast-search::placeholder {
      color: #ff00ff;
      opacity: 1;
    }

    .broadcast-search:focus {
      border-color: #00ff00;
      color: #00ff00;
    }

    .broadcast-search-action:hover,
    .broadcast-search-action:focus-visible {
      border-color: #512A67;
      color: #00ff00;
    }

    .broadcast-sort:focus {
      border-color: #512A67;
      color: #ff00ff;
    }

    .broadcast-search:focus::placeholder {
      color: #00ff00;
    }

    .broadcast-feed {
      display: grid;
      gap: 14px;
      padding: 16px;
    }

    .broadcast-card {
      position: relative;
      height: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.82);
      border: 2px solid #512A67;
      color: #ff00ff;
      font-family: "Courier New", Courier, monospace;
      text-align: center;
      overflow: hidden;
    }

    .broadcast-channel {
      position: relative;
      z-index: 2;
      align-self: center;
      width: fit-content;
      max-width: 100%;
      padding: 1px 4px;
      background: transparent;
      color: #ff00ff;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.25;
      text-align: center;
    }

    .broadcast-title {
      position: relative;
      z-index: 2;
      align-self: center;
      width: fit-content;
      max-width: 100%;
      padding: 1px 4px;
      background: transparent;
      color: #ff00ff;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.25;
      text-decoration: none;
    }

    .broadcast-title:hover,
    .broadcast-title:focus-visible {
      text-decoration: underline;
    }

    .broadcast-middle {
      position: relative;
      z-index: 1;
      min-height: 0;
      overflow: hidden;
    }

    .broadcast-thumbnail-link {
      position: relative;
      z-index: 1;
      display: block;
      background: #000;
      border: 1px solid #512A67;
      line-height: 0;
    }

    .broadcast-thumbnail {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }

    .broadcast-meta {
      position: relative;
      z-index: 3;
      justify-self: center;
      width: fit-content;
      max-width: 100%;
      padding: 1px 4px;
      background: transparent;
      color: #ff00ff;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.35;
    }

    .broadcast-details {
      z-index: 2;
      display: grid;
    }

    .broadcast-description {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: none;
      box-sizing: border-box;
      margin: 0;
      padding: 8px;
      overflow: auto;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.35;
      text-align: left;
      white-space: pre-line;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .broadcast-description::-webkit-scrollbar {
      display: none;
    }

    .broadcast-description-label {
      display: table;
      width: fit-content;
      margin-bottom: 6px;
      padding: 1px 4px;
      background: transparent;
      color: #ff00ff;
    }

    .broadcast-description-text {
      padding: 1px 4px;
      background: transparent;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }

    .broadcast-card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
        var(--broadcast-thumbnail);
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      opacity: 0;
      transform: scale(1.08);
      transition: opacity .16s ease;
    }

    .broadcast-card:has(.broadcast-details:hover),
    .broadcast-card:has(.broadcast-details:focus-within) {
      color: #00ff00;
    }

    .broadcast-card:has(.broadcast-details:hover)::before,
    .broadcast-card:has(.broadcast-details:focus-within)::before {
      opacity: 1;
    }

    .broadcast-card:has(.broadcast-details:hover) .broadcast-title,
    .broadcast-card:has(.broadcast-details:focus-within) .broadcast-title {
      color: #00ff00;
      background: #000;
      box-shadow: inset 0 0 0 1px #fff;
      font-family: "Courier New", Courier, monospace;
      font-weight: 700;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
      text-shadow: 0 1px 3px #000;
    }

    .broadcast-card:has(.broadcast-details:hover) .broadcast-channel,
    .broadcast-card:has(.broadcast-details:focus-within) .broadcast-channel,
    .broadcast-card:has(.broadcast-details:hover) .broadcast-meta,
    .broadcast-card:has(.broadcast-details:focus-within) .broadcast-meta {
      color: #00ff00;
      background: #000;
      box-shadow: inset 0 0 0 1px #fff;
      font-family: "Courier New", Courier, monospace;
      font-weight: 700;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
      text-shadow: 0 1px 3px #000;
    }

    .broadcast-card:has(.broadcast-details:hover) .broadcast-middle .broadcast-thumbnail-link,
    .broadcast-card:has(.broadcast-details:focus-within) .broadcast-middle .broadcast-thumbnail-link {
      visibility: hidden;
    }

    .broadcast-card:has(.broadcast-details:hover) .broadcast-description,
    .broadcast-card:has(.broadcast-details:focus-within) .broadcast-description {
      display: block;
      color: #fff;
      text-shadow: 0 1px 3px #000;
    }

    .broadcast-card:has(.broadcast-details:hover) .broadcast-description-label,
    .broadcast-card:has(.broadcast-details:focus-within) .broadcast-description-label,
    .broadcast-card:has(.broadcast-details:hover) .broadcast-description-text,
    .broadcast-card:has(.broadcast-details:focus-within) .broadcast-description-text {
      background: #000;
      box-shadow: inset 0 0 0 1px #fff;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }

    .feed-status,
    .load-more-broadcasts {
      margin: 0 16px 16px;
      padding: 8px 10px;
      background: #000;
      border: 2px solid #512A67;
      color: #ff00ff;
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
    }

    .load-more-broadcasts {
      display: block;
      width: calc(100% - 32px);
      cursor: pointer;
    }

    .load-more-broadcasts:hover,
    .load-more-broadcasts:focus-visible {
      text-decoration: underline;
    }

    .white-screen .column-title {
      width: calc((100% - var(--homepage-column-gap)) / 2 - 27px);
      min-width: min-content;
      margin-inline: auto;
      border-color: #00ff00;
      color: #00ff00;
    }

    .white-screen {
      position: relative;
      display: flow-root;
      min-width: 0;
      min-height: 0;
      height: 100%;
      background: rgba(81, 42, 103, 0.5);
    }

    @keyframes column-outline-rainbow {
      from { background-position: 0% 50%; }
      to { background-position: 200% 50%; }
    }

    @media (max-width: 760px) {
      body {
        overflow: hidden;
      }

      .homepage-grid {
        display: block;
        grid-template-columns: none;
        height: 100vh;
        height: 100dvh;
        width: 100vw;
        min-height: 0;
        overflow: hidden;
        touch-action: pan-y;
      }

      .column-wrap {
        display: none !important;
        width: 100%;
        height: calc(100vh - (var(--homepage-column-gap) * 2));
        height: calc(100dvh - (var(--homepage-column-gap) * 2));
      }

      .column-wrap.is-mobile-active {
        display: block !important;
      }

      .column-wrap[hidden] {
        display: none !important;
      }

      .posts-column {
        min-height: 0;
      }

      .white-screen {
        min-height: 0;
        overflow: auto;
      }
    }
  </style>
</head>
<body>
  <iframe
    class="starfield-background"
    src="/dead/experiments/canvas-backgrounds/starfield-background.html"
    title="Starfield background"
    aria-hidden="true"
  ></iframe>

  <main class="homepage-grid" aria-label="Homepage layout">
    <div class="column-wrap is-mobile-active">
      <section class="posts-column" aria-label="Homepage listings">
        <a class="column-title" href="https://youtube.com/@Honestly_Thomas" target="_blank" rel="noopener noreferrer">My Latest YouTube Broadcasts📡</a>
        <div class="broadcast-search-row">
          <input class="broadcast-search" id="broadcast-search" type="search" placeholder="Search Videos..." aria-label="Search videos" autocomplete="off">
          <select class="broadcast-sort" id="broadcast-sort" aria-label="Sort videos">
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
            <option value="most-viewed">Most Viewed</option>
            <option value="least-viewed">Least Viewed</option>
          </select>
          <button class="broadcast-search-action" id="broadcast-search-action" type="button" aria-label="Show sorting options">⚙️</button>
        </div>
        <div class="broadcast-feed" id="broadcast-feed"></div>
        <p class="feed-status" id="broadcast-feed-status">Loading broadcasts...</p>
        <button class="load-more-broadcasts" id="load-more-broadcasts" type="button" hidden>Load More</button>
      </section>
    </div>

    <div class="column-wrap">
      <section class="white-screen" aria-label="The Daily Spiral">
        <h1 class="column-title">The Daily Spiral🌀</h1>
      </section>
    </div>
  </main>

  <section class="video-embed-view" id="video-embed-view" aria-label="Video player" hidden>
    <div class="video-embed-shell">
      <iframe
        class="video-embed-frame"
        id="video-embed-frame"
        title="YouTube video player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen
      ></iframe>
    </div>
  </section>
  <script>
    const FEED_VIDEOS_PATH = '/dead/JSON/feed-videos.json';
    const INITIAL_BROADCAST_COUNT = 3;
    const BROADCAST_BATCH_SIZE = 3;

    const broadcastFeed = document.getElementById('broadcast-feed');
    const broadcastStatus = document.getElementById('broadcast-feed-status');
    const broadcastSearch = document.getElementById('broadcast-search');
    const broadcastSearchRow = document.querySelector('.broadcast-search-row');
    const broadcastSearchAction = document.getElementById('broadcast-search-action');
    const broadcastSort = document.getElementById('broadcast-sort');
    const loadMoreBroadcasts = document.getElementById('load-more-broadcasts');
    const videoEmbedView = document.getElementById('video-embed-view');
    const videoEmbedFrame = document.getElementById('video-embed-frame');
    const homepageGrid = document.querySelector('.homepage-grid');
    const homepageColumns = Array.from(document.querySelectorAll('.column-wrap'));
    const mobileLayoutQuery = window.matchMedia('(max-width: 760px)');
    let allBroadcastEntries = [];
    let broadcastEntries = [];
    let renderedBroadcastCount = 0;
    let openVideoId = '';
    let activeHomepageColumn = 0;
    let homepageSwipeStartX = 0;
    let homepageSwipeStartY = 0;

    function isMobileHomepageLayout() {
      return mobileLayoutQuery.matches || homepageGrid.getBoundingClientRect().width <= 760;
    }

    function setActiveHomepageColumn(index) {
      activeHomepageColumn = Math.max(0, Math.min(homepageColumns.length - 1, index));
      const isMobile = isMobileHomepageLayout();
      homepageColumns.forEach((column, columnIndex) => {
        const isActive = columnIndex === activeHomepageColumn;
        column.classList.toggle('is-mobile-active', isActive);
        column.hidden = isMobile && !isActive;
        column.setAttribute('aria-hidden', isMobile && !isActive ? 'true' : 'false');
      });
    }

    function syncHomepageColumnsForViewport() {
      if (isMobileHomepageLayout()) {
        setActiveHomepageColumn(activeHomepageColumn);
        return;
      }

      homepageColumns.forEach((column) => {
        column.classList.remove('is-mobile-active');
        column.hidden = false;
        column.removeAttribute('aria-hidden');
      });
    }

    function handleHomepageSwipeEnd(endX, endY) {
      if (!isMobileHomepageLayout()) return;
      const deltaX = endX - homepageSwipeStartX;
      const deltaY = endY - homepageSwipeStartY;
      if (Math.abs(deltaX) < 48 || Math.abs(deltaX) < Math.abs(deltaY) * 1.25) return;
      setActiveHomepageColumn(activeHomepageColumn + (deltaX < 0 ? 1 : -1));
    }

    syncHomepageColumnsForViewport();

    mobileLayoutQuery.addEventListener('change', syncHomepageColumnsForViewport);

    homepageGrid.addEventListener('touchstart', (event) => {
      if (!isMobileHomepageLayout() || event.touches.length !== 1) return;
      homepageSwipeStartX = event.touches[0].clientX;
      homepageSwipeStartY = event.touches[0].clientY;
    }, { passive: true });

    homepageGrid.addEventListener('touchend', (event) => {
      if (!isMobileHomepageLayout() || event.changedTouches.length !== 1) return;
      handleHomepageSwipeEnd(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
    }, { passive: true });

    window.addEventListener('resize', syncHomepageColumnsForViewport);

    function formatUploadDate(value) {
      const raw = String(value || '').trim();
      if (!/^\d{8}$/.test(raw)) return 'Unknown date';
      const year = raw.slice(0, 4);
      const month = raw.slice(4, 6);
      const day = raw.slice(6, 8);
      const date = new Date(`${year}-${month}-${day}T00:00:00`);
      if (Number.isNaN(date.getTime())) return raw;
      return date.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function formatViews(value) {
      const count = Number(value);
      if (!Number.isFinite(count)) return '0 views';
      return `${count.toLocaleString()} ${count === 1 ? 'view' : 'views'}`;
    }

    function getVideoId(entry) {
      const id = String(entry && entry.id || '').trim();
      if (id) return id;
      try {
        return new URL(entry.url).searchParams.get('v') || '';
      } catch (error) {
        return '';
      }
    }

    function getMaxresThumbnail(entry) {
      const thumbnails = Array.isArray(entry.thumbnails) ? entry.thumbnails : [];
      const maxres = thumbnails.find((thumbnail) => /maxresdefault\.jpg(?:[?#]|$)/i.test(String(thumbnail.url || '')));
      if (maxres && maxres.url) return maxres.url;

      const jpg = thumbnails.find((thumbnail) => /maxresdefault/i.test(String(thumbnail.url || '')));
      if (jpg && jpg.url) return jpg.url;

      const videoId = getVideoId(entry);
      return videoId ? `https://i.ytimg.com/vi/${encodeURIComponent(videoId)}/maxresdefault.jpg` : '';
    }

    function getVideoRoute(entry) {
      const videoId = getVideoId(entry);
      return videoId ? `/dead/videos/?vid=${encodeURIComponent(videoId)}` : String(entry.url || '#');
    }

    function getVideoTitleById(videoId) {
      const match = allBroadcastEntries.find((entry) => getVideoId(entry) === videoId);
      return match ? String(match.title || '').trim() : '';
    }

    function getYouTubeEmbedUrl(videoId) {
      const url = new URL(`https://www.youtube.com/embed/${encodeURIComponent(videoId)}`);
      url.searchParams.set('autoplay', '1');
      url.searchParams.set('rel', '0');
      return url.href;
    }

    function openVideoEmbed(videoId, videoTitle = '') {
      const requestedId = String(videoId || '').trim();
      if (!requestedId) return;
      if (openVideoId === requestedId && document.body.classList.contains('video-view-open')) return;

      openVideoId = requestedId;
      videoEmbedFrame.src = getYouTubeEmbedUrl(requestedId);
      videoEmbedFrame.title = videoTitle || getVideoTitleById(requestedId) || 'YouTube video player';
      videoEmbedView.hidden = false;
      document.body.classList.add('video-view-open');
    }

    function closeVideoEmbed() {
      openVideoId = '';
      videoEmbedFrame.removeAttribute('src');
      videoEmbedView.hidden = true;
      document.body.classList.remove('video-view-open');
    }

    function getVideoIdFromUrl(value) {
      try {
        const url = new URL(value, window.location.origin);
        const path = url.pathname.replace(/\/{2,}/g, '/');
        if (!/^\/dead\/videos\/?$/i.test(path)) return '';
        return (url.searchParams.get('vid') || url.searchParams.get('id') || url.searchParams.get('v') || '').trim();
      } catch (error) {
        return '';
      }
    }

    function syncVideoEmbedFromParentRoute() {
      let routeVideoId = getVideoIdFromUrl(window.location.href);
      try {
        if (window.parent && window.parent !== window) {
          routeVideoId = getVideoIdFromUrl(window.parent.location.href) || routeVideoId;
        }
      } catch (error) {
        // Cross-origin parents cannot be inspected; the message listener still handles routed opens.
      }

      if (routeVideoId) {
        openVideoEmbed(routeVideoId);
      } else if (openVideoId) {
        closeVideoEmbed();
      }
    }

    function createBroadcastCard(entry) {
      const article = document.createElement('article');
      article.className = 'broadcast-card';

      const url = getVideoRoute(entry);
      const title = String(entry.title || 'Untitled broadcast');
      const thumbnailUrl = getMaxresThumbnail(entry);
      const channelName = String(entry.channel || entry.uploader || 'Unknown channel');
      article.style.setProperty('--broadcast-thumbnail', thumbnailUrl ? `url("${thumbnailUrl.replace(/"/g, '%22')}")` : 'none');

      const channel = document.createElement('div');
      channel.className = 'broadcast-channel';
      channel.textContent = channelName;
      article.appendChild(channel);

      const titleLink = document.createElement('a');
      titleLink.className = 'broadcast-title';
      titleLink.href = url;
      if (url !== '#') {
        titleLink.dataset.indexFrameSrc = url;
        titleLink.dataset.videoRouteId = getVideoId(entry);
        titleLink.dataset.videoTitle = title;
      }
      titleLink.textContent = title;
      article.appendChild(titleLink);

      const middle = document.createElement('div');
      middle.className = 'broadcast-middle';

      if (thumbnailUrl) {
        const thumbnailLink = document.createElement('a');
        thumbnailLink.className = 'broadcast-thumbnail-link';
        thumbnailLink.href = url;
        if (url !== '#') {
          thumbnailLink.dataset.indexFrameSrc = url;
          thumbnailLink.dataset.videoRouteId = getVideoId(entry);
          thumbnailLink.dataset.videoTitle = title;
        }

        const image = document.createElement('img');
        image.className = 'broadcast-thumbnail';
        image.src = thumbnailUrl;
        image.alt = title;
        image.loading = 'lazy';
        thumbnailLink.appendChild(image);
        middle.appendChild(thumbnailLink);
      }

      const description = document.createElement('p');
      description.className = 'broadcast-description';
      const descriptionLabel = document.createElement('span');
      descriptionLabel.className = 'broadcast-description-label';
      descriptionLabel.textContent = 'Video Description:';
      description.appendChild(descriptionLabel);
      const descriptionText = document.createElement('span');
      descriptionText.className = 'broadcast-description-text';
      descriptionText.textContent = String(entry.description || 'No description available.').trim() || 'No description available.';
      description.appendChild(descriptionText);
      middle.appendChild(description);
      article.appendChild(middle);

      const details = document.createElement('div');
      details.className = 'broadcast-details';

      const meta = document.createElement('div');
      meta.className = 'broadcast-meta';
      meta.textContent = `${formatUploadDate(entry.upload_date)} / ${formatViews(entry.view_count)}`;
      details.appendChild(meta);

      article.appendChild(details);

      return article;
    }

    function getSearchText(entry) {
      return [
        entry.title,
        entry.channel,
        entry.uploader,
        entry.description,
        formatUploadDate(entry.upload_date),
        formatViews(entry.view_count)
      ].map((value) => String(value || '').toLowerCase()).join(' ');
    }

    function getUploadSortValue(entry) {
      const raw = String(entry.upload_date || '').trim();
      return /^\d{8}$/.test(raw) ? Number(raw) : 0;
    }

    function getViewSortValue(entry) {
      const count = Number(entry.view_count);
      return Number.isFinite(count) ? count : 0;
    }

    function sortBroadcastEntries(entries) {
      const sortMode = broadcastSort.value;
      return [...entries].sort((a, b) => {
        if (sortMode === 'oldest') return getUploadSortValue(a) - getUploadSortValue(b);
        if (sortMode === 'most-viewed') return getViewSortValue(b) - getViewSortValue(a);
        if (sortMode === 'least-viewed') return getViewSortValue(a) - getViewSortValue(b);
        return getUploadSortValue(b) - getUploadSortValue(a);
      });
    }

    function applyBroadcastSearch() {
      const query = broadcastSearch.value.trim().toLowerCase();
      const filteredEntries = query
        ? allBroadcastEntries.filter((entry) => getSearchText(entry).includes(query))
        : [...allBroadcastEntries];
      broadcastEntries = sortBroadcastEntries(filteredEntries);

      broadcastFeed.replaceChildren();
      renderedBroadcastCount = 0;
      broadcastStatus.hidden = broadcastEntries.length > 0;
      broadcastStatus.textContent = broadcastEntries.length > 0 ? '' : 'No broadcasts found.';
      renderBroadcasts(INITIAL_BROADCAST_COUNT);
    }

    function renderBroadcasts(count) {
      const nextCount = Math.min(count, broadcastEntries.length);
      for (let i = renderedBroadcastCount; i < nextCount; i += 1) {
        broadcastFeed.appendChild(createBroadcastCard(broadcastEntries[i]));
      }
      renderedBroadcastCount = nextCount;
      loadMoreBroadcasts.hidden = renderedBroadcastCount >= broadcastEntries.length;
    }

    document.addEventListener('click', (event) => {
      const link = event.target && event.target.closest
        ? event.target.closest('[data-video-route-id]')
        : null;
      if (!link) return;

      const videoId = String(link.dataset.videoRouteId || '').trim();
      if (!videoId) return;

      const videoTitle = String(link.dataset.videoTitle || '').trim();
      event.preventDefault();
      openVideoEmbed(videoId, videoTitle);

      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: 'indexFrameVideoRoute',
          action: 'open',
          videoId,
          videoTitle
        }, '*');
      } else {
        window.location.href = `/dead/videos/?vid=${encodeURIComponent(videoId)}`;
      }
    }, true);

    broadcastSearch.addEventListener('input', applyBroadcastSearch);
    broadcastSort.addEventListener('change', applyBroadcastSearch);
    broadcastSearchAction.addEventListener('click', () => {
      const isSorting = broadcastSearchRow.classList.toggle('is-sorting');
      broadcastSearchAction.setAttribute('aria-label', isSorting ? 'Show search videos' : 'Show sorting options');
      if (isSorting) {
        broadcastSort.focus();
      } else {
        broadcastSearch.focus();
      }
    });

    window.addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.type === 'feedGridOpenVideo' && data.videoId) {
        openVideoEmbed(String(data.videoId || ''), String(data.videoTitle || ''));
      } else if (data.type === 'feedGridCloseVideo') {
        closeVideoEmbed();
      }
    });

    window.addEventListener('focus', syncVideoEmbedFromParentRoute);
    window.addEventListener('pageshow', syncVideoEmbedFromParentRoute);
    window.setInterval(syncVideoEmbedFromParentRoute, 250);

    loadMoreBroadcasts.addEventListener('click', () => {
      renderBroadcasts(renderedBroadcastCount + BROADCAST_BATCH_SIZE);
    });

    fetch(FEED_VIDEOS_PATH, { cache: 'no-store' })
      .then((response) => {
        if (!response.ok) throw new Error(`Failed to load ${FEED_VIDEOS_PATH}`);
        return response.json();
      })
      .then((feed) => {
        allBroadcastEntries = Array.isArray(feed.entries) ? feed.entries : [];
        broadcastEntries = sortBroadcastEntries(allBroadcastEntries);
        broadcastStatus.hidden = true;
        renderBroadcasts(INITIAL_BROADCAST_COUNT);
        syncVideoEmbedFromParentRoute();
      })
      .catch((error) => {
        console.error(error);
        broadcastStatus.textContent = 'Unable to load broadcasts.';
      });
  </script>
</body>
</html>
