<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bottom Taskbar</title>
  <style>
    :root {
      --taskbar-height: 44px;
      --theme-surface: #160020;
      --theme-surface-raised: #2b073d;
      --theme-text: #baff39;
      --theme-edge-bright: #ff2bd6;
      --theme-edge-light: #9d3dff;
      --theme-edge-dark: #590a78;
      --theme-edge-deep: #09000f;
      --theme-selection: #c6ff00;
      --theme-selection-text: #21002e;
      --start-menu-width: 270px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      color: var(--theme-text);
      font-family: "Courier New", Courier, monospace;
      font-weight: 700;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    .start-menu::-webkit-scrollbar {
      display: none;
    }

    .start-menu {
      position: fixed;
      z-index: 999;
      bottom: var(--taskbar-height);
      left: 0;
      display: flex;
      flex-direction: column;
      width: min(var(--start-menu-width), 100vw);
      height: calc(100% - var(--taskbar-height));
      min-height: 0;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      overflow-y: auto;
      visibility: hidden;
      list-style: none;
      pointer-events: none;
      opacity: 0;
      background:
        linear-gradient(180deg, rgba(48, 8, 68, 0.995), rgba(22, 0, 32, 0.995));
      border-top: 2px solid var(--theme-edge-light);
      border-right: 2px solid var(--theme-edge-deep);
      border-left: 2px solid var(--theme-edge-light);
      box-shadow:
        inset 1px 1px 0 rgba(255, 43, 214, 0.22),
        inset -1px 0 0 var(--theme-edge-deep),
        5px 0 0 rgba(9, 0, 15, 0.72),
        12px 0 28px rgba(9, 0, 15, 0.48);
      scrollbar-width: none;
      transform: translateY(100%);
      transition:
        visibility 0s linear 180ms,
        opacity 120ms linear,
        transform 180ms cubic-bezier(0.2, 0.8, 0.2, 1);
      -ms-overflow-style: none;
    }

    body.taskbar-at-top .start-menu {
      top: var(--taskbar-height);
      bottom: auto;
      border-top: 0;
      border-bottom: 2px solid var(--theme-edge-deep);
      transform: translateY(-100%);
    }

    body.start-menu-open .start-menu {
      visibility: visible;
      pointer-events: auto;
      opacity: 1;
      transform: translateY(0);
      transition-delay: 0s;
    }

    .start-menu-header {
      flex: 0 0 auto;
      padding: 14px 11px 12px;
      color: var(--theme-edge-bright);
      font-size: 13px;
      line-height: 16px;
      letter-spacing: 0.08em;
      text-transform: none;
      background:
        linear-gradient(90deg, rgba(89, 10, 120, 0.72), rgba(43, 7, 61, 0.35));
      border-bottom: 1px solid var(--theme-edge-dark);
      box-shadow: inset 0 -1px 0 rgba(157, 61, 255, 0.38);
    }

    .start-menu-nickname {
      text-decoration: underline;
      text-decoration-color: var(--theme-selection);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .start-menu-item {
      flex: 0 0 auto;
      margin: 0;
      padding: 0;
    }

    .start-menu-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 38px;
      margin: 0;
      padding: 8px 11px;
      border: 1px solid transparent;
      border-radius: 0;
      background: transparent;
      color: var(--theme-text);
      font: inherit;
      font-size: 15px;
      line-height: 18px;
      text-align: left;
      white-space: nowrap;
      cursor: default;
    }

    .start-menu-button:hover,
    .start-menu-button:focus-visible {
      outline: 0;
      background: var(--theme-selection);
      color: var(--theme-selection-text);
      border-color: var(--theme-edge-bright);
      box-shadow:
        inset 1px 1px 0 rgba(255, 43, 214, 0.4),
        inset -1px -1px 0 rgba(33, 0, 46, 0.35);
    }

    .start-menu-arrow {
      margin-left: 24px;
      font-size: 13px;
    }

    .start-menu-separator {
      flex: 0 0 auto;
      height: 2px;
      margin: 3px 0;
      border-top: 1px solid var(--theme-edge-dark);
      border-bottom: 1px solid rgba(157, 61, 255, 0.45);
    }

    .start-menu-spacer {
      flex: 1 1 auto;
      min-height: 12px;
    }

    .taskbar {
      position: fixed;
      z-index: 1000;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      align-items: flex-end;
      width: 100%;
      height: var(--taskbar-height);
      margin: 0;
      padding: 0;
      list-style: none;
      background:
        linear-gradient(180deg, rgba(43, 7, 61, 0.99), rgba(22, 0, 32, 0.99));
      border-top: 1px solid var(--theme-edge-bright);
      box-shadow:
        inset 0 1px 0 rgba(157, 61, 255, 0.55),
        inset 0 -2px 0 var(--theme-edge-deep),
        0 -2px 0 rgba(9, 0, 15, 0.7);
    }

    body.taskbar-at-top .taskbar {
      top: 0;
      bottom: auto;
      align-items: flex-start;
      border-top: 0;
      border-bottom: 1px solid var(--theme-edge-bright);
      box-shadow:
        inset 0 -1px 0 rgba(157, 61, 255, 0.55),
        inset 0 2px 0 var(--theme-edge-deep),
        0 2px 0 rgba(9, 0, 15, 0.7);
    }

    .taskbar-slot {
      position: relative;
      flex: 0 0 auto;
      height: var(--taskbar-height);
      margin: 0;
      padding: 0;
    }

    .taskbar-slot:first-child::after {
      position: absolute;
      z-index: 2;
      top: 50%;
      right: -1px;
      width: 1px;
      height: 23.1px;
      background: var(--theme-edge-bright);
      content: "";
      pointer-events: none;
      transform: translateY(-50%);
    }

    .domain-slot::after {
      position: absolute;
      z-index: 2;
      top: 50%;
      right: -1px;
      width: 1px;
      height: 23.1px;
      background: var(--theme-edge-bright);
      content: "";
      pointer-events: none;
      transform: translateY(-50%);
    }

    .taskbar-button {
      display: flex;
      align-items: center;
      justify-content: center;
      height: var(--taskbar-height);
      margin: 0;
      padding: 0 12px;
      border-top: 1px solid var(--theme-edge-light);
      border-right: 1px solid var(--theme-edge-deep);
      border-bottom: 1px solid var(--theme-edge-deep);
      border-left: 1px solid var(--theme-edge-light);
      border-radius: 0;
      background:
        linear-gradient(180deg, var(--theme-surface-raised), var(--theme-surface));
      color: var(--theme-text);
      font: inherit;
      font-size: 16px;
      line-height: 18px;
      letter-spacing: 0.02em;
      text-decoration: none;
      white-space: nowrap;
      cursor: default;
      user-select: none;
      transition:
        color 60ms linear,
        background 60ms linear,
        border-color 60ms linear;
    }

    .taskbar-slot + .taskbar-slot .taskbar-button {
      border-left: 0;
    }

    .taskbar-app-slot {
      flex: 0 0 auto;
      min-width: 0;
      max-width: none;
    }

    .taskbar-app-slot::before {
      position: absolute;
      z-index: 2;
      top: 50%;
      left: 0;
      width: 1px;
      height: 23.1px;
      background: var(--theme-edge-bright);
      content: "";
      pointer-events: none;
      transform: translateY(-50%);
    }

    .taskbar-app-button {
      justify-content: flex-start;
      width: auto;
      min-width: 0;
      max-width: none;
      padding-left: 13px;
      overflow: hidden;
      text-align: left;
      text-overflow: ellipsis;
    }

    .taskbar-app-button.is-active {
      border-top-color: var(--theme-edge-deep);
      border-right-color: var(--theme-edge-light);
      border-bottom-color: var(--theme-edge-light);
      background:
        linear-gradient(180deg, var(--theme-surface), var(--theme-surface-raised));
      color: var(--theme-edge-bright);
      box-shadow:
        inset 1px 1px 0 rgba(9, 0, 15, 0.9),
        inset -1px -1px 0 rgba(157, 61, 255, 0.5);
    }

    .taskbar-app-button.is-minimized {
      opacity: 0.62;
    }

    .taskbar-button:hover,
    .taskbar-button:focus-visible {
      outline: 0;
      background: var(--theme-surface-raised);
      border-top-color: var(--theme-edge-bright);
      border-right-color: var(--theme-edge-dark);
      border-bottom-color: var(--theme-edge-dark);
      border-left-color: var(--theme-edge-bright);
      box-shadow:
        inset 1px 1px 0 rgba(255, 43, 214, 0.18),
        inset -1px -1px 0 rgba(9, 0, 15, 0.55);
    }

    .taskbar-button:active {
      border-top-color: var(--theme-edge-deep);
      border-right-color: var(--theme-edge-light);
      border-bottom-color: var(--theme-edge-light);
      border-left-color: var(--theme-edge-deep);
      background:
        linear-gradient(180deg, var(--theme-surface), var(--theme-surface-raised));
      box-shadow:
        inset 1px 1px 0 rgba(9, 0, 15, 0.9),
        inset -1px -1px 0 rgba(157, 61, 255, 0.5);
    }

    body.start-menu-open .spiral-button {
      border-top-color: var(--theme-edge-deep);
      border-right-color: var(--theme-edge-light);
      border-bottom-color: var(--theme-edge-light);
      border-left-color: var(--theme-edge-deep);
      background:
        linear-gradient(180deg, var(--theme-surface), var(--theme-surface-raised));
      box-shadow:
        inset 1px 1px 0 rgba(9, 0, 15, 0.9),
        inset -1px -1px 0 rgba(157, 61, 255, 0.5);
    }

    .spiral-button {
      width: 44px;
      min-width: 44px;
      max-width: 44px;
      padding: 0;
      border-right: 0;
      font-family:
        "Segoe UI Emoji",
        "Apple Color Emoji",
        "Noto Color Emoji",
        sans-serif;
      font-size: 22px;
      line-height: 1;
    }

    .clock-slot {
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 1ch;
      margin-left: auto;
      padding: 0 12px 0 0;
      background:
        linear-gradient(180deg, var(--theme-surface-raised), var(--theme-surface));
      box-shadow:
        inset 1px 1px 0 rgba(157, 61, 255, 0.38),
        inset 0 -2px 0 var(--theme-edge-deep);
      white-space: nowrap;
    }

    .clock-slot::before {
      position: absolute;
      z-index: 2;
      top: 50%;
      left: 0;
      width: 1px;
      height: 23.1px;
      background: var(--theme-edge-bright);
      content: "";
      pointer-events: none;
      transform: translateY(-50%);
    }

    .clock-caret {
      position: relative;
      display: grid;
      flex: 0 0 44px;
      width: 44px;
      min-width: 44px;
      max-width: 44px;
      height: 44px;
      margin: 0;
      padding: 0;
      place-items: center;
      border-top: 1px solid var(--theme-edge-light);
      border-right: 1px solid var(--theme-edge-deep);
      border-bottom: 1px solid var(--theme-edge-deep);
      border-left: 1px solid var(--theme-edge-light);
      border-radius: 0;
      outline: 0;
      background:
        linear-gradient(180deg, var(--theme-surface-raised), var(--theme-surface));
      color: var(--theme-selection);
      box-shadow:
        inset 1px 1px 0 rgba(255, 43, 214, 0.18),
        inset -1px -1px 0 rgba(9, 0, 15, 0.55);
    }

    .clock-caret::after {
      position: absolute;
      z-index: 2;
      top: 50%;
      right: -1px;
      width: 1px;
      height: 23.1px;
      background: var(--theme-edge-bright);
      content: "";
      pointer-events: none;
      transform: translateY(-50%);
    }

    .clock-caret-shape {
      display: block;
      width: 12px;
      height: 12px;
      border-right: 4px solid currentColor;
      border-bottom: 4px solid currentColor;
      filter: drop-shadow(1px 1px 0 var(--theme-edge-deep));
      transform: rotate(45deg);
      transform-origin: 50% 50%;
      transition: transform 100ms linear;
    }

    .clock-caret:hover,
    .clock-caret:focus-visible {
      color: var(--theme-edge-bright);
    }

    .clock-caret:focus-visible {
      outline: 1px dotted var(--theme-selection);
      outline-offset: 2px;
    }

    .clock-caret[aria-expanded="true"] .clock-caret-shape {
      transform: rotate(-135deg);
    }

    .taskbar-clock {
      color: var(--theme-text);
      font-size: 14px;
      line-height: 18px;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
    }

    @media (prefers-reduced-motion: reduce) {
      .start-menu,
      .taskbar-button,
      .clock-caret-shape {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <ul class="start-menu" id="start-menu" role="menu" aria-hidden="true">
    <li class="start-menu-header" aria-hidden="true">
      Welcome, <span class="start-menu-nickname" id="start-menu-nickname"></span>!
    </li>
    <li class="start-menu-item">
      <button class="start-menu-button" type="button" role="menuitem">
        <span>Desktop</span>
      </button>
    </li>
    <li class="start-menu-item">
      <button class="start-menu-button" type="button" role="menuitem">
        <span>Files</span>
        <span class="start-menu-arrow" aria-hidden="true">▶</span>
      </button>
    </li>
    <li class="start-menu-item">
      <button class="start-menu-button" type="button" role="menuitem">
        <span>Applications</span>
        <span class="start-menu-arrow" aria-hidden="true">▶</span>
      </button>
    </li>
    <li class="start-menu-item">
      <button class="start-menu-button" type="button" role="menuitem">
        <span>Experiments</span>
        <span class="start-menu-arrow" aria-hidden="true">▶</span>
      </button>
    </li>
    <li class="start-menu-separator" role="separator"></li>
    <li class="start-menu-item">
      <button
        class="start-menu-button"
        type="button"
        role="menuitem"
        data-app-src="/os/apps/settings_app.html"
        data-app-title="Settings"
        data-app-width="640"
        data-app-singleton
      >
        <span>Settings</span>
        <span class="start-menu-arrow" aria-hidden="true">▶</span>
      </button>
    </li>
    <li class="start-menu-item">
      <button class="start-menu-button" type="button" role="menuitem">
        <span>Help</span>
      </button>
    </li>
    <li class="start-menu-spacer" aria-hidden="true"></li>
    <li class="start-menu-separator" role="separator"></li>
    <li class="start-menu-item">
      <button class="start-menu-button" type="button" role="menuitem">
        <span>Shut Down...</span>
      </button>
    </li>
  </ul>

  <nav aria-label="Desktop taskbar">
    <ul class="taskbar">
      <li class="taskbar-slot">
        <button
          class="taskbar-button spiral-button"
          type="button"
          aria-label="Open start menu"
          aria-controls="start-menu"
          aria-expanded="false"
          aria-haspopup="menu"
        >🌀</button>
      </li>
      <li class="taskbar-slot domain-slot">
        <a
          class="taskbar-button domain-button"
          href="/"
          target="_top"
        >theinternetisdead.org</a>
      </li>
      <li class="taskbar-slot clock-slot">
        <button
          class="taskbar-button clock-caret"
          type="button"
          aria-label="Move taskbar to top"
          aria-expanded="false"
        >
          <span class="clock-caret-shape" aria-hidden="true"></span>
        </button>
        <time class="taskbar-clock" id="taskbar-clock">Thu. July 23, 2026 @ 12:33:02pm</time>
      </li>
    </ul>
  </nav>

  <script>
    const deadOSnickname = "deadOSnickname";
    const startMenu = document.querySelector(".start-menu");
    const startMenuNickname = document.querySelector("#start-menu-nickname");
    const startButton = document.querySelector(".spiral-button");
    const taskbar = document.querySelector(".taskbar");
    const taskbarSlots = [...document.querySelectorAll(".taskbar-slot")];
    const clockSlot = document.querySelector(".clock-slot");
    const clockCaret = document.querySelector(".clock-caret");
    const clock = document.querySelector("#taskbar-clock");
    const animationDuration =
      window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches
        ? 0
        : 180;
    let closeFrameTimer = null;

    function setStartMenuNickname(nickname) {
      const normalizedNickname = String(nickname ?? "").trim();
      startMenuNickname.textContent = normalizedNickname || "Unknown Soul";
    }

    function syncStartMenuWidth() {
      const domainSlot = taskbarSlots[1];
      if (!domainSlot) return;

      const menuWidth = Math.ceil(domainSlot.getBoundingClientRect().right);
      document.documentElement.style.setProperty(
        "--start-menu-width",
        `${menuWidth}px`
      );
    }

    function setParentFrameOpen(open) {
      try {
        window.parent.setStartMenuFrameOpen?.(open);
      } catch {
        // The taskbar still works when opened outside the parent OS document.
      }
    }

    function setParentTaskbarPosition(position) {
      try {
        if (typeof window.parent.setTaskbarPosition === "function") {
          window.parent.setTaskbarPosition(position);
          return;
        }
      } catch {
        // Fall through to postMessage when direct same-origin access is blocked.
      }

      window.parent.postMessage(
        {
          type: "os:taskbar:set-position",
          position
        },
        "*"
      );
    }

    function setStartMenuOpen(open) {
      clearTimeout(closeFrameTimer);

      if (open) {
        setParentFrameOpen(true);
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            document.body.classList.add("start-menu-open");
            startMenu.setAttribute("aria-hidden", "false");
            startButton.setAttribute("aria-expanded", "true");
          });
        });
        return;
      }

      document.body.classList.remove("start-menu-open");
      startMenu.setAttribute("aria-hidden", "true");
      startButton.setAttribute("aria-expanded", "false");
      closeFrameTimer = setTimeout(
        () => setParentFrameOpen(false),
        animationDuration
      );
    }

    function openStartMenuApp(button) {
      const source = button.dataset.appSrc;
      if (!source) return;

      setStartMenuOpen(false);

      try {
        window.parent.osShell?.openApp(source, {
          title: button.dataset.appTitle || "Application",
          width: Number(button.dataset.appWidth) || 1280,
          windowed: true,
          singleton: button.hasAttribute("data-app-singleton"),
          controlBar: { visible: false }
        });
      } catch {
        // App launching is available when this taskbar runs inside /os/index.html.
      }
    }

    function formatClock(date) {
      const days = ["Sun.", "Mon.", "Tue.", "Wed.", "Thu.", "Fri.", "Sat."];
      const months = [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December"
      ];
      const hours = date.getHours();
      const twelveHour = hours % 12 || 12;
      const minutes = String(date.getMinutes()).padStart(2, "0");
      const seconds = String(date.getSeconds()).padStart(2, "0");
      const meridiem = hours >= 12 ? "pm" : "am";

      return (
        `${days[date.getDay()]} ${months[date.getMonth()]} ` +
        `${date.getDate()}, ${date.getFullYear()} @ ` +
        `${twelveHour}:${minutes}:${seconds}${meridiem}`
      );
    }

    function updateClock() {
      const now = new Date();
      clock.textContent = formatClock(now);
      clock.dateTime = now.toISOString();
      clock.title = now.toString();
    }

    function requestWindowAction(method, messageType, id) {
      try {
        const shell = window.parent.osShell;
        if (typeof shell?.[method] === "function") {
          shell[method](id);
          return;
        }
      } catch {
        // Fall through to postMessage when direct same-origin access is blocked.
      }

      window.parent.postMessage(
        {
          type: messageType,
          id
        },
        "*"
      );
    }

    function setTaskbarApps(apps) {
      taskbar.querySelectorAll(".taskbar-app-slot").forEach((slot) => {
        slot.remove();
      });

      apps.forEach((app) => {
        if (!app || typeof app.id !== "string") return;

        const slot = document.createElement("li");
        const button = document.createElement("button");

        slot.className = "taskbar-slot taskbar-app-slot";
        button.className = "taskbar-button taskbar-app-button";
        button.classList.toggle("is-active", Boolean(app.active));
        button.classList.toggle("is-minimized", Boolean(app.minimized));
        button.type = "button";
        button.dataset.windowId = app.id;
        button.textContent = app.title || "Application";
        button.title = app.title || "Application";
        button.setAttribute("aria-pressed", String(Boolean(app.active)));
        let taskbarClickTimer = null;

        button.addEventListener("click", (event) => {
          event.stopPropagation();
          clearTimeout(taskbarClickTimer);
          if (event.detail > 1) return;

          taskbarClickTimer = setTimeout(() => {
            requestWindowAction(
              "toggleAppWindow",
              "os:taskbar:toggle-app",
              app.id
            );
          }, 220);
        });

        button.addEventListener("dblclick", (event) => {
          event.preventDefault();
          event.stopPropagation();
          clearTimeout(taskbarClickTimer);
          const shouldMaximize = app.layout === "normal";
          requestWindowAction(
            shouldMaximize ? "maximizeAppWindow" : "restoreAppWindow",
            shouldMaximize
              ? "os:taskbar:maximize-app"
              : "os:taskbar:restore-app",
            app.id
          );
        });

        slot.append(button);
        taskbar.insertBefore(slot, clockSlot);
      });
    }

    window.taskbarShell = Object.freeze({
      setApps: setTaskbarApps
    });

    startButton.addEventListener("click", (event) => {
      event.stopPropagation();
      const opening = !document.body.classList.contains("start-menu-open");
      setStartMenuOpen(opening);
    });

    clockCaret.addEventListener("click", () => {
      const moveToTop = clockCaret.getAttribute("aria-expanded") !== "true";
      setStartMenuOpen(false);
      document.body.classList.toggle("taskbar-at-top", moveToTop);
      clockCaret.setAttribute("aria-expanded", String(moveToTop));
      clockCaret.setAttribute(
        "aria-label",
        moveToTop ? "Move taskbar to bottom" : "Move taskbar to top"
      );
      setParentTaskbarPosition(moveToTop ? "top" : "bottom");
    });

    startMenu.addEventListener("click", (event) => {
      event.stopPropagation();
      const appButton = event.target.closest?.("[data-app-src]");
      if (appButton) {
        openStartMenuApp(appButton);
      }
    });

    document.addEventListener("click", () => setStartMenuOpen(false));
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        setStartMenuOpen(false);
        startButton.focus();
      }
    });

    window.addEventListener("message", (event) => {
      const message = event.data;

      if (
        event.source === window.parent &&
        message?.type === "os:taskbar:set-apps" &&
        Array.isArray(message.apps)
      ) {
        setTaskbarApps(message.apps);
      }

      if (
        event.source === window.parent &&
        message?.type === "os:taskbar:set-nickname"
      ) {
        setStartMenuNickname(message.nickname);
      }
    });

    window.addEventListener("resize", syncStartMenuWidth);
    try {
      setStartMenuNickname(localStorage.getItem(deadOSnickname));
    } catch (error) {
      setStartMenuNickname("");
    }
    updateClock();
    setInterval(updateClock, 1000);
    syncStartMenuWidth();
  </script>
</body>
</html>
