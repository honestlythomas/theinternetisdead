<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>theinternetisdead.org Boot Screen</title>
  <style>
    :root {
      color-scheme: dark;
      --black: #000;
      --lime: #baff00;
      --green: #56ff62;
      --magenta: #ff2bd6;
      --purple: #8d36ff;
      --cyan: #43f8ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--black);
    }

    body {
      display: grid;
      place-items: center;
      color: var(--lime);
      font-family: "Courier New", Courier, monospace;
      isolation: isolate;
      cursor: pointer;
      user-select: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 2px,
          rgba(0, 0, 0, 0.68) 3px,
          rgba(0, 0, 0, 0.68) 4px
        ),
        linear-gradient(
          90deg,
          rgba(255, 0, 90, 0.035),
          rgba(0, 255, 100, 0.025),
          rgba(60, 90, 255, 0.035)
        );
      background-size: 100% 4px, 6px 100%;
      animation: scan-jump 260ms steps(2, end) infinite;
      mix-blend-mode: screen;
    }

    body::after {
      content: "";
      position: fixed;
      inset: -30%;
      z-index: 19;
      pointer-events: none;
      background:
        radial-gradient(circle at center, transparent 0 17%, rgba(186, 255, 0, 0.08) 18%, transparent 19%),
        conic-gradient(
          from 15deg at 50% 50%,
          transparent 0 8%,
          rgba(255, 43, 214, 0.08) 9%,
          transparent 10% 31%,
          rgba(67, 248, 255, 0.07) 32%,
          transparent 33% 100%
        );
      animation: field-rotate 8s linear infinite;
    }

    .matrix {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      opacity: 0.26;
      filter: blur(0.15px);
    }

    .code-column {
      position: absolute;
      top: -35%;
      width: 1ch;
      color: var(--green);
      font-size: clamp(9px, 1.1vw, 14px);
      line-height: 1.05;
      text-align: center;
      word-break: break-all;
      text-shadow: 0 0 7px currentColor;
      animation: data-fall var(--fall-time) linear infinite;
      animation-delay: var(--fall-delay);
    }

    .void-grid {
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(rgba(141, 54, 255, 0.09) 1px, transparent 1px),
        linear-gradient(90deg, rgba(186, 255, 0, 0.08) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle at 50% 50%, #000, transparent 72%);
      transform: perspective(520px) rotateX(62deg) scale(1.8) translateY(14%);
      transform-origin: center bottom;
      animation: grid-drift 1.7s linear infinite;
    }

    .boot-shell {
      position: relative;
      z-index: 5;
      display: grid;
      width: min(92vw, 980px);
      min-height: min(82vh, 650px);
      padding: clamp(22px, 4vw, 54px);
      place-items: center;
      align-content: center;
      border: 1px solid rgba(186, 255, 0, 0.32);
      background:
        linear-gradient(135deg, rgba(141, 54, 255, 0.09), transparent 35%),
        linear-gradient(315deg, rgba(255, 43, 214, 0.08), transparent 40%),
        rgba(0, 0, 0, 0.72);
      box-shadow:
        0 0 0 1px rgba(255, 43, 214, 0.13),
        0 0 70px rgba(141, 54, 255, 0.23),
        inset 0 0 70px rgba(0, 0, 0, 0.9);
      clip-path: polygon(
        0 18px,
        18px 18px,
        18px 0,
        calc(100% - 18px) 0,
        calc(100% - 18px) 18px,
        100% 18px,
        100% calc(100% - 18px),
        calc(100% - 18px) calc(100% - 18px),
        calc(100% - 18px) 100%,
        18px 100%,
        18px calc(100% - 18px),
        0 calc(100% - 18px)
      );
      animation: shell-stutter 1.35s steps(1, end) infinite;
    }

    .boot-shell::before,
    .boot-shell::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }

    .boot-shell::before {
      inset: 12px;
      border: 1px dashed rgba(67, 248, 255, 0.16);
    }

    .boot-shell::after {
      top: 0;
      left: 0;
      width: 38%;
      height: 3px;
      background: linear-gradient(90deg, var(--lime), var(--magenta), transparent);
      box-shadow: 0 0 18px var(--lime);
      animation: edge-scan 1.15s steps(7, end) infinite alternate;
    }

    .corner-readout {
      position: absolute;
      color: rgba(67, 248, 255, 0.66);
      font-size: clamp(8px, 1.15vw, 11px);
      line-height: 1.45;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(67, 248, 255, 0.7);
    }

    .corner-readout.left {
      top: 28px;
      left: 30px;
    }

    .corner-readout.right {
      right: 30px;
      bottom: 28px;
      text-align: right;
    }

    .core {
      position: relative;
      display: grid;
      width: clamp(142px, 24vw, 220px);
      aspect-ratio: 1;
      margin-bottom: clamp(28px, 5vh, 48px);
      place-items: center;
      filter:
        drop-shadow(7px 0 0 rgba(255, 43, 214, 0.18))
        drop-shadow(-7px 0 0 rgba(67, 248, 255, 0.15));
    }

    .core-ring {
      position: absolute;
      border: 2px solid var(--lime);
      border-radius: 50%;
      box-shadow:
        0 0 10px currentColor,
        inset 0 0 18px rgba(186, 255, 0, 0.2);
    }

    .core-ring.one {
      inset: 0;
      color: var(--lime);
      border-style: dashed;
      animation: ring-clockwise 5s steps(24, end) infinite;
    }

    .core-ring.two {
      inset: 14%;
      color: var(--magenta);
      border-color: currentColor;
      border-width: 5px 1px 3px 1px;
      animation: ring-counter 2.7s linear infinite;
    }

    .core-ring.three {
      inset: 29%;
      color: var(--cyan);
      border-color: currentColor;
      border-style: dotted;
      border-width: 4px;
      animation: ring-clockwise 1.25s steps(12, end) infinite;
    }

    .core::before,
    .core::after {
      content: "";
      position: absolute;
      background: var(--magenta);
      box-shadow: 0 0 16px var(--magenta);
      mix-blend-mode: screen;
    }

    .core::before {
      width: 140%;
      height: 1px;
      animation: cross-horizontal 820ms steps(3, end) infinite;
    }

    .core::after {
      width: 1px;
      height: 140%;
      background: var(--cyan);
      box-shadow: 0 0 16px var(--cyan);
      animation: cross-vertical 680ms steps(3, end) infinite;
    }

    .terminal-mark {
      position: relative;
      z-index: 3;
      display: grid;
      width: 36%;
      aspect-ratio: 1;
      place-items: center;
      border: 2px solid var(--lime);
      background: #020600;
      color: var(--lime);
      font-weight: 900;
      font-size: clamp(24px, 5vw, 46px);
      letter-spacing: -0.18em;
      text-indent: -0.12em;
      text-shadow:
        2px 0 var(--magenta),
        -2px 0 var(--cyan),
        0 0 12px var(--lime);
      box-shadow:
        0 0 0 6px rgba(0, 0, 0, 0.9),
        0 0 0 8px var(--purple),
        0 0 28px var(--purple);
      transform: rotate(45deg);
      animation: mark-glitch 970ms steps(1, end) infinite;
    }

    .terminal-mark span {
      transform: rotate(-45deg);
    }

    .site-name {
      position: relative;
      margin: 0;
      color: var(--lime);
      font-size: clamp(17px, 6.2vw, 62px);
      line-height: 0.95;
      letter-spacing: -0.075em;
      text-align: center;
      text-transform: lowercase;
      text-shadow:
        3px 0 0 var(--magenta),
        -3px 0 0 var(--cyan),
        0 0 22px rgba(186, 255, 0, 0.82);
      animation: title-glitch 1.1s steps(1, end) infinite;
    }

    .site-name::before,
    .site-name::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .site-name::before {
      color: var(--magenta);
      clip-path: inset(12% 0 61% 0);
      transform: translate(-5px, -2px);
      opacity: 0.8;
      animation: slice-one 620ms steps(2, end) infinite;
    }

    .site-name::after {
      color: var(--cyan);
      clip-path: inset(64% 0 11% 0);
      transform: translate(6px, 2px);
      opacity: 0.75;
      animation: slice-two 710ms steps(2, end) infinite;
    }

    .status-line {
      min-height: 1.4em;
      margin: 18px 0 0;
      color: var(--cyan);
      font-size: clamp(10px, 1.6vw, 14px);
      letter-spacing: 0.22em;
      text-align: center;
      text-transform: uppercase;
      text-shadow: 0 0 9px rgba(67, 248, 255, 0.75);
    }

    .status-line::before {
      content: "[ ";
      color: var(--magenta);
    }

    .status-line::after {
      content: " ]";
      color: var(--magenta);
    }

    .entry-prompt {
      margin: 16px 0 0;
      color: var(--lime);
      font-size: clamp(11px, 1.8vw, 16px);
      letter-spacing: 0.18em;
      text-align: center;
      text-transform: uppercase;
      text-shadow:
        2px 0 var(--magenta),
        -2px 0 var(--cyan),
        0 0 12px rgba(186, 255, 0, 0.85);
      animation: entry-pulse 780ms steps(2, end) infinite;
    }

    .signature {
      position: absolute;
      right: clamp(18px, 4vw, 46px);
      bottom: clamp(16px, 3vh, 30px);
      left: clamp(18px, 4vw, 46px);
      margin: 0;
      color: rgba(255, 255, 255, 0.72);
      font-size: clamp(9px, 1.55vw, 13px);
      line-height: 1.4;
      text-align: center;
      text-shadow:
        1px 0 var(--magenta),
        -1px 0 var(--cyan);
      overflow-wrap: anywhere;
    }

    @keyframes data-fall {
      to {
        transform: translateY(145vh);
      }
    }

    @keyframes field-rotate {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes grid-drift {
      to {
        background-position: 0 42px, 42px 0;
      }
    }

    @keyframes scan-jump {
      0%,
      87% {
        transform: translateY(0);
      }
      88% {
        transform: translateY(2px);
      }
      91% {
        transform: translateY(-1px);
      }
      94%,
      100% {
        transform: translateY(0);
      }
    }

    @keyframes shell-stutter {
      0%,
      77%,
      82%,
      100% {
        transform: translate(0);
      }
      78% {
        transform: translate(2px, -1px);
      }
      79% {
        transform: translate(-4px, 1px);
      }
      80% {
        transform: translate(1px, 0);
      }
    }

    @keyframes edge-scan {
      to {
        left: 62%;
      }
    }

    @keyframes ring-clockwise {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes ring-counter {
      to {
        transform: rotate(-360deg);
      }
    }

    @keyframes cross-horizontal {
      0%,
      89%,
      100% {
        transform: scaleX(1);
        opacity: 0.46;
      }
      90% {
        transform: scaleX(0.28) translateX(-90%);
        opacity: 1;
      }
      94% {
        transform: scaleX(0.7) translateX(40%);
      }
    }

    @keyframes cross-vertical {
      0%,
      81%,
      100% {
        transform: scaleY(1);
        opacity: 0.38;
      }
      82% {
        transform: scaleY(0.3) translateY(80%);
        opacity: 1;
      }
      88% {
        transform: scaleY(0.62) translateY(-35%);
      }
    }

    @keyframes mark-glitch {
      0%,
      72%,
      79%,
      100% {
        translate: 0;
        filter: none;
      }
      73% {
        translate: -5px 2px;
        filter: hue-rotate(45deg);
      }
      75% {
        translate: 6px -1px;
        filter: invert(1);
      }
      77% {
        translate: -2px 0;
      }
    }

    @keyframes title-glitch {
      0%,
      74%,
      79%,
      100% {
        transform: translate(0);
        filter: none;
      }
      75% {
        transform: translate(-4px, 1px) skewX(2deg);
        filter: saturate(1.7);
      }
      77% {
        transform: translate(5px, -1px) skewX(-4deg);
        filter: hue-rotate(55deg);
      }
    }

    @keyframes slice-one {
      0%,
      67%,
      100% {
        transform: translate(-5px, -2px);
      }
      68% {
        transform: translate(14px, 1px);
      }
      74% {
        transform: translate(-11px, -1px);
      }
    }

    @keyframes slice-two {
      0%,
      73%,
      100% {
        transform: translate(6px, 2px);
      }
      74% {
        transform: translate(-16px, -2px);
      }
      81% {
        transform: translate(13px, 1px);
      }
    }

    @keyframes entry-pulse {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.34;
      }
    }

    @media (max-height: 560px) {
      .boot-shell {
        min-height: 92vh;
        padding-top: 18px;
        padding-bottom: 52px;
      }

      .core {
        width: min(26vh, 150px);
        margin-bottom: 22px;
      }

      .signature {
        bottom: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="matrix" id="matrix" aria-hidden="true"></div>
  <div class="void-grid" aria-hidden="true"></div>

  <main class="boot-shell">
    <div class="corner-readout left" aria-hidden="true">
      signal://dead-net<br>
      kernel: tektite.1997<br>
      memory: recursive
    </div>

    <div class="core" aria-hidden="true">
      <span class="core-ring one"></span>
      <span class="core-ring two"></span>
      <span class="core-ring three"></span>
      <span class="terminal-mark"><span>&gt;_</span></span>
    </div>

    <h1 class="site-name" data-text="theinternetisdead.org">theinternetisdead.org</h1>
    <p class="status-line" id="status-line">resurrecting dead signal</p>
    <p class="entry-prompt" id="entry-prompt">Click anywhere to enter</p>

    <div class="corner-readout right" aria-hidden="true">
      souls: reserved<br>
      uplink: unstable<br>
      boot: inevitable
    </div>

    <p class="signature">Powered by🍁𝙷𝚘𝚗𝚎𝚜𝚝𝚕y_𝚃𝚑𝚘𝚖𝚊𝚜👽(𝚃𝚎𝚔𝚝𝚒𝚝𝚎) ~ All Souls Reserved 1997-2026</p>
  </main>

  <script>
    const matrix = document.querySelector("#matrix");
    const statusLine = document.querySelector("#status-line");
    const entryPrompt = document.querySelector("#entry-prompt");
    const glyphs = "010101<>/\\\\[]{}$#@*+_-=DEADNET";
    const columnCount = Math.max(18, Math.min(44, Math.floor(window.innerWidth / 34)));
    const statuses = [
      "resurrecting dead signal",
      "mounting haunted interface",
      "routing souls through static",
      "terminal core online"
    ];
    let statusIndex = 0;

    function randomGlyphs(length) {
      return Array.from(
        { length },
        () => glyphs[Math.floor(Math.random() * glyphs.length)]
      ).join("<br>");
    }

    for (let index = 0; index < columnCount; index += 1) {
      const column = document.createElement("span");
      column.className = "code-column";
      column.style.left = `${(index / columnCount) * 100}%`;
      column.style.setProperty("--fall-time", `${2.4 + Math.random() * 3.8}s`);
      column.style.setProperty("--fall-delay", `${Math.random() * -5}s`);
      column.innerHTML = randomGlyphs(24 + Math.floor(Math.random() * 30));
      matrix.append(column);
    }

    window.setInterval(() => {
      statusIndex = (statusIndex + 1) % statuses.length;
      statusLine.textContent = statuses[statusIndex];
    }, 620);

    let dismissalRequested = false;

    function requestDismissal() {
      if (dismissalRequested) return;
      dismissalRequested = true;
      entryPrompt.textContent = "Opening deadOS";
      window.parent.postMessage({ type: "os:boot:dismiss" }, "*");
    }

    window.addEventListener("click", requestDismissal);
    window.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;
      event.preventDefault();
      requestDismissal();
    });
  </script>
</body>
</html>
