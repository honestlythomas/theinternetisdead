<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings</title>
  <style>
    :root {
      --theme-surface: #160020;
      --theme-surface-raised: #2b073d;
      --theme-surface-soft: #240532;
      --theme-text: #baff39;
      --theme-edge-bright: #ff2bd6;
      --theme-edge-light: #9d3dff;
      --theme-edge-dark: #590a78;
      --theme-edge-deep: #09000f;
      --theme-selection: #c6ff00;
      --theme-muted: #caa7dc;
      --theme-danger: #ff6b9d;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-width: 0;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--theme-surface);
      color: var(--theme-text);
      font-family: "Courier New", Courier, monospace;
      font-weight: 700;
    }

    button,
    input { font: inherit; }

    .properties-shell {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      width: 100%;
      height: 100%;
      min-height: 0;
      padding: 14px;
      background:
        linear-gradient(135deg, rgba(157, 61, 255, 0.06), transparent 38%),
        var(--theme-surface);
    }

    .settings-panel {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border-top: 2px solid var(--theme-edge-light);
      border-right: 2px solid var(--theme-edge-deep);
      border-bottom: 2px solid var(--theme-edge-deep);
      border-left: 2px solid var(--theme-edge-light);
      background: linear-gradient(180deg, rgba(43, 7, 61, 0.99), rgba(22, 0, 32, 0.99));
      box-shadow:
        inset 1px 1px 0 rgba(255, 43, 214, 0.22),
        inset -1px -1px 0 var(--theme-edge-deep);
    }

    .panel-scroll {
      width: 100%;
      height: 100%;
      padding: 18px;
      overflow: auto;
      scrollbar-width: none;
    }

    .panel-scroll::-webkit-scrollbar { display: none; }

    .intro {
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr);
      gap: 16px;
      align-items: center;
      max-width: 760px;
      margin: 0 auto 20px;
    }

    .settings-icon {
      display: grid;
      width: 60px;
      height: 60px;
      place-items: center;
      border-top: 2px solid var(--theme-edge-bright);
      border-right: 2px solid var(--theme-edge-deep);
      border-bottom: 2px solid var(--theme-edge-deep);
      border-left: 2px solid var(--theme-edge-bright);
      background:
        radial-gradient(circle, rgba(255, 43, 214, 0.2), transparent 60%),
        var(--theme-surface-soft);
      color: var(--theme-selection);
      font-family: "Segoe UI Symbol", "Noto Sans Symbols", sans-serif;
      font-size: 34px;
      box-shadow:
        inset 1px 1px 0 rgba(157, 61, 255, 0.48),
        4px 4px 0 rgba(9, 0, 15, 0.65);
    }

    .intro h1 {
      margin: 0 0 4px;
      color: var(--theme-edge-bright);
      font-size: clamp(20px, 3vw, 28px);
      line-height: 1.1;
      letter-spacing: 0.03em;
    }

    .intro p {
      margin: 0;
      color: var(--theme-muted);
      font-size: 13px;
      line-height: 1.45;
    }

    fieldset {
      width: 100%;
      max-width: 760px;
      min-width: 0;
      margin: 0 auto;
      padding: 22px 18px 18px;
      border: 1px solid var(--theme-edge-dark);
      background: rgba(9, 0, 15, 0.22);
      box-shadow:
        inset 1px 1px 0 rgba(157, 61, 255, 0.24),
        1px 1px 0 var(--theme-edge-deep);
    }

    legend {
      padding: 0 8px;
      color: var(--theme-edge-bright);
      font-size: 14px;
      letter-spacing: 0.04em;
    }

    .nickname-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: end;
    }

    .input-wrap { min-width: 0; }

    label {
      display: block;
      margin-bottom: 7px;
      color: var(--theme-text);
      font-size: 14px;
    }

    .control-note {
      display: block;
      margin-top: 7px;
      color: var(--theme-muted);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.35;
    }

    input[type="text"] {
      width: 100%;
      min-width: 0;
      height: 38px;
      padding: 7px 10px;
      border-top: 2px solid var(--theme-edge-deep);
      border-right: 2px solid var(--theme-edge-light);
      border-bottom: 2px solid var(--theme-edge-light);
      border-left: 2px solid var(--theme-edge-deep);
      border-radius: 0;
      outline: 0;
      background: var(--theme-surface);
      color: var(--theme-text);
      caret-color: var(--theme-selection);
      box-shadow:
        inset 1px 1px 0 rgba(9, 0, 15, 0.9),
        inset -1px -1px 0 rgba(157, 61, 255, 0.4);
    }

    input[type="text"]:focus {
      border-right-color: var(--theme-edge-bright);
      border-bottom-color: var(--theme-edge-bright);
      box-shadow:
        inset 1px 1px 0 rgba(9, 0, 15, 0.9),
        inset -1px -1px 0 rgba(157, 61, 255, 0.4),
        0 0 0 1px var(--theme-selection);
    }

    .action-button {
      min-width: 116px;
      height: 38px;
      margin: 0;
      padding: 6px 14px;
      border-top: 2px solid var(--theme-edge-light);
      border-right: 2px solid var(--theme-edge-deep);
      border-bottom: 2px solid var(--theme-edge-deep);
      border-left: 2px solid var(--theme-edge-light);
      border-radius: 0;
      background: linear-gradient(180deg, var(--theme-surface-raised), var(--theme-surface));
      color: var(--theme-text);
      box-shadow:
        inset 1px 1px 0 rgba(255, 43, 214, 0.18),
        inset -1px -1px 0 rgba(9, 0, 15, 0.55);
    }

    .action-button:hover,
    .action-button:focus-visible {
      outline: 0;
      border-top-color: var(--theme-edge-bright);
      border-left-color: var(--theme-edge-bright);
      background: var(--theme-surface-raised);
    }

    .action-button:active {
      border-top-color: var(--theme-edge-deep);
      border-right-color: var(--theme-edge-light);
      border-bottom-color: var(--theme-edge-light);
      border-left-color: var(--theme-edge-deep);
    }

    .action-button.primary {
      border-color: var(--theme-edge-bright);
      box-shadow:
        inset 0 0 0 1px var(--theme-selection),
        inset 2px 2px 0 rgba(255, 43, 214, 0.18),
        inset -2px -2px 0 rgba(9, 0, 15, 0.55);
    }

    .clear-zone {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--theme-edge-dark);
    }

    .clear-zone strong {
      display: block;
      color: var(--theme-danger);
      font-size: 13px;
    }

    .clear-zone span {
      display: block;
      margin-top: 4px;
      color: var(--theme-muted);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.35;
    }

    .clear-button { color: var(--theme-danger); }

    .button-bar {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      min-height: 54px;
      padding: 12px 0 0;
    }

    .status {
      align-self: center;
      margin-right: auto;
      color: var(--theme-muted);
      font-size: 12px;
      font-weight: 400;
    }

    .status.is-error { color: var(--theme-danger); }

    @media (max-width: 620px) {
      .properties-shell { padding: 8px; }
      .panel-scroll { padding: 14px; }
      .nickname-row,
      .clear-zone { grid-template-columns: 1fr; }
      .action-button { width: 100%; }
      .button-bar { flex-wrap: wrap; }
      .status { width: 100%; }
    }

    @media (max-width: 480px) {
      .intro {
        grid-template-columns: 48px minmax(0, 1fr);
        gap: 11px;
      }

      .settings-icon {
        width: 46px;
        height: 46px;
        font-size: 27px;
      }
    }
  </style>
</head>
<body>
  <form class="properties-shell" id="settings-form">
    <main class="settings-panel">
      <div class="panel-scroll">
        <header class="intro">
          <div class="settings-icon" aria-hidden="true">⚙️</div>
          <div>
            <h1>Settings</h1>
            <p>Manage the local identity used by this deadOS installation.</p>
          </div>
        </header>

        <fieldset>
          <legend>Nickname</legend>

          <div class="nickname-row">
            <div class="input-wrap">
              <label for="nickname-input">deadOS nickname</label>
              <input
                id="nickname-input"
                name="nickname"
                type="text"
                maxlength="32"
                autocomplete="off"
                spellcheck="false"
                placeholder="Enter a nickname"
                required
              >
              <span class="control-note">Saving reloads deadOS and updates the welcome text.</span>
            </div>
            <button class="action-button primary" type="submit">Update</button>
          </div>

          <div class="clear-zone">
            <div>
              <strong>Clear nickname</strong>
              <span>This nullifies the saved nickname. The boot and nickname screens will return after reload.</span>
            </div>
            <button class="action-button clear-button" id="clear-button" type="button">Clear Nickname</button>
          </div>
        </fieldset>
      </div>
    </main>

    <footer class="button-bar">
      <span class="status" id="status" role="status" aria-live="polite">Nickname loaded from this browser.</span>
    </footer>
  </form>

  <script>
    const STORAGE_KEY = "deadOSnickname";
    const form = document.querySelector("#settings-form");
    const nicknameInput = document.querySelector("#nickname-input");
    const clearButton = document.querySelector("#clear-button");
    const status = document.querySelector("#status");

    function normalizeNickname(value) {
      return String(value ?? "").trim().replace(/\s+/g, " ").slice(0, 32);
    }

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle("is-error", isError);
    }

    function reloadDeadOS() {
      window.top.location.reload();
    }

    try {
      nicknameInput.value = normalizeNickname(localStorage.getItem(STORAGE_KEY));
    } catch (error) {
      setStatus("Local storage is unavailable.", true);
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const nickname = normalizeNickname(nicknameInput.value);

      if (!nickname) {
        nicknameInput.focus();
        setStatus("Enter a nickname before updating.", true);
        return;
      }

      try {
        localStorage.setItem(STORAGE_KEY, nickname);
        setStatus("Nickname updated. Reloading deadOS...");
        reloadDeadOS();
      } catch (error) {
        setStatus("Nickname could not be saved.", true);
      }
    });

    clearButton.addEventListener("click", () => {
      try {
        localStorage.removeItem(STORAGE_KEY);
        nicknameInput.value = "";
        setStatus("Nickname cleared. Reloading boot sequence...");
        reloadDeadOS();
      } catch (error) {
        setStatus("Nickname could not be cleared.", true);
      }
    });
  </script>
</body>
</html>
