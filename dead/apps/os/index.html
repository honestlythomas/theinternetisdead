<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>theinternetisdead.org OS</title>
  <style>
    :root {
      --taskbar-height: 44px;
      --desktop-background: #09000f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--desktop-background);
    }

    body {
      display: grid;
      grid-template-rows: minmax(0, 1fr) var(--taskbar-height);
    }

    body.taskbar-at-top {
      grid-template-rows: var(--taskbar-height) minmax(0, 1fr);
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      margin: 0;
      border: 0;
      background: transparent;
    }

    .boot-screen-frame {
      position: fixed;
      inset: 0;
      z-index: 9999;
      width: 100vw;
      height: 100vh;
      background: #000;
      pointer-events: auto;
      transform-origin: center;
      will-change: opacity, filter, transform, clip-path;
    }

    .boot-screen-frame.is-exiting {
      animation: boot-screen-exit 760ms steps(12, end) forwards;
    }

    .nickname-screen-frame {
      position: fixed;
      inset: 0;
      z-index: 100;
      width: 100vw;
      height: 100vh;
      background: var(--desktop-background);
      opacity: 0;
      pointer-events: none;
      will-change: opacity, filter, transform;
    }

    .nickname-screen-frame.is-loading {
      animation: nickname-screen-enter 760ms steps(12, end) forwards;
    }

    .nickname-screen-frame.is-ready {
      opacity: 1;
      filter: none;
      transform: none;
      pointer-events: auto;
    }

    .nickname-screen-frame.is-exiting {
      pointer-events: none;
      animation: nickname-screen-exit 320ms steps(6, end) forwards;
    }

    .desktop-frame {
      grid-row: 1;
      min-width: 0;
      min-height: 0;
      position: relative;
      z-index: 1;
    }

    .taskbar-frame {
      grid-row: 2;
      align-self: end;
      position: relative;
      z-index: 2;
    }

    body.taskbar-at-top .desktop-frame {
      grid-row: 2;
    }

    body.taskbar-at-top .taskbar-frame {
      grid-row: 1;
      align-self: start;
    }

    @keyframes boot-screen-exit {
      0% {
        opacity: 1;
        filter: none;
        transform: translate(0) scale(1);
        clip-path: inset(0);
      }
      12% {
        filter: contrast(2.2) saturate(2.4) hue-rotate(45deg);
        transform: translate(-8px, 2px) scaleX(1.01);
        clip-path: inset(7% 0 18% 0);
      }
      24% {
        opacity: 0.94;
        transform: translate(12px, -3px) skewX(-2deg);
        clip-path: inset(42% 0 4% 0);
      }
      37% {
        filter: invert(1) contrast(4);
        transform: translate(-15px, 0) scaleY(0.97);
        clip-path: inset(3% 0 61% 0);
      }
      49% {
        opacity: 0.72;
        filter: contrast(3) saturate(3) hue-rotate(230deg);
        transform: translate(9px, 4px) scaleX(1.035);
        clip-path: inset(27% 0 23% 0);
      }
      63% {
        opacity: 0.5;
        transform: translate(-5px, -2px) skewX(4deg);
        clip-path: inset(57% 0 7% 0);
      }
      78% {
        opacity: 0.28;
        filter: contrast(5) blur(1px);
        transform: translate(18px, 0) scaleX(1.08);
        clip-path: inset(12% 0 71% 0);
      }
      91% {
        opacity: 0.12;
        transform: translate(-22px, 0) scaleX(1.14);
        clip-path: inset(48% 0 46% 0);
      }
      100% {
        opacity: 0;
        filter: contrast(8) blur(3px);
        transform: translate(0) scaleX(1.2);
        clip-path: inset(50% 0);
        visibility: hidden;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .boot-screen-frame.is-exiting {
        animation-name: boot-screen-fade;
        animation-duration: 240ms;
        animation-timing-function: ease-out;
      }
    }

    @keyframes boot-screen-fade {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }

    @keyframes nickname-screen-enter {
      0% {
        opacity: 0;
        filter: contrast(3.4) saturate(2.8) hue-rotate(235deg) blur(3px);
        transform: translateX(14px) scaleX(1.04);
      }
      20% {
        opacity: 0.12;
        transform: translateX(-9px) scaleX(1.025);
      }
      39% {
        opacity: 0.32;
        filter: contrast(2.5) saturate(2.1) hue-rotate(145deg) blur(2px);
        transform: translateX(7px) scaleX(1.015);
      }
      58% {
        opacity: 0.54;
        transform: translateX(-4px);
      }
      78% {
        opacity: 0.78;
        filter: contrast(1.5) saturate(1.4) hue-rotate(35deg) blur(0.5px);
        transform: translateX(2px);
      }
      100% {
        opacity: 1;
        filter: none;
        transform: none;
      }
    }

    @keyframes nickname-screen-exit {
      0% {
        opacity: 1;
        filter: none;
        transform: translateX(0);
      }
      35% {
        opacity: 0.82;
        filter: saturate(2.4) hue-rotate(35deg);
        transform: translateX(-7px);
      }
      58% {
        opacity: 0.55;
        filter: contrast(2.6) hue-rotate(210deg);
        transform: translateX(11px);
      }
      100% {
        opacity: 0;
        filter: contrast(4);
        transform: translateX(-18px);
        visibility: hidden;
      }
    }
  </style>
</head>
<body>
  <iframe
    class="boot-screen-frame"
    data-src="components/boot-screen.html"
    title="System boot screen"
    scrolling="no"
  ></iframe>

  <iframe
    class="nickname-screen-frame"
    data-src="components/nickname-screen.html"
    title="deadOS nickname"
    scrolling="no"
  ></iframe>

  <script>
    const deadOSnickname = "deadOSnickname";
    const settingsStoragePrefix = `${deadOSnickname}:settings:`;
    const bootScreenFrame = document.querySelector(".boot-screen-frame");
    const nicknameScreenFrame = document.querySelector(".nickname-screen-frame");
    const taskbarHeight = 44;
    let desktopFrame = null;
    let bottomTaskbarFrame = null;
    let activeNickname = "";
    let indexSettings = {};
    let osIsMounted = false;
    let bootScreenIsGone = false;
    let nicknameLoadStarted = false;
    let nicknameScreenIsLoaded = false;
    let nicknameScreenIsReady = false;
    let nicknameScreenIsExiting = false;
    let startMenuFrameIsOpen = false;
    let taskbarIsReady = false;
    let taskbarApps = [];
    const pendingAppRequests = [];

    function completeNicknameHandoff() {
      if (
        !bootScreenIsGone ||
        !nicknameScreenIsLoaded ||
        nicknameScreenIsReady
      ) {
        return;
      }

      nicknameScreenIsReady = true;
      nicknameScreenFrame.classList.remove("is-loading");
      nicknameScreenFrame.classList.add("is-ready");
      nicknameScreenFrame.contentWindow.postMessage(
        { type: "os:nickname:activate" },
        "*"
      );
    }

    function finishBootExit() {
      if (bootScreenIsGone) return;
      bootScreenIsGone = true;
      bootScreenFrame.remove();
      completeNicknameHandoff();
    }

    function beginNicknameHandoff() {
      if (nicknameLoadStarted) return;
      nicknameLoadStarted = true;
      nicknameScreenFrame.classList.add("is-loading");
      nicknameScreenFrame.src = nicknameScreenFrame.dataset.src;
    }

    function dismissBootScreen() {
      if (bootScreenFrame.classList.contains("is-exiting")) return;
      beginNicknameHandoff();
      bootScreenFrame.classList.add("is-exiting");
      bootScreenFrame.style.pointerEvents = "none";
      window.setTimeout(finishBootExit, 1100);
    }

    bootScreenFrame.addEventListener("animationend", finishBootExit, { once: true });

    nicknameScreenFrame.addEventListener("load", () => {
      if (!nicknameLoadStarted) return;
      nicknameScreenIsLoaded = true;
      completeNicknameHandoff();
    });

    function normalizeNickname(value) {
      return String(value ?? "").trim().replace(/\s+/g, " ").slice(0, 48);
    }

    function getSettingsStorageKey(nickname = activeNickname) {
      return `${settingsStoragePrefix}${encodeURIComponent(nickname.toLowerCase())}`;
    }

    function loadIndexSettings(nickname) {
      try {
        const savedSettings = JSON.parse(
          localStorage.getItem(getSettingsStorageKey(nickname)) ?? "{}"
        );
        return savedSettings && typeof savedSettings === "object"
          ? savedSettings
          : {};
      } catch (error) {
        console.warn("deadOS settings could not be loaded.", error);
        return {};
      }
    }

    function saveIndexSettings(settings) {
      if (!activeNickname) return;

      try {
        localStorage.setItem(
          getSettingsStorageKey(),
          JSON.stringify(settings)
        );
      } catch (error) {
        console.warn("deadOS settings could not be saved.", error);
      }
    }

    function updateIndexSettings(changes, applyChanges = true) {
      if (!changes || typeof changes !== "object") return;
      indexSettings = { ...indexSettings, ...changes };
      saveIndexSettings(indexSettings);

      if (applyChanges && "taskbarPosition" in changes) {
        window.setTaskbarPosition(changes.taskbarPosition, false);
      }
    }

    function setControlBar() {
      return false;
    }

    function sendTaskbarApps() {
      if (!taskbarIsReady || !bottomTaskbarFrame) return;

      bottomTaskbarFrame.contentWindow.postMessage(
        {
          type: "os:taskbar:set-apps",
          apps: taskbarApps
        },
        "*"
      );
    }

    function sendTaskbarNickname() {
      if (!taskbarIsReady || !bottomTaskbarFrame) return;

      bottomTaskbarFrame.contentWindow.postMessage(
        {
          type: "os:taskbar:set-nickname",
          nickname: activeNickname
        },
        "*"
      );
    }

    function setTaskbarApps(apps) {
      if (!Array.isArray(apps)) return;

      taskbarApps = apps.map((app) => ({ ...app }));
      sendTaskbarApps();
    }

    window.setStartMenuFrameOpen = (open) => {
      if (!bottomTaskbarFrame) return;
      startMenuFrameIsOpen = open;
      const expandedHeight = Math.max(taskbarHeight, window.innerHeight);

      bottomTaskbarFrame.style.height = open
        ? `${expandedHeight}px`
        : `${taskbarHeight}px`;
    };

    window.setTaskbarPosition = (position, persist = true) => {
      const normalizedPosition = position === "top" ? "top" : "bottom";
      const atTop = normalizedPosition === "top";
      document.body.classList.toggle("taskbar-at-top", atTop);

      if (bottomTaskbarFrame) {
        bottomTaskbarFrame.title = atTop ? "Top taskbar" : "Bottom taskbar";
      }

      if (bottomTaskbarFrame && startMenuFrameIsOpen) {
        window.setStartMenuFrameOpen(true);
      }

      if (persist && activeNickname) {
        updateIndexSettings({ taskbarPosition: normalizedPosition }, false);
      }
    };

    window.addEventListener("resize", () => {
      if (bottomTaskbarFrame && startMenuFrameIsOpen) {
        window.setStartMenuFrameOpen(true);
      }
    });

    function revealOS() {
      if (nicknameScreenIsExiting) return;
      nicknameScreenIsExiting = true;

      if (!nicknameScreenFrame.isConnected) return;

      nicknameScreenFrame.classList.add("is-exiting");
      nicknameScreenFrame.addEventListener("animationend", () => {
        nicknameScreenFrame.remove();
      }, { once: true });
    }

    function mountOS(nickname) {
      if (osIsMounted) return;
      osIsMounted = true;
      activeNickname = nickname;
      indexSettings = loadIndexSettings(nickname);

      desktopFrame = document.createElement("iframe");
      desktopFrame.className = "desktop-frame";
      desktopFrame.src = "components/desktop.html";
      desktopFrame.title = "Desktop";

      bottomTaskbarFrame = document.createElement("iframe");
      bottomTaskbarFrame.className = "taskbar-frame";
      bottomTaskbarFrame.src = "components/bottom-taskbar.html";
      bottomTaskbarFrame.title = "Taskbar";
      bottomTaskbarFrame.scrolling = "no";

      let framesAwaitingLoad = 2;
      const recordFrameLoad = () => {
        framesAwaitingLoad -= 1;
        if (framesAwaitingLoad === 0) revealOS();
      };

      desktopFrame.addEventListener("load", () => {
        const desktopShell = desktopFrame.contentWindow.desktopShell;

        if (desktopShell) {
          pendingAppRequests.splice(0).forEach(({ source, options }) => {
            desktopShell.openApp(source, options);
          });
        }

        recordFrameLoad();
      });

      bottomTaskbarFrame.addEventListener("load", () => {
        taskbarIsReady = true;
        sendTaskbarApps();
        sendTaskbarNickname();
        recordFrameLoad();
      });

      document.body.append(desktopFrame, bottomTaskbarFrame);
      window.setTaskbarPosition(indexSettings.taskbarPosition, false);
      window.setTimeout(revealOS, 2500);
    }

    window.addEventListener("message", (event) => {
      const message = event.data;
      if (!message || typeof message !== "object") return;

      if (
        event.source === bootScreenFrame.contentWindow &&
        message.type === "os:boot:dismiss"
      ) {
        dismissBootScreen();
        return;
      }

      if (
        event.source === nicknameScreenFrame.contentWindow &&
        message.type === "os:nickname:submit"
      ) {
        const nickname = normalizeNickname(message.nickname);
        if (!nickname) return;

        try {
          localStorage.setItem(deadOSnickname, nickname);
        } catch (error) {
          console.warn("deadOS nickname could not be saved.", error);
        }

        mountOS(nickname);
        return;
      }

      if (
        desktopFrame &&
        event.source === desktopFrame.contentWindow &&
        message.type === "os:taskbar:set-apps"
      ) {
        setTaskbarApps(message.apps ?? []);
      }

      if (
        bottomTaskbarFrame &&
        event.source === bottomTaskbarFrame.contentWindow &&
        message.type === "os:taskbar:toggle-app"
      ) {
        desktopFrame.contentWindow.desktopShell?.toggleWindow(message.id);
      }

      if (
        bottomTaskbarFrame &&
        event.source === bottomTaskbarFrame.contentWindow &&
        message.type === "os:taskbar:restore-app"
      ) {
        desktopFrame.contentWindow.desktopShell?.restoreWindow(message.id);
      }

      if (
        bottomTaskbarFrame &&
        event.source === bottomTaskbarFrame.contentWindow &&
        message.type === "os:taskbar:maximize-app"
      ) {
        desktopFrame.contentWindow.desktopShell?.maximizeWindow(message.id);
      }

      if (
        bottomTaskbarFrame &&
        event.source === bottomTaskbarFrame.contentWindow &&
        message.type === "os:taskbar:set-position"
      ) {
        window.setTaskbarPosition(message.position);
      }
    });

    function getSavedNickname() {
      try {
        return normalizeNickname(localStorage.getItem(deadOSnickname));
      } catch (error) {
        console.warn("deadOS nickname could not be loaded.", error);
        return "";
      }
    }

    const savedNickname = getSavedNickname();

    if (savedNickname) {
      bootScreenIsGone = true;
      bootScreenFrame.remove();
      nicknameScreenFrame.remove();
      mountOS(savedNickname);
    } else {
      bootScreenFrame.src = bootScreenFrame.dataset.src;
    }

    window.osShell = Object.freeze({
      get nickname() {
        return activeNickname;
      },
      get settings() {
        return { ...indexSettings };
      },
      setControlBar,
      setTaskbarApps,
      updateSettings: updateIndexSettings,
      showControlBar: setControlBar,
      hideControlBar: setControlBar,
      openApp(source, options = {}) {
        const desktopShell = desktopFrame?.contentWindow.desktopShell;

        if (!desktopShell) {
          pendingAppRequests.push({ source, options });
          return;
        }

        return desktopShell.openApp(source, options);
      },
      closeApp() {
        desktopFrame?.contentWindow.desktopShell?.closeApp();
      },
      activateAppWindow(id) {
        desktopFrame?.contentWindow.desktopShell?.activateWindow(id);
      },
      toggleAppWindow(id) {
        desktopFrame?.contentWindow.desktopShell?.toggleWindow(id);
      },
      minimizeAppWindow(id) {
        desktopFrame?.contentWindow.desktopShell?.minimizeWindow(id);
      },
      maximizeAppWindow(id) {
        desktopFrame?.contentWindow.desktopShell?.maximizeWindow(id);
      },
      restoreAppWindow(id) {
        desktopFrame?.contentWindow.desktopShell?.restoreWindow(id);
      },
      closeAppWindow(id) {
        desktopFrame?.contentWindow.desktopShell?.closeWindow(id);
      }
    });
  </script>
  <script src="/dead/scripts/page-transitions.js?v=20260809-8"></script>
</body>
</html>
