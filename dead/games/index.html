<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Games</title>
  <link rel="stylesheet" href="/dead/styles/orb-arranger.css?v=20260809-1">
  <style>
    :root{color-scheme:dark;--green:#72ff19;--magenta:#ff2bd6;--line:rgba(114,255,25,.32);--vortex-x:0px;--vortex-y:0px}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}body{color:var(--green);font-family:"Courier New",Courier,monospace}
    .portal{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#000}
    .starfield{position:absolute;inset:-3%;z-index:0;display:block;width:106%;height:106%;border:0;background:#000;transform:scale(1.04);transform-origin:center}
    .navigation{position:absolute;top:54%;left:50%;z-index:1;width:min(84vmin,760px);height:min(84vmin,760px);transform:translate(-50%,-50%);isolation:isolate}
    .compass{position:relative;display:grid;width:100%;height:100%;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);place-items:center}
    .portal-lines{position:absolute;inset:8%;z-index:-1;width:84%;height:84%;overflow:visible;pointer-events:none}.portal-lines line{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}.portal-open .portal-lines line{stroke:var(--magenta);stroke-width:3}
    .portal-button{position:relative;display:grid;width:min(22vmin,190px);aspect-ratio:1;place-items:center;overflow:hidden;border:2px solid var(--green);border-radius:50%;background:linear-gradient(rgba(0,0,0,.12),rgba(0,0,0,.12)),var(--portal-image) center/cover no-repeat;box-shadow:0 0 0 4px rgba(0,0,0,.85),0 0 0 5px rgba(114,255,25,.3),0 0 34px rgba(114,255,25,.2),inset 0 0 32px rgba(0,0,0,.45);color:var(--green);text-decoration:none;opacity:0;visibility:hidden;pointer-events:none;transform:scale(.05) rotate(540deg);transition:transform 900ms cubic-bezier(.12,.72,.18,1.12),opacity 500ms ease,color 160ms,border-color 160ms}
    .portal-button::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.3) 3px 4px),radial-gradient(circle,transparent 38%,rgba(0,0,0,.58) 100%)}
    .destination-label{position:relative;z-index:2;max-width:80%;padding:.35em .55em;background:rgba(0,0,0,.78);font-weight:900;font-size:clamp(8px,1.35vmin,14px);text-align:center;overflow-wrap:anywhere}
    .portal-open .portal-button{visibility:visible;pointer-events:auto;opacity:1;transform:scale(1) rotate(0)}.portal-open .portal-button.is-empty{pointer-events:none}
    .portal-button:hover,.portal-button:focus-visible{border-color:var(--magenta);color:#ff8deb;outline:2px solid #fff;outline-offset:6px;box-shadow:0 0 0 4px rgba(0,0,0,.85),0 0 0 5px rgba(255,43,214,.45),0 0 48px rgba(255,43,214,.42)}
    .northwest{grid-column:1;grid-row:1;--portal-image:url("/dead/games/thumbnails/shooter-game.png")}.north{grid-column:2;grid-row:1;--portal-image:url("/dead/games/thumbnails/inferno-trainer.png")}.northeast{grid-column:3;grid-row:1;--portal-image:url("/dead/games/thumbnails/tektite-3D-game.png")}.west{grid-column:1;grid-row:2;--portal-image:url("/dead/assets/images/static.gif")}.east{grid-column:3;grid-row:2;--portal-image:url("/dead/assets/images/static.gif")}.southwest{grid-column:1;grid-row:3;--portal-image:url("/dead/assets/images/static.gif")}.south{grid-column:2;grid-row:3;--portal-image:url("/dead/assets/images/static.gif")}.southeast{grid-column:3;grid-row:3;--portal-image:url("/dead/assets/images/static.gif")}
    .core{position:relative;grid-column:2;grid-row:2;display:grid;width:min(15vmin,125px);aspect-ratio:1;place-items:center;overflow:hidden;border:1px solid rgba(255,43,214,.7);border-radius:50%;padding:0;background:radial-gradient(circle,#000 0 34%,rgba(0,0,0,.78) 52%,transparent 72%);color:var(--green);cursor:pointer;font:900 clamp(18px,3vmin,30px)/1.05 "Courier New",Courier,monospace;letter-spacing:.04em;text-align:center;text-decoration:none;text-transform:uppercase;text-shadow:0 0 8px #000;outline:2px solid var(--green);outline-offset:6px;box-shadow:0 0 48px rgba(114,255,25,.46);transform:scale(3);transition:transform 700ms ease,color 160ms,outline-color 160ms,box-shadow 160ms}.portal-open .core{transform:scale(1.08)}.core:hover,.core:focus-visible{outline-color:var(--magenta);color:var(--magenta);box-shadow:0 0 64px rgba(255,43,214,.58)}
    .core-vortex{position:absolute;inset:-50%;z-index:-1;width:200%;height:200%;animation:spin 1.65s linear infinite}.vortex-tendril{fill:none;stroke-width:3.2;stroke-linecap:round;vector-effect:non-scaling-stroke;mix-blend-mode:screen}.vortex-red{stroke:#ff1744}.vortex-green{stroke:#42ff55}.vortex-blue{stroke:#18a8ff}@keyframes spin{to{transform:rotate(360deg)}}
    .topbar{position:absolute;top:0;left:0;right:0;z-index:2;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;height:54px;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
    .site-name,.page-title,.topbar-clock{color:var(--green);font:900 clamp(15px,1.65vw,21px)/.9 "Courier New",Courier,monospace;letter-spacing:-.075em;text-shadow:0 2px 8px #000,0 0 12px rgba(114,255,25,.38)}
    .site-name{grid-column:1;justify-self:start;display:inline-flex;align-items:center;gap:9px;white-space:nowrap;text-decoration:none}.site-name-icon{position:relative;display:block;width:34px;height:34px;flex:0 0 34px;overflow:hidden;border:1px solid rgba(114,255,25,.68);background:rgba(0,0,0,.78);font-size:0}.site-name-icon::before{content:"☠️";position:absolute;inset:0;display:grid;place-items:center;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;font-size:25px}.site-name-label,.page-title,.topbar-clock{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.18em}
    .page-title{grid-column:2;justify-self:center;display:inline-flex;align-items:center;gap:.4em;margin:0;font-style:normal}.topbar-clock{grid-column:3;justify-self:end;white-space:nowrap}
    .page-select{border:0;padding:0;background:transparent;color:inherit;font:inherit;letter-spacing:inherit;text-decoration:inherit;cursor:pointer}.page-select option{background:#000;color:var(--green);font-family:"Courier New",Courier,monospace;letter-spacing:0}.page-select:hover,.page-select:focus-visible{color:var(--magenta);outline:none}
    .site-name:visited{color:var(--green)}.site-name:hover,.site-name:focus-visible{color:var(--magenta);outline:none}
    .cursor-lens{position:fixed;top:0;left:0;z-index:3;width:50px;height:50px;border:3px solid #fff;border-radius:50%;background:rgba(255,255,255,.001);backdrop-filter:invert(1);opacity:0;pointer-events:none;transform:translate3d(-100px,-100px,0) translate(-50%,-50%);transition:opacity 80ms linear}.cursor-lens.is-visible{opacity:1}
    @media(max-width:520px){.navigation{top:55%;width:88vmin;height:88vmin}.portal-button{width:23vmin}.core{width:16vmin}.topbar{gap:10px;height:48px}.site-name,.page-title,.topbar-clock{font-size:clamp(13px,4vw,17px)}.site-name{gap:7px}.site-name-icon{width:30px;height:30px;flex-basis:30px}.site-name-icon::before{font-size:22px}}
  </style>
</head>
<body>
<main class="portal" data-transition-root>
  <iframe class="starfield" src="/dead/experiments/canvas-backgrounds/starfield-background.html?v=20260809-3" title="Animated starfield background"></iframe>
  <header class="topbar">
    <a class="site-name" href="/" aria-label="Return to Main Space"><span class="site-name-icon" aria-hidden="true">☠️</span><span class="site-name-label">theinternetisdead.org</span></a>
    <h1 class="page-title"><span>Games</span><button class="orb-edit-toggle" type="button" aria-label="Rearrange orbs" aria-pressed="false">✏️</button></h1>
    <div class="topbar-clock"><select class="page-select" id="game-page" aria-label="Game portal page"><option value="1">Page 1/1</option></select></div>
  </header>
  <nav class="navigation compass" aria-label="Games portal navigation" data-orb-arranger-key="theinternetisdead:games:orb-order" data-orb-arranger-scope-select="#game-page">
    <svg class="portal-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line x1="50" y1="50" x2="16.67" y2="16.67"/><line x1="50" y1="50" x2="50" y2="16.67"/><line x1="50" y1="50" x2="83.33" y2="16.67"/><line x1="50" y1="50" x2="16.67" y2="50"/><line x1="50" y1="50" x2="83.33" y2="50"/><line x1="50" y1="50" x2="16.67" y2="83.33"/><line x1="50" y1="50" x2="50" y2="83.33"/><line x1="50" y1="50" x2="83.33" y2="83.33"/></svg>
    <a class="portal-button northwest" href="/dead/games/shooter-game/" data-transition="slide-down-right"><span class="destination-label">Shooter Game</span></a>
    <a class="portal-button north" href="/dead/games/inferno-trainer/" data-transition="slide-down"><span class="destination-label">Inferno Trainer</span></a>
    <a class="portal-button northeast" href="/dead/games/tektite-3D-game/" data-transition="slide-down-left"><span class="destination-label">Tektite 3D Game</span></a>
    <span class="portal-button west is-empty"><span class="destination-label">Empty</span></span>
    <a class="core" id="open-portal" href="/portal/" data-transition="crt-collapse" aria-expanded="false"><svg class="core-vortex" viewBox="-110 -110 220 220" aria-hidden="true"><path class="vortex-tendril vortex-red"/><path class="vortex-tendril vortex-green"/><path class="vortex-tendril vortex-blue"/></svg><span class="core-label">Open<br>Portal</span></a>
    <span class="portal-button east is-empty"><span class="destination-label">Empty</span></span><span class="portal-button southwest is-empty"><span class="destination-label">Empty</span></span><span class="portal-button south is-empty"><span class="destination-label">Empty</span></span><span class="portal-button southeast is-empty"><span class="destination-label">Empty</span></span>
  </nav>
  <div class="cursor-lens" aria-hidden="true"></div>
</main>
<script>
  const compass=document.querySelector('.compass'),openPortal=document.getElementById('open-portal'),coreLabel=openPortal.querySelector('.core-label'),tendrils=document.querySelectorAll('.vortex-tendril');
  const makeSpiral=phase=>{const p=[];for(let s=0;s<=260;s++){const t=s/260,a=t*Math.PI*10+phase,r=4+t*98;p.push(`${s?'L':'M'}${(Math.cos(a)*r).toFixed(2)} ${(Math.sin(a)*r).toFixed(2)}`)}return p.join(' ')};tendrils.forEach((t,i)=>t.setAttribute('d',makeSpiral(i*Math.PI*2/tendrils.length)));
  const key='theinternetisdead:games:portal-open';const read=()=>{try{return localStorage.getItem(key)==='true'}catch(_){return false}};const set=open=>{compass.classList.toggle('portal-open',open);openPortal.setAttribute('aria-expanded',String(open));coreLabel.innerHTML=open?'Portal':'Open<br>Portal';try{localStorage.setItem(key,String(open))}catch(_){}};set(read());
  openPortal.addEventListener('click',e=>{if(!compass.classList.contains('portal-open')){e.preventDefault();set(true)}});
  document.addEventListener('click',e=>{const a=e.target.closest('a[data-transition]');if(!a)return;e.preventDefault();window.PageTransitions?window.PageTransitions.navigate(a.href,a.dataset.transition):location.assign(a.href)});
  const lens=document.querySelector('.cursor-lens');addEventListener('pointermove',e=>{lens.style.transform=`translate3d(${e.clientX}px,${e.clientY}px,0) translate(-50%,-50%)`;lens.classList.add('is-visible')},{passive:true});addEventListener('pointerleave',()=>lens.classList.remove('is-visible'));
</script>
<script src="/dead/scripts/orb-arranger.js?v=20260809-2"></script>
<script src="/dead/scripts/page-transitions.js?v=20260809-8"></script>
</body>
</html>
