<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>31×31 Three.js Noclip Grid</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.05,
      1000
    );
    camera.position.set(0, 8, 18);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const GRID_SIZE = 31;
    const HALF_GRID = GRID_SIZE / 2;

    const checkerCanvas = document.createElement("canvas");
    checkerCanvas.width = GRID_SIZE;
    checkerCanvas.height = GRID_SIZE;

    const ctx = checkerCanvas.getContext("2d");

    for (let z = 0; z < GRID_SIZE; z++) {
      for (let x = 0; x < GRID_SIZE; x++) {
        const isCenter = x === 15 && z === 15;

        if (isCenter) {
          ctx.fillStyle = "#ffffff";
        } else {
          ctx.fillStyle = (x + z) % 2 === 0 ? "#b8b8b8" : "#202020";
        }

        ctx.fillRect(x, z, 1, 1);
      }
    }

    const checkerTexture = new THREE.CanvasTexture(checkerCanvas);
    checkerTexture.colorSpace = THREE.SRGBColorSpace;
    checkerTexture.magFilter = THREE.NearestFilter;
    checkerTexture.minFilter = THREE.NearestFilter;
    checkerTexture.generateMipmaps = false;

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(GRID_SIZE, GRID_SIZE),
      new THREE.MeshBasicMaterial({
        map: checkerTexture,
        side: THREE.DoubleSide
      })
    );

    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const grid = new THREE.GridHelper(
      GRID_SIZE,
      GRID_SIZE,
      0x000000,
      0x000000
    );
    grid.position.y = 0.002;
    scene.add(grid);

    const keys = new Set();

    let yaw = 0;
    let pitch = -0.18;
    let isLooking = false;
    let lastMouseX = 0;
    let lastMouseY = 0;
    let moveSpeed = 9;

    function applyCameraRotation() {
      camera.rotation.order = "YXZ";
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;
      camera.rotation.z = 0;
    }

    applyCameraRotation();

    renderer.domElement.addEventListener("contextmenu", event => {
      event.preventDefault();
    });

    renderer.domElement.addEventListener("mousedown", event => {
      if (event.button !== 1) return;

      event.preventDefault();
      isLooking = true;
      lastMouseX = event.clientX;
      lastMouseY = event.clientY;
    });

    window.addEventListener("mouseup", event => {
      if (event.button === 1) {
        isLooking = false;
      }
    });

    window.addEventListener("mousemove", event => {
      if (!isLooking) return;

      const deltaX = event.clientX - lastMouseX;
      const deltaY = event.clientY - lastMouseY;

      lastMouseX = event.clientX;
      lastMouseY = event.clientY;

      yaw -= deltaX * 0.003;
      pitch -= deltaY * 0.003;

      pitch = THREE.MathUtils.clamp(
        pitch,
        -Math.PI / 2 + 0.01,
        Math.PI / 2 - 0.01
      );

      applyCameraRotation();
    });

    renderer.domElement.addEventListener(
      "wheel",
      event => {
        event.preventDefault();

        moveSpeed = THREE.MathUtils.clamp(
          moveSpeed * (event.deltaY > 0 ? 0.9 : 1.1),
          1,
          120
        );
      },
      { passive: false }
    );

    window.addEventListener("keydown", event => {
      keys.add(event.code);

      if (
        [
          "KeyW",
          "KeyA",
          "KeyS",
          "KeyD",
          "Space",
          "ShiftLeft",
          "ShiftRight",
          "ControlLeft",
          "ControlRight"
        ].includes(event.code)
      ) {
        event.preventDefault();
      }
    });

    window.addEventListener("keyup", event => {
      keys.delete(event.code);
    });

    window.addEventListener("blur", () => {
      keys.clear();
      isLooking = false;
    });

    const clock = new THREE.Clock();
    const forward = new THREE.Vector3();
    const right = new THREE.Vector3();
    const movement = new THREE.Vector3();
    const worldUp = new THREE.Vector3(0, 1, 0);

    function updateMovement(delta) {
      movement.set(0, 0, 0);

      camera.getWorldDirection(forward);
      forward.normalize();

      right.crossVectors(forward, worldUp).normalize();

      if (keys.has("KeyW")) movement.add(forward);
      if (keys.has("KeyS")) movement.sub(forward);
      if (keys.has("KeyD")) movement.add(right);
      if (keys.has("KeyA")) movement.sub(right);
      if (keys.has("Space")) movement.y += 1;
      if (keys.has("ShiftLeft") || keys.has("ShiftRight")) movement.y -= 1;

      if (movement.lengthSq() > 0) {
        movement.normalize();

        const boost =
          keys.has("ControlLeft") || keys.has("ControlRight")
            ? 3
            : 1;

        camera.position.addScaledVector(
          movement,
          moveSpeed * boost * delta
        );
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.05);
      updateMovement(delta);

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
  <script src="/dead/scripts/page-transitions.js?v=20260809-6"></script>
</body>
</html>
