<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>TheInternetIsDead.org - Games</title>
  <link rel="stylesheet" href="/dead/styles/bubble-grid.css?v=20260925-5">
  <script src="/dead/backgrounds/starfield-pointer-pass-through.js" defer></script>
</head>
<body>
  <main class="main-rectangle">
    <nav class="bubble-navigation bubble-compass" aria-label="Games navigation">
      <svg class="bubble-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line x1="50" y1="50" x2="16.67" y2="16.67"/><line x1="50" y1="50" x2="50" y2="16.67"/><line x1="50" y1="50" x2="83.33" y2="16.67"/><line x1="50" y1="50" x2="16.67" y2="50"/><line x1="50" y1="50" x2="83.33" y2="50"/><line x1="50" y1="50" x2="16.67" y2="83.33"/><line x1="50" y1="50" x2="50" y2="83.33"/><line x1="50" y1="50" x2="83.33" y2="83.33"/></svg>
      <a class="bubble northwest" href="/dead/games/shooter-game/" style="--bubble-image:url('/dead/games/thumbnails/shooter-game.png')"><span class="bubble-label">Shooter Game</span></a>
      <a class="bubble north" href="/dead/games/inferno-trainer/" style="--bubble-image:url('/dead/games/thumbnails/inferno-trainer.png')"><span class="bubble-label">Inferno Trainer</span></a>
      <a class="bubble northeast" href="/dead/games/tektite-3D-game/" style="--bubble-image:url('/dead/games/thumbnails/tektite-3D-game.png')"><span class="bubble-label">Tektite 3D Game</span></a>
      <span class="bubble west is-empty"><span class="bubble-label">Empty</span></span>
      <button class="bubble-core" id="random-game" type="button" aria-label="Open a random game"><svg class="core-vortex" viewBox="-110 -110 220 220" aria-hidden="true"><path class="vortex-tendril vortex-red"></path><path class="vortex-tendril vortex-green"></path><path class="vortex-tendril vortex-blue"></path></svg><span class="core-label">RANDOM</span></button>
      <span class="bubble east is-empty"><span class="bubble-label">Empty</span></span>
      <span class="bubble southwest is-empty"><span class="bubble-label">Empty</span></span>
      <span class="bubble south is-empty"><span class="bubble-label">Empty</span></span>
      <span class="bubble southeast is-empty"><span class="bubble-label">Empty</span></span>
    </nav>
  </main>
  <script>
    const navigateThroughShell=path=>{
      if(window.parent===window)window.location.assign(path);
      else window.parent.postMessage({type:'portal-shell-route',path},window.location.origin);
    };
    const gameLinks=[...document.querySelectorAll('.bubble[href]')];
    gameLinks.forEach(link=>link.addEventListener('click',event=>{
      if(event.shiftKey&&event.button===0){
        event.preventDefault();
        const standaloneUrl=new URL(link.href);
        standaloneUrl.searchParams.set('standalone','true');
        const standaloneTab=document.createElement('a');
        standaloneTab.href=standaloneUrl.href;
        standaloneTab.target='_blank';
        standaloneTab.rel='noopener';
        document.body.appendChild(standaloneTab);
        standaloneTab.click();
        standaloneTab.remove();
        return;
      }
      if(event.button!==0||event.metaKey||event.ctrlKey||event.altKey)return;
      event.preventDefault();
      navigateThroughShell(link.getAttribute('href'));
    }));
    document.getElementById('random-game').addEventListener('click',()=>{
      const destination=gameLinks[Math.floor(Math.random()*gameLinks.length)];
      if(destination)navigateThroughShell(destination.getAttribute('href'));
    });
    let vortexPointerFrame=0,vortexPointerX=0,vortexPointerY=0;
    const publishVortexPointer=()=>{vortexPointerFrame=0;document.documentElement.style.setProperty('--vortex-x',`${vortexPointerX*15}px`);document.documentElement.style.setProperty('--vortex-y',`${vortexPointerY*15}px`)};
    const updateVortexPointer=event=>{vortexPointerX=Math.max(-1,Math.min(1,event.clientX/window.innerWidth*2-1));vortexPointerY=Math.max(-1,Math.min(1,event.clientY/window.innerHeight*2-1));if(!vortexPointerFrame)vortexPointerFrame=requestAnimationFrame(publishVortexPointer)};
    window.addEventListener('pointermove',updateVortexPointer,{passive:true});
    window.addEventListener('pointerdown',updateVortexPointer,{passive:true});
    window.addEventListener('pointerout',event=>{if(event.relatedTarget)return;vortexPointerX=0;vortexPointerY=0;if(!vortexPointerFrame)vortexPointerFrame=requestAnimationFrame(publishVortexPointer)},{passive:true});
    const tendrils=document.querySelectorAll('.vortex-tendril');
    const makeSpiral=phase=>{const points=[];for(let step=0;step<=260;step++){const progress=step/260,angle=progress*Math.PI*6+phase,radius=4+progress*98;points.push(`${step?'L':'M'}${(Math.cos(angle)*radius).toFixed(2)} ${(Math.sin(angle)*radius).toFixed(2)}`)}return points.join(' ')};
    tendrils.forEach((tendril,index)=>tendril.setAttribute('d',makeSpiral(index*Math.PI*2/tendrils.length)));
  </script>
</body>
</html>
