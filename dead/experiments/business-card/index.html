<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>360° Business Card</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at center, #28133b 0%, #100818 45%, #030205 100%);
      font-family: Arial, Helvetica, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }

    canvas:active {
      cursor: grabbing;
    }

    .card-rotation-controls {
      position: fixed;
      inset: 0;
      z-index: 9;
      pointer-events: none;
    }

    .card-rotation-button {
      position: fixed;
      display: grid;
      place-items: center;
      width: clamp(46px, 7vw, 86px);
      height: clamp(46px, 7vw, 86px);
      padding: 0;
      border: 2px solid rgba(0, 255, 0, 0.62);
      background: rgba(0, 0, 0, 0.36);
      color: rgba(0, 255, 0, 0.82);
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(28px, 5.6vw, 62px);
      font-weight: 700;
      line-height: 1;
      text-shadow: 0 0 12px rgba(0, 255, 0, 0.86);
      pointer-events: auto;
      user-select: none;
      touch-action: none;
      cursor: pointer;
      opacity: 0.58;
    }

    .card-rotation-button:hover,
    .card-rotation-button:focus-visible,
    .card-rotation-button.is-active {
      background: rgba(0, 0, 0, 0.62);
      border-color: rgba(0, 255, 0, 0.96);
      color: #00ff00;
      opacity: 0.9;
      outline: 0;
    }

    .card-rotation-button-up {
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
    }

    .card-rotation-button-down {
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
    }

    .card-rotation-button-left {
      top: 50%;
      left: 10px;
      transform: translateY(-50%);
    }

    .card-rotation-button-right {
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
    }

    #status {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      max-width: calc(100vw - 32px);
      padding: 9px 13px;
      border: 1px solid rgba(194, 255, 92, 0.5);
      border-radius: 999px;
      background: rgba(8, 4, 13, 0.82);
      color: #c2ff5c;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-align: center;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }

  </style>
</head>

<body>
  <div id="status">Loading front.png and back.png…</div>
  <div class="card-rotation-controls" aria-label="Card rotation controls">
    <button class="card-rotation-button card-rotation-button-up" type="button" data-card-rotate="up" aria-label="Rotate card up">↑</button>
    <button class="card-rotation-button card-rotation-button-down" type="button" data-card-rotate="down" aria-label="Rotate card down">↓</button>
    <button class="card-rotation-button card-rotation-button-left" type="button" data-card-rotate="left" aria-label="Rotate card left">←</button>
    <button class="card-rotation-button card-rotation-button-right" type="button" data-card-rotate="right" aria-label="Rotate card right">→</button>
  </div>

  <!-- Classic scripts work when index.html is opened directly from a folder. -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    (function () {
      const status = document.getElementById("status");
      const cardRotationButtons = Array.from(
        document.querySelectorAll("[data-card-rotate]")
      );
      const activeCardRotationControls = new Set();

      if (!window.THREE) {
        status.textContent =
          "Three.js failed to load. Check your internet connection or CDN blocking.";
        status.style.color = "#ff8080";
        return;
      }

      const scene = new THREE.Scene();

      const camera = new THREE.PerspectiveCamera(
        35,
        window.innerWidth / window.innerHeight,
        0.1,
        100
      );

      camera.position.set(0, 0.1, 6.375);

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false,
        powerPreference: "high-performance",
        stencil: false
      });

      function getTargetPixelRatio() {
        const devicePixelRatio = window.devicePixelRatio || 1;
        const lowMemoryDevice = navigator.deviceMemory && navigator.deviceMemory <= 4;
        const compactScreen = Math.min(window.innerWidth, window.innerHeight) < 700;
        const ratioCap = lowMemoryDevice ? 1 : compactScreen ? 1.25 : 1.5;
        return Math.min(devicePixelRatio, ratioCap);
      }

      renderer.setPixelRatio(getTargetPixelRatio());
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.autoClear = false;
      document.body.appendChild(renderer.domElement);
      renderer.domElement.setAttribute(
        "aria-label",
        "Interactive 3D business card. Click the card to hear a message."
      );

      const backgroundScene = new THREE.Scene();
      const backgroundCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const backgroundResolution = new THREE.Vector2();
      const backgroundUniforms = {
        uTime: { value: 0 },
        uFrontTexture: { value: null },
        uBackTexture: { value: null },
        uCardNormal: { value: new THREE.Vector3(0, 0, 1) },
        uCameraRight: { value: new THREE.Vector3(1, 0, 0) },
        uCameraUp: { value: new THREE.Vector3(0, 1, 0) },
        uCameraForward: { value: new THREE.Vector3(0, 0, -1) },
        uTanHalfFov: { value: Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) },
        uResolution: { value: new THREE.Vector2(1, 1) }
      };

      const backgroundMaterial = new THREE.ShaderMaterial({
        uniforms: backgroundUniforms,
        depthTest: false,
        depthWrite: false,
        vertexShader: [
          "varying vec2 vUv;",
          "void main() {",
          "  vUv = uv;",
          "  gl_Position = vec4(position.xy, 0.0, 1.0);",
          "}"
        ].join("\n"),
        fragmentShader: [
          "precision mediump float;",
          "uniform float uTime;",
          "uniform sampler2D uFrontTexture;",
          "uniform sampler2D uBackTexture;",
          "uniform vec3 uCardNormal;",
          "uniform vec3 uCameraRight;",
          "uniform vec3 uCameraUp;",
          "uniform vec3 uCameraForward;",
          "uniform float uTanHalfFov;",
          "uniform vec2 uResolution;",
          "varying vec2 vUv;",
          "float hash(vec2 p) {",
          "  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);",
          "}",
          "void main() {",
          "  vec2 p = vUv * 2.0 - 1.0;",
          "  p.x *= uResolution.x / max(uResolution.y, 1.0);",
          "  float radius = length(p);",
          "  vec3 worldRay = normalize(",
          "    uCameraForward +",
          "    uCameraRight * p.x * uTanHalfFov +",
          "    uCameraUp * p.y * uTanHalfFov",
          "  );",
          "  vec3 cardNormal = normalize(uCardNormal);",
          "  vec3 referenceUp = abs(cardNormal.y) < 0.92",
          "    ? vec3(0.0, 1.0, 0.0)",
          "    : vec3(1.0, 0.0, 0.0);",
          "  vec3 cardTangent = normalize(cross(referenceUp, cardNormal));",
          "  vec3 cardBitangent = normalize(cross(cardNormal, cardTangent));",
          "  float localX = dot(worldRay, cardTangent);",
          "  float localY = clamp(dot(worldRay, cardBitangent), -1.0, 1.0);",
          "  float hemisphere = dot(worldRay, cardNormal);",
          "  float foldedDepth = max(abs(hemisphere), 0.0001);",
          "  const float PI = 3.14159265359;",
          "  vec2 frontUv = vec2(",
          "    atan(localX, foldedDepth) / PI + 0.5,",
          "    asin(localY) / PI + 0.5",
          "  );",
          "  vec2 backUv = vec2(",
          "    atan(-localX, foldedDepth) / PI + 0.5,",
          "    asin(localY) / PI + 0.5",
          "  );",
          "  float seamSoftness = 1.0 - smoothstep(0.0, 0.20, abs(hemisphere));",
          "  vec2 frontSeamUv = vec2(mix(frontUv.x, 0.5, 0.045), frontUv.y);",
          "  vec2 backSeamUv = vec2(mix(backUv.x, 0.5, 0.045), backUv.y);",
          "  vec3 frontMapped = texture2D(uFrontTexture, frontUv).rgb;",
          "  vec3 backMapped = texture2D(uBackTexture, backUv).rgb;",
          "  vec3 frontFiltered = texture2D(uFrontTexture, frontSeamUv).rgb * 0.50;",
          "  frontFiltered += texture2D(uFrontTexture, frontSeamUv + vec2(0.0, 0.012)).rgb * 0.25;",
          "  frontFiltered += texture2D(uFrontTexture, frontSeamUv - vec2(0.0, 0.012)).rgb * 0.25;",
          "  vec3 backFiltered = texture2D(uBackTexture, backSeamUv).rgb * 0.50;",
          "  backFiltered += texture2D(uBackTexture, backSeamUv + vec2(0.0, 0.012)).rgb * 0.25;",
          "  backFiltered += texture2D(uBackTexture, backSeamUv - vec2(0.0, 0.012)).rgb * 0.25;",
          "  frontMapped = mix(frontMapped, frontFiltered, seamSoftness * 0.72);",
          "  backMapped = mix(backMapped, backFiltered, seamSoftness * 0.72);",
          "  float hemisphereMix = smoothstep(-0.13, 0.13, hemisphere);",
          "  vec3 hemisphereTexture = mix(backMapped, frontMapped, hemisphereMix);",
          "  float pulse = 0.5 + 0.5 * sin(uTime * 0.32 + radius * 2.8);",
          "  float scan = 0.5 + 0.5 * sin(vUv.y * uResolution.y * 0.42);",
          "  float band = step(0.94, hash(vec2(floor(vUv.y * 44.0), floor(uTime * 7.0))));",
          "  float grain = hash(gl_FragCoord.xy + floor(uTime * 12.0));",
          "  vec3 emission = hemisphereTexture * (0.92 + pulse * 0.08);",
          "  vec3 seamAverage = (frontFiltered + backFiltered) * 0.5;",
          "  emission = mix(emission, seamAverage, seamSoftness * 0.18);",
          "  float angularScatter = 0.82 + 0.18 * sin(",
          "    atan(worldRay.y, worldRay.x) * 9.0 + uTime * 0.08",
          "  );",
          "  vec3 color = vec3(0.003, 0.002, 0.007);",
          "  color += emission * (0.82 + pulse * 0.10) * angularScatter;",
          "  color += emission * band * 0.09;",
          "  color *= 0.94 + scan * 0.06;",
          "  color += (grain - 0.5) * 0.018;",
          "  color *= 0.78 + 0.22 * (1.0 - smoothstep(0.42, 1.85, radius));",
          "  gl_FragColor = vec4(max(color, 0.0), 1.0);",
          "}"
        ].join("\n")
      });

      const backgroundQuad = new THREE.Mesh(
        new THREE.PlaneGeometry(2, 2),
        backgroundMaterial
      );
      backgroundQuad.frustumCulled = false;
      backgroundScene.add(backgroundQuad);

      function updateBackgroundResolution() {
        renderer.getDrawingBufferSize(backgroundResolution);
        backgroundUniforms.uResolution.value.copy(backgroundResolution);
      }

      updateBackgroundResolution();

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.065;
      controls.enablePan = false;
      controls.minDistance = 4.0;
      controls.maxDistance = 11;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 3.6;
      controls.target.set(0, 0, 0);

      const card = new THREE.Group();
      scene.add(card);

      const CARD_WIDTH = 3.5;
      const CARD_HEIGHT = 2.0;
      const CARD_DEPTH = 0.04;

      let loadedCount = 0;
      let failed = false;

      function updateStatus() {
        if (failed) return;

        loadedCount += 1;

        if (loadedCount === 2) {
          status.textContent = "front.png + back.png loaded";
          setTimeout(function () {
            status.style.opacity = "0";
            status.style.transition = "opacity 500ms ease";
          }, 1200);
        }
      }

      function textureError(filename) {
        failed = true;
        status.textContent =
          "Could not load " + filename +
          ". Confirm the spelling is exact and all three files are together.";
        status.style.color = "#ff8080";
      }

      function prepareTexture(texture) {
        texture.encoding = THREE.sRGBEncoding;
        texture.anisotropy = Math.min(renderer.capabilities.getMaxAnisotropy(), 8);
        texture.wrapS = THREE.ClampToEdgeWrapping;
        texture.wrapT = THREE.ClampToEdgeWrapping;
        texture.minFilter = THREE.LinearMipmapLinearFilter;
        texture.magFilter = THREE.LinearFilter;

        /*
          Source image: 3.75 × 2.25
          Visible centered crop: 3.5 × 2.0
        */
        texture.repeat.set(3.5 / 3.75, 2.0 / 2.25);
        texture.offset.set(
          (1 - texture.repeat.x) / 2,
          (1 - texture.repeat.y) / 2
        );

        return texture;
      }

      const loader = new THREE.TextureLoader();

      const frontTexture = prepareTexture(
        loader.load(
          "front.png",
          updateStatus,
          undefined,
          function () {
            textureError("front.png");
          }
        )
      );

      const backTexture = prepareTexture(
        loader.load(
          "back.png",
          updateStatus,
          undefined,
          function () {
            textureError("back.png");
          }
        )
      );

      backgroundUniforms.uFrontTexture.value = frontTexture;
      backgroundUniforms.uBackTexture.value = backTexture;

      const edgeMaterial = new THREE.MeshStandardMaterial({
        color: 0x17101d,
        roughness: 0.76,
        metalness: 0.08
      });

      const slab = new THREE.Mesh(
        new THREE.BoxGeometry(CARD_WIDTH, CARD_HEIGHT, CARD_DEPTH),
        edgeMaterial
      );

      card.add(slab);

      const faceGeometry = new THREE.PlaneGeometry(CARD_WIDTH, CARD_HEIGHT);

      const frontFace = new THREE.Mesh(
        faceGeometry,
        new THREE.MeshStandardMaterial({
          map: frontTexture,
          color: 0x000000,
          emissive: 0xffffff,
          emissiveMap: frontTexture,
          emissiveIntensity: 1.35,
          roughness: 0.72,
          metalness: 0,
          side: THREE.FrontSide
        })
      );

      frontFace.position.z = CARD_DEPTH / 2 + 0.001;
      card.add(frontFace);

      const backFace = new THREE.Mesh(
        faceGeometry,
        new THREE.MeshStandardMaterial({
          map: backTexture,
          color: 0x000000,
          emissive: 0xffffff,
          emissiveMap: backTexture,
          emissiveIntensity: 1.35,
          roughness: 0.72,
          metalness: 0,
          side: THREE.FrontSide
        })
      );

      backFace.position.z = -(CARD_DEPTH / 2 + 0.001);
      backFace.rotation.y = Math.PI;
      card.add(backFace);

      const cardRaycaster = new THREE.Raycaster();
      const cardPointer = new THREE.Vector2();
      const pointerDownPosition = new THREE.Vector2();
      const pointerUpPosition = new THREE.Vector2();
      const projectedCardCenter = new THREE.Vector3();
      let microsoftDavidVoice = null;
      let nextCardMessageIndex = 0;
      let cardSpinVelocity = 0;
      let cardNudgeOffset = 0;
      let cardNudgeVelocity = 0;

      function updateMicrosoftDavidVoice() {
        if (!window.speechSynthesis) return;

        const voices = window.speechSynthesis.getVoices();
        microsoftDavidVoice = voices.find(function (voice) {
          return voice.name.toLowerCase().includes("microsoft david");
        }) || voices.find(function (voice) {
          return voice.name.toLowerCase().includes("david");
        }) || null;
      }

      updateMicrosoftDavidVoice();
      if (window.speechSynthesis) {
        window.speechSynthesis.addEventListener(
          "voiceschanged",
          updateMicrosoftDavidVoice
        );
      }

      function pointerIntersectsCard(clientX, clientY) {
        const bounds = renderer.domElement.getBoundingClientRect();
        cardPointer.set(
          ((clientX - bounds.left) / bounds.width) * 2 - 1,
          -((clientY - bounds.top) / bounds.height) * 2 + 1
        );
        cardRaycaster.setFromCamera(cardPointer, camera);
        return cardRaycaster.intersectObject(card, true).length > 0;
      }

      function getCardFaceIntersection(clientX, clientY) {
        const bounds = renderer.domElement.getBoundingClientRect();
        cardPointer.set(
          ((clientX - bounds.left) / bounds.width) * 2 - 1,
          -((clientY - bounds.top) / bounds.height) * 2 + 1
        );
        cardRaycaster.setFromCamera(cardPointer, camera);
        return cardRaycaster.intersectObjects([frontFace, backFace], false)[0] || null;
      }

      function kickCardFromEdge(clientX, intersection) {
        if (!intersection || !intersection.uv) return false;

        const edgeUv = intersection.uv.x;
        if (edgeUv > 0.05 && edgeUv < 0.95) return false;

        const bounds = renderer.domElement.getBoundingClientRect();
        projectedCardCenter.setFromMatrixPosition(card.matrixWorld).project(camera);
        const cardCenterX = bounds.left + (projectedCardCenter.x + 1) * 0.5 * bounds.width;
        const direction = clientX < cardCenterX ? -1 : 1;

        cardSpinVelocity += direction * 8.5;
        cardNudgeVelocity += direction * 0.62;
        controls.autoRotate = false;
        cancelAutoOrbitResume();
        scheduleAutoOrbitResume();
        return true;
      }

      function speakCardMessage() {
        if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) return;

        updateMicrosoftDavidVoice();
        window.speechSynthesis.cancel();

        const isPaidLine = nextCardMessageIndex === 1;
        const message = new SpeechSynthesisUtterance(
          isPaidLine ? "Yep, I paid for that." : "Yep, I made that."
        );
        nextCardMessageIndex = (nextCardMessageIndex + 1) % 2;

        if (microsoftDavidVoice) {
          message.voice = microsoftDavidVoice;
        }
        message.pitch = isPaidLine ? 0.82 : 1;
        message.rate = isPaidLine ? 0.96 : 1;

        window.speechSynthesis.speak(message);
      }

      renderer.domElement.addEventListener("pointermove", function (event) {
        renderer.domElement.style.cursor = pointerIntersectsCard(
          event.clientX,
          event.clientY
        ) ? "pointer" : "";
      });

      renderer.domElement.addEventListener("pointerleave", function () {
        renderer.domElement.style.cursor = "";
      });

      renderer.domElement.addEventListener("pointerdown", function (event) {
        pointerDownPosition.set(event.clientX, event.clientY);
      });

      renderer.domElement.addEventListener("click", function (event) {
        pointerUpPosition.set(event.clientX, event.clientY);
        const movement = pointerDownPosition.distanceTo(pointerUpPosition);

        if (movement > 6) return;
        if (!pointerIntersectsCard(event.clientX, event.clientY)) return;
        const faceIntersection = getCardFaceIntersection(
          event.clientX,
          event.clientY
        );
        if (kickCardFromEdge(event.clientX, faceIntersection)) return;
        speakCardMessage();
      });

      scene.add(new THREE.AmbientLight(0xffffff, 1.7));

      const keyLight = new THREE.DirectionalLight(0xd9b8ff, 1.9);
      keyLight.position.set(3, 4, 5);
      scene.add(keyLight);

      const rimLight = new THREE.DirectionalLight(0xc2ff5c, 1.1);
      rimLight.position.set(-4, -2, -3);
      scene.add(rimLight);

      card.rotation.x = THREE.MathUtils.degToRad(-5);
      card.rotation.y = THREE.MathUtils.degToRad(-18);

      let autoOrbitResumeTimer = 0;
      let autoOrbitResumeDeadline = 0;
      let pausedAutoOrbitResumeDelay = 0;
      let movementFrozen = false;

      document.addEventListener("keydown", function (event) {
        if (event.code !== "Space" || event.repeat) return;
        event.preventDefault();

        movementFrozen = !movementFrozen;
        controls.enabled = !movementFrozen;

        if (movementFrozen && autoOrbitResumeTimer) {
          pausedAutoOrbitResumeDelay = Math.max(
            0,
            autoOrbitResumeDeadline - performance.now()
          );
          clearTimeout(autoOrbitResumeTimer);
          autoOrbitResumeTimer = 0;
          autoOrbitResumeDeadline = 0;
          return;
        }

        if (!movementFrozen && pausedAutoOrbitResumeDelay > 0) {
          const remainingDelay = pausedAutoOrbitResumeDelay;
          pausedAutoOrbitResumeDelay = 0;
          scheduleAutoOrbitResume(remainingDelay);
        }
      });

      function cancelAutoOrbitResume() {
        if (autoOrbitResumeTimer) {
          clearTimeout(autoOrbitResumeTimer);
        }
        autoOrbitResumeTimer = 0;
        autoOrbitResumeDeadline = 0;
        pausedAutoOrbitResumeDelay = 0;
      }

      function scheduleAutoOrbitResume(delay) {
        cancelAutoOrbitResume();
        if (activeCardRotationControls.size) return;

        const resumeDelay = typeof delay === "number" ? delay : 5000;
        if (movementFrozen) {
          pausedAutoOrbitResumeDelay = resumeDelay;
          return;
        }

        autoOrbitResumeDeadline = performance.now() + resumeDelay;
        autoOrbitResumeTimer = window.setTimeout(function () {
          autoOrbitResumeTimer = 0;
          autoOrbitResumeDeadline = 0;
          if (!activeCardRotationControls.size) {
            controls.autoRotate = true;
          }
        }, resumeDelay);
      }

      function setCardRotationControl(button, isActive) {
        const direction = String(
          (button && button.dataset.cardRotate) || ""
        ).trim();

        if (!direction) return;

        button.classList.toggle("is-active", isActive);

        if (isActive) {
          cancelAutoOrbitResume();
          controls.autoRotate = false;
          activeCardRotationControls.add(direction);
          return;
        }

        activeCardRotationControls.delete(direction);
        scheduleAutoOrbitResume();
      }

      function clearCardRotationControls() {
        activeCardRotationControls.clear();
        cardRotationButtons.forEach(function (button) {
          button.classList.remove("is-active");
        });
        scheduleAutoOrbitResume();
      }

      cardRotationButtons.forEach(function (button) {
        button.addEventListener("pointerdown", function (event) {
          event.preventDefault();
          button.setPointerCapture(event.pointerId);
          setCardRotationControl(button, true);
        });

        button.addEventListener("pointerup", function (event) {
          event.preventDefault();
          setCardRotationControl(button, false);
        });

        button.addEventListener("pointercancel", function () {
          setCardRotationControl(button, false);
        });

        button.addEventListener("lostpointercapture", function () {
          setCardRotationControl(button, false);
        });
      });

      window.addEventListener("blur", clearCardRotationControls);

      let previousFrameTime = performance.now();
      let animationFrameId = 0;
      let sceneTime = 0;
      const cardFrontNormal = new THREE.Vector3();
      const cardWorldQuaternion = new THREE.Quaternion();
      const cameraRight = new THREE.Vector3();
      const cameraUp = new THREE.Vector3();
      const cameraForward = new THREE.Vector3();

      function animate(frameTime) {
        animationFrameId = requestAnimationFrame(animate);

        const deltaSeconds = Math.min(
          0.05,
          (frameTime - previousFrameTime) / 1000
        );
        previousFrameTime = frameTime;

        if (!movementFrozen) {
          const controlRotateAmount = 1.65 * deltaSeconds;
          if (activeCardRotationControls.has("up")) {
            card.rotation.x -= controlRotateAmount;
          }
          if (activeCardRotationControls.has("down")) {
            card.rotation.x += controlRotateAmount;
          }
          if (activeCardRotationControls.has("left")) {
            card.rotation.y -= controlRotateAmount;
          }
          if (activeCardRotationControls.has("right")) {
            card.rotation.y += controlRotateAmount;
          }

          card.rotation.y += cardSpinVelocity * deltaSeconds;
          cardSpinVelocity *= Math.exp(-1.05 * deltaSeconds);

          const nudgeAcceleration =
            -cardNudgeOffset * 20 - cardNudgeVelocity * 7.5;
          cardNudgeVelocity += nudgeAcceleration * deltaSeconds;
          cardNudgeOffset += cardNudgeVelocity * deltaSeconds;

          controls.update();

          sceneTime += deltaSeconds;
          card.position.x = cardNudgeOffset;
          card.position.y = Math.sin(sceneTime * 0.8) * 0.045;

          card.getWorldQuaternion(cardWorldQuaternion);
          cardFrontNormal.set(0, 0, 1).applyQuaternion(cardWorldQuaternion);

          camera.updateMatrixWorld();
          cameraRight.setFromMatrixColumn(camera.matrixWorld, 0).normalize();
          cameraUp.setFromMatrixColumn(camera.matrixWorld, 1).normalize();
          camera.getWorldDirection(cameraForward);
          backgroundUniforms.uCardNormal.value.copy(cardFrontNormal);
          backgroundUniforms.uCameraRight.value.copy(cameraRight);
          backgroundUniforms.uCameraUp.value.copy(cameraUp);
          backgroundUniforms.uCameraForward.value.copy(cameraForward);
          backgroundUniforms.uTime.value = sceneTime;

        renderer.clear();
        renderer.render(backgroundScene, backgroundCamera);
        renderer.clearDepth();
        renderer.render(scene, camera);

      function startAnimation() {
        if (animationFrameId || document.hidden) return;
        previousFrameTime = performance.now();
        animationFrameId = requestAnimationFrame(animate);
      }

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) {
          cancelAnimationFrame(animationFrameId);
          animationFrameId = 0;

        startAnimation();

      startAnimation();

      window.addEventListener("resize", function () {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setPixelRatio(getTargetPixelRatio());
        renderer.setSize(window.innerWidth, window.innerHeight);
        updateBackgroundResolution();
