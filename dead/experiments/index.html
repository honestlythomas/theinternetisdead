  <style>
    :root{color-scheme:dark;--green:#72ff19;--magenta:#ff2bd6;--line:rgba(114,255,25,.32)}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}body{color:var(--green);font-family:"Courier New",Courier,monospace}.portal{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#000}.starfield{position:absolute;inset:-3%;z-index:0;width:106%;height:106%;border:0;background:#000;transform:scale(1.04)}
    .navigation{position:absolute;top:54%;left:50%;z-index:1;width:min(84vmin,760px);height:min(84vmin,760px);transform:translate(-50%,-50%);isolation:isolate}.compass{position:relative;display:grid;width:100%;height:100%;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);place-items:center}.portal-lines{position:absolute;inset:8%;z-index:-1;width:84%;height:84%;overflow:visible;pointer-events:none}.portal-lines line{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}.portal-open .portal-lines line{stroke:var(--magenta);stroke-width:3}
    .portal-button{position:relative;display:grid;width:min(22vmin,190px);aspect-ratio:1;place-items:center;overflow:hidden;border:2px solid var(--green);border-radius:50%;background:linear-gradient(rgba(0,0,0,.12),rgba(0,0,0,.12)),var(--portal-image) center/cover no-repeat;box-shadow:0 0 0 4px rgba(0,0,0,.85),0 0 0 5px rgba(114,255,25,.3),0 0 34px rgba(114,255,25,.2),inset 0 0 32px rgba(0,0,0,.45);color:var(--green);text-decoration:none;opacity:0;visibility:hidden;pointer-events:none;transform:scale(.05) rotate(540deg);transition:transform 900ms cubic-bezier(.12,.72,.18,1.12),opacity 500ms ease,color 160ms,border-color 160ms}.portal-button::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.3) 3px 4px),radial-gradient(circle,transparent 38%,rgba(0,0,0,.58) 100%)}.destination-label{position:relative;z-index:2;max-width:80%;padding:.35em .55em;background:rgba(0,0,0,.78);font-weight:900;font-size:clamp(8px,1.35vmin,14px);text-align:center;overflow-wrap:anywhere}.portal-open .portal-button{visibility:visible;pointer-events:auto;opacity:1;transform:scale(1) rotate(0)}.portal-open .portal-button.is-empty{pointer-events:none}.portal-button:hover,.portal-button:focus-visible{border-color:var(--magenta);color:#ff8deb;outline:2px solid #fff;outline-offset:6px;box-shadow:0 0 0 4px rgba(0,0,0,.85),0 0 0 5px rgba(255,43,214,.45),0 0 48px rgba(255,43,214,.42)}
    .northwest{grid-column:1;grid-row:1}.north{grid-column:2;grid-row:1}.northeast{grid-column:3;grid-row:1}.west{grid-column:1;grid-row:2}.east{grid-column:3;grid-row:2}.southwest{grid-column:1;grid-row:3}.south{grid-column:2;grid-row:3}.southeast{grid-column:3;grid-row:3}
    .core{position:relative;grid-column:2;grid-row:2;display:grid;width:min(15vmin,125px);aspect-ratio:1;place-items:center;overflow:hidden;border:1px solid rgba(255,43,214,.7);border-radius:50%;padding:0;background:radial-gradient(circle,#000 0 34%,rgba(0,0,0,.78) 52%,transparent 72%);color:var(--green);cursor:pointer;font:900 clamp(18px,3vmin,30px)/1.05 "Courier New",Courier,monospace;letter-spacing:.04em;text-align:center;text-decoration:none;text-transform:uppercase;text-shadow:0 0 8px #000;outline:2px solid var(--green);outline-offset:6px;box-shadow:0 0 48px rgba(114,255,25,.46);transform:scale(3);transition:transform 700ms ease,color 160ms,outline-color 160ms,box-shadow 160ms}.portal-open .core{transform:scale(1.08)}.core:hover,.core:focus-visible{outline-color:var(--magenta);color:var(--magenta);box-shadow:0 0 64px rgba(255,43,214,.58)}.core-vortex{position:absolute;inset:-50%;z-index:-1;width:200%;height:200%;animation:spin 1.65s linear infinite}.vortex-tendril{fill:none;stroke-width:3.2;stroke-linecap:round;vector-effect:non-scaling-stroke;mix-blend-mode:screen}.vortex-red{stroke:#ff1744}.vortex-green{stroke:#42ff55}.vortex-blue{stroke:#18a8ff}@keyframes spin{to{transform:rotate(360deg)}}
    .topbar{position:absolute;top:0;left:0;right:0;z-index:2;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;height:54px;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}.site-name,.page-title,.topbar-clock{color:var(--green);font:900 clamp(15px,1.65vw,21px)/.9 "Courier New",Courier,monospace;letter-spacing:-.075em;text-shadow:0 2px 8px #000,0 0 12px rgba(114,255,25,.38)}.site-name{grid-column:1;justify-self:start;display:inline-flex;align-items:center;gap:9px;white-space:nowrap;text-decoration:none}.site-name-icon{position:relative;display:block;width:34px;height:34px;flex:0 0 34px;overflow:hidden;border:1px solid rgba(114,255,25,.68);background:rgba(0,0,0,.78);font-size:0}.site-name-icon::before{content:"☠️";position:absolute;inset:0;display:grid;place-items:center;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;font-size:25px}.site-name-label,.page-title,.topbar-clock{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.18em}.page-title{grid-column:2;justify-self:center;display:inline-flex;align-items:center;gap:.4em;margin:0}.topbar-clock{grid-column:3;justify-self:end;white-space:nowrap}.page-select{border:0;padding:0;background:transparent;color:inherit;font:inherit;letter-spacing:inherit;cursor:pointer}.page-select option{background:#000;color:var(--green);font-family:"Courier New",Courier,monospace;letter-spacing:0}.page-select:hover,.page-select:focus-visible{color:var(--magenta);outline:none}.site-name:visited{color:var(--green)}.site-name:hover,.site-name:focus-visible{color:var(--magenta);outline:none}
    .cursor-lens{position:fixed;top:0;left:0;z-index:3;width:50px;height:50px;border:3px solid #fff;border-radius:50%;background:rgba(255,255,255,.001);backdrop-filter:invert(1);opacity:0;pointer-events:none;transform:translate3d(-100px,-100px,0) translate(-50%,-50%);transition:opacity 80ms linear}.cursor-lens.is-visible{opacity:1}@media(max-width:520px){.navigation{top:55%;width:88vmin;height:88vmin}.portal-button{width:23vmin}.core{width:16vmin}.topbar{gap:10px;height:48px}.site-name,.page-title,.topbar-clock{font-size:clamp(13px,4vw,17px)}.site-name{gap:7px}.site-name-icon{width:30px;height:30px;flex-basis:30px}.site-name-icon::before{font-size:22px}}
  </style>
</head>
<body>
<main class="portal" data-transition-root>
  <iframe class="starfield" src="/dead/experiments/canvas-backgrounds/starfield-background.html?v=20260809-3" title="Animated starfield background"></iframe>
  <header class="topbar"><a class="site-name" href="/" aria-label="Return to Main Space"><span class="site-name-icon" aria-hidden="true">☠️</span><span class="site-name-label">theinternetisdead.org</span></a><h1 class="page-title"><span>Experiments</span><button class="orb-edit-toggle" type="button" aria-label="Rearrange orbs" aria-pressed="false">✏️</button></h1><div class="topbar-clock"><select class="page-select" id="experiment-page" aria-label="Experiment portal page"><option value="1">Page 1/3</option><option value="2">Page 2/3</option><option value="3">Page 3/3</option></select></div></header>
  <nav class="navigation compass portal-open" aria-label="Experiments portal navigation" data-orb-arranger-key="theinternetisdead:experiments:orb-order" data-orb-arranger-scope-select="#experiment-page">
    <svg class="portal-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line x1="50" y1="50" x2="16.67" y2="16.67"/><line x1="50" y1="50" x2="50" y2="16.67"/><line x1="50" y1="50" x2="83.33" y2="16.67"/><line x1="50" y1="50" x2="16.67" y2="50"/><line x1="50" y1="50" x2="83.33" y2="50"/><line x1="50" y1="50" x2="16.67" y2="83.33"/><line x1="50" y1="50" x2="50" y2="83.33"/><line x1="50" y1="50" x2="83.33" y2="83.33"/></svg>
    <a class="portal-button northwest"><span class="destination-label"></span></a><a class="portal-button north"><span class="destination-label"></span></a><a class="portal-button northeast"><span class="destination-label"></span></a><a class="portal-button west"><span class="destination-label"></span></a>
    <a class="core" id="open-portal" href="/portal/" data-transition="crt-collapse" aria-expanded="true"><svg class="core-vortex" viewBox="-110 -110 220 220" aria-hidden="true"><path class="vortex-tendril vortex-red"/><path class="vortex-tendril vortex-green"/><path class="vortex-tendril vortex-blue"/></svg><span class="core-label">Portal</span></a>
    <a class="portal-button east"><span class="destination-label"></span></a><a class="portal-button southwest"><span class="destination-label"></span></a><a class="portal-button south"><span class="destination-label"></span></a><a class="portal-button southeast"><span class="destination-label"></span></a>
  </nav><div class="cursor-lens" aria-hidden="true"></div>
</main>
<script>
const pages=[
[["Background","/dead/experiments/background/","/dead/experiments/thumbnails/background/index.png"],["Blotter Visualizer","/dead/experiments/blotter-visualizer/","/dead/experiments/thumbnails/blotter-visualizer/index.png"],["Bookmark Manager","/dead/experiments/bookmark-manager/","/dead/experiments/thumbnails/bookmark-manager/index.png"],["Business Card","/dead/experiments/business-card/","/dead/experiments/thumbnails/business-card/index.png"],["Camera Experiment","/dead/experiments/camera-experiment/","/dead/experiments/thumbnails/camera-experiment/index.png"],["Camera Studio","/dead/experiments/camera-studio/","/dead/experiments/thumbnails/camera-studio/index.png"],["Canvas Backgrounds","/dead/experiments/canvas-backgrounds/","/dead/experiments/thumbnails/canvas-backgrounds/index.png"],["Chat Sandbox","/dead/experiments/chat-sandbox/","/dead/experiments/thumbnails/chat-sandbox/index.png"]],
[["Dead TV","/dead/experiments/dead-tv/","/dead/experiments/thumbnails/dead-tv/index.png"],["God's Eye","/dead/experiments/gods-eye/","/dead/experiments/thumbnails/gods-eye/index.png"],["Habisky Mofo","/dead/experiments/habisky-mofo/","/dead/experiments/thumbnails/habisky-mofo/index.png"],["Karaoke Machine","/dead/experiments/karaoke-machine/","/dead/experiments/thumbnails/karaoke-machine/index.png"],["Mandala Visuals","/dead/experiments/mandala-visuals/","/dead/experiments/thumbnails/mandala-visuals/index.png"],["Multimedia Editor","/dead/experiments/multimedia-editor/","/dead/experiments/thumbnails/multimedia-editor/index.png"],["Music Crunchifier","/dead/experiments/music-crunchifier/","/dead/experiments/thumbnails/music-crunchifier/index.png"],["Music Player","/dead/experiments/music-player/","/dead/experiments/thumbnails/music-player/index.png"]],
[["PDF Viewer","/dead/experiments/pdf-viewer/","/dead/experiments/thumbnails/pdf-viewer/index.png"],["Photosphere","/dead/experiments/photosphere/","/dead/experiments/thumbnails/photosphere/index.png"],["Sound Machine","/dead/experiments/sound-machine/","/dead/experiments/thumbnails/sound-machine/index.png"],["Stacks","/dead/experiments/stacks/","/dead/experiments/thumbnails/stacks/index.png"],["Weird Secret","/dead/experiments/weird-secret/","/dead/experiments/thumbnails/weird-secret/index.png"],["World in Thing","/dead/experiments/world-in-thing/","/dead/experiments/thumbnails/world-in-thing/index.png"]]
];
const slots=[...document.querySelectorAll('.portal-button')],select=document.getElementById('experiment-page'),compass=document.querySelector('.compass'),openPortal=document.getElementById('open-portal'),coreLabel=openPortal.querySelector('.core-label'),tendrils=document.querySelectorAll('.vortex-tendril');
const transitions=['slide-down-right','slide-down','slide-down-left','slide-right','slide-left','slide-up-right','slide-up','slide-up-left'];
const pageKey='theinternetisdead:experiments:page',portalKey='theinternetisdead:experiments:portal-open';
const render=i=>{i=Math.max(0,Math.min(pages.length-1,Number(i)||0));select.value=String(i+1);slots.forEach((s,n)=>{const e=pages[i][n],label=s.querySelector('.destination-label');if(!e){s.removeAttribute('href');s.removeAttribute('data-transition');s.classList.add('is-empty');label.textContent='Empty';s.style.setProperty('--portal-image','url("/dead/assets/images/static.gif")');return}s.href=e[1];s.dataset.transition=transitions[n];s.classList.remove('is-empty');s.setAttribute('aria-label',`Open ${e[0]}`);label.textContent=e[0];s.style.setProperty('--portal-image',`url("${e[2]}")`)});try{localStorage.setItem(pageKey,String(i+1))}catch(_){}};
let p=0;try{p=Number(localStorage.getItem(pageKey))-1||0}catch(_){}render(p);select.addEventListener('change',()=>render(Number(select.value)-1));
const makeSpiral=phase=>{const p=[];for(let s=0;s<=260;s++){const t=s/260,a=t*Math.PI*10+phase,r=4+t*98;p.push(`${s?'L':'M'}${(Math.cos(a)*r).toFixed(2)} ${(Math.sin(a)*r).toFixed(2)}`)}return p.join(' ')};tendrils.forEach((t,i)=>t.setAttribute('d',makeSpiral(i*Math.PI*2/tendrils.length)));
const setPortal=open=>{compass.classList.toggle('portal-open',open);openPortal.setAttribute('aria-expanded',String(open));coreLabel.innerHTML=open?'Portal':'Open<br>Portal';try{localStorage.setItem(portalKey,String(open))}catch(_){}};setPortal(true);openPortal.addEventListener('click',e=>{if(!compass.classList.contains('portal-open')){e.preventDefault();setPortal(true)}});
document.addEventListener('click',e=>{const a=e.target.closest('a[data-transition]');if(!a||!a.href)return;e.preventDefault();window.PageTransitions?window.PageTransitions.navigate(a.href,a.dataset.transition):location.assign(a.href)});
const lens=document.querySelector('.cursor-lens');addEventListener('pointermove',e=>{lens.style.transform=`translate3d(${e.clientX}px,${e.clientY}px,0) translate(-50%,-50%)`;lens.classList.add('is-visible')},{passive:true});addEventListener('pointerleave',()=>lens.classList.remove('is-visible'));
</script>
