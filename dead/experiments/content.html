<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>TheInternetIsDead.org - Experiments</title>
  <link rel="stylesheet" href="/dead/styles/bubble-grid.css?v=20260925-5">
  <script src="/dead/backgrounds/starfield-pointer-pass-through.js" defer></script>
</head>
<body>
  <main class="main-rectangle">
    <div class="frame-tools"><select class="page-select" id="experiment-page" aria-label="Experiment bubble page"><option value="1">Page 1/3</option><option value="2">Page 2/3</option><option value="3">Page 3/3</option></select></div>
    <nav class="bubble-navigation bubble-compass" aria-label="Experiments navigation">
      <svg class="bubble-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line x1="50" y1="50" x2="16.67" y2="16.67"/><line x1="50" y1="50" x2="50" y2="16.67"/><line x1="50" y1="50" x2="83.33" y2="16.67"/><line x1="50" y1="50" x2="16.67" y2="50"/><line x1="50" y1="50" x2="83.33" y2="50"/><line x1="50" y1="50" x2="16.67" y2="83.33"/><line x1="50" y1="50" x2="50" y2="83.33"/><line x1="50" y1="50" x2="83.33" y2="83.33"/></svg>
      <a class="bubble northwest"><span class="bubble-label"></span></a><a class="bubble north"><span class="bubble-label"></span></a><a class="bubble northeast"><span class="bubble-label"></span></a><a class="bubble west"><span class="bubble-label"></span></a>
      <button class="bubble-core" id="random-experiment" type="button" aria-label="Open a random experiment"><svg class="core-vortex" viewBox="-110 -110 220 220" aria-hidden="true"><path class="vortex-tendril vortex-red"></path><path class="vortex-tendril vortex-green"></path><path class="vortex-tendril vortex-blue"></path></svg><span class="core-label">RANDOM</span></button>
      <a class="bubble east"><span class="bubble-label"></span></a><a class="bubble southwest"><span class="bubble-label"></span></a><a class="bubble south"><span class="bubble-label"></span></a><a class="bubble southeast"><span class="bubble-label"></span></a>
    </nav>
  </main>
  <script>
    const navigateThroughShell=path=>{
      if(window.parent===window)window.location.assign(path);
      else window.parent.postMessage({type:'portal-shell-route',path},window.location.origin);
    };
    const pages=[
      [["Background","/dead/experiments/background/","/dead/experiments/thumbnails/background/index.png"],["Blotter Visualizer","/dead/experiments/blotter-visualizer/","/dead/experiments/thumbnails/blotter-visualizer/index.png"],["Bookmark Manager","/dead/experiments/bookmark-manager/","/dead/experiments/thumbnails/bookmark-manager/index.png"],["Business Card","/dead/experiments/business-card/","/dead/experiments/thumbnails/business-card/index.png"],["Camera Experiment","/dead/experiments/camera-experiment/","/dead/experiments/thumbnails/camera-experiment/index.png"],["Camera Studio","/dead/experiments/camera-studio/","/dead/experiments/thumbnails/camera-studio/index.png"],["Canvas Backgrounds","/dead/experiments/canvas-backgrounds/","/dead/experiments/thumbnails/canvas-backgrounds/index.png"],["Chat Sandbox","/dead/experiments/chat-sandbox/","/dead/experiments/thumbnails/chat-sandbox/index.png"]],
      [["Dead TV","/dead/experiments/dead-tv/","/dead/experiments/thumbnails/dead-tv/index.png"],["God's Eye","/dead/experiments/gods-eye/","/dead/experiments/thumbnails/gods-eye/index.png"],["Habisky Mofo","/dead/experiments/habisky-mofo/","/dead/experiments/thumbnails/habisky-mofo/index.png"],["Karaoke Machine","/dead/experiments/karaoke-machine/","/dead/experiments/thumbnails/karaoke-machine/index.png"],["Mandala Visuals","/dead/experiments/mandala-visuals/","/dead/experiments/thumbnails/mandala-visuals/index.png"],["Multimedia Editor","/dead/experiments/multimedia-editor/","/dead/experiments/thumbnails/multimedia-editor/index.png"],["Music Crunchifier","/dead/experiments/music-crunchifier/","/dead/experiments/thumbnails/music-crunchifier/index.png"],["Music Player","/dead/experiments/music-player/","/dead/experiments/thumbnails/music-player/index.png"]],
      [["PDF Viewer","/dead/experiments/pdf-viewer/","/dead/experiments/thumbnails/pdf-viewer/index.png"],["Photosphere","/dead/experiments/photosphere/","/dead/experiments/thumbnails/photosphere/index.png"],["Sound Machine","/dead/experiments/sound-machine/","/dead/experiments/thumbnails/sound-machine/index.png"],["Stacks","/dead/experiments/stacks/","/dead/experiments/thumbnails/stacks/index.png"],["Weird Secret","/dead/experiments/weird-secret/","/dead/experiments/thumbnails/weird-secret/index.png"],["World in Thing","/dead/experiments/world-in-thing/","/dead/experiments/thumbnails/world-in-thing/index.png"]]
    ];
    const allExperiments=pages.flat();
    document.getElementById('random-experiment').addEventListener('click',()=>{
      const destination=allExperiments[Math.floor(Math.random()*allExperiments.length)];
      if(destination)navigateThroughShell(destination[1]);
    });
    let vortexPointerFrame=0,vortexPointerX=0,vortexPointerY=0;
    const publishVortexPointer=()=>{vortexPointerFrame=0;document.documentElement.style.setProperty('--vortex-x',`${vortexPointerX*15}px`);document.documentElement.style.setProperty('--vortex-y',`${vortexPointerY*15}px`)};
    const updateVortexPointer=event=>{vortexPointerX=Math.max(-1,Math.min(1,event.clientX/window.innerWidth*2-1));vortexPointerY=Math.max(-1,Math.min(1,event.clientY/window.innerHeight*2-1));if(!vortexPointerFrame)vortexPointerFrame=requestAnimationFrame(publishVortexPointer)};
    window.addEventListener('pointermove',updateVortexPointer,{passive:true});
    window.addEventListener('pointerdown',updateVortexPointer,{passive:true});
    window.addEventListener('pointerout',event=>{if(event.relatedTarget)return;vortexPointerX=0;vortexPointerY=0;if(!vortexPointerFrame)vortexPointerFrame=requestAnimationFrame(publishVortexPointer)},{passive:true});
    const slots=[...document.querySelectorAll('.bubble')];
    slots.forEach(link=>link.addEventListener('click',event=>{
      if(!link.hasAttribute('href'))return;
      if(event.shiftKey&&event.button===0){
        event.preventDefault();
        const standaloneUrl=new URL(link.href);
        standaloneUrl.searchParams.set('standalone','true');
        const standaloneTab=document.createElement('a');
        standaloneTab.href=standaloneUrl.href;
        standaloneTab.target='_blank';
        standaloneTab.rel='noopener';
        document.body.appendChild(standaloneTab);
        standaloneTab.click();
        standaloneTab.remove();
        return;
      }
      if(event.button!==0||event.metaKey||event.ctrlKey||event.altKey)return;
      event.preventDefault();
      navigateThroughShell(link.getAttribute('href'));
    }));
    const pageSelect=document.getElementById('experiment-page');
    const pageKey='theinternetisdead:experiments:page';
    const renderPage=index=>{index=Math.max(0,Math.min(pages.length-1,Number(index)||0));pageSelect.value=String(index+1);slots.forEach((slot,slotIndex)=>{const entry=pages[index][slotIndex],label=slot.querySelector('.bubble-label');if(!entry){slot.removeAttribute('href');slot.removeAttribute('aria-label');slot.classList.add('is-empty');slot.style.removeProperty('--bubble-image');label.textContent='Empty';return}slot.href=entry[1];slot.setAttribute('aria-label',`Open ${entry[0]}`);slot.classList.remove('is-empty');slot.style.setProperty('--bubble-image',`url("${entry[2]}")`);label.textContent=entry[0]});try{localStorage.setItem(pageKey,String(index+1))}catch(error){}};
    let savedPage=0;try{savedPage=Number(localStorage.getItem(pageKey))-1||0}catch(error){}renderPage(savedPage);
    pageSelect.addEventListener('change',()=>renderPage(Number(pageSelect.value)-1));
    const tendrils=document.querySelectorAll('.vortex-tendril');
    const makeSpiral=phase=>{const points=[];for(let step=0;step<=260;step++){const progress=step/260,angle=progress*Math.PI*6+phase,radius=4+progress*98;points.push(`${step?'L':'M'}${(Math.cos(angle)*radius).toFixed(2)} ${(Math.sin(angle)*radius).toFixed(2)}`)}return points.join(' ')};
    tendrils.forEach((tendril,index)=>tendril.setAttribute('d',makeSpiral(index*Math.PI*2/tendrils.length)));
  </script>
</body>
</html>
