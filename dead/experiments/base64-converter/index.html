<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Image to Base64 Converter</title>
  <style>
    :root {
      color-scheme: dark;
      font: 16px/1.4 "Courier New", Courier, monospace;
      background: #050208;
      color: #b7ff00;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 0;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 45%, rgb(91 0 138 / 18%), transparent 48%),
        #050208;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    main {
      display: grid;
      width: 100%;
      height: 100%;
      padding: 16px;
      place-items: center;
    }

    .stage {
      display: flex;
      min-width: 0;
      max-width: 100%;
      max-height: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .visual-shell {
      position: relative;
      overflow: hidden;
      outline: 1px solid #7b00b5;
      background: #000;
      box-shadow:
        0 0 0 1px rgb(183 255 0 / 12%),
        0 0 24px rgb(123 0 181 / 28%);
    }

    .metadata {
      width: max-content;
      max-width: 100%;
      margin: 0;
      overflow-x: auto;
      color: #d98cff;
      font-size: clamp(9px, 1.35vw, 13px);
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
      scrollbar-width: none;
      -ms-overflow-style: none;
      -webkit-overflow-scrolling: touch;
    }

    .metadata::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    .size-unit {
      border: 0;
      border-bottom: 1px dashed currentColor;
      border-radius: 0;
      padding: 0;
      color: inherit;
      background: transparent;
      font: inherit;
      line-height: inherit;
      vertical-align: baseline;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      field-sizing: content;
      cursor: pointer;
    }

    .size-unit:focus-visible {
      outline: 1px dotted currentColor;
      outline-offset: 2px;
    }

    #preview {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #base64Output {
      width: 100%;
      max-width: 100%;
      height: 100%;
      padding: clamp(6px, 1.2vmin, 12px);
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      color: #b7ff00;
      background: #020103;
      font: 10px/1.35 "Courier New", Courier, monospace;
      overflow-wrap: anywhere;
      word-wrap: break-word;
      word-break: break-all;
      white-space: normal;
      scrollbar-width: none;
      -ms-overflow-style: none;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      cursor: text;
    }

    #base64Output::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    button {
      min-height: 44px;
      border: 1px solid #b7ff00;
      border-radius: 0;
      padding: 10px 18px;
      color: #b7ff00;
      background: #08030d;
      box-shadow: 4px 4px 0 #61008f;
      font: 700 15px/1 "Courier New", Courier, monospace;
      letter-spacing: 0.04em;
      cursor: pointer;
    }

    button:hover {
      color: #050208;
      background: #b7ff00;
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #61008f;
    }

    button:disabled {
      color: #8a8a8a;
      border-color: #555;
      background: #111;
      box-shadow: 4px 4px 0 #333;
      cursor: wait;
    }

    button:focus-visible,
    #base64Output:focus-visible {
      outline: 3px solid #c244ff;
      outline-offset: 4px;
    }

    .metadata .metadata-value {
      display: inline;
      min-height: 0;
      border: 0;
      padding: 0;
      color: #b7ff00;
      background: transparent;
      box-shadow: none;
      font: inherit;
      font-size: 2em;
      line-height: 1;
      letter-spacing: normal;
      vertical-align: middle;
      cursor: pointer;
    }

    .metadata .metadata-value:hover,
    .metadata .metadata-value:active {
      color: #b7ff00;
      background: transparent;
      box-shadow: none;
      transform: none;
    }

    .metadata .metadata-value:focus-visible {
      outline: 2px dotted #b7ff00;
      outline-offset: 2px;
    }

    .copy-popup {
      position: fixed;
      top: 18px;
      left: 50%;
      z-index: 100;
      max-width: calc(100vw - 32px);
      border: 1px solid #b7ff00;
      padding: 7px 10px;
      color: #b7ff00;
      background: #08030d;
      box-shadow: 3px 3px 0 #61008f;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      overflow-wrap: anywhere;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%);
      transition: opacity 500ms ease;
    }

    .copy-popup.is-visible {
      opacity: 1;
    }

    #fileInput {
      position: fixed;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }

    #error {
      position: fixed;
      right: 16px;
      bottom: 16px;
      left: 16px;
      margin: 0;
      color: #ff63d8;
      font-weight: 700;
      text-align: center;
    }

    #status {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }

    [hidden] {
      display: none !important;
    }

    @media (prefers-reduced-motion: no-preference) {
      button {
        transition:
          color 100ms ease,
          background-color 100ms ease,
          transform 100ms ease,
          box-shadow 100ms ease;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .copy-popup {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <section id="uploadStage" class="stage" aria-label="Select an image">
      <input id="fileInput" type="file" accept=".png,.jpg,.jpeg,image/png,image/jpeg" hidden>
      <button id="uploadButton" type="button">Upload Image</button>
    </section>

    <section id="previewStage" class="stage" aria-label="Image preview" hidden>
      <p class="metadata">
        Dimensions:
        <button class="metadata-value" type="button" aria-label="Copy dimensions">(<span data-dimensions data-copy-text></span>)</button>
        <span aria-hidden="true">&bull;</span>
        Aspect Ratio:
        <button class="metadata-value" type="button" aria-label="Copy aspect ratio">(<span data-aspect-ratio data-copy-text></span>)</button>
        <span aria-hidden="true">&bull;</span>
        base64 characters:
        <button class="metadata-value" type="button" aria-label="Copy Base64 character count">(<span data-base64-characters data-copy-text></span>)</button>
        <span aria-hidden="true">&bull;</span>
        Size in
        <select class="size-unit" aria-label="Image size unit">
          <option value="bytes">bytes</option>
          <option value="kilobytes">kilobytes</option>
          <option value="megabytes">megabytes</option>
          <option value="gigabytes">gigabytes</option>
        </select>:
        <button class="metadata-value" type="button" aria-label="Copy file size">(<span data-file-size data-copy-text></span>)</button>
      </p>
      <div id="previewShell" class="visual-shell">
        <img id="preview" alt="">
      </div>
      <button id="convertButton" type="button">Convert Now</button>
    </section>

    <section id="convertedStage" class="stage" aria-label="Converted Base64" hidden>
      <p class="metadata">
        Dimensions:
        <button class="metadata-value" type="button" aria-label="Copy dimensions">(<span data-dimensions data-copy-text></span>)</button>
        <span aria-hidden="true">&bull;</span>
        Aspect Ratio:
        <button class="metadata-value" type="button" aria-label="Copy aspect ratio">(<span data-aspect-ratio data-copy-text></span>)</button>
        <span aria-hidden="true">&bull;</span>
        base64 characters:
        <button class="metadata-value" type="button" aria-label="Copy Base64 character count">(<span data-base64-characters data-copy-text></span>)</button>
        <span aria-hidden="true">&bull;</span>
        Size in
        <select class="size-unit" aria-label="Image size unit">
          <option value="bytes">bytes</option>
          <option value="kilobytes">kilobytes</option>
          <option value="megabytes">megabytes</option>
          <option value="gigabytes">gigabytes</option>
        </select>:
        <button class="metadata-value" type="button" aria-label="Copy file size">(<span data-file-size data-copy-text></span>)</button>
      </p>
      <div id="outputShell" class="visual-shell">
        <div
          id="base64Output"
          role="textbox"
          aria-label="Complete raw Base64 output"
          aria-readonly="true"
          tabindex="0"
        ></div>
      </div>
      <button id="downloadButton" type="button">Download Base64</button>
    </section>
  </main>

  <p id="error" role="alert" hidden></p>
  <p id="status" role="status" aria-live="polite"></p>
  <div id="copyPopup" class="copy-popup" role="status" aria-live="polite"></div>

  <script>
    (() => {
      "use strict";

      const fileInput = document.getElementById("fileInput");
      const uploadButton = document.getElementById("uploadButton");
      const uploadStage = document.getElementById("uploadStage");
      const previewStage = document.getElementById("previewStage");
      const convertedStage = document.getElementById("convertedStage");
      const previewShell = document.getElementById("previewShell");
      const outputShell = document.getElementById("outputShell");
      const preview = document.getElementById("preview");
      const convertButton = document.getElementById("convertButton");
      const base64Output = document.getElementById("base64Output");
      const downloadButton = document.getElementById("downloadButton");
      const error = document.getElementById("error");
      const status = document.getElementById("status");
      const copyPopup = document.getElementById("copyPopup");
      const metadataRows = [...document.querySelectorAll(".metadata")];
      const sizeUnitSelects = [...document.querySelectorAll(".size-unit")];
      const metadataValueButtons =
        [...document.querySelectorAll(".metadata-value")];

      const BASE64_ALPHABET =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
      const ENCODE_CHUNK_BYTES = 3 * 16384;
      const VERIFY_CHUNK_CHARS = 4 * 16384;
      const ALLOWED_EXTENSION = /\.(?:png|jpe?g)$/i;
      const ALLOWED_MIME = new Set(["image/png", "image/jpeg"]);
      const STANDARD_RESOLUTION_ASPECTS = new Map([
        ["1360x768", "16:9"],
        ["1366x768", "16:9"],
        ["2048x1080", "17:9"],
        ["2560x1080", "21:9"],
        ["3440x1440", "21:9"],
        ["3840x1600", "24:10"],
        ["4096x2160", "17:9"],
        ["5120x2160", "21:9"]
      ]);
      const KNOWN_ASPECT_RATIOS = [
        { width: 1, height: 1, label: "1:1" },
        { width: 5, height: 4, label: "5:4" },
        { width: 4, height: 3, label: "4:3" },
        { width: 3, height: 2, label: "3:2" },
        { width: 16, height: 10, label: "16:10" },
        { width: 5, height: 3, label: "5:3" },
        { width: 16, height: 9, label: "16:9" },
        { width: 17, height: 9, label: "17:9" },
        { width: 18, height: 9, label: "18:9" },
        { width: 19, height: 9, label: "19:9" },
        { width: 19.5, height: 9, label: "19.5:9" },
        { width: 20, height: 9, label: "20:9" },
        { width: 21, height: 9, label: "21:9" },
        { width: 24, height: 10, label: "24:10" },
        { width: 32, height: 9, label: "32:9" }
      ];

      let selectedFile = null;
      let naturalWidth = 0;
      let naturalHeight = 0;
      let previewUrl = "";
      let verifiedBase64 = "";
      let selectedSizeUnit = "bytes";
      let copyPopupTimer = 0;

      uploadButton.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", handleSelection);
      convertButton.addEventListener("click", convertSelectedFile);
      downloadButton.addEventListener("click", downloadBase64);
      base64Output.addEventListener("keydown", handleOutputKeydown);
      window.addEventListener("resize", fitVisual);
      for (const select of sizeUnitSelects) {
        select.addEventListener("change", () => {
          selectedSizeUnit = select.value;
          updateMetadata();
        });
      }
      for (const button of metadataValueButtons) {
        button.addEventListener("click", () => copyMetadataValue(button));
      }

      function showError(message) {
        error.textContent = message;
        error.hidden = false;
        status.textContent = message;
      }

      function clearError() {
        error.textContent = "";
        error.hidden = true;
      }

      function showOnly(stage) {
        uploadStage.hidden = stage !== uploadStage;
        previewStage.hidden = stage !== previewStage;
        convertedStage.hidden = stage !== convertedStage;
      }

      function releasePreviewUrl() {
        if (previewUrl) {
          URL.revokeObjectURL(previewUrl);
          previewUrl = "";
        }
      }

      async function handleSelection() {
        const file = fileInput.files && fileInput.files[0];
        fileInput.value = "";
        clearError();

        if (!file) {
          return;
        }

        if (
          !ALLOWED_EXTENSION.test(file.name) ||
          (file.type && !ALLOWED_MIME.has(file.type))
        ) {
          showError("Unsupported file type. Choose a PNG or JPEG image.");
          return;
        }

        releasePreviewUrl();
        selectedFile = null;
        verifiedBase64 = "";
        base64Output.textContent = "";

        const candidateUrl = URL.createObjectURL(file);
        previewUrl = candidateUrl;
        preview.alt = `Preview of ${file.name}`;

        try {
          await loadPreview(candidateUrl);
        } catch {
          if (previewUrl === candidateUrl) {
            releasePreviewUrl();
          } else {
            URL.revokeObjectURL(candidateUrl);
          }
          showOnly(uploadStage);
          showError("The image cannot be read.");
          uploadButton.focus();
          return;
        }

        if (previewUrl !== candidateUrl) {
          return;
        }

        selectedFile = file;
        naturalWidth = preview.naturalWidth;
        naturalHeight = preview.naturalHeight;
        updateMetadata();
        showOnly(previewStage);
        fitVisual();
        status.textContent = `${file.name} is ready to convert.`;
        convertButton.focus();
      }

      function loadPreview(url) {
        return new Promise((resolve, reject) => {
          preview.onload = () => {
            preview.onload = null;
            preview.onerror = null;
            if (preview.naturalWidth > 0 && preview.naturalHeight > 0) {
              resolve();
            } else {
              reject(new Error("Missing image dimensions"));
            }
          };
          preview.onerror = () => {
            preview.onload = null;
            preview.onerror = null;
            reject(new Error("Image decode failed"));
          };
          preview.src = url;
        });
      }

      function fitVisual() {
        if (!naturalWidth || !naturalHeight) {
          return;
        }

        const maxWidth = Math.max(1, window.innerWidth - 32);
        const visibleMetadata = metadataRows.find((row) => row.offsetParent);
        const metadataHeight = visibleMetadata
          ? visibleMetadata.getBoundingClientRect().height
          : 0;
        const maxHeight = Math.max(
          1,
          window.innerHeight - 104 - metadataHeight
        );
        const scale = Math.min(maxWidth / naturalWidth, maxHeight / naturalHeight);
        const width = naturalWidth * scale;
        const height = naturalHeight * scale;

        for (const shell of [previewShell, outputShell]) {
          shell.style.width = `${width}px`;
          shell.style.height = `${height}px`;
          shell.style.aspectRatio = `${naturalWidth} / ${naturalHeight}`;
        }
      }

      async function convertSelectedFile() {
        if (!selectedFile || convertButton.disabled) {
          return;
        }

        clearError();
        convertButton.disabled = true;
        convertButton.textContent = "Converting\u2026";
        status.textContent = "Reading the image locally.";

        let buffer;
        try {
          buffer = await selectedFile.arrayBuffer();
        } catch {
          conversionError("The image cannot be read.");
          return;
        }

        try {
          const bytes = new Uint8Array(buffer);
          status.textContent = "Encoding the original image bytes.";
          const base64 = await encodeBase64(bytes);
          status.textContent = "Verifying every decoded byte.";
          const verified = await verifyBase64(base64, bytes);

          if (!verified) {
            throw new Error("Byte verification failed");
          }

          verifiedBase64 = base64;
          base64Output.textContent = base64;
          updateMetadata(base64.length);
          showOnly(convertedStage);
          fitVisual();
          releasePreviewUrl();
          preview.removeAttribute("src");
          status.textContent =
            "Conversion complete and verified byte for byte. Download is ready.";
          base64Output.focus();
        } catch {
          conversionError("Base64 verification failed.");
        }
      }

      function conversionError(message) {
        convertButton.disabled = false;
        convertButton.textContent = "Convert Now";
        showError(message);
        convertButton.focus();
      }

      async function encodeBase64(bytes) {
        const parts = [];
        const completeLength = bytes.length - (bytes.length % 3);
        let chunkCount = 0;

        for (let start = 0; start < completeLength; start += ENCODE_CHUNK_BYTES) {
          const end = Math.min(completeLength, start + ENCODE_CHUNK_BYTES);
          let chunk = "";

          for (let index = start; index < end; index += 3) {
            const value =
              (bytes[index] << 16) |
              (bytes[index + 1] << 8) |
              bytes[index + 2];
            chunk +=
              BASE64_ALPHABET[(value >>> 18) & 63] +
              BASE64_ALPHABET[(value >>> 12) & 63] +
              BASE64_ALPHABET[(value >>> 6) & 63] +
              BASE64_ALPHABET[value & 63];
          }

          parts.push(chunk);
          chunkCount += 1;
          if (chunkCount % 32 === 0) {
            await yieldToBrowser();
          }
        }

        const remaining = bytes.length - completeLength;
        if (remaining === 1) {
          const value = bytes[completeLength] << 16;
          parts.push(
            BASE64_ALPHABET[(value >>> 18) & 63] +
            BASE64_ALPHABET[(value >>> 12) & 63] +
            "=="
          );
        } else if (remaining === 2) {
          const value =
            (bytes[completeLength] << 16) |
            (bytes[completeLength + 1] << 8);
          parts.push(
            BASE64_ALPHABET[(value >>> 18) & 63] +
            BASE64_ALPHABET[(value >>> 12) & 63] +
            BASE64_ALPHABET[(value >>> 6) & 63] +
            "="
          );
        }

        return parts.join("");
      }

      async function verifyBase64(base64, originalBytes) {
        const expectedLength = Math.floor(base64.length * 3 / 4) -
          (base64.endsWith("==") ? 2 : base64.endsWith("=") ? 1 : 0);

        if (expectedLength !== originalBytes.length) {
          return false;
        }

        let byteIndex = 0;
        let chunkCount = 0;

        try {
          for (
            let start = 0;
            start < base64.length;
            start += VERIFY_CHUNK_CHARS
          ) {
            const encodedChunk = base64.slice(
              start,
              Math.min(base64.length, start + VERIFY_CHUNK_CHARS)
            );
            const decodedChunk = atob(encodedChunk);

            for (let index = 0; index < decodedChunk.length; index += 1) {
              if (
                byteIndex >= originalBytes.length ||
                decodedChunk.charCodeAt(index) !== originalBytes[byteIndex]
              ) {
                return false;
              }
              byteIndex += 1;
            }

            chunkCount += 1;
            if (chunkCount % 32 === 0) {
              await yieldToBrowser();
            }
          }
        } catch {
          return false;
        }

        return byteIndex === originalBytes.length;
      }

      function yieldToBrowser() {
        return new Promise((resolve) => {
          if (typeof requestAnimationFrame === "function") {
            requestAnimationFrame(() => resolve());
          } else {
            setTimeout(resolve, 0);
          }
        });
      }

      function updateMetadata(base64Length) {
        if (!selectedFile || !naturalWidth || !naturalHeight) {
          return;
        }

        const divisorByUnit = {
          bytes: 1,
          kilobytes: 1024,
          megabytes: 1024 ** 2,
          gigabytes: 1024 ** 3
        };
        const aspectRatio =
          getKnownAspectRatio(naturalWidth, naturalHeight);
        const characterCount =
          base64Length ?? (Math.ceil(selectedFile.size / 3) * 4);
        const convertedSize =
          selectedFile.size / divisorByUnit[selectedSizeUnit];
        const sizeText = selectedSizeUnit === "bytes"
          ? selectedFile.size.toLocaleString()
          : convertedSize.toLocaleString(undefined, {
              maximumFractionDigits: 4
            });

        for (const row of metadataRows) {
          row.querySelector("[data-dimensions]").textContent =
            `${naturalWidth}x${naturalHeight}`;
          row.querySelector("[data-aspect-ratio]").textContent = aspectRatio;
          row.querySelector("[data-base64-characters]").textContent =
            characterCount.toLocaleString();
          row.querySelector("[data-file-size]").textContent = sizeText;
        }

        for (const select of sizeUnitSelects) {
          select.value = selectedSizeUnit;
        }
      }

      function greatestCommonDivisor(first, second) {
        let left = first;
        let right = second;

        while (right !== 0) {
          const remainder = left % right;
          left = right;
          right = remainder;
        }

        return left;
      }

      function getKnownAspectRatio(width, height) {
        const isPortrait = height > width;
        const longSide = Math.max(width, height);
        const shortSide = Math.min(width, height);
        const resolutionKey = `${longSide}x${shortSide}`;
        const standardRatio = STANDARD_RESOLUTION_ASPECTS.get(resolutionKey);

        if (standardRatio) {
          return orientAspectRatio(standardRatio, isPortrait);
        }

        const measuredRatio = longSide / shortSide;
        let closestRatio = null;
        let closestDifference = Number.POSITIVE_INFINITY;

        for (const ratio of KNOWN_ASPECT_RATIOS) {
          const ratioValue = ratio.width / ratio.height;
          const relativeDifference =
            Math.abs(measuredRatio - ratioValue) / ratioValue;

          if (relativeDifference < closestDifference) {
            closestDifference = relativeDifference;
            closestRatio = ratio.label;
          }
        }

        if (closestRatio && closestDifference <= 0.01) {
          return orientAspectRatio(closestRatio, isPortrait);
        }

        const divisor = greatestCommonDivisor(width, height);
        return `${width / divisor}:${height / divisor}`;
      }

      function orientAspectRatio(ratio, isPortrait) {
        if (!isPortrait) {
          return ratio;
        }

        const [width, height] = ratio.split(":");
        return `${height}:${width}`;
      }

      async function copyMetadataValue(button) {
        const valueElement = button.querySelector("[data-copy-text]");
        const value = valueElement ? valueElement.textContent : "";

        if (!value) {
          return;
        }

        let copied = false;

        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(value);
            copied = true;
          }
        } catch {
          copied = false;
        }

        if (!copied) {
          copied = copyTextFallback(value);
        }

        showCopyPopup(copied ? `Copied: ${value}` : "Copy failed.");
      }

      function copyTextFallback(value) {
        const textarea = document.createElement("textarea");
        textarea.value = value;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();

        let copied = false;
        try {
          copied = document.execCommand("copy");
        } catch {
          copied = false;
        }

        textarea.remove();
        return copied;
      }

      function showCopyPopup(message) {
        window.clearTimeout(copyPopupTimer);
        copyPopup.classList.remove("is-visible");
        copyPopup.textContent = message;

        requestAnimationFrame(() => {
          copyPopup.classList.add("is-visible");
          copyPopupTimer = window.setTimeout(() => {
            copyPopup.classList.remove("is-visible");
          }, 900);
        });
      }

      function handleOutputKeydown(event) {
        const lineStep = 36;
        const pageStep = Math.max(1, base64Output.clientHeight - lineStep);
        let nextScrollTop = null;

        switch (event.key) {
          case "ArrowDown":
            nextScrollTop = base64Output.scrollTop + lineStep;
            break;
          case "ArrowUp":
            nextScrollTop = base64Output.scrollTop - lineStep;
            break;
          case "PageDown":
          case " ":
            nextScrollTop =
              base64Output.scrollTop + (event.shiftKey ? -pageStep : pageStep);
            break;
          case "PageUp":
            nextScrollTop = base64Output.scrollTop - pageStep;
            break;
          case "Home":
            nextScrollTop = 0;
            break;
          case "End":
            nextScrollTop = base64Output.scrollHeight;
            break;
          default:
            return;
        }

        event.preventDefault();
        base64Output.scrollTop = nextScrollTop;
      }

      function downloadBase64() {
        if (!selectedFile || !verifiedBase64) {
          return;
        }

        const blob = new Blob([verifiedBase64], {
          type: "text/plain;charset=us-ascii"
        });
        const downloadUrl = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = downloadUrl;
        link.download = `${selectedFile.name}.base64.txt`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
        status.textContent = `${link.download} downloaded.`;
      }
    })();
  </script>
