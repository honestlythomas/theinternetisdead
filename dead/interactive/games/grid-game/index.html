<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Isometric Cobblestone Triangle Lattice</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0b0711;
      font-family: Consolas, "Courier New", monospace;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 10;
      padding: 10px 12px;
      background: rgba(12, 8, 20, 0.82);
      border: 1px solid #7b3cff;
      color: #cfff8f;
      pointer-events: none;
      box-shadow: 0 0 18px rgba(123, 60, 255, 0.25);
    }

    #hud.error {
      color: #ff8f9f;
      border-color: #ff3c62;
    }
  </style>
</head>
<body>
  <div id="hud">Loading cobblestone lattice...</div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    const hud = document.getElementById("hud");

    if (!window.THREE) {
      hud.className = "error";
      hud.textContent = "Three.js failed to load. Internet connection is required for the CDN.";
      throw new Error("Three.js failed to load.");
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0711);
    scene.fog = new THREE.FogExp2(0x0b0711, 0.012);

    const camera = new THREE.OrthographicCamera(-16, 16, 10, -10, 0.1, 200);
    camera.position.set(18, 22, 18);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.target.set(0, 0, 0);
    controls.update();

    scene.add(new THREE.HemisphereLight(0xb98cff, 0x130d1a, 1.4));

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.8);
    keyLight.position.set(12, 20, 10);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -30;
    keyLight.shadow.camera.right = 30;
    keyLight.shadow.camera.top = 30;
    keyLight.shadow.camera.bottom = -30;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x9dff4d, 0.45);
    fillLight.position.set(-10, 8, -12);
    scene.add(fillLight);

    const lattice = new THREE.Group();
    scene.add(lattice);

    const loader = new THREE.TextureLoader();

    loader.load(
      "./assets/cobblestone.png",
      function(texture) {
        texture.encoding = THREE.sRGBEncoding;
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();

        buildGrid(texture);
        hud.textContent = "Drag to orbit · Scroll to zoom · Right-drag to pan";
      },
      undefined,
      function(error) {
        console.error(error);
        hud.className = "error";
        hud.innerHTML = "Could not load <b>./assets/cobblestone.png</b><br>Check the folder name and filename exactly.";
      }
    );

    function buildGrid(texture) {
      const normalMaterial = new THREE.MeshStandardMaterial({
        map: texture,
        color: 0xffffff,
        roughness: 0.95,
        metalness: 0.02,
        side: THREE.DoubleSide
      });

      const darkMaterial = new THREE.MeshStandardMaterial({
        map: texture,
        color: new THREE.Color(0xababab),
        roughness: 0.95,
        metalness: 0.02,
        side: THREE.DoubleSide
      });

      const edgeMaterial = new THREE.LineBasicMaterial({
        color: 0x201128,
        transparent: true,
        opacity: 0.82
      });

      const side = 1.4;
      const h = Math.sqrt(3) * 0.5 * side;
      const rows = 20;
      const cols = 28;

      const gridWidth = cols * side * 0.5 + side;
      const gridDepth = rows * h;

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const up = (row + col) % 2 === 0;
          const x = col * side * 0.5 - gridWidth * 0.5;
          const z = row * h - gridDepth * 0.5;

          const a = up
            ? new THREE.Vector3(x, 0, z + h)
            : new THREE.Vector3(x, 0, z);

          const b = up
            ? new THREE.Vector3(x + side * 0.5, 0, z)
            : new THREE.Vector3(x + side * 0.5, 0, z + h);

          const c = up
            ? new THREE.Vector3(x + side, 0, z + h)
            : new THREE.Vector3(x + side, 0, z);

          addTriangle(a, b, c, row, col, normalMaterial, darkMaterial, edgeMaterial);
        }
      }
    }

    function addTriangle(a, b, c, row, col, normalMaterial, darkMaterial, edgeMaterial) {
      const center = new THREE.Vector3()
        .add(a)
        .add(b)
        .add(c)
        .multiplyScalar(1 / 3);

      const heightOffset = ((row + col) % 4) * 0.03;

      a.y += heightOffset;
      b.y += heightOffset;
      c.y += heightOffset;
      center.y += heightOffset + 0.008;

      const parts = [
        [a, b, center],
        [b, c, center],
        [c, a, center]
      ];

      const darkPart = (row * 5 + col * 7) % 3;

      for (let i = 0; i < parts.length; i++) {
        const geometry = makeGeometry(parts[i], a, b, c);
        const mesh = new THREE.Mesh(
          geometry,
          i === darkPart ? darkMaterial : normalMaterial
        );

        mesh.castShadow = true;
        mesh.receiveShadow = true;
        lattice.add(mesh);
      }

      const edgeGeometry = new THREE.BufferGeometry().setFromPoints([a, b, c, a]);
      const outline = new THREE.Line(edgeGeometry, edgeMaterial);
      outline.position.y += 0.012;
      lattice.add(outline);
    }

    function makeGeometry(points, parentA, parentB, parentC) {
      const geometry = new THREE.BufferGeometry();
      const positions = [];
      const uvs = [];

      for (let i = 0; i < points.length; i++) {
        const p = points[i];
        positions.push(p.x, p.y, p.z);

        const uv = triangleUV(p, parentA, parentB, parentC);
        uvs.push(uv.x, uv.y);
      }

      geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(positions, 3)
      );

      geometry.setAttribute(
        "uv",
        new THREE.Float32BufferAttribute(uvs, 2)
      );

      geometry.setIndex([0, 1, 2]);
      geometry.computeVertexNormals();

      return geometry;
    }

    function triangleUV(point, a, b, c) {
      const v0x = b.x - a.x;
      const v0z = b.z - a.z;
      const v1x = c.x - a.x;
      const v1z = c.z - a.z;
      const v2x = point.x - a.x;
      const v2z = point.z - a.z;

      const d00 = v0x * v0x + v0z * v0z;
      const d01 = v0x * v1x + v0z * v1z;
      const d11 = v1x * v1x + v1z * v1z;
      const d20 = v2x * v0x + v2z * v0z;
      const d21 = v2x * v1x + v2z * v1z;

      const denom = d00 * d11 - d01 * d01 || 1;
      const v = (d11 * d20 - d01 * d21) / denom;
      const w = (d00 * d21 - d01 * d20) / denom;
      const u = 1 - v - w;

      return new THREE.Vector2(v * 0.5 + w, u);
    }

    function resize() {
      const aspect = window.innerWidth / window.innerHeight;
      const viewHeight = 20;

      camera.left = -viewHeight * aspect * 0.5;
      camera.right = viewHeight * aspect * 0.5;
      camera.top = viewHeight * 0.5;
      camera.bottom = -viewHeight * 0.5;
      camera.updateProjectionMatrix();

      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener("resize", resize);
    resize();

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
