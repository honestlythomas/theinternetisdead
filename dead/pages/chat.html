<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      color: var(--chat-primary);
      font-family: "Courier New", Courier, monospace;
      overflow: hidden;
    }

    body {
      --chat-primary-rgb: 0, 255, 102;
      --chat-all-rgb: 255, 255, 255;
      --chat-public-rgb: 57, 255, 20;
      --chat-ai-rgb: 255, 0, 255;
      --chat-local-rgb: 255, 255, 0;
      --chat-commands-rgb: 0, 255, 102;
      --chat-system-rgb: 255, 0, 255;
      --chat-primary: rgb(var(--chat-primary-rgb));
      --chat-bg: rgba(0, 0, 0, 0.82);
      --chat-border: rgba(var(--chat-primary-rgb), 0.42);
      --chat-text: var(--chat-primary);
      --chat-muted: rgba(var(--chat-primary-rgb), 0.72);
      --chat-danger: #ff5577;
    }

    body[data-chat-mode="all"] { --chat-primary-rgb: var(--chat-all-rgb); }
    body[data-chat-mode="public"] { --chat-primary-rgb: var(--chat-public-rgb); }
    body[data-chat-mode="ai"] { --chat-primary-rgb: var(--chat-ai-rgb); }
    body[data-chat-mode="local"] { --chat-primary-rgb: var(--chat-local-rgb); }
    body[data-chat-mode="commands"] { --chat-primary-rgb: var(--chat-commands-rgb); }
    body[data-chat-mode="system"] { --chat-primary-rgb: var(--chat-system-rgb); }

    #chatSurface {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      pointer-events: none;
      z-index: 3;
    }

    #chatDimLayer {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.46);
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease;
      z-index: 1;
    }

    body.chat-open #chatDimLayer {
      opacity: 1;
    }

    #chatPanel {
      width: 100%;
      height: 100%;
      max-height: none;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px;
      box-sizing: border-box;
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 160ms ease, transform 160ms ease;
      pointer-events: none;
    }

    body.chat-open #chatPanel,
    body.chat-preview #chatPanel {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    body.chat-preview:not(.chat-open) #chatPanel {
      opacity: var(--preview-opacity, 0.45);
    }

    #messages {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 6px;
      max-height: none;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    #messages::-webkit-scrollbar {
      display: none;
    }

    #messages::before {
      content: "";
      margin-top: auto;
    }

    .message {
      position: relative;
      width: fit-content;
      max-width: min(920px, calc(100vw - 32px));
      align-self: flex-start;
      flex-shrink: 0;
      padding: 7px 32px 7px 9px;
      border: 1px solid var(--chat-border);
      background: var(--chat-bg);
      color: var(--chat-text);
      text-shadow: 0 0 6px rgba(var(--chat-primary-rgb), 0.28);
      line-height: 1.35;
      overflow-wrap: anywhere;
      box-shadow: 0 0 18px rgba(var(--chat-primary-rgb), 0.08);
    }

    .messageReadButton {
      position: absolute;
      top: 2px;
      right: 3px;
      border: 0;
      background: transparent;
      color: var(--chat-text);
      font: inherit;
      font-size: 15px;
      line-height: 1;
      padding: 2px;
      cursor: pointer;
      opacity: 0.72;
      text-shadow: 0 0 6px rgba(var(--chat-primary-rgb), 0.55);
    }

    .messageReadButton:hover,
    .messageReadButton:focus-visible,
    .messageReadButton.is-reading {
      opacity: 1;
      outline: 1px solid var(--chat-border);
      background: rgba(var(--chat-primary-rgb), 0.12);
    }

    .message[data-role="user"] {
      border-color: rgba(var(--chat-primary-rgb), 0.58);
      color: var(--chat-text);
      text-shadow: 0 0 6px rgba(var(--chat-primary-rgb), 0.25);
    }

    .message[data-role="system"] { color: var(--chat-muted); }

    .message[data-chat-kind] {
      --chat-text: rgb(var(--chat-primary-rgb));
      --chat-muted: rgba(var(--chat-primary-rgb), 0.72);
      --chat-border: rgba(var(--chat-primary-rgb), 0.42);
    }

    .message[data-chat-kind="public"] { --chat-primary-rgb: var(--chat-public-rgb); }
    .message[data-chat-kind="ai"] { --chat-primary-rgb: var(--chat-ai-rgb); }
    .message[data-chat-kind="local"] { --chat-primary-rgb: var(--chat-local-rgb); }
    .message[data-chat-kind="commands"] { --chat-primary-rgb: var(--chat-commands-rgb); }
    .message[data-chat-kind="system"] { --chat-primary-rgb: var(--chat-system-rgb); }

    .message a,
    .message a:visited {
      color: #ffffff;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .message p {
      margin: 0;
    }

    .message p + p,
    .message ul + p,
    .message pre + p {
      margin-top: 7px;
    }

    .message ul {
      margin: 4px 0 0 18px;
      padding: 0;
    }

    .message li {
      margin: 2px 0;
    }

    .message code {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
      padding: 1px 4px;
      border-radius: 3px;
      text-shadow: none;
    }

    .message pre {
      margin: 4px 0 0;
      max-width: min(720px, calc(100vw - 70px));
      overflow: auto;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.48);
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 8px;
      text-shadow: none;
      white-space: pre;
    }

    .message pre code {
      display: block;
      padding: 0;
      background: transparent;
    }

    .publicChatImage {
      display: block;
      max-width: min(420px, calc(100vw - 70px));
      max-height: 320px;
      width: auto;
      height: auto;
      margin-top: 6px;
      border: 1px solid rgba(255, 255, 255, 0.34);
      background: rgba(0, 0, 0, 0.35);
      object-fit: contain;
      cursor: zoom-in;
    }

    .publicChatImage:hover,
    .publicChatImage:focus-visible {
      outline: 1px solid rgba(255, 255, 255, 0.62);
      filter: brightness(1.08);
    }

    .publicChatYoutube {
      display: block;
      width: min(420px, calc(100vw - 70px));
      max-width: 100%;
      margin-top: 6px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.34);
      background: rgba(0, 0, 0, 0.52);
      color: #ffffff;
      box-shadow: 0 0 18px rgba(255, 0, 120, 0.12), 0 0 20px rgba(var(--chat-primary-rgb), 0.08);
      overflow: hidden;
    }

    .publicChatYoutubeFrame {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      height: auto;
      border: 0;
      background: rgba(0, 0, 0, 0.72);
    }

    .publicChatYoutubeThumbWrap {
      position: relative;
      display: block;
      aspect-ratio: 16 / 9;
      background: rgba(0, 0, 0, 0.72);
    }

    .publicChatYoutubeThumb {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .publicChatYoutubePlay {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      width: 62px;
      height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.66);
      border-radius: 10px;
      background: rgba(255, 0, 80, 0.72);
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.45);
      box-shadow: 0 0 26px rgba(255, 0, 80, 0.35);
    }

    .publicChatYoutubeLabel {
      display: block;
      padding: 7px 9px;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.64);
      overflow-wrap: anywhere;
      text-shadow: 0 0 6px rgba(var(--chat-primary-rgb), 0.22);
    }

    #chatLightbox {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 22px;
      box-sizing: border-box;
      background:
        radial-gradient(circle at 50% 50%, rgba(81, 42, 103, 0.38), transparent 58%),
        rgba(0, 0, 0, 0.84);
      pointer-events: none;
    }

    #chatLightbox.active {
      display: flex;
      pointer-events: auto;
    }

    #chatLightboxImage {
      display: block;
      max-width: min(96vw, 1400px);
      max-height: 90vh;
      width: auto;
      height: auto;
      border: 1px solid rgba(var(--chat-primary-rgb), 0.54);
      background: rgba(0, 0, 0, 0.72);
      box-shadow: 0 0 32px rgba(var(--chat-primary-rgb), 0.18), 0 0 90px rgba(81, 42, 103, 0.34);
      object-fit: contain;
      cursor: zoom-out;
    }

    #chatLightboxFrame {
      display: none;
      width: min(96vw, 1400px);
      height: min(54vw, 78vh);
      max-height: 78vh;
      aspect-ratio: 16 / 9;
      border: 1px solid rgba(var(--chat-primary-rgb), 0.54);
      background: rgba(0, 0, 0, 0.9);
      box-shadow: 0 0 32px rgba(var(--chat-primary-rgb), 0.18), 0 0 90px rgba(81, 42, 103, 0.34);
    }

    #chatLightbox[data-lightbox-kind="video"] #chatLightboxImage {
      display: none;
    }

    #chatLightbox[data-lightbox-kind="video"] #chatLightboxFrame {
      display: block;
    }

    #chatLightbox[data-lightbox-kind="image"] #chatLightboxFrame {
      display: none;
    }

    #chatLightboxClose {
      position: fixed;
      top: 14px;
      right: 16px;
      border: 1px solid rgba(255, 85, 119, 0.5);
      background: rgba(0, 0, 0, 0.76);
      color: #ff5577;
      font: inherit;
      line-height: 1;
      padding: 7px 9px;
      cursor: pointer;
      text-shadow: 0 0 8px rgba(255, 85, 119, 0.38);
    }

    #chatLightboxClose:hover,
    #chatLightboxClose:focus-visible {
      outline: none;
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.62);
    }

    .messageTimestamp {
      color: #ffffff;
      font-size: 12px;
      line-height: 1;
      margin-right: 6px;
      text-shadow: none;
      white-space: nowrap;
    }

    .reservedNickname {
      background: linear-gradient(90deg, #ff5577, #ff9f43, #ffe66d, var(--chat-primary), #7bd2ff, #c792ea, #ff7ac8, #ff5577);
      background-size: 220% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: reserved-nickname-rainbow 2.2s linear infinite;
      text-shadow: none;
    }

    @keyframes reserved-nickname-rainbow {
      from { background-position: 0% 50%; }
      to { background-position: 220% 50%; }
    }

    .message[data-error="true"] {
      color: var(--chat-danger);
      border-color: rgba(255, 85, 119, 0.5);
      text-shadow: 0 0 6px rgba(255, 85, 119, 0.25);
    }

    .message[data-pinned-message="true"] {
      border-color: rgba(255, 255, 255, 0.52);
      color: var(--chat-text);
      background: rgba(0, 0, 0, 0.66);
      box-shadow: 0 0 22px rgba(255, 255, 255, 0.12);
    }

    .helpList { display: grid; gap: 4px; margin-top: 4px; }

    .helpItem {
      color: inherit;
      text-decoration: none;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px;
      align-items: baseline;
    }

    .helpItem:hover,
    .helpItem:focus-visible { outline: none; color: #ffffff; }
    .helpCommandName { color: #ffffff; font-weight: 700; }
    .helpCommandDesc { color: var(--chat-muted); }

    #inputWrap {
      position: relative;
      display: grid;
      grid-template-columns: auto auto 1fr;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border: 1px solid var(--chat-border);
      background: var(--chat-bg);
      box-shadow: 0 0 22px rgba(var(--chat-primary-rgb), 0.12);
    }

    #prompt { color: var(--chat-text); font-weight: 700; }

    #chatModePicker {
      position: relative;
    }

    #chatModeButton {
      min-width: 86px;
      border: 1px solid rgba(var(--chat-primary-rgb), 0.34);
      background: rgba(0, 0, 0, 0.58);
      color: var(--chat-text);
      font: inherit;
      padding: 2px 8px;
      outline: none;
      cursor: pointer;
      text-shadow: 0 0 6px rgba(var(--chat-primary-rgb), 0.22);
    }

    #chatModeButton:hover,
    #chatModeButton:focus-visible {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.62);
    }

    #chatModeMenu {
      position: absolute;
      left: 0;
      bottom: calc(100% + 6px);
      z-index: 4;
      display: none;
      min-width: 150px;
      gap: 2px;
      padding: 6px;
      border: 1px solid var(--chat-border);
      background: var(--chat-bg);
      box-shadow: 0 0 22px rgba(var(--chat-primary-rgb), 0.12);
    }

    #chatModeMenu.open {
      display: grid;
    }

    .chatModeOption {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 8px;
      color: var(--chat-text);
      padding: 4px 6px;
      cursor: pointer;
      user-select: none;
      text-shadow: 0 0 6px rgba(var(--chat-primary-rgb), 0.22);
    }

    .chatModeOption:hover,
    .chatModeOption:focus-within {
      outline: 1px solid var(--chat-border);
      background: rgba(var(--chat-primary-rgb), 0.12);
    }

    .chatModeOption input {
      margin: 0;
      accent-color: var(--chat-primary);
    }

    .chatModeOption:has(input:disabled) {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .chatModeOption.hidden {
      display: none;
    }

    #chatBaseSelect {
      width: 100%;
      border: 1px solid rgba(var(--chat-primary-rgb), 0.34);
      background: rgba(0, 0, 0, 0.58);
      color: var(--chat-text);
      font: inherit;
      padding: 3px 6px;
      outline: none;
      cursor: pointer;
      text-shadow: 0 0 6px rgba(var(--chat-primary-rgb), 0.22);
    }

    #chatBaseSelect:hover,
    #chatBaseSelect:focus-visible {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.62);
    }

    #chatBaseSelect option {
      background: #000000;
      color: var(--chat-primary);
    }

    #publicChatSettings,
    #aiChatSettings {
      display: none;
      gap: 6px;
    }

    #publicChatSettings.visible,
    #aiChatSettings.visible {
      display: grid;
    }

    #publicNicknameInput,
    #publicNicknameColor,
    #aiSystemPromptInput {
      min-width: 0;
      border: 1px solid rgba(var(--chat-primary-rgb), 0.34);
      background: rgba(0, 0, 0, 0.58);
      color: var(--chat-text);
      font: inherit;
      padding: 3px 6px;
      outline: none;
      text-shadow: 0 0 6px rgba(var(--chat-primary-rgb), 0.22);
    }

    #publicNicknameInput::placeholder,
    #aiSystemPromptInput::placeholder {
      color: rgba(var(--chat-primary-rgb), 0.52);
    }

    #publicNicknameInput:hover,
    #publicNicknameInput:focus-visible,
    #publicNicknameColor:hover,
    #publicNicknameColor:focus-visible,
    #aiSystemPromptInput:hover,
    #aiSystemPromptInput:focus-visible {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.62);
    }

    #publicNicknameColor {
      width: 100%;
      min-height: 28px;
      padding: 2px 4px;
      cursor: pointer;
    }

    #chatInput {
      min-width: 0;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--chat-text);
      font: inherit;
    }

    #chatInput::placeholder { color: rgba(var(--chat-primary-rgb), 0.52); }

    #suggestions {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(100% + 6px);
      display: none;
      gap: 4px;
      padding: 6px;
      border: 1px solid var(--chat-border);
      background: var(--chat-bg);
    }

    #suggestions.visible { display: grid; }

    .suggestion {
      border: 0;
      background: transparent;
      color: var(--chat-text);
      font: inherit;
      text-align: left;
      padding: 4px 6px;
      cursor: pointer;
    }

    .suggestion:hover,
    .suggestion.active,
    .suggestion:focus-visible {
      outline: 1px solid var(--chat-border);
      background: rgba(var(--chat-primary-rgb), 0.12);
    }

    #dvdOverlay {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      display: none;
      z-index: 2;
    }

    #dvdOverlay.active {
      display: block;
    }

    .dvdLogo {
      position: absolute;
      left: 0;
      top: 0;
      width: min(22vw, 180px);
      height: auto;
      opacity: 0.96;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: auto;
      cursor: default;
      filter: hue-rotate(0deg) drop-shadow(0 0 10px rgba(255, 255, 255, 0.28));
      transform: translate3d(0, 0, 0);
      will-change: transform, filter;
    }

    body.embedded {
      font-size: 12px;
    }

    body.embedded #chatPanel {
      gap: 5px;
      padding: 6px;
    }

    body.embedded #messages {
      gap: 4px;
    }

    body.embedded .message {
      max-width: min(760px, calc(100vw - 18px));
      padding: 4px 28px 4px 6px;
      line-height: 1.18;
      box-shadow: 0 0 10px rgba(var(--chat-primary-rgb), 0.07);
    }

    body.embedded .message p + p,
    body.embedded .message ul + p,
    body.embedded .message pre + p {
      margin-top: 4px;
    }

    body.embedded .message ul {
      margin: 3px 0 0 14px;
    }

    body.embedded .message li {
      margin: 1px 0;
    }

    body.embedded .message code {
      padding: 0 3px;
    }

    body.embedded .message pre {
      max-width: min(620px, calc(100vw - 36px));
      margin-top: 3px;
      padding: 5px;
    }

    body.embedded .publicChatImage {
      max-width: min(300px, calc(100vw - 36px));
      max-height: 210px;
      margin-top: 4px;
    }

    body.embedded .publicChatYoutube {
      width: min(300px, calc(100vw - 36px));
      margin-top: 4px;
    }

    body.embedded .publicChatYoutubeLabel {
      padding: 4px 6px;
    }

    body.embedded .messageTimestamp {
      font-size: 10px;
      margin-right: 4px;
    }

    body.embedded .helpList {
      gap: 2px;
      margin-top: 2px;
    }

    body.embedded .helpItem {
      gap: 5px;
    }

    body.embedded #inputWrap {
      grid-template-columns: auto auto minmax(0, 1fr) auto;
      gap: 5px;
      padding: 5px 6px;
    }

    body.embedded #chatModeButton {
      min-width: 68px;
      padding: 1px 5px;
    }

    body.embedded #chatModeMenu {
      bottom: calc(100% + 4px);
      min-width: 124px;
      gap: 1px;
      padding: 4px;
    }

    body.embedded .chatModeOption {
      gap: 5px;
      padding: 2px 4px;
    }

    body.embedded #chatBaseSelect,
    body.embedded #publicNicknameInput,
    body.embedded #aiSystemPromptInput {
      padding: 2px 4px;
    }

    body.embedded #publicChatSettings,
    body.embedded #aiChatSettings {
      gap: 4px;
    }

    body.embedded #publicNicknameColor {
      min-height: 22px;
      padding: 1px 3px;
    }

    body.embedded #suggestions {
      bottom: calc(100% + 4px);
      gap: 2px;
      padding: 4px;
    }

    body.embedded .suggestion {
      padding: 2px 4px;
    }

    @media (max-width: 520px) {
      body.embedded {
        font-size: 11px;
      }

      body.embedded #chatPanel {
        padding: 4px;
      }

      body.embedded #inputWrap {
        gap: 4px;
        padding: 4px 5px;
      }

      body.embedded #chatModeButton {
        min-width: 58px;
        max-width: 86px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    }
  </style>
</head>
<body>
  <div id="chatDimLayer" aria-hidden="true"></div>
  <div id="dvdOverlay" aria-hidden="true"></div>
  <div id="chatLightbox" aria-hidden="true" role="dialog" aria-label="Expanded chat media">
    <button id="chatLightboxClose" type="button" aria-label="Close expanded media" title="Close expanded media">❌</button>
    <img id="chatLightboxImage" src="" alt="" />
    <iframe id="chatLightboxFrame" title="YouTube video player" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </div>
  <main id="chatSurface" aria-live="polite">
    <section id="chatPanel">
      <div id="messages"></div>
      <form id="inputWrap" autocomplete="off">
        <span id="prompt">&gt;</span>
        <div id="chatModePicker">
          <button id="chatModeButton" type="button" aria-haspopup="true" aria-expanded="false" title="Chat filters">All Chats</button>
          <div id="chatModeMenu" aria-label="Chat filters">
            <select id="chatBaseSelect" aria-label="Chat base">
              <option value="all">All Chats</option>
              <option value="public">Public Chat</option>
              <option value="local">Local Chat</option>
              <option value="ai">AI Chat</option>
            </select>
            <div id="publicChatSettings">
              <input id="publicNicknameInput" type="text" maxlength="40" placeholder="Nickname" aria-label="Public nickname" />
              <input id="publicNicknameColor" type="color" aria-label="Nickname color" />
            </div>
            <div id="aiChatSettings">
              <input id="aiSystemPromptInput" type="text" maxlength="4000" placeholder="System prompt" aria-label="AI system prompt" />
              <label class="chatModeOption"><input type="checkbox" checked disabled /> GPT-5.5</label>
            </div>
            <label class="chatModeOption"><input type="checkbox" value="commands" /> Commands</label>
            <label class="chatModeOption"><input type="checkbox" value="system" /> System Chat</label>
          </div>
        </div>
        <input id="chatInput" type="text" placeholder="Press here to chat..." />
        <div id="suggestions" aria-hidden="true"></div>
      </form>
    </section>
  </main>

  <script>
    const CHAT_NICKNAME_STORAGE_KEY = 'tektiteChatNickname';

    function refreshSpeechVoices() {

    function getMicrosoftDavidVoice() {
      return speechVoices.find((voice) => /microsoft david/i.test(voice.name))
        || speechVoices.find((voice) => /david/i.test(voice.name))
        || speechVoices.find((voice) => /^en[-_]/i.test(voice.lang))

    function getMessageSpeechText(line) {
      const clone = line.cloneNode(true);
      clone.querySelectorAll('.messageReadButton, .messageTimestamp').forEach((node) => node.remove());
      const leadingLabel = clone.firstElementChild;
      if (leadingLabel && leadingLabel.tagName === 'STRONG' && /:$/.test(leadingLabel.textContent.trim())) {
        leadingLabel.remove();
      }
      return clone.textContent.replace(/\s+/g, ' ').trim();
    }

    function readMessageAloud(line) {
      if (!window.speechSynthesis || !window.SpeechSynthesisUtterance || !line) return;
      const button = line.querySelector('.messageReadButton');
      if (button && button === activeSpeechButton && window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
        activeSpeechButton = null;
        button.classList.remove('is-reading');
        button.setAttribute('aria-label', 'Read message aloud');
        return;
      }

      const text = getMessageSpeechText(line);
      if (!text) return;

      window.speechSynthesis.cancel();
      if (activeSpeechButton) {
        activeSpeechButton.classList.remove('is-reading');
        activeSpeechButton.setAttribute('aria-label', 'Read message aloud');
      }
      refreshSpeechVoices();
      const utterance = new SpeechSynthesisUtterance(text);
      const voice = getMicrosoftDavidVoice();
      if (voice) utterance.voice = voice;
      utterance.rate = 1;
      utterance.pitch = 1;
      utterance.onend = () => {
        if (button) {
          button.classList.remove('is-reading');
          button.setAttribute('aria-label', 'Read message aloud');
        }
        if (activeSpeechButton === button) activeSpeechButton = null;
      };
      utterance.onerror = utterance.onend;
      if (button) {
        activeSpeechButton = button;
        button.classList.add('is-reading');
        button.setAttribute('aria-label', 'Stop reading message');
      }
      window.speechSynthesis.speak(utterance);
    }

    }

    function normalizeNicknameColor(value) {
      const raw = String(value || '').trim();
      if (!raw) return '';
      const cssColor = raw.replace(/\s+/g, ' ');
      const hex = raw.match(/^#?([0-9a-f]{3}|[0-9a-f]{6})$/i);
      if (hex) {
        const value = hex[1];
        if (value.length === 3) {
          return `#${value.split('').map((char) => char + char).join('').toLowerCase()}`;
        }
        return `#${value.toLowerCase()}`;
      }
      const rgba = raw.match(/^rgba?\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})(?:\s*,\s*(0|1|0?\.\d+))?\s*\)$/i);
      if (rgba) {
        const red = Math.max(0, Math.min(255, Number(rgba[1])));
        const green = Math.max(0, Math.min(255, Number(rgba[2])));
        const blue = Math.max(0, Math.min(255, Number(rgba[3])));
        const alpha = rgba[4] === undefined ? null : Math.max(0, Math.min(1, Number(rgba[4])));
        return alpha === null
          ? `rgb(${red}, ${green}, ${blue})`
          : `rgba(${red}, ${green}, ${blue}, ${alpha})`;
      }
      const namedColors = {
        red: '#ff5577',
        orange: '#ff9f43',
        yellow: '#ffe66d',
        green: '#00ff66',
        blue: '#7bd2ff',
        indigo: 'indigo',
        purple: '#c792ea',
        pink: '#ff7ac8',
        white: '#ffffff'
      };
      if (namedColors[raw.toLowerCase()]) return namedColors[raw.toLowerCase()];

      if (typeof CSS !== 'undefined' && CSS.supports && CSS.supports('color', cssColor)) {
        return cssColor;
      }

      return '';
    }

    function cssColorToRgbComponents(value) {
      const color = normalizeNicknameColor(value);
      if (!color) return '';
      const probe = document.createElement('span');
      probe.style.color = color;
      probe.style.position = 'absolute';
      probe.style.left = '-9999px';
      probe.style.visibility = 'hidden';
      document.body.appendChild(probe);
      const computed = window.getComputedStyle(probe).color;
      probe.remove();
      const rgb = computed.match(/^rgba?\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})/i);
      if (!rgb) return '';
      return [rgb[1], rgb[2], rgb[3]]
        .map((component) => String(Math.max(0, Math.min(255, Number(component)))))
        .join(', ');
    }

    function normalizeChatColors(value) {
      const source = value && typeof value === 'object' ? value : {};
      const normalized = {};
      CHAT_COLOR_KINDS.forEach((kind) => {
        const rawColor = String(source[kind] || '').trim();
        const rawRgb = rawColor.match(/^(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})$/);
        const rgb = rawRgb
          ? [rawRgb[1], rawRgb[2], rawRgb[3]].map((component) => String(Math.max(0, Math.min(255, Number(component))))).join(', ')
          : cssColorToRgbComponents(rawColor);
        if (rgb) normalized[kind] = rgb;
      });
      return normalized;
    }

    function normalizeChatKind(value) {
      const kind = String(value || '').trim().toLowerCase();
      return CHAT_KIND_SET.has(kind) ? kind : 'system';

    function normalizeChatKindSelection(value) {
      let selected = [];
      if (Array.isArray(value)) {
        selected = value;
      } else {
        const mode = String(value || '').trim().toLowerCase();
        if (mode === 'all') return new Set(ALL_CHAT_KINDS);
        if (!mode) return new Set(DEFAULT_CHAT_KINDS);
        selected = [mode];
      }

      if (selected.some((kind) => String(kind || '').trim().toLowerCase() === 'all')) {
        return new Set(ALL_CHAT_KINDS);
      }
      const normalized = selected.map(normalizeChatKind).filter((kind, index, kinds) => kinds.indexOf(kind) === index);
      if (normalized.length === CHAT_KINDS.length) return new Set(ALL_CHAT_KINDS);
      if (normalized.includes('public')) return new Set(['public']);
      if (normalized.includes('ai')) return new Set(['ai', ...normalized.filter((kind) => kind === 'commands' || kind === 'system')]);
      if (normalized.length && normalized.every((kind) => kind === 'commands' || kind === 'system')) return new Set(normalized);
      if (normalized.length) return new Set(['local', ...normalized.filter((kind) => kind === 'commands' || kind === 'system')]);
      return new Set(DEFAULT_CHAT_KINDS);
    }

    function loadChatKinds() {
      try {
        const saved = window.localStorage.getItem(CHAT_MODE_STORAGE_KEY);
        if (!saved) return new Set(DEFAULT_CHAT_KINDS);

      return new Set(DEFAULT_CHAT_KINDS);

      return selected;

    function normalizeApiHistoryRole(value) {

    function normalizeApiHistoryEntry(entry) {
      if (!entry || typeof entry !== 'object') return null;
      const content = String(entry.content || '').trim();
      if (!content) return null;
      const normalized = {
        role: normalizeApiHistoryRole(entry.role),
        content
      };
      if (entry.nickname && normalized.role === 'user') {
        normalized.nickname = normalizeNickname(entry.nickname);
      }
      if (entry.nicknameColor && normalized.role === 'user') {
        const color = normalizeNicknameColor(entry.nicknameColor);
        if (color) normalized.nicknameColor = color;
      }
      if (entry.createdAt) normalized.createdAt = String(entry.createdAt);
      return normalized;
    }

    function normalizeApiChatHistory(value) {
      if (!Array.isArray(value)) return [];
      return value.map(normalizeApiHistoryEntry).filter(Boolean);
    }

    function appendApiChatHistory(role, content, options = {}) {
      const entry = normalizeApiHistoryEntry({
        role,
        content,
        nickname: options.nickname,
        nicknameColor: options.nicknameColor,
        createdAt: new Date().toISOString()

      if (!entry) return apiChatHistory;
      apiChatHistory = [...apiChatHistory, entry];
      saveApiChatHistory(apiChatHistory);
      return apiChatHistory;
    }

    function messageMatchesChatMode(line) {
      if (!line) return false;

    function updateChatModeControls() {
      const isAll = currentChatKinds.size === CHAT_KINDS.length;
      const isPublic = currentChatKinds.has('public');
      const isAi = currentChatKinds.has('ai');
      const isLocal = currentChatKinds.has('local');
      if (chatBaseSelect) chatBaseSelect.value = isAll ? 'all' : (isPublic ? 'public' : (isAi ? 'ai' : 'local'));
      publicChatSettings?.classList.toggle('visible', !isAll && isPublic);
      aiChatSettings?.classList.toggle('visible', !isAll && isAi);
      chatModeCheckboxes.forEach((checkbox) => {
        const option = checkbox.closest?.('.chatModeOption');
        const kind = checkbox.value && normalizeChatKind(checkbox.value);
        if (option) option.classList.toggle('hidden', isAll || !isLocal);
        if (!kind) return;
        checkbox.checked = currentChatKinds.has(normalizeChatKind(checkbox.value));
        checkbox.disabled = isPublic && (checkbox.value === 'commands' || checkbox.value === 'system');
      });
      if (!chatModeButton) return;
      chatModeButton.textContent = getChatModeLabel();
    }

    function setChatKinds(kinds, options = {}) {
      currentChatKinds = saveChatKinds(kinds);
      updateChatModeControls();
      applyChatModeTheme();
      if (!commandsEnabled()) hideSuggestions();
      applyChatModeFilter();
      return true;
    }

    function getActiveInputChatKind() {
      if (currentChatKinds.size === CHAT_KINDS.length) return 'public';
      if (currentChatKinds.size !== CHAT_KINDS.length && currentChatKinds.has('public')) return 'public';
      if (currentChatKinds.size !== CHAT_KINDS.length && currentChatKinds.has('ai')) return 'ai';
      return 'local';
    }

    function getActiveChatColorKind() {
      if (currentChatKinds.size === CHAT_KINDS.length) return 'all';
      if (currentChatKinds.size === 1) return Array.from(currentChatKinds)[0];
      return getActiveInputChatKind();
    }

    function getChatColorKindLabel(kind = getActiveChatColorKind()) {
      const labels = {
        all: 'All Chats',
        public: 'Public Chat',
        local: 'Local Chat',
        ai: 'AI Chat',
        commands: 'Commands',
        system: 'System Chat'
      };
      return labels[kind] || 'Current Chat';
    }

    function getChatModeLabel(kinds = currentChatKinds) {
      if (kinds.size === CHAT_KINDS.length) return 'All Chats';
      if (kinds.size === 1 && kinds.has('public')) return 'Public Chat';
      if (kinds.size === 1 && kinds.has('ai')) return 'AI Chat';
      if (kinds.size === 1 && kinds.has('commands')) return 'Commands';
      if (kinds.size === 1 && kinds.has('system')) return 'System Chat';
      return 'Local Chat';
    }

    function commandsEnabled() {
      const commandsCheckbox = chatModeCheckboxes.find((checkbox) => checkbox.value === 'commands');
      return currentChatKinds.has('commands') || !!(commandsCheckbox && commandsCheckbox.checked && !commandsCheckbox.disabled);
    }

    function setChatModeMenuOpen(open) {
      if (!chatModeMenu || !chatModeButton) return;
      chatModeMenu.classList.toggle('open', !!open);
      chatModeButton.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/`/g, '&#96;');
    }

    function splitUrlTrailingPunctuation(value) {
      let url = String(value || '');
      let trailing = '';
      while (/[),.!?:;]$/.test(url)) {
        trailing = url.slice(-1) + trailing;
        url = url.slice(0, -1);
      }
      return { url, trailing };
    }

    function getSafeHttpUrl(value) {
      try {
        const url = new URL(value);
        if (url.protocol !== 'http:' && url.protocol !== 'https:') return '';
        return url.href;
      } catch (error) {
        return '';
      }
    }

    function parseYouTubeTimestamp(value) {
      const raw = String(value || '').trim();
      if (!raw) return 0;
      if (/^\d+$/.test(raw)) return Math.max(0, Number(raw));
      const match = raw.match(/(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?/i);
      if (!match || !match[0]) return 0;
      return ((Number(match[1]) || 0) * 3600) + ((Number(match[2]) || 0) * 60) + (Number(match[3]) || 0);
    }

    function getYouTubeEmbedInfo(value) {
      const safeUrl = getSafeHttpUrl(value);
      if (!safeUrl) return null;
      let url;
      try {
        url = new URL(safeUrl);
      } catch (error) {
        return null;
      }

      const host = url.hostname.replace(/^www\./i, '').toLowerCase();
      let videoId = '';
      if (host === 'youtu.be') {
        videoId = url.pathname.split('/').filter(Boolean)[0] || '';
      } else if (host === 'youtube.com' || host === 'm.youtube.com' || host === 'music.youtube.com' || host === 'youtube-nocookie.com') {
        const parts = url.pathname.split('/').filter(Boolean);
        if (url.pathname === '/watch') {
          videoId = url.searchParams.get('v') || '';
        } else if (['shorts', 'embed', 'live', 'v'].includes(parts[0])) {
          videoId = parts[1] || '';
        }
      }

      videoId = String(videoId || '').match(/^[a-zA-Z0-9_-]{11}$/)?.[0] || '';
      if (!videoId) return null;

      const start = parseYouTubeTimestamp(url.searchParams.get('t') || url.searchParams.get('start') || '');
      const embedUrl = new URL(`https://www.youtube-nocookie.com/embed/${videoId}`);
      embedUrl.searchParams.set('rel', '0');
      if (start) embedUrl.searchParams.set('start', String(start));

      return {
        videoId,
        url: safeUrl,
        embedUrl: embedUrl.href,
        thumbnailUrl: `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`
      };
    }

    function replaceAllowedYouTubeIframeEmbeds(value) {
      let ok = true;
      const text = String(value || '').replace(/<iframe\b[\s\S]*?<\/iframe\s*>/gi, (match) => {
        const srcMatch = match.match(/\bsrc\s*=\s*(["'])(.*?)\1/i) || match.match(/\bsrc\s*=\s*([^\s>]+)/i);
        const src = srcMatch ? String(srcMatch[2] || srcMatch[1] || '').trim() : '';
        const info = getYouTubeEmbedInfo(src);
        if (!info) {
          ok = false;
          return match;
        }
        return info.url;
      });
      return { ok, text };
    }

    function isAllowedChatFileLinkHost(hostname) {
      const host = String(hostname || '').replace(/^www\./i, '').toLowerCase();
      return host === 'theinternetisdead.org' ||
        host.endsWith('.theinternetisdead.org') ||
        host === 'youtu.be' ||
        host === 'youtube.com' ||
        host.endsWith('.youtube.com') ||
        host === 'youtube-nocookie.com' ||
        host.endsWith('.youtube-nocookie.com') ||
        host === 'ytimg.com' ||
        host.endsWith('.ytimg.com');
    }

    function isChatFileUrlPath(pathname) {
      return /\.[a-z0-9]{1,12}$/i.test(String(pathname || ''));
    }

    function validateChatInputBody(value) {
      const raw = String(value || '').trim();
      if (!raw) return { ok: false, text: '', message: 'Type a message first.' };

      const iframeResult = replaceAllowedYouTubeIframeEmbeds(raw);
      if (!iframeResult.ok) {
        return { ok: false, text: '', message: 'Only YouTube iframe embed code is allowed.' };
      }

      const text = iframeResult.text.trim();
      if (/<\/?iframe\b/i.test(text)) {
        return { ok: false, text: '', message: 'Only YouTube iframe embed code is allowed.' };
      }
      if (/<\s*(?:script|object|embed|link|meta|style|form|input|button|textarea|select|svg|math|base)\b/i.test(text)) {
        return { ok: false, text: '', message: 'HTML, scripts, and embeds are not allowed in chat.' };
      }
      if (/<\/?[a-z][^>]*>/i.test(text)) {
        return { ok: false, text: '', message: 'HTML is not allowed in chat. Links are fine.' };
      }
      if (/&lt;\s*\/?\s*[a-z][\s\S]*?&gt;/i.test(text)) {
        return { ok: false, text: '', message: 'HTML is not allowed in chat. Links are fine.' };
      }
      if (/\b(?:javascript|vbscript|data\s*:\s*text\/html)\s*:/i.test(text)) {
        return { ok: false, text: '', message: 'Script-like links are not allowed in chat.' };
      }

      let blockedFileUrl = '';
      text.replace(/https?:\/\/[^\s<]+/gi, (match) => {
        const { url } = splitUrlTrailingPunctuation(match);
        try {
          const parsed = new URL(url);
          if (isChatFileUrlPath(parsed.pathname) && !isAllowedChatFileLinkHost(parsed.hostname)) {
            blockedFileUrl = url;
          }
        } catch (error) {
        }
        return match;
      });
      if (blockedFileUrl) {
        return { ok: false, text: '', message: 'File links are only allowed from theinternetisdead.org or YouTube.' };
      }

      return { ok: true, text, message: '' };
    }

    function getYouTubeEmbedsFromText(value) {
      const found = [];
      const seen = new Set();
      String(value || '').replace(/https?:\/\/[^\s<]+/gi, (match) => {
        const { url } = splitUrlTrailingPunctuation(match);
        const info = getYouTubeEmbedInfo(url);
        if (info && !seen.has(info.videoId)) {
          seen.add(info.videoId);
          found.push(info);
        }
        return match;
      });
      return found;
    }

    function renderYouTubeEmbeds(value) {
      const embeds = getYouTubeEmbedsFromText(value);
      if (!embeds.length) return '';
      return embeds.map((embed) => `
        <div class="publicChatYoutube" data-youtube-video-id="${escapeAttribute(embed.videoId)}">
          <iframe class="publicChatYoutubeFrame" title="YouTube video ${escapeAttribute(embed.videoId)}" src="${escapeAttribute(embed.embedUrl)}" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>
      `).join('');
    }

    function renderInlineMarkdown(value) {
      const tokens = [];
      const addToken = (html) => {
        const token = `@@MDTOKEN${tokens.length}@@`;
        tokens.push(html);
        return token;
      };

      let text = String(value || '');
      text = text.replace(/`([^`\n]+)`/g, (_match, code) => {
        return addToken(`<code>${escapeHtml(code)}</code>`);
      });
      text = text.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/gi, (_match, label, href) => {
        const safeUrl = getSafeHttpUrl(href);
        if (!safeUrl) return escapeHtml(label);
        return addToken(`<a href="${escapeAttribute(safeUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)}</a>`);
      });

      let html = escapeHtml(text);
      html = html.replace(/\*\*([^*\n][\s\S]*?[^*\n])\*\*/g, '<strong>$1</strong>');
      html = html.replace(/(^|[^\*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
      html = html.replace(/(https?:\/\/[^\s<]+)/gi, (match) => {
        const { url, trailing } = splitUrlTrailingPunctuation(match);
        const safeUrl = getSafeHttpUrl(url);
        return safeUrl
          ? `<a href="${escapeAttribute(safeUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(url)}</a>${escapeHtml(trailing)}`
          : escapeHtml(match);
      });
      tokens.forEach((tokenHtml, index) => {
        html = html.replaceAll(`@@MDTOKEN${index}@@`, tokenHtml);
      });
      return html;
    }

    function renderMarkdownText(value) {
      const raw = String(value || '').replace(/\r\n?/g, '\n');
      if (!raw.includes('\n') && !/^\s*[-*]\s+/.test(raw) && !/```/.test(raw)) {
        return `${renderInlineMarkdown(raw)}${renderYouTubeEmbeds(raw)}`;
      }
      const lines = raw.split('\n');
      const blocks = [];
      let paragraph = [];
      let listItems = [];
      let codeLines = [];
      let inCodeBlock = false;

      const flushParagraph = () => {
        if (!paragraph.length) return;
        blocks.push(`<p>${paragraph.map(renderInlineMarkdown).join('<br>')}</p>`);
        paragraph = [];
      };
      const flushList = () => {
        if (!listItems.length) return;
        blocks.push(`<ul>${listItems.map((item) => `<li>${renderInlineMarkdown(item)}</li>`).join('')}</ul>`);
        listItems = [];
      };
      const flushCode = () => {
        blocks.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
        codeLines = [];
      };

      lines.forEach((line) => {
        if (/^\s*```/.test(line)) {
          if (inCodeBlock) {
            flushCode();
            inCodeBlock = false;
          } else {
            flushParagraph();
            flushList();
            inCodeBlock = true;
          }
          return;
        }

        if (inCodeBlock) {
          codeLines.push(line);
          return;
        }

        const listMatch = line.match(/^\s*[-*]\s+(.+)$/);
        if (listMatch) {
          flushParagraph();
          listItems.push(listMatch[1]);
          return;
        }

        if (!line.trim()) {
          flushParagraph();
          flushList();
          return;
        }

        flushList();
        paragraph.push(line);
      });

      if (inCodeBlock) flushCode();
      flushParagraph();
      flushList();
      return `${blocks.join('')}${renderYouTubeEmbeds(raw)}`;
    }

    function scrollToBottom() {
      messages.scrollTop = messages.scrollHeight;
    }

    function isScrolledNearBottom() {
      return messages.scrollHeight - messages.scrollTop - messages.clientHeight < 48;
    }

    function scheduleScrollToBottom(options = {}) {
      if (!options.force && !isScrolledNearBottom()) return;
      if (scrollFrameId) return;
      scrollFrameId = requestAnimationFrame(() => {
        scrollFrameId = 0;
        scrollToBottom();
      });
    }

    function addMessage(role, html, options = {}) {
      const shouldStickToBottom = isScrolledNearBottom();
      const line = document.createElement('div');
      line.className = 'message';
      line.dataset.role = role;
      line.dataset.chatKind = options.kind || (options.publicMessage ? 'public' : (role === 'system' && commandOutputDepth > 0 ? 'commands' : role));
      if (options.publicMessage) line.dataset.liveChatMessage = 'true';
      if (options.error) line.dataset.error = 'true';
      line.innerHTML = html;
      const readButton = document.createElement('button');
      readButton.className = 'messageReadButton';
      readButton.type = 'button';
      readButton.textContent = '🔊';
      readButton.setAttribute('aria-label', 'Read message aloud');
      line.appendChild(readButton);
      messages.appendChild(line);
      while (messages.children.length > SUPABASE_CHAT_MAX_VISIBLE + 30) {
        messages.firstElementChild?.remove();
      }
      line.hidden = !messageMatchesChatMode(line);
      scheduleScrollToBottom({ force: options.forceScroll || shouldStickToBottom });
      return line;
    }

    function addSystemMessage(text, options = {}) {
      return addMessage('system', escapeHtml(text), options);
    }

    function addWelcomeMessages() {
      const welcomeMessages = [
        { kind: 'ai', text: 'AI chat ready. Ask with plain text when AI Chat is checked. 🤖' },
        { kind: 'local', text: 'Local chat ready. Notes stay in this browser session. 📝' },
        { kind: 'public', text: 'Public chat ready. Messages are shared with everyone. 🌐' },
        { kind: 'system', text: 'System chat ready. Commands and status messages land here. ⚙️' }
      ];
      let publicWelcomeLine = null;
      welcomeMessages.forEach((welcome) => {
        const line = addSystemMessage(welcome.text, { kind: welcome.kind });
        welcomeMessageLines.set(welcome.kind, line);
        if (welcome.kind === 'public') publicWelcomeLine = line;
      });
      return publicWelcomeLine;
    }

    function openChatImageLightbox(image) {
      if (!image || !chatLightbox || !chatLightboxImage) return;
      const src = image.currentSrc || image.src || '';
      if (!src) return;
      if (chatLightboxFrame) chatLightboxFrame.src = '';
      chatLightbox.dataset.lightboxKind = 'image';
      chatLightboxImage.src = src;
      chatLightboxImage.alt = image.alt || 'Expanded chat image';
      chatLightbox.classList.add('active');
      chatLightbox.setAttribute('aria-hidden', 'false');
      chatLightboxClose?.focus({ preventScroll: true });
    }

    function openChatVideoLightbox(trigger) {
      if (!trigger || !chatLightbox || !chatLightboxFrame) return;
      const embedUrl = trigger.dataset.youtubeEmbedUrl || '';
      if (!getSafeHttpUrl(embedUrl)) return;
      chatLightboxImage.removeAttribute('src');
      chatLightboxImage.alt = '';
      chatLightbox.dataset.lightboxKind = 'video';
      chatLightboxFrame.src = embedUrl;
      chatLightbox.classList.add('active');
      chatLightbox.setAttribute('aria-hidden', 'false');
      chatLightboxClose?.focus({ preventScroll: true });
    }

    function closeChatImageLightbox() {
      if (!chatLightbox || !chatLightboxImage) return;
      chatLightbox.classList.remove('active');
      chatLightbox.setAttribute('aria-hidden', 'true');
      chatLightbox.removeAttribute('data-lightbox-kind');
      chatLightboxImage.removeAttribute('src');
      chatLightboxImage.alt = '';
      if (chatLightboxFrame) chatLightboxFrame.src = '';
    }

    messages.addEventListener('click', (event) => {
      const readButton = event.target.closest?.('.messageReadButton');
      if (readButton) {
        event.preventDefault();
        event.stopPropagation();
        readMessageAloud(readButton.closest('.message'));
        return;
      }

      const youtubeEmbed = event.target.closest?.('.publicChatYoutube');
      if (youtubeEmbed) {
        event.preventDefault();
        openChatVideoLightbox(youtubeEmbed);
        return;
      }

      const image = event.target.closest?.('.publicChatImage');
      if (!image) return;
      event.preventDefault();
      openChatImageLightbox(image);
    });

    messages.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      const youtubeEmbed = event.target.closest?.('.publicChatYoutube');
      if (youtubeEmbed) {
        event.preventDefault();
        openChatVideoLightbox(youtubeEmbed);
        return;
      }

      const image = event.target.closest?.('.publicChatImage');
      if (!image) return;
      event.preventDefault();
      openChatImageLightbox(image);
    });

    chatLightbox?.addEventListener('click', (event) => {
      if (event.target === chatLightbox || event.target === chatLightboxImage) {
        closeChatImageLightbox();
      }
    });

    chatLightboxClose?.addEventListener('click', closeChatImageLightbox);

    if (window.speechSynthesis) {
      refreshSpeechVoices();
      window.speechSynthesis.addEventListener('voiceschanged', refreshSpeechVoices);
    }

    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && chatLightbox?.classList.contains('active')) {
        event.preventDefault();
        closeChatImageLightbox();
      }
    });

    function formatCommandExecutionMessage(command, state = 'executed', nickname = currentNickname) {
      return `${command} ${state} by ${nickname}`;
    }

    function getNicknameHtml(nickname) {
      const rawNickname = normalizeNickname(nickname);
      const escapedNickname = escapeHtml(rawNickname);
      if (isReservedNickname(rawNickname)) {
        return `<strong class="reservedNickname">${escapedNickname}:</strong>`;
      }
      return `<strong>${escapedNickname}:</strong>`;
    }

    function getPinnedMessageAnchor(kind) {
      const welcomeLine = welcomeMessageLines.get(kind);
      if (welcomeLine && welcomeLine.isConnected) return welcomeLine;
      return welcomeMessageLine && welcomeMessageLine.isConnected ? welcomeMessageLine : messages.firstElementChild;
    }

    function upsertPinnedMessage(text, nickname = currentNickname, options = {}) {
      const pinnedText = String(text || '').trim();
      if (!pinnedText) {
        addSystemMessage('Usage: /pin [text]', { kind: options.kind || 'system' });
        return false;
      }

      const kind = normalizeChatKind(options.kind || 'public');
      const html = `${getNicknameHtml(nickname)} ${renderMarkdownText(pinnedText)}`;
      let pinnedMessageLine = pinnedMessageLines.get(kind);
      if (!pinnedMessageLine || !pinnedMessageLine.isConnected) {
        pinnedMessageLine = document.createElement('div');
        pinnedMessageLine.className = 'message';
        pinnedMessageLine.dataset.role = 'public';
        pinnedMessageLine.dataset.chatKind = kind;
        pinnedMessageLine.dataset.pinnedMessage = 'true';
        pinnedMessageLines.set(kind, pinnedMessageLine);
      }
      pinnedMessageLine.innerHTML = html;
      pinnedMessageLine.dataset.chatKind = kind;

      const shouldStickToBottom = isScrolledNearBottom();
      const anchor = getPinnedMessageAnchor(kind);
      if (anchor && anchor.nextSibling !== pinnedMessageLine) {
        messages.insertBefore(pinnedMessageLine, anchor.nextSibling);
      } else if (!anchor && pinnedMessageLine.parentElement !== messages) {
        messages.insertBefore(pinnedMessageLine, messages.firstChild);
      }
      pinnedMessageLine.hidden = !messageMatchesChatMode(pinnedMessageLine);
      applyChatModeFilter();
      scheduleScrollToBottom({ force: shouldStickToBottom });
      return true;
    }

    function removePinnedMessage(kind = 'public') {
      const normalizedKind = normalizeChatKind(kind);
      const pinnedMessageLine = pinnedMessageLines.get(normalizedKind);
      if (pinnedMessageLine && pinnedMessageLine.isConnected) pinnedMessageLine.remove();
      pinnedMessageLines.delete(normalizedKind);
    }

    function currentNicknameCanPinPublicChat() {
      return isReservedNickname(currentNickname);
    }

    async function pinPublicChatMessage(text) {
      const pinnedText = String(text || '').trim();
      if (!currentNicknameCanPinPublicChat()) {
        addSystemMessage('/pin is reserved for protected nicknames.', { error: true, kind: 'commands' });
        return false;
      }
      if (!pinnedText) {
        addSystemMessage('Usage: /pin [text]', { kind: 'commands' });
        return false;
      }
      if (pinnedText.length > 500) {
        addSystemMessage('Pinned message is too long. Keep it to 500 characters.', { error: true, kind: 'commands' });
        return false;
      }

      const nickname = normalizeNickname(currentNickname);
      currentNickname = nickname;
      saveNickname(currentNickname);
      if (!(await insertPublicPinnedMessage(pinnedText))) {
        return false;
      }
      return true;
    }

    function removeCommandExecutionMessage(commandKey) {
      const entry = commandExecutionMessages.get(commandKey);
      if (!entry) return;
      window.clearTimeout(entry.timerId);
      if (entry.line && entry.line.isConnected) entry.line.remove();
      commandExecutionMessages.delete(commandKey);
    }

    function addCommandExecutionMessage(command, options = {}) {
      const commandKey = String(command || '').trim().toLowerCase();
      if (!commandKey) return null;

      const baseText = options.message || formatCommandExecutionMessage(commandKey, options.state || 'executed');
      const detail = options.detail ? ` ${options.detail}` : '';
      const existing = commandExecutionMessages.get(commandKey);
      const count = existing && existing.line && existing.line.isConnected ? existing.count + 1 : 1;
      const text = `${baseText}${detail}${count > 1 ? ` x${count}` : ''}`;
      const line = existing && existing.line && existing.line.isConnected
        ? existing.line
        : addMessage('system', escapeHtml(text), {
            commandExecution: true,
            kind: options.kind || 'commands'
          });

      line.textContent = text;
      line.dataset.chatKind = options.kind || line.dataset.chatKind || 'commands';
      line.dataset.commandExecution = commandKey;
      line.dataset.commandExecutionCount = String(count);
      window.clearTimeout(existing && existing.timerId);

      const timerId = window.setTimeout(() => {
        removeCommandExecutionMessage(commandKey);
      }, COMMAND_EXECUTION_MESSAGE_TTL_MS);

      commandExecutionMessages.set(commandKey, { line, count, timerId });
      scheduleScrollToBottom();
      return line;
    }

    function createHelpHtml() {
      const items = getVisibleCommands().map((command) => {
        const subcommands = Array.isArray(command.subcommands) && command.subcommands.length
          ? `<br><span class="helpCommandDesc">subcommands: ${command.subcommands.map((subcommand) => escapeHtml(subcommand.name)).join(', ')}</span>`
          : '';
        return `<a href="#" class="helpItem" data-command="${escapeHtml(command.name)}"><span class="helpCommandName">${escapeHtml(command.name)}</span><span class="helpCommandDesc">- ${escapeHtml(command.desc)}${subcommands}</span></a>`;
      }).join('');
      return `<strong>Help with commands...</strong><div class="helpList">${items}</div>`;
    }

    function normalizeSoundFileName(value) {
      const fileName = String(value || '').trim().split(/[\\/]/).pop() || '';
      return SOUND_FILES.includes(fileName) ? fileName : '';
    }

    function getSoundFileUrl(fileName) {
      const soundFile = normalizeSoundFileName(fileName);
      return soundFile ? `/dead/sounds/${encodeURIComponent(soundFile)}` : '';

    function createSoundListHtml() {
      const canClick = isReservedNickname(currentNickname);
      const items = SOUND_FILES.map((fileName) => {

      return `<strong>Sounds in /dead/sounds/</strong><div class="helpList">${items}</div>`;

    function getCommandUsage(commandName) {
      const command = commandByName.get(commandName);
      if (!command) return '';
      const usageByCommand = {
        '/chat': [
          '/chat all',

          '/chat local',

          '/chat commands',
          '/chat system',

        ].join('\n'),
        '/clear': '/clear',

        '/system_prompt': [

    function showCommandUsage(commandName) {

    function addLocalUserPromptMessage(promptText, options = {}) {
      const nickname = normalizeNickname(options.nickname || currentNickname);
      const rawNicknameColor = options.nicknameColor || currentNicknameColor;
      const nicknameColor = rawNicknameColor ? ` style="color:${escapeAttribute(rawNicknameColor)}"` : '';
      return addMessage('user', `<strong${nicknameColor}>${escapeHtml(nickname)}:</strong> ${renderMarkdownText(promptText)}`, { kind: 'ai' });

    function renderStoredApiChatHistory() {
      apiChatHistory.forEach((entry) => {
        if (entry.role === 'assistant') {
          addApiResponseMessage(entry.content);
          return;
        }
        addLocalUserPromptMessage(entry.content, {
          nickname: entry.nickname,
          nicknameColor: entry.nicknameColor
        });
      });
